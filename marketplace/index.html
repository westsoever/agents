/` here, where the preview picks it up and `?capture=\u003cyours>` films it, then move it into the host when it passes and fix its kit import path. Keep its structure: the stage size, the crop and bleed, row and type sizes, spacing, the script's beats, the kit parts. Now read `references/craft.md` in full: it is short, and it holds the still-frame rules the gold can't show you, the cases your gold doesn't happen to contain. Then replace its look and content with the brief's product: the tokens from step 2, the product's own icons, chrome and words. A copy that only changes the name is not done: it should read as the brief's product, not the gold's. If no gold tells your story, choose in two parts: the layout first (pick it from the table in `references/framing.md`; each layout names its example), and copy that example even though its story differs; then borrow the motion for your beats from the example whose story is closest, and build what neither has in the same style. Then frame it: crop to the panel the story happens in, judged in the final visible crop (`references/framing.md` has the rules and the layout table). The short form: one gutter, a full one or well past; only filler bleeds; what opens stays in; windows keep their shape; the page is the ground, so no plate under a hero on a white or dark page and no window whole with air on four sides; `unframed` only when the developer asks; no dead corners. Film one still at both widths beside the gold's; if yours is emptier, flatter or more boxed, fix the frame before any motion.\n5. **The screen.** Count the real strings, usually 3 to 7 (`references/craft.md`, Restraint): a budget for words, not elements. Build with the kit's tokens, `Bar`, `Text` and `Row`. Fit every control's text before it moves. Mark what the cursor touches with `data-target` and `data-cursor`; measure with `rect()`, never hard-code.\n6. **Choreograph.** The `Act` API. Keep what appears mounted and toggle it so exits animate (`Bubble` and `Fly` hand off explicitly). Animate the relationship, not just the object: a new row carries the rows below it, a surface that resizes never stretches its text. Beats overlap, groups stagger, the payoff holds, the loop ends where it began or resets with a visible cause.\n7. **Rehearse.** Set `poster` first: most people see only that frame (a thumbnail, reduced motion, a screenshot), so it is the beat that tells the story on its own, never one caught mid-change, with the result left on screen rather than tidied away (`references/motion.md`, Story). Then film the loop, not just a still: the contact sheet at the shown width and at 390, and step through every press, menu, morph and the loop seam (`references/rehearse.md`). A still can't show a pop. Read every frame, fix the largest visible fault first (framing, then hierarchy, then motion, then polish), re-film. Then hold it next to the closest gold and answer the whole-composition and style pairs in `references/teaching.md` as questions about your still (what does the eye land on first, and is it the result? is one window, tile or device clearly leading?); any no is the largest fault. `film.mjs --gate` ending `rehearsal passed` is necessary, not sufficient. Then run the last pass in `references/rehearse.md`: a fresh-eye review (`references/review.md`) and `REHEARSAL.md` beside the component (template in `references/verify.md`, Hand over): the gold you copied, what you changed, what you did not check.\n\nFaults that come back every round, each with its rule; check them before handing over:\n\n- **Content that swaps** instead of moving (`references/motion.md`, Changing text and values).\n- **Gray bars where the eye lands;** filler belongs at the edges (`references/craft.md`, Restraint).\n- **A plate behind the window, or a window floating** with air on four sides; the window or phone fills at least two thirds of the stage and runs off an edge (`references/framing.md`, rule 5 and Small formats and the page).\n- **Empty bands, cut controls and shadows** (`references/craft.md`, Restraint; `references/framing.md`, rule 4).\n- **Stock AI and made-up logos:** sparkles, purple, a letter in a colored square (`references/craft.md`, Icons and logos).\n- **Busy rows and uneven insets** (`references/craft.md`, Restraint and Spacing and alignment).\n- **Long holds and a reset with no cause** (`references/motion.md`, Loops).\n- **A selection that isn't under the I-beam** (`references/motion.md`, Drags and selection).\n- **A status bar or home indicator drawn by hand;** the Phone draws both (`references/craft.md`, Chrome and devices).\n- **A centered amount centered with its sign** (`references/craft.md`, Spacing and alignment).\n\n## Examples\n\nFilm the closest one before you start (step 4). The gold examples are the quality bar; product studies are for borrowing an interaction, never another product's identity; specimen sheets are catalogs, not compositions. Run everything with `npm install` and `npm run dev`. `teaching/` holds bad/good pairs (`references/teaching.md`) for diagnosing a problem; the bad halves are never starting points.\n\n### Gold\n\n| Need | Example | What to learn |\n|---|---|---|\n| Still or feature card | `static-card` | Quiet hierarchy, a hard crop, one satellite, real words only on the selected customer, its neighbors and the total |\n| Dark still | `dark-bento` | One signal said once; album art keeps it a music app |\n| Animated hero, a gesture | `hero-demo` | Five beats, named targets, an annotation, a terminal coming forward |\n| Choreography, no cursor | `payout-flow` | Slow overlapping arrivals, reading time, a payoff that holds |\n| Content changing in place | `choreography` | Retained tracks, soft masks, dependent timing |\n| AI answer | `ai-chat` | The question sent, Thinking, the answer streaming in with its height, sources last; no sparkles, no purple |\n| AI with cards | `ai-cards` | A multiple-choice card answered and kept as the record, a card of options opening in the thread, booked from its own button |\n| Form validation | `form-error` | An error on the field that caused it, cleared by fixing it, then the button confirms on itself |\n| Drag to reorder | `reorder` | A row lifted by its grip, the others making room, dropped into place |\n| Chart scrub | `chart-scrub` | A hairline and dot that follow the pointer, the headline value rolling to the day under it |\n| Edit in a table | `table-edit` | A cell edited in place, then the total it feeds rolls a beat later |\n| Loading to content | `loading` | A skeleton at the content's own geometry, rows resolving top to bottom, real chrome throughout |\n| Dark hero | `dark-hero` | Depth from surface steps on black, one lit color, a status that changes on its own pill |\n| Live collaborators | `presence` | Each person one color everywhere, names riding their cursors, work shown in the doc's own marks |\n| System story | `subscriptions` | A chip flies into a row, MRR rolls, a second scene is the reset |\n| Close-up | `close-up` | One control at 1.4x with its window's chrome, the row whole, a large cursor to match |\n| Many of one | `many-of-one` | A grid of one thing off every edge, one tile in focus by depth, the only one with words |\n| Fade crop | `fade-crop` | A window fading out at its foot, over filler, instead of running off an edge |\n| Panel over product | `panel-annotation` | A settings panel over the product's margin, one leader from the setting to what it changed |\n| Overlapping windows | `overlap` | A card in front of a window, its edge on the window's sidebar line |\n| Stacked cards | `stacked-cards` | Two components at one width, a small gap, the lower one off the bottom |\n| Opposite corners | `opposite-corners` | A bento tile: copy bottom-left, the product hung from the top-right corner |\n| Tilted stack | `tilted-stack` | A loose pile of paper, small alternating angles, only the top card has words |\n| Corner chip | `corner-chip` | A small chip centered on a window's corner, half outside |\n| Monochrome | `monochrome` | Other companies' products in a row, grayscale, faded at the foot |\n| Row of windows | `window-row` | Sessions side by side at one height: focus by depth, neighbors cut by the stage, only filler cropped |\n| Window and phone | `device-pair` | A dashboard and a lock screen telling one event; the phone straddles over margin, never over the figure |\n| Related objects | `story` | An invoice, a plan, a connector, rolling totals |\n| Calendar drag | `calendar` | A populated week, one focal event, a measured pickup |\n| Free dragging | `freeform-drag` | Grab offset, a measured grid, a drop slot that snaps |\n| Phone app | `phone-touch` | A card opens into its screen as one object, and the loop folds back |\n| Dynamic Island | `dynamic-island` | One black shape, its content a separate layer |\n| Messages | `messages` | Composer, typing, receipts, a bubble's lifetime |\n| Cursors | `cursors`, `cursor-morph`, `cursor-resize` | Five styles, element-driven kinds, resize edges and corners, no cursor at all |\n| Annotations | `annotations` | Leaders, dimensions, flows and a moving target; `references/annotations.md` |\n| Feature grid | `bento` | One hero, one window, a stat, an object, a diagram |\n| Dark ruled grid | `ruled-bento` | Shared rules and technical imagery |\n| Consumer grid | `staggered-bento` | Offset tiles, graphic art, physical objects |\n| Image-led hero grid | `hero-grid` | Different grounds and materials composed as one picture |\n| Upload | `upload` | A file dragged in from the desktop, an upload row with progress that settles as a file row |\n| Share | `share` | A share popover over a document: an email becomes a chip, a role menu, a person added to the list |\n| Swipe | `swipe` | A phone swipe to archive: press, swipe, a throw at the finger's speed, the gap closes |\n\n### Product studies\n\nRecognizable products (Figma, Linear, Slack, Raycast, Finder, Spotify, Notion, Gmail, Google's apps, Office, Wikipedia, Telegram, iMessage): read `references/products.md` first. Borrow the interaction, not another product's identity.\n\n| Need | Example | What to learn |\n|---|---|---|\n| Design tool | `figma` | Canvas selection, a color picker, a second cursor |\n| Issue tracker | `linear` | Command menu and assignment |\n| Chat | `slack` | Messages, a reaction, a thread reply |\n| Launcher | `raycast` | Search and clipboard history over a blurred desktop |\n| Files | `finder`, `finder-glass` | Quick Look over a file list; a file moved into a folder; the same window in frosted glass |\n| Music, dark | `spotify` | A dark desktop app with album art |\n| Docs and editors | `notion`, `google-docs` | A slash command; a comment and its reply |\n| Email | `gmail` | Hover actions, archive, an undo toast |\n| Calendar, real app | `google-calendar` | Drag to create an event, the quick-create popup |\n| Office | `powerpoint`, `excel` | Slide editing; AutoSum and a chart |\n| Browser page | `wikipedia` | Search suggestions in a browser |\n| Phone conversations | `telegram`, `imessage` | Native chat apps on an iPhone |\n\n### Specimen and reference sheets\n\nCatalogs of parts and grounds, described in `references/kit.md` (Specimen sheets). Look up a part here; compose from a gold example.\n\n| Need | Example | What to learn |\n|---|---|---|\n| Kit specimens | `chrome`, `phones`, `controls`, `parts`, `kit-extras` | Every frame and part |\n| Glass | `glass` | Frosted surfaces over a color field |\n| Backgrounds | `backgrounds` | One interface over twenty grounds; `references/backgrounds.md` |\n| Logos | `brand-marks` | Real marks, optically sized, on light and dark; `references/brands.md` |\n| A product's look | `looks` | Type, shape and color working together |\n\n## The kit\n\nCopy `kit/` into the project and import from `kit/index.ts`. React, react-dom and lucide-react (for `Icon`, which `Field` and `Chip` use); each part brings its own CSS. It does the parts that are hard to get right by hand and leaves the product's look to you. `references/kit.md` has every part's props and rules; read the entries for the parts you use.\n\n- **The stage.** `Stage`: design size and scale-to-fit, `compact`, scene state, playback, the look, the cursor. The script gets an `Act` (`set`, `wait`, `move`, `click`, `type` and the rest: `references/kit.md`, Act).\n- **Frames.** `Window`, `Phone` with `LockScreen` and `Notification`, `Keyboard`, `Thread` with `Bubble`, `Stamp`, `Receipt`. Real geometry; never draw a window, device or bubble by hand.\n- **Motion.** `Collapse`, `Roll`, `Swap`, `Count`, `Connector`, `Fly`, `Follow`, `States`, `Stream`, `Popover`, `Scroll`, `Camera`, `Expand`. They handle the frames a cold hand gets wrong.\n- **Small parts.** `Bar`, `Text`, `Row` (every list is made of it), `Avatar`, `Pin`, `Icon`, `Menu`, `Field`, `Segmented`, `Toggle`, `Tabs`, `Badge`, `Chip`, `BrandMark`, `Code`, `Chart`. Quiet starting points; restyle to the product, never reshape a kit part's geometry from outside.\n- **`stageshow.css`**: tokens, looks, edge fades, chrome, phones, keycaps.\n\n## The references\n\n`references/framing.md`: the framing rules and the layout table. `references/craft.md`: the still frame (restraint, type, spacing, icons, color, chrome). `references/motion.md`: story, loops, pace, the cursor and drags. `references/verify.md`: the checklist with a you-see / you-do table. `references/rehearse.md`: how to film, and the film lines that are never intentional.\n"}, {"name": "state-machine", "description": "Renders every state of a component you choose on a throwaway page, with mock data and a switcher, so you can work on each state.", "manual": true, "path": "~/.agents/skills/state-machine", "file_count": 2, "files": ["agents/openai.yaml", "switcher.md"], "body": "---\nname: state-machine\ndescription: Renders every state of a component you choose on a throwaway page, with mock data and a switcher, so you can work on each state.\ndisable-model-invocation: true\n---\n\n# State machine\n\nThis skill takes one component and renders it on a throwaway page in every state it can be in. Mock data feeds each state, a switcher flips between them and the page is deleted in one step when you are done.\n\nIt is a workbench, not a review. The page stays up while the user works on the visuals, one state on screen and every other a keypress away. Stacking hostile scenarios on one page for a single look is `break`, exploring alternative designs is `variant` and reviewing finished work is `interface-review`.\n\n`variant` is not installed.\n\n## 1. Scope one component\n\nOne component per run: the audit log table, the network panel, the billing card. \"The settings page\" spans several, so list them and ask which one.\n\nRestate it in one sentence: what the component shows, where it renders in production and where its data comes from.\n\n## 2. Find the states in the code\n\nThe states are the branches the component already has. Read it and its data hooks for every one:\n\n| Kind | States |\n| --- | --- |\n| Data | Loading, empty, error, one item, a typical set, a set long enough to scroll or paginate, some requests resolved and others pending, stale data refetching |\n| Account | Plan tier, role and permission checks, an owner versus a member |\n| Feature | Flags, trials, limits reached, a disabled or locked feature |\n\nA state the code cannot reach is not a state. Do not add a branch to render one. Where the design shows a state the code lacks, list it as missing and leave it out.\n\nWrite the set down before building, one line each, named the way the product talks about it: `empty`, `enterprise`, `member-no-access`. Group them under headings in the product's words, by what changes. Use `Data` and `Account` or narrower ones such as `Connection` or `Access`. The switcher shows these groups. Say which kinds you dropped and why in one line. Combine kinds only where the code branches on the combination, such as `member-empty`, never as a cross product.\n\n## 3. Build the throwaway page\n\nA scratch route inside the app holds the real component, imported from the project and untouched. The route inherits the app's layout, fonts, global styles and providers for free.\n\nWhere the framework splits server from client components, the page is client code, `\"use client\"` in Next. Otherwise fixture data can silently vanish crossing that boundary, and the page renders empty.\n\nRender one instance in a container as wide as the component is in production. The container, the fixtures and the switcher are everything the page adds, with no fonts, styles or themes of its own. Keep the page, its fixtures and its switcher in one folder, such as `/states/audit-log`, so removal is one delete.\n\n## 4. Feed each state at the data boundary\n\nSupply the data where the component receives it, from the page, without editing the component. In order of preference:\n\n1. Props, where the component takes its data as props.\n2. The app's own data seam: a seeded query cache, a mock provider or the project's request mocks.\n\nA fixture threaded through props five levels down tests a path production never takes. Where the only way in is editing the component, say so and ask before adding a seam.\n\nMake the data look like the product. Real-shaped names, timestamps, amounts and the item counts users actually have. Three rows of \"Test item\" make every state look fine.\n\nLoading and pending states hold still. Keep them pending until the switcher moves, rather than resolving after a timeout.\n\n## 5. Add the switcher\n\nA grouped list beside the component flips the `__state` search param, so every state is a link. Where there is no room beside the component, it moves above it as a select with the same groups. The double underscore keeps it clear of any param the app's layout reads. [switcher.md](switcher.md) holds the spec.\n\n## 6. Confirm every state renders, then hand over\n\nLoad the page once in a browser already at hand and flip through every state. The component shows the mock data, not the real data and not a blank region. Mock data that never appears is the common failure here. Live sync, a cache that refetches over the seed or a server boundary dropping the fixture all cause it. Fix the plumbing before handing over.\n\nWith no browser at hand, say so and hand the URL over for the user to check.\n\nThen hand over the URL, the state list and the switcher keys. Stop there. Changing how a state looks is the user's next request, not part of this one.\n\n## Re-check every state after each change\n\nAfter a visual change, flip through every state again, since a fix for one state often breaks another.\n\n## Remove it in one step, on the user's word\n\nDelete the page folder and any seam the user approved. Then search the codebase for the route and fixture names, and check that the diff touches nothing else of the setup.\n\n## Before you finish\n\n| Mistake | Fix |\n| --- | --- |\n| The component edited to accept fixtures | Feed data from the page through props or the app's data seam; ask before adding a seam |\n| A rebuilt lookalike component on the page | Import the real component from the project |\n| The page restyles or re-themes the component | The app's layout, fonts and tokens as they are |\n| Fixtures passed as props deep in the tree | Supply the data where the component receives it |\n| A branch added to the component to show a state | Leave out states the code cannot reach, and list missing ones |\n| \"Item 1\", \"Test user\", three rows | Product-shaped data in real quantities |\n| Loading resolves after a timeout | Hold it until the switcher moves |\n| Handed over without loading each state | Load every state; a blank or real-data state means broken plumbing |\n| Switcher styled with the project's tokens | Keep it visibly outside the design system |\n| One long row of tabs, one per state | A grouped list beside the component that scrolls on its own; a select above it where the list does not fit |\n| Visuals changed unasked | Hand over and wait |\n| Page deleted in the same turn it was built | Remove it only on the user's word |\n| Route or fixture names left behind | Search for both after removal |\n"}, {"name": "stitch-design-taste", "description": "Semantic Design System Skill for Google Stitch. Generates agent-friendly DESIGN.md files that enforce premium, anti-generic UI standards — strict typography, calibrated color, asymmetric layouts, perpetual micro-motion, and hardware-accelerated performance.", "manual": false, "path": "~/.agents/skills/stitch-design-taste", "file_count": 1, "files": ["DESIGN.md"], "body": "---\nname: stitch-design-taste\ndescription: Semantic Design System Skill for Google Stitch. Generates agent-friendly DESIGN.md files that enforce premium, anti-generic UI standards — strict typography, calibrated color, asymmetric layouts, perpetual micro-motion, and hardware-accelerated performance.\n---\n\n# Stitch Design Taste — Semantic Design System Skill\n\n## Overview\nThis skill generates `DESIGN.md` files optimized for Google Stitch screen generation. It translates the battle-tested anti-slop frontend engineering directives into Stitch's native semantic design language — descriptive, natural-language rules paired with precise values that Stitch's AI agent can interpret to produce premium, non-generic interfaces.\n\nThe generated `DESIGN.md` serves as the **single source of truth** for prompting Stitch to generate new screens that align with a curated, high-agency design language. Stitch interprets design through **\"Visual Descriptions\"** supported by specific color values, typography specs, and component behaviors.\n\n## Prerequisites\n- Access to Google Stitch via [labs.google/stitch](https://labs.google/stitch)\n- Optionally: Stitch MCP Server for programmatic integration with Cursor, Antigravity, or Gemini CLI\n\n## The Goal\nGenerate a `DESIGN.md` file that encodes:\n1. **Visual atmosphere** — the mood, density, and design philosophy\n2. **Color calibration** — neutrals, accents, and banned patterns with hex codes\n3. **Typographic architecture** — font stacks, scale hierarchy, and anti-patterns\n4. **Component behaviors** — buttons, cards, inputs with interaction states\n5. **Layout principles** — grid systems, spacing philosophy, responsive strategy\n6. **Motion philosophy** — animation engine specs, spring physics, perpetual micro-interactions\n7. **Anti-patterns** — explicit list of banned AI design clichés\n\n## Analysis & Synthesis Instructions\n\n### 1. Define the Atmosphere\nEvaluate the target project's intent. Use evocative adjectives from the taste spectrum:\n- **Density:** \"Art Gallery Airy\" (1–3) → \"Daily App Balanced\" (4–7) → \"Cockpit Dense\" (8–10)\n- **Variance:** \"Predictable Symmetric\" (1–3) → \"Offset Asymmetric\" (4–7) → \"Artsy Chaotic\" (8–10)\n- **Motion:** \"Static Restrained\" (1–3) → \"Fluid CSS\" (4–7) → \"Cinematic Choreography\" (8–10)\n\nDefault baseline: Variance 8, Motion 6, Density 4. Adapt dynamically based on user's vibe description.\n\n### 2. Map the Color Palette\nFor each color provide: **Descriptive Name** + **Hex Code** + **Functional Role**.\n\n**Mandatory constraints:**\n- Maximum 1 accent color. Saturation below 80%\n- The \"AI Purple/Blue Neon\" aesthetic is strictly BANNED — no purple button glows, no neon gradients\n- Use absolute neutral bases (Zinc/Slate) with high-contrast singular accents\n- Stick to one palette for the entire output — no warm/cool gray fluctuation\n- Never use pure black (`#000000`) — use Off-Black, Zinc-950, or Charcoal\n\n### 3. Establish Typography Rules\n- **Display/Headlines:** Track-tight, controlled scale. Not screaming. Hierarchy through weight and color, not just massive size\n- **Body:** Relaxed leading, max 65 characters per line\n- **Font Selection:** `Inter` is BANNED for premium/creative contexts. Force unique character: `Geist`, `Outfit`, `Cabinet Grotesk`, or `Satoshi`\n- **Serif Ban:** Generic serif fonts (`Times New Roman`, `Georgia`, `Garamond`, `Palatino`) are BANNED. If serif is needed for editorial/creative contexts, use only distinctive modern serifs: `Fraunces`, `Gambarino`, `Editorial New`, or `Instrument Serif`. Serif is always BANNED in dashboards or software UIs\n- **Dashboard Constraint:** Use Sans-Serif pairings exclusively (`Geist` + `Geist Mono` or `Satoshi` + `JetBrains Mono`)\n- **High-Density Override:** When density exceeds 7, all numbers must use Monospace\n\n### 4. Define the Hero Section\nThe Hero is the first impression and must be creative, striking, and never generic:\n- **Inline Image Typography:** Embed small, contextual photos or visuals directly between words or letters in the headline. Images sit inline at type-height, rounded, acting as visual punctuation. This is the signature creative technique\n- **No Overlapping:** Text must never overlap images or other text. Every element occupies its own clean spatial zone\n- **No Filler Text:** \"Scroll to explore\", \"Swipe down\", scroll arrow icons, bouncing chevrons are BANNED. The content should pull users in naturally\n- **Asymmetric Structure:** Centered Hero layouts BANNED when variance exceeds 4\n- **CTA Restraint:** Maximum one primary CTA. No secondary \"Learn more\" links\n\n### 5. Describe Component Stylings\nFor each component type, describe shape, color, shadow depth, and interaction behavior:\n- **Buttons:** Tactile push feedback on active state. No neon outer glows. No custom mouse cursors\n- **Cards:** Use ONLY when elevation communicates hierarchy. Tint shadows to background hue. For high-density layouts, replace cards with border-top dividers or negative space\n- **Inputs/Forms:** Label above input, helper text optional, error text below. Standard gap spacing\n- **Loading States:** Skeletal loaders matching layout dimensions — no generic circular spinners\n- **Empty States:** Composed compositions indicating how to populate data\n- **Error States:** Clear, inline error reporting\n\n### 6. Define Layout Principles\n- No overlapping elements — every element occupies its own clear spatial zone. No absolute-positioned content stacking\n- Centered Hero sections are BANNED when variance exceeds 4 — force Split Screen, Left-Aligned, or Asymmetric Whitespace\n- The generic \"3 equal cards horizontally\" feature row is BANNED — use 2-column Zig-Zag, asymmetric grid, or horizontal scroll\n- CSS Grid over Flexbox math — never use `calc()` percentage hacks\n- Contain layouts using max-width constraints (e.g., 1400px centered)\n- Full-height sections must use `min-h-[100dvh]` — never `h-screen` (iOS Safari catastrophic jump)\n\n### 7. Define Responsive Rules\nEvery design must work across all viewports:\n- **Mobile-First Collapse (\u003c 768px):** All multi-column layouts collapse to single column. No exceptions\n- **No Horizontal Scroll:** Horizontal overflow on mobile is a critical failure\n- **Typography Scaling:** Headlines scale via `clamp()`. Body text minimum `1rem`/`14px`\n- **Touch Targets:** All interactive elements minimum `44px` tap target\n- **Image Behavior:** Inline typography images (photos between words) stack below headline on mobile\n- **Navigation:** Desktop horizontal nav collapses to clean mobile menu\n- **Spacing:** Vertical section gaps reduce proportionally (`clamp(3rem, 8vw, 6rem)`)\n\n### 8. Encode Motion Philosophy\n- **Spring Physics default:** `stiffness: 100, damping: 20` — premium, weighty feel. No linear easing\n- **Perpetual Micro-Interactions:** Every active component should have an infinite loop state (Pulse, Typewriter, Float, Shimmer)\n- **Staggered Orchestration:** Never mount lists instantly — use cascade delays for waterfall reveals\n- **Performance:** Animate exclusively via `transform` and `opacity`. Never animate `top`, `left`, `width`, `height`. Grain/noise filters on fixed pseudo-elements only\n\n### 9. List Anti-Patterns (AI Tells)\nEncode these as explicit \"NEVER DO\" rules in the DESIGN.md:\n- No emojis anywhere\n- No `Inter` font\n- No generic serif fonts (`Times New Roman`, `Georgia`, `Garamond`) — distinctive modern serifs only if needed\n- No pure black (`#000000`)\n- No neon/outer glow shadows\n- No oversaturated accents\n- No excessive gradient text on large headers\n- No custom mouse cursors\n- No overlapping elements — clean spatial separation always\n- No 3-column equal card layouts\n- No generic names (\"John Doe\", \"Acme\", \"Nexus\")\n- No fake round numbers (`99.99%`, `50%`)\n- No AI copywriting clichés (\"Elevate\", \"Seamless\", \"Unleash\", \"Next-Gen\")\n- No filler UI text: \"Scroll to explore\", \"Swipe down\", scroll arrows, bouncing chevrons\n- No broken Unsplash links — use `picsum.photos` or SVG avatars\n- No centered Hero sections (for high-variance projects)\n\n## Output Format (DESIGN.md Structure)\n\n```markdown\n# Design System: [Project Title]\n\n## 1. Visual Theme & Atmosphere\n(Evocative description of the mood, density, variance, and motion intensity.\nExample: \"A restrained, gallery-airy interface with confident asymmetric layouts\nand fluid spring-physics motion. The atmosphere is clinical yet warm — like a\nwell-lit architecture studio.\")\n\n## 2. Color Palette & Roles\n- **Canvas White** (#F9FAFB) — Primary background surface\n- **Pure Surface** (#FFFFFF) — Card and container fill\n- **Charcoal Ink** (#18181B) — Primary text, Zinc-950 depth\n- **Muted Steel** (#71717A) — Secondary text, descriptions, metadata\n- **Whisper Border** (rgba(226,232,240,0.5)) — Card borders, 1px structural lines\n- **[Accent Name]** (#XXXXXX) — Single accent for CTAs, active states, focus rings\n(Max 1 accent. Saturation \u003c 80%. No purple/neon.)\n\n## 3. Typography Rules\n- **Display:** [Font Name] — Track-tight, controlled scale, weight-driven hierarchy\n- **Body:** [Font Name] — Relaxed leading, 65ch max-width, neutral secondary color\n- **Mono:** [Font Name] — For code, metadata, timestamps, high-density numbers\n- **Banned:** Inter, generic system fonts for premium contexts. Serif fonts banned in dashboards.\n\n## 4. Component Stylings\n* **Buttons:** Flat, no outer glow. Tactile -1px translate on active. Accent fill for primary, ghost/outline for secondary.\n* **Cards:** Generously rounded corners (2.5rem). Diffused whisper shadow. Used only when elevation serves hierarchy. High-density: replace with border-top dividers.\n* **Inputs:** Label above, error below. Focus ring in accent color. No floating labels.\n* **Loaders:** Skeletal shimmer matching exact layout dimensions. No circular spinners.\n* **Empty States:** Composed, illustrated compositions — not just \"No data\" text.\n\n## 5. Layout Principles\n(Grid-first responsive architecture. Asymmetric splits for Hero sections.\nStrict single-column collapse below 768px. Max-width containment.\nNo flexbox percentage math. Generous internal padding.)\n\n## 6. Motion & Interaction\n(Spring physics for all interactive elements. Staggered cascade reveals.\nPerpetual micro-loops on active dashboard components. Hardware-accelerated\ntransforms only. Isolated Client Components for CPU-heavy animations.)\n\n## 7. Anti-Patterns (Banned)\n(Explicit list of forbidden patterns: no emojis, no Inter, no pure black,\nno neon glows, no 3-column equal grids, no AI copywriting clichés,\nno generic placeholder names, no broken image links.)\n```\n\n## Best Practices\n- **Be Descriptive:** \"Deep Charcoal Ink (#18181B)\" — not just \"dark text\"\n- **Be Functional:** Explain what each element is used for\n- **Be Consistent:** Same terminology throughout the document\n- **Be Precise:** Include exact hex codes, rem values, pixel values in parentheses\n- **Be Opinionated:** This is not a neutral template — it enforces a specific, premium aesthetic\n\n## Tips for Success\n1. Start with the atmosphere — understand the vibe before detailing tokens\n2. Look for patterns — identify consistent spacing, sizing, and styling\n3. Think semantically — name colors by purpose, not just appearance\n4. Consider hierarchy — document how visual weight communicates importance\n5. Encode the bans — anti-patterns are as important as the rules themselves\n\n## Common Pitfalls to Avoid\n- Using technical jargon without translation (\"rounded-xl\" instead of \"generously rounded corners\")\n- Omitting hex codes or using only descriptive names\n- Forgetting functional roles of design elements\n- Being too vague in atmosphere descriptions\n- Ignoring the anti-pattern list — these are what make the output premium\n- Defaulting to generic \"safe\" designs instead of enforcing the curated aesthetic\n"}, {"name": "subtask", "description": "Use when the owner says \"/subtask\", \"with /subtask\", \"run it through /subtask agents\", \"do it in parallel using /subtask\", or asks to hand a job to subagents. Splits the work into independent pieces, runs each in its own subagent (in parallel, in the background), then collects and reports the results. The owner can hand over a whole numbered list or a batch of tasks and walk away.", "manual": false, "path": "~/.agents/skills/subtask", "file_count": 0, "files": [], "body": "---\nname: subtask\ndescription: Use when the owner says \"/subtask\", \"with /subtask\", \"run it through /subtask agents\", \"do it in parallel using /subtask\", or asks to hand a job to subagents. Splits the work into independent pieces, runs each in its own subagent (in parallel, in the background), then collects and reports the results. The owner can hand over a whole numbered list or a batch of tasks and walk away.\n---\n\n# /subtask\n\nThe owner hands you a job and wants it done by subagents, not step by step in this session. Start right away, report when done. Text after `/subtask` (or the sentence it sits in) is the job; \"with /subtask\" at the end of one item in a list applies to that item only.\n\n## Steps\n\n1. **Split.** Break the job into pieces that don't depend on each other: one per repo, per task id, per list item, per file group. Pieces that need another piece's output run after it, not beside it. A job that is a single small step doesn't need a subagent: do it here and say so.\n2. **Brief each subagent** like a peer who has no context: goal, the exact paths or ids, what is already ruled out, the repo rules that apply (paste the relevant `AGENTS.md`/`CLAUDE.md` section word for word, not \"read AGENTS.md\"), what to return. When briefing a subagent to merge or push, follow the owner's global push/merge rule (fetch first, explicit paths, never force-push, confirm nothing from `origin/main` was dropped).\n3. **Launch in parallel.** Send all independent subagents in one message with `run_in_background: true`. Use `isolation: \"worktree\"` when two of them could edit the same repo. Model: the session default, or the one the owner names (\"on Opus\" means `model: \"opus\"`). Pick a read-only type (`Explore`, `data-checker`) for checks and counts; `general-purpose` for work that edits.\n4. **Keep working or wait.** Do other parts of the owner's message meanwhile. Don't poll: you are notified when a subagent finishes. Never write a result for a subagent that hasn't reported.\n5. **Verify.** Read what each subagent says it did against the repo or the tool's real state (a `git log`, a row count, a file listing) before you repeat it. Say plainly when one failed or skipped something.\n6. **Report.** One short summary: what each subagent did, what changed, what needs the owner. If the owner said \"take all decisions for me\", decide, log the decision, and keep going. If they asked for errors in a file (\"write them in an error file\"), write that file.\n\n## Owner conventions\n\n- **Tasks in the vault** (`~/cos`): each subagent claims its task per `AGENTS.md` (owner `agent:\u003cname>`, `in_progress`, progress log), ends at `status: review` (never `done`), commits per task, and doesn't push unless asked. Don't create new tasks when told not to.\n- **Don't send personal data** (the owner's email address, tokens) to external APIs from a subagent unless the brief says to.\n- Commit and push stay the owner's call: `/subtask` runs the work, `/commit` and `/merge` land it.\n"}, {"name": "supabase", "description": "Use when doing ANY task involving Supabase. Triggers: Supabase products (Database, Auth, Edge Functions, Realtime, Storage, Vectors, Cron, Queues); client libraries and SSR integrations (supabase-js, @supabase/ssr) in Next.js, React, SvelteKit, Astro, Remix; auth issues (login, logout, sessions, JWT, cookies, getSession, getUser, getClaims, RLS); Supabase CLI or MCP server; schema changes, migrations, declarative schemas, security audits, Postgres extensions (pg_graphql, pg_cron, pg_vector); debugging and troubleshooting errors or unexpected behavior on Supabase projects (HTTP errors, Postgres errors, RLS surprises, permission denied, schema cache issues, timeouts, Edge Function crashes, Realtime drops, Storage failures) and reading or querying logs (Logs Explorer, ClickHouse).", "manual": false, "path": "~/.agents/skills/supabase", "file_count": 3, "files": ["CHANGELOG.md", "assets/feedback-issue-template.md", "references/skill-feedback.md"], "body": "---\nname: supabase\ndescription: \"Use when doing ANY task involving Supabase. Triggers: Supabase products (Database, Auth, Edge Functions, Realtime, Storage, Vectors, Cron, Queues); client libraries and SSR integrations (supabase-js, @supabase/ssr) in Next.js, React, SvelteKit, Astro, Remix; auth issues (login, logout, sessions, JWT, cookies, getSession, getUser, getClaims, RLS); Supabase CLI or MCP server; schema changes, migrations, declarative schemas, security audits, Postgres extensions (pg_graphql, pg_cron, pg_vector); debugging and troubleshooting errors or unexpected behavior on Supabase projects (HTTP errors, Postgres errors, RLS surprises, permission denied, schema cache issues, timeouts, Edge Function crashes, Realtime drops, Storage failures) and reading or querying logs (Logs Explorer, ClickHouse).\"\nmetadata:\n  author: supabase\n  version: \"0.1.2\"\n---\n\n# Supabase\n\n## Core Principles\n\n**1. Supabase changes frequently — verify against changelog and current docs before implementing.**\nDo not rely on training data for Supabase features. Function signatures, config.toml settings, and API conventions change between versions.\n\nFirst, fetch `https://supabase.com/changelog.md` (a lightweight summary index — not a heavy pull), scan for `breaking-change` tags relevant to your task, and follow the linked page for any that apply. Then look up the relevant topic using the documentation access methods below.\n\n**2. Verify your work.**\nAfter implementing any fix, run a test query to confirm the change works. A fix without verification is incomplete.\n\n**3. Recover from errors, don't loop.**\nIf an approach fails after 2-3 attempts, stop and reconsider. Try a different method, check documentation, inspect the error more carefully, and review relevant logs when available. Supabase issues are not always solved by retrying the same command, and the answer is not always in the logs, but logs are often worth checking before proceeding.\n\n**4. Exposing tables to the Data API:** Depending on the user's [Data API settings](https://supabase.com/dashboard/project/\u003cref>/integrations/data_api/settings), newly created tables may not be automatically exposed via the Data (REST) API. If this is the case, `anon` and `authenticated` roles will need to be explicitly granted access.\n\n> Note that this is separate from RLS, which controls which _rows_ are visible once a table is accessible, not whether the table is accessible at all.\n\nWhen a user reports a SQL-created table is unexpectedly inaccessible, check their Data API settings and whether the roles have been granted access via explicit `GRANT` SQL. When granting public (`anon`/`authenticated`) access, always enable RLS too. See [Exposing a Table to the Data API](https://supabase.com/docs/guides/api/securing-your-api.md) for the full setup workflow.\n\n**5. RLS in exposed schemas.**\nEnable RLS on every table in any exposed schema, which includes `public` by default. This is critical in Supabase because tables in exposed schemas can be reachable through the Data API when the `anon`/`authenticated` roles have access (see [Exposing a Table to the Data API](https://supabase.com/docs/guides/api/securing-your-api.md)). For private schemas, prefer RLS as defense in depth. After enabling RLS, create policies that match the actual access model rather than defaulting every table to the same `auth.uid()` pattern.\n\n**6. Security checklist.**\nWhen working on any Supabase task that touches auth, RLS, views, storage, or user data, run through this checklist. These are Supabase-specific security traps that silently create vulnerabilities:\n\n- **Auth and session security**\n  - **Never use `user_metadata` claims in JWT-based authorization decisions.** In Supabase, `raw_user_meta_data` is user-editable and can appear in `auth.jwt()`, so it is unsafe for RLS policies or any other authorization logic. Store authorization data in `raw_app_meta_data` / `app_metadata` instead.\n  - **Deleting a user does not invalidate existing access tokens.** Sign out or revoke sessions first, keep JWT expiry short for sensitive apps, and for strict guarantees validate `session_id` against `auth.sessions` on sensitive operations.\n  - **If you use `app_metadata` or `auth.jwt()` for authorization, remember JWT claims are not always fresh until the user's token is refreshed.**\n\n- **API key and client exposure**\n  - **Never expose the `service_role` or secret key in public clients.** Prefer publishable keys for frontend code. Legacy `anon` keys are only for compatibility. In Next.js, any `NEXT_PUBLIC_` env var is sent to the browser.\n\n- **RLS, views, and privileged database code**\n  - **Views bypass RLS by default.** In Postgres 15 and above, use `CREATE VIEW ... WITH (security_invoker = true)`. In older versions of Postgres, protect your views by revoking access from the `anon` and `authenticated` roles, or by putting them in an unexposed schema.\n  - **UPDATE requires a SELECT policy.** In Postgres RLS, an UPDATE needs to first SELECT the row. Without a SELECT policy, updates silently return 0 rows — no error, just no change.\n  - **`auth.role()` is deprecated — use the `TO` clause instead.** Supabase has deprecated `auth.role()` in favour of specifying the target role directly on the policy with `TO authenticated` or `TO anon`. Beyond deprecation, `auth.role() = 'authenticated'` breaks silently when anonymous sign-ins are enabled, because anonymous users carry the `authenticated` Postgres role and pass the check regardless of whether the user is genuinely signed in.\n    ```sql\n    -- Deprecated (do not use)\n    create policy \"example\" on table_name for select\n    using ( auth.role() = 'authenticated' );\n    ```\n  - **`TO authenticated` alone is authentication without authorization (BOLA / IDOR).** Using `TO authenticated` only checks the role — it does not restrict which rows a user can access. The correct pattern combines `TO authenticated` with an ownership predicate in `USING`:\n    ```sql\n    create policy \"example\" on table_name for select\n    to authenticated\n    using ( (select auth.uid()) = user_id );\n    ```\n  - **UPDATE policies require both `USING` and `WITH CHECK`.** Without `WITH CHECK`, a user can reassign a row's `user_id` to another user:\n    ```sql\n    create policy \"example\" on table_name for update\n    to authenticated\n    using ( (select auth.uid()) = user_id )\n    with check ( (select auth.uid()) = user_id );\n    ```\n  - **`SECURITY DEFINER` functions bypass RLS.** A `SECURITY DEFINER` function runs with its creator's privileges — typically a role with `bypassrls` (e.g., `postgres`). Never add `SECURITY DEFINER` to resolve a permission error; it silently removes access control without fixing the underlying cause. Prefer `SECURITY INVOKER`.\n  - **`SECURITY DEFINER` functions in `public` are callable by all roles.** Postgres grants `EXECUTE` to `PUBLIC` by default for every new function, so any `SECURITY DEFINER` function in `public` is a public API endpoint callable by `anon` and `authenticated` (which inherit from `PUBLIC`) without any additional grant. When `SECURITY DEFINER` is genuinely needed (e.g., bypassing RLS on an internal lookup table), keep the function in a non-exposed schema, always include an `auth.uid()` check in the function body, and run `supabase db advisors` after making changes.\n\n- **Storage access control**\n  - **Storage upsert requires INSERT + SELECT + UPDATE.** Granting only INSERT allows new uploads but file replacement (upsert) silently fails. You need all three.\n\n- **Dependency and supply-chain security**\n  - **Always pin package versions and commit lockfiles** when installing Supabase packages (`supabase-js`, `@supabase/ssr`, `supabase-py`, etc.). See the [npm security guide](https://supabase.com/docs/guides/security/npm-security.md) for the full checklist.\n\nFor any security concern not covered above, fetch the Supabase product security index: `https://supabase.com/docs/guides/security/product-security.md`\n\n## Supabase CLI\n\nAlways discover commands via `--help` — never guess. The CLI structure changes between versions.\n\n```bash\nsupabase --help                    # All top-level commands\nsupabase \u003cgroup> --help            # Subcommands (e.g., supabase db --help)\nsupabase \u003cgroup> \u003ccommand> --help  # Flags for a specific command\n```\n\n**Supabase CLI Known gotchas:**\n\n- `supabase db query` requires **CLI v2.79.0+** → use MCP `execute_sql` or `psql` as fallback\n- `supabase db advisors` requires **CLI v2.81.3+** → use MCP `get_advisors` as fallback\n- In imperative migration projects, create new hand-authored migration files with `supabase migration new \u003cname>` first. Never invent a migration filename or rely on memory for the expected format. Declarative schema projects generate migrations from `supabase/schemas/`; see \"Making and Committing Schema Changes\" below.\n\n**Version check and upgrade:** Run `supabase --version` to check. For CLI changelogs and version-specific features, consult the [CLI documentation](https://supabase.com/docs/reference/cli/introduction) or [GitHub releases](https://github.com/supabase/cli/releases).\n\n## Supabase MCP Server\n\nFor setup instructions, server URL, and configuration, see the [MCP setup guide](https://supabase.com/docs/guides/getting-started/mcp).\n\n**Troubleshooting connection issues** — follow these steps in order:\n\n1. **Check if the server is reachable:**\n   `curl -so /dev/null -w \"%{http_code}\" https://mcp.supabase.com/mcp`\n   A `401` is expected (no token) and means the server is up. Timeout or \"connection refused\" means it may be down.\n\n2. **Check `.mcp.json` configuration:**\n   Verify the project root has a valid `.mcp.json` with the correct server URL. If missing, create one pointing to `https://mcp.supabase.com/mcp`.\n\n3. **Authenticate the MCP server:**\n   If the server is reachable and `.mcp.json` is correct but tools aren't visible, the user needs to authenticate. The Supabase MCP server uses OAuth 2.1 — tell the user to trigger the auth flow in their agent, complete it in the browser, and reload the session.\n\n## Supabase Documentation\n\nBefore implementing any Supabase feature, find the relevant documentation. Use these methods in priority order:\n\n1. **MCP `search_docs` tool** (preferred — returns relevant snippets directly)\n2. **Fetch docs pages as markdown** — any docs page can be fetched by appending `.md` to the URL path.\n3. **Web search** for Supabase-specific topics when you don't know which page to look at.\n\n## Making and Committing Schema Changes\n\nFirst decide which schema workflow the project uses.\n\n### Option A: Declarative schemas\n\nUse this when `supabase/schemas/` exists or `config.toml` sets `schema_paths`. Edit the desired schema state in those files, then generate and review the migration. Do not start by hand-writing a migration. See the [Declarative database schemas guide](https://supabase.com/docs/guides/local-development/declarative-database-schemas).\n\n### Option B: Imperative migrations\n\nUse this when the project does not use declarative schemas.\n\n**To make schema changes, use `execute_sql` (MCP) or `supabase db query` (CLI).** These run SQL directly on the database without creating migration history entries, so you can iterate freely and generate a clean migration when ready.\n\nDo NOT use `apply_migration` to change a local database schema — it writes a migration history entry on every call, which means you can't iterate, and `supabase db diff` / `supabase db pull` will produce empty or conflicting diffs. If you use it, you'll be stuck with whatever SQL you passed on the first try.\n\n**When ready to commit** your changes to a migration file:\n\n1. **Run advisors** → `supabase db advisors` (CLI v2.81.3+) or MCP `get_advisors`. Fix any issues.\n2. **Review the Security Checklist above** if your changes involve views, functions, triggers, or storage.\n3. **Generate the migration** → `supabase db pull \u003cdescriptive-name> --local --yes`\n4. **Verify** → `supabase migration list --local`\n\n## Debugging\n\nWhen you get an error on a Supabase-related request, for example an error code from the Supabase REST API, Postgres database, or PostgREST, an empty result, getting blocked by RLS unexpectedly, or an error from a Supabase service like Auth, Realtime, Edge Functions, or Storage, you **must** fetch Supabase's [Monitoring and Debugging](https://supabase.com/docs/guides/monitoring-and-debugging.md) documentation before diagnosing or proposing a fix, rather than working from memory. The same docs also cover performance optimizations, such as slow queries and missing indexes.\n\n## Reference Guides\n\n- **Skill Feedback** → [references/skill-feedback.md](references/skill-feedback.md)\n  **MUST read when** the user reports that this skill gave incorrect guidance or is missing information.\n"}, {"name": "supabase-postgres-best-practices", "description": "Postgres best practices maintained by Supabase, for Postgres running anywhere. Load this skill BEFORE writing or changing anything that lives in a Postgres database: creating or altering tables and columns (including choosing column types), schema design, migrations and declarative schema files, RLS policies and the tests that verify them, indexes, triggers, database functions, queues and scheduled jobs (pg_cron, pgmq), vector/semantic search (pgvector), and restoring dumps (pg_restore) or importing data. Also load it when diagnosing slow queries, high CPU, timeouts, EXPLAIN plans, connection exhaustion, locking, bloat, or rows visible to the wrong user or tenant. This is not just a performance guide — schema, migration, security, and SQL authoring tasks need these rules too, even for a one-column change or a single query.", "manual": false, "path": "~/.agents/skills/supabase-postgres-best-practices", "file_count": 35, "files": ["CHANGELOG.md", "references/_contributing.md", "references/_sections.md", "references/_template.md", "references/advanced-full-text-search.md", "references/advanced-jsonb-indexing.md", "references/conn-idle-timeout.md", "references/conn-limits.md", "references/conn-pooling.md", "references/conn-prepared-statements.md", "references/data-batch-inserts.md", "references/data-n-plus-one.md", "references/data-pagination.md", "references/data-upsert.md", "references/lock-advisory.md", "references/lock-deadlock-prevention.md", "references/lock-short-transactions.md", "references/lock-skip-locked.md", "references/monitor-explain-analyze.md", "references/monitor-pg-stat-statements.md", "references/monitor-vacuum-analyze.md", "references/query-composite-indexes.md", "references/query-covering-indexes.md", "references/query-index-types.md", "references/query-missing-indexes.md", "references/query-partial-indexes.md", "references/schema-constraints.md", "references/schema-data-types.md", "references/schema-foreign-key-indexes.md", "references/schema-lowercase-identifiers.md", "references/schema-partitioning.md", "references/schema-primary-keys.md", "references/security-privileges.md", "references/security-rls-basics.md", "references/security-rls-performance.md"], "body": "---\nname: supabase-postgres-best-practices\ndescription: \"Postgres best practices maintained by Supabase, for Postgres running anywhere. Load this skill BEFORE writing or changing anything that lives in a Postgres database: creating or altering tables and columns (including choosing column types), schema design, migrations and declarative schema files, RLS policies and the tests that verify them, indexes, triggers, database functions, queues and scheduled jobs (pg_cron, pgmq), vector/semantic search (pgvector), and restoring dumps (pg_restore) or importing data. Also load it when diagnosing slow queries, high CPU, timeouts, EXPLAIN plans, connection exhaustion, locking, bloat, or rows visible to the wrong user or tenant. This is not just a performance guide — schema, migration, security, and SQL authoring tasks need these rules too, even for a one-column change or a single query.\"\nlicense: MIT\nmetadata:\n  author: supabase\n  version: \"1.1.1\"\n  organization: Supabase\n  date: January 2026\n  abstract: Comprehensive Postgres performance optimization guide for developers using Supabase and Postgres. Contains performance rules across 8 categories, prioritized by impact from critical (query performance, connection management) to incremental (advanced features). Each rule includes detailed explanations, incorrect vs. correct SQL examples, query plan analysis, and specific performance metrics to guide automated optimization and code generation.\n---\n\n# Supabase Postgres Best Practices\n\nComprehensive performance optimization guide for Postgres, maintained by Supabase. Contains rules across 8 categories, prioritized by impact to guide automated query optimization and schema design.\n\n## When to Apply\n\nReference these guidelines when:\n- Writing SQL queries or designing schemas\n- Implementing indexes or query optimization\n- Reviewing database performance issues\n- Configuring connection pooling or scaling\n- Optimizing for Postgres-specific features\n- Working with Row-Level Security (RLS)\n\n## Rule Categories by Priority\n\n| Priority | Category | Impact | Prefix |\n|----------|----------|--------|--------|\n| 1 | Query Performance | CRITICAL | `query-` |\n| 2 | Connection Management | CRITICAL | `conn-` |\n| 3 | Security & RLS | CRITICAL | `security-` |\n| 4 | Schema Design | HIGH | `schema-` |\n| 5 | Concurrency & Locking | MEDIUM-HIGH | `lock-` |\n| 6 | Data Access Patterns | MEDIUM | `data-` |\n| 7 | Monitoring & Diagnostics | LOW-MEDIUM | `monitor-` |\n| 8 | Advanced Features | LOW | `advanced-` |\n\n## How to Use\n\nRead individual rule files for detailed explanations and SQL examples:\n\n```\nreferences/query-missing-indexes.md\nreferences/query-partial-indexes.md\nreferences/_sections.md\n```\n\nEach rule file contains:\n- Brief explanation of why it matters\n- Incorrect SQL example with explanation\n- Correct SQL example with explanation\n- Optional EXPLAIN output or metrics\n- Additional context and references\n- Supabase-specific notes (when applicable)\n\n## References\n\n- https://www.postgresql.org/docs/current/\n- https://supabase.com/docs\n- https://wiki.postgresql.org/wiki/Performance_Optimization\n- https://supabase.com/docs/guides/database/overview\n- https://supabase.com/docs/guides/auth/row-level-security\n"}, {"name": "supervise", "description": "Use first, before ListAgents or SendMessage, whenever the owner points at another session or agent (an @Name, a background, Paperclip or cron agent) and wants it kept going, supervised, followed up on, or reported back on when done. Examples are \"keep tabs on @X\", \"keep that going and report back when it's done\", \"implement this through @Helper and take decisions for it\", \"supervise the session\", \"did the cron session push anything new? follow up with it\", or /supervise. Briefs the session, answers its questions within what the owner delegated, checks its claims with git fetch and its transcript, and reports only when it is done or the owner must decide. For an overview of all sessions, use /master.", "manual": false, "path": "~/.agents/skills/supervise", "file_count": 0, "files": [], "body": "---\nname: supervise\ndescription: Use first, before ListAgents or SendMessage, whenever the owner points at another session or agent (an @Name, a background, Paperclip or cron agent) and wants it kept going, supervised, followed up on, or reported back on when done. Examples are \"keep tabs on @X\", \"keep that going and report back when it's done\", \"implement this through @Helper and take decisions for it\", \"supervise the session\", \"did the cron session push anything new? follow up with it\", or /supervise. Briefs the session, answers its questions within what the owner delegated, checks its claims with git fetch and its transcript, and reports only when it is done or the owner must decide. For an overview of all sessions, use /master.\n---\n\n# /supervise\n\nThe owner hands named sessions to you so they don't have to watch them. You don't do their work. You keep it moving: brief them, answer their questions, check what they say they did, and tell the owner when it's done or when something truly needs the owner.\n\nText after `/supervise` names the sessions and the goal. `/master` is for \"what are all my sessions doing\". This skill is for following specific delegated work through to the end.\n\n## 1. Pin down the job\nWrite this to `STATE.md` in `~/.agent/sessions/\u003cyour id>/` before sending anything:\n- **Targets:** each session's address (its name in `ListAgents`), repo and branch.\n- **Goal:** in the owner's words.\n- **Done when:** what proves it is finished, for example tests pass, a PR is open, a file is written, or the report is delivered.\n- **Delegated:** the decisions you may take for the owner. Default: everything inside the goal.\n- **Owner keeps:** merges the owner said they would review, production writes (Supabase applies, prod migrations, deploy merges), scope changes, product choices, and anything a guard or permission blocked.\n\n## 2. Find each target\n- Live sessions: `ListAgents`. Copy the name exactly.\n- Not live (a cron run, a Paperclip agent, an ended session): `~/.agents/skills/master/scripts/sessions.sh 48` lists recent sessions with their transcript path. Paperclip work also shows up as commits on its branch.\n- What it is doing now: `python3 -I ~/.agents/skills/master/scripts/digest.py \u003ctranscript> 6`.\n\n## 3. Brief or nudge\nUse `SendMessage` with `notify_when_idle: true`. Make the first line self-contained. Give the exact next step and the owner's git rules: fetch first, stage explicit paths, never force-push, and check that `git log HEAD..origin/main` is empty after a merge. Ask it to report back to you by name. If it is already working on the right thing, leave out the message and only subscribe.\n\n## 4. Wait without polling\nAn idle notice wakes you. Don't loop on `ListAgents` and don't send \"are you done?\". For a target that can't send idle notices (cron, Paperclip, a remote branch), use one `Bash` call with `run_in_background` and an `until` loop on `git fetch` that exits when the branch moves. Keep the interval at 60 s or more.\n\n## 5. On every idle notice\n1. Read the full last reply (digest.py, or the whole last assistant message if it was cut off), not the notice summary.\n2. Look for questions, offers (\"If you want, I can…\"), blockers and claims of \"done\".\n3. Check claims before you believe them: `git fetch`, then `git log --oneline origin/main..origin/\u003cbranch>`, `git status -sb` in its worktree, `gh pr view`, and the test output it quoted.\n4. Act:\n   - Question inside the delegation: answer it yourself with the recommended option, send it with `notify_when_idle: true`, and log the decision in `STATE.md`.\n   - Owner decision: ask with `AskUserQuestion` and put \"(Recommended)\" on your recommended option. For production writes, tell the owner to type \"yes\" in that session themselves. Peers refuse approval that you relay.\n   - Blocked by a guard or permission: never ask the peer to do it instead. Route it to the owner.\n   - Done and verified: go to step 6.\n5. Report a session with an open question as \"waiting on X\", never as \"idle\".\n\n## 6. Report\nWhen every target is done, or when only owner decisions are left, send one short report:\n- Per session: what got done (verified, with the commit, PR or file) and what is left.\n- The decisions you took for the owner, one line each.\n- The decisions the owner must take, each with a recommendation.\n\nUpdate `STATE.md` and `NEXT.md` so another session can take over.\n"}, {"name": "task-prd-creator", "description": "Use this skill when users request new features, enhancements, bug fixes, or any work that needs planning. Creates structured task files and PRDs (Product Requirements Documents) before implementation. Activates for \"I want to add X\", \"implement Y\", \"create a task for Z\", \"plan this feature\", or any feature request.", "manual": false, "path": "~/.agents/skills/task-prd-creator", "file_count": 2, "files": ["plugin.json", "references/full-guide.md"], "body": "---\nname: task-prd-creator\ndescription: Use this skill when users request new features, enhancements, bug fixes, or any work that needs planning. Creates structured task files and PRDs (Product Requirements Documents) before implementation. Activates for \"I want to add X\", \"implement Y\", \"create a task for Z\", \"plan this feature\", or any feature request.\nversion: 1.0.0\ntags:\n  - planning\n  - task-management\n  - prd\n  - workflow\n  - documentation\n  - project-management\nauto_activate: true\n---\n\n# Task & PRD Creator\n\n## Overview\n\nCreate structured task files and PRDs before implementing features. This ensures proper planning, documentation, and clear scope definition.\n\n**CRITICAL RULE:** Never implement a feature without first creating the task + PRD files and getting user approval.\n\n## When This Activates\n\n- \"I want to add [feature]\"\n- \"Implement [feature]\"\n- \"Create a task for [feature]\"\n- \"Plan this feature\"\n- User describes a user story\n- Bug that needs tracking\n\n## The Workflow\n\n### Step 1: Understand Request\n\n- **Simple task:** \u003c1 hour, few files\n- **Complex feature:** >1 hour, multiple files/systems\n\n### Step 2: Gather Requirements\n\n- Which app/project?\n- Priority? (CRITICAL/High/Medium/Low)\n- Dependencies?\n\n### Step 3: Check Existing System\n\n- Read architecture docs\n- Search for similar implementations\n\n### Step 4: Create Files\n\n**Task file:** `[project]/.agents/TASKS/[task-name].md`\n**PRD file:** `[project]/.agents/PRDS/[task-name].md`\n\n### Step 5: Get Approval\n\nPresent files, explain approach, **WAIT for user approval**.\n\n## Task File Format\n\n```markdown\n## Task: [Feature Name]\n\n**ID:** feature-name-slug\n**Label:** [App]: [Feature Name]\n**Description:** Brief description\n**Type:** Feature | Bug | Enhancement\n**Status:** Backlog | To Do | Testing | Done\n**Priority:** High | Medium | Low\n**Created:** YYYY-MM-DD\n**Updated:** YYYY-MM-DD\n**PRD:** [Link](../PRDS/feature-name.md)\n```\n\n## Critical Rules\n\n1. Create task file\n2. Create PRD file\n3. Link them together\n4. Present to user\n5. Get approval\n6. Then implement\n\n## Red Flags (Stop and Ask)\n\n- Breaking changes\n- Affects multiple projects\n- Security implications\n- Unclear requirements\n\n## Integration\n\n- `mvp-architect` - MVP scoping\n- `planning-assistant` - Content planning\n- `agent-folder-init` - Initialize .agents/ structure\n\n---\n\n**For complete PRD template, naming conventions, status update workflow, Context7 integration, and example interactions, see:** `references/full-guide.md`\n"}, {"name": "writing-style", "description": "Apply plain, direct prose (Google Developer Documentation Style Guide) to any agent-authored text, such as briefs, project status, outreach drafts, reports, plans, docs and PR descriptions. Use whenever writing or editing prose meant for a human reader, not code. Do not use for commit messages or code comments (those follow their own conventions).", "manual": false, "path": "~/.agents/skills/writing-style", "file_count": 0, "files": [], "body": "---\nname: writing-style\ndescription: Apply plain, direct prose (Google Developer Documentation Style Guide) to any agent-authored text, such as briefs, project status, outreach drafts, reports, plans, docs and PR descriptions. Use whenever writing or editing prose meant for a human reader, not code. Do not use for commit messages or code comments (those follow their own conventions).\n---\n\n## Why this exists\n\nAgent-authored prose tends toward \"Claude-lish\": hedged, over-qualified, first-person-plural (\"we'll want to...\"), title-cased headings, and passive constructions that hide who's doing what. This skill is a checklist to catch that before it ships, sourced from Google's developer documentation style guide (developers.google.com/style/highlights) — not invented rules.\n\n## Rules to apply\n\n**Voice & grammar**\n- Second person (\"you\"), not first person plural (\"we\") — the reader is doing the thing, not us.\n- Active voice: name who does the action. \"Claude built the skill,\" not \"the skill was built.\"\n- Put the condition before the instruction: \"If X, do Y\" — not \"Do Y if X.\"\n\n**Tone**\n- Conversational and direct, not frivolous. Say the finding, then the reason — skip throat-clearing (\"It's worth noting that...\", \"I think it's important to...\").\n- No pre-announcing future work as if it's decided (\"this will eventually...\") — state what's true now, flag what's planned as planned.\n\n**Capitalization & formatting**\n- Sentence case for headings (\"Open loops still live\", not \"Open Loops Still Live\").\n- Code-related terms (file names, commands, flags) in code font.\n- Serial (Oxford) commas in lists.\n\n**Lists**\n- Numbered lists only for sequential procedures (do step 1, then step 2).\n- Bulleted lists for anything non-sequential (a set of findings, options, open items).\n\n**Dates**\n- Always unambiguous: `YYYY-MM-DD`, never \"8/9\" or \"next Tuesday\" without an absolute date attached.\n\n## Where it matters most\n\n- Outreach drafts (speakers, partners, investors): second person, active voice, and specific link text directly affect response rates.\n- Plans and status logs: watch for passive voice (\"was decided\" → name who decided).\n- Briefs and reports: keep headings in sentence case and dates absolute.\n\n## In the bbqos vault\n\n- Daily briefs (`01-Daily/*.md`): already largely conversational; check headings stay sentence-case and dates stay absolute.\n- Project `ACTIVE_PLAN.md` files: watch for passive voice in Status Log entries (\"was decided\" → name who decided).\n- Outreach drafts (LP Forum, VIP outreach): highest-value target, since second person, active voice, and specific link text all directly affect response rates.\n\n## Anti-pattern check\n\nBefore finishing a piece of writing, scan for these and fix on sight:\n- \"We\" where \"you\" (reader-facing) or a named actor (internal reporting) belongs.\n- Title Case headings.\n- A passive sentence where the actor is knowable — rewrite active.\n- Vague link text (\"click here\", \"see this\") — replace with the actual destination's name.\n"}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const S = DATA.skills;
const $ = id => document.getElementById(id);
const isMac = /Mac|iPhone|iPad/.test(navigator.platform);
$('kbd').textContent = isMac ? '⌘K' : 'Ctrl K';
$('meta').textContent = `${DATA.count} skills from ${DATA.source} · built ${DATA.generated}`;

for (const s of S) { s._n = s.name.toLowerCase(); s._d = s.description.toLowerCase(); s._b = s.body.toLowerCase(); s._f = s.files.join(' ').toLowerCase(); }

const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const reEsc = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const tokens = q => q.toLowerCase().split(/\s+/).filter(Boolean);

function hl(text, toks) {
  if (!toks.length) return esc(text);
  const re = new RegExp(toks.slice().sort((a, b) => b.length - a.length).map(reEsc).join('|'), 'gi');
  let out = '', last = 0, m;
  while ((m = re.exec(text))) {
    out += esc(text.slice(last, m.index)) + '<mark>' + esc(m[0]) + '</mark>';
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}

// ---- small markdown renderer (no dependencies; covers what skills use: headings, lists, tables, code, quotes, links)
function fmt(t) {
  return t
    .replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^\w])__(?=\S)([\s\S]*?\S)__(?!\w)/g, '$1<strong>$2</strong>')
    .replace(/(^|[^*\w])\*(?=[^\s*])([\s\S]*?[^\s*])\*(?!\*)/g, '$1<em>$2</em>')
    .replace(/(^|[^\w])_(?=[^\s_])([\s\S]*?[^\s_])_(?!\w)/g, '$1<em>$2</em>')
    .replace(/~~(?=\S)([\s\S]*?\S)~~/g, '<del>$1</del>');
}
function inline(src) {
  const stash = [];
  const put = h => { stash.push(h); return '\u0001' + (stash.length - 1) + '\u0002'; };
  let t = src.replace(/(`+)([\s\S]*?[^`])\1(?!`)/g, (_, _b, c) => put('<code>' + esc(c.trim()) + '</code>'));
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, (_, text, href) => {
    const inner = fmt(esc(text));
    return put(/^(https?:\/\/|mailto:)/i.test(href) ? `<a href="${esc(href)}" target="_blank" rel="noopener">${inner}</a>` : `<span class="ref">${inner}</span>`);
  });
  t = fmt(esc(t));
  while (/\u0001\d+\u0002/.test(t)) t = t.replace(/\u0001(\d+)\u0002/g, (_, i) => stash[i]);
  return t;
}
function splitRow(l) {
  let s = l.trim();
  if (s[0] === '|') s = s.slice(1);
  if (s.endsWith('|') && !s.endsWith('\\|')) s = s.slice(0, -1);
  const cells = []; let cur = '', tick = false;
  for (let k = 0; k < s.length; k++) {
    const c = s[k];
    if (c === '\\' && s[k + 1] === '|') { cur += '|'; k++; continue; }
    if (c === '`') tick = !tick;
    if (c === '|' && !tick) { cells.push(cur.trim()); cur = ''; continue; }
    cur += c;
  }
  cells.push(cur.trim());
  return cells;
}
const blank = l => /^\s*$/.test(l);
const fenceRe = /^\s*(```+|~~~+)/;
const listRe = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const hrRe = /^\s{0,3}([-*_])(\s*\1){2,}\s*$/;
const sepRe = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
const indentOf = l => l.replace(/\t/g, '    ').match(/^ */)[0].length;

function blocks(lines) {
  let out = '', i = 0;
  const tableAt = k => k + 1 < lines.length && lines[k].includes('|') && lines[k + 1].includes('-') && sepRe.test(lines[k + 1]);
  const startsBlock = k => /^\s{0,3}#{1,6}\s/.test(lines[k]) || fenceRe.test(lines[k]) || /^\s{0,3}>/.test(lines[k]) || hrRe.test(lines[k]) || listRe.test(lines[k]) || tableAt(k);
  while (i < lines.length) {
    const l = lines[i];
    if (blank(l)) { i++; continue; }
    let m;
    if ((m = fenceRe.exec(l))) {
      const ch = m[1][0], n = m[1].length, ind = indentOf(l), buf = [];
      const close = new RegExp('^\\s*' + (ch === '`' ? '`' : '~') + '{' + n + ',}\\s*$');
      for (i++; i < lines.length && !close.test(lines[i]); i++) buf.push(lines[i].slice(Math.min(ind, indentOf(lines[i]))));
      i++;
      out += `<pre class="code"><code>${esc(buf.join('\n'))}</code></pre>`;
    } else if ((m = /^\s{0,3}(#{1,6})\s+(.*?)(?:\s+#+)?\s*$/.exec(l))) {
      out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; i++;
    } else if (hrRe.test(l)) {
      out += '<hr>'; i++;
    } else if (/^\s{0,3}>/.test(l)) {
      const buf = [];
      for (; i < lines.length && /^\s{0,3}>/.test(lines[i]); i++) buf.push(lines[i].replace(/^\s{0,3}>\s?/, ''));
      out += `<blockquote>${blocks(buf)}</blockquote>`;
    } else if (tableAt(i)) {
      const head = splitRow(l), align = splitRow(lines[i + 1]).map(c => c.startsWith(':') && c.endsWith(':') ? 'center' : c.endsWith(':') ? 'right' : '');
      const cell = (tag, c, k) => `<${tag}${align[k] ? ` style="text-align:${align[k]}"` : ''}>${inline(c)}</${tag}>`;
      let html = '<table><thead><tr>' + head.map((c, k) => cell('th', c, k)).join('') + '</tr></thead><tbody>';
      for (i += 2; i < lines.length && !blank(lines[i]) && lines[i].includes('|'); i++) html += '<tr>' + splitRow(lines[i]).map((c, k) => cell('td', c, k)).join('') + '</tr>';
      out += html + '</tbody></table>';
    } else if ((m = listRe.exec(l))) {
      const base = indentOf(l), ordered = /\d/.test(m[2]), start = parseInt(m[2], 10), items = [];
      while (i < lines.length) {
        const lm = listRe.exec(lines[i]);
        if (lm && indentOf(lines[i]) <= base) { items.push([lm[3]]); i++; }
        else if (blank(lines[i])) {
          let j = i; while (j < lines.length && blank(lines[j])) j++;
          if (items.length && j < lines.length && (listRe.test(lines[j]) || indentOf(lines[j]) > base)) { for (; i < j; i++) items[items.length - 1].push(''); } else break;
        } else if (items.length && indentOf(lines[i]) > base) { items[items.length - 1].push(lines[i]); i++; }
        else break;
      }
      const tag = ordered ? 'ol' : 'ul';
      out += `<${tag}${ordered && start !== 1 ? ` start="${start}"` : ''}>` + items.map(it => {
        const rest = it.slice(1), ind = Math.min(...rest.filter(x => !blank(x)).map(indentOf), Infinity);
        const inner = blocks([it[0], ...rest.map(x => (blank(x) || !isFinite(ind)) ? x : x.replace(/\t/g, '    ').slice(ind))]);
        return '<li>' + inner.replace(/^<p>([\s\S]*?)<\/p>/, '$1') + '</li>';
      }).join('') + `</${tag}>`;
    } else {
      const buf = [l];
      for (i++; i < lines.length && !blank(lines[i]) && !startsBlock(i); i++) buf.push(lines[i]);
      out += '<p>' + inline(buf.join('\n')).replace(/ {2,}\n|\\\n/g, '<br>').replace(/\n/g, ' ') + '</p>';
    }
  }
  return out;
}
const renderMd = src => blocks(src.replace(/\r\n?/g, '\n').replace(/^---\n[\s\S]*?\n---\n?/, '').split('\n'));

// Wrap search hits inside already-rendered HTML.
function markText(root, toks) {
  if (!toks.length) return;
  const re = new RegExp(toks.slice().sort((a, b) => b.length - a.length).map(reEsc).join('|'), 'gi');
  const nodes = [], w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  while (w.nextNode()) nodes.push(w.currentNode);
  for (const n of nodes) {
    const text = n.nodeValue; re.lastIndex = 0;
    let m, last = 0, frag = null;
    while ((m = re.exec(text))) {
      frag = frag || document.createDocumentFragment();
      if (m.index > last) frag.append(text.slice(last, m.index));
      const mk = document.createElement('mark'); mk.textContent = m[0]; frag.append(mk);
      last = m.index + m[0].length;
    }
    if (frag) { if (last < text.length) frag.append(text.slice(last)); n.replaceWith(frag); }
  }
}

function count(hay, w) { let n = 0, i = -1; while ((i = hay.indexOf(w, i + 1)) !== -1) n++; return n; }

// Every word must appear somewhere in the skill. Name hits rank above description, then files, then body text.
function search(q) {
  const t = tokens(q);
  if (!t.length) return S.map(s => ({ s, score: 0 }));
  const out = [];
  for (const s of S) {
    let score = 0, ok = true;
    for (const w of t) {
      let sc = 0;
      if (s._n === w) sc += 100; else if (s._n.startsWith(w)) sc += 40; else if (s._n.includes(w)) sc += 25;
      if (s._d.includes(w)) sc += 10 + (new RegExp('\\b' + reEsc(w) + '\\b').test(s._d) ? 5 : 0);
      if (s._f.includes(w)) sc += 3;
      const c = count(s._b, w);
      if (c) sc += 1 + Math.min(c, 10) * 0.5;
      if (!sc) { ok = false; break; }
      score += sc;
    }
    if (ok) out.push({ s, score });
  }
  return out.sort((a, b) => b.score - a.score || a.s.name.localeCompare(b.s.name));
}

function snippet(s, toks) {
  const w = toks.find(w => !s._n.includes(w) && !s._d.includes(w) && s._b.includes(w));
  if (!w) return '';
  const m = new RegExp(reEsc(w), 'i').exec(s.body);
  if (!m) return '';
  const a = Math.max(0, m.index - 50), b = Math.min(s.body.length, m.index + 90);
  return (a ? '…' : '') + s.body.slice(a, b).replace(/\s+/g, ' ').trim() + (b < s.body.length ? '…' : '');
}

const badge = s => s.manual ? '<span class="badge" title="Only runs when you type /' + esc(s.name) + '">manual</span>' : '';

$('grid').innerHTML = S.map(s => `
  <button class="card" type="button" data-name="${esc(s.name)}">
    <span class="top"><span class="name">${esc(s.name)}</span>${badge(s)}</span>
    <span class="desc">${esc(s.description) || '<em>No description</em>'}</span>
    <span class="foot">${s.file_count ? s.file_count + ' extra file' + (s.file_count > 1 ? 's' : '') : 'SKILL.md only'}</span>
  </button>`).join('');
$('grid').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) openSkill(c.dataset.name); });

// ---- palette
const pal = $('palette'), q = $('q'), list = $('results');
let rows = [], active = 0;

function render() {
  const t = tokens(q.value);
  rows = search(q.value);
  active = 0;
  $('count').textContent = `${rows.length} of ${S.length}`;
  if (!rows.length) { list.innerHTML = `<li class="empty" role="presentation">No skill mentions “${esc(q.value)}”</li>`; q.removeAttribute('aria-activedescendant'); return; }
  list.innerHTML = rows.map(({ s }, i) => {
    const sn = snippet(s, t);
    return `<li role="option" id="opt-${i}" data-i="${i}" aria-selected="${i === 0}">
      <span class="r-top"><span class="name">${hl(s.name, t)}</span>${badge(s)}</span>
      <span class="r-desc">${hl(s.description, t)}</span>
      ${sn ? `<span class="r-snip">${hl(sn, t)}</span>` : ''}</li>`;
  }).join('');
  q.setAttribute('aria-activedescendant', 'opt-0');
}
function setActive(i) {
  if (!rows.length) return;
  active = (i + rows.length) % rows.length;
  for (const li of list.querySelectorAll('[role=option]')) li.setAttribute('aria-selected', li.dataset.i == active);
  const el = $('opt-' + active); q.setAttribute('aria-activedescendant', 'opt-' + active);
  el && el.scrollIntoView({ block: 'nearest' });
}
function openPalette() { if (!pal.open) pal.showModal(); q.focus(); q.select(); render(); }
function pick(i) { const r = rows[i]; if (!r) return; const t = tokens(q.value); pal.close(); openSkill(r.s.name, t); }

q.addEventListener('input', render);
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); setActive(active + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(active - 1); }
  else if (e.key === 'Enter') { e.preventDefault(); pick(active); }
});
list.addEventListener('click', e => { const li = e.target.closest('[role=option]'); if (li) pick(+li.dataset.i); });
list.addEventListener('mousemove', e => { const li = e.target.closest('[role=option]'); if (li && +li.dataset.i !== active) setActive(+li.dataset.i); });
$('open-search').addEventListener('click', openPalette);
for (const d of [pal, $('sheet')]) d.addEventListener('click', e => { if (e.target === d) d.close(); });

document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); pal.open ? pal.close() : openPalette(); }
  else if (e.key === '/' && !typing && !e.metaKey && !e.ctrlKey && !$('sheet').open) { e.preventDefault(); openPalette(); }
});

// ---- detail sheet
const sheet = $('sheet');
function copy(text, btn, label) {
  const done = () => { btn.textContent = 'Copied'; $('live').textContent = 'Copied'; setTimeout(() => (btn.textContent = label), 1200); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallback());
  else fallback();
  function fallback() { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(); }
}
let cur = null;
function openSkill(name, toks = []) {
  const s = S.find(x => x.name === name); if (!s) return;
  cur = s;
  $('sheet-name').textContent = s.name;
  $('sheet-badge').innerHTML = badge(s);
  $('sheet-desc').textContent = s.description;
  $('sheet-path').textContent = s.path + '/SKILL.md';
  $('copy-cmd').textContent = 'Copy /' + s.name;
  const extra = s.files.length ? `<p class="files">Also in this skill (${s.file_count}): ${s.files.map(f => '<code>' + esc(f) + '</code>').join(', ')}${s.file_count > s.files.length ? ', …' : ''}</p>` : '';
  $('sheet-body').innerHTML = extra + '<div class="md">' + renderMd(s.body) + '</div>';
  markText($('sheet-body').querySelector('.md'), toks);
  if (!sheet.open) sheet.showModal();
  $('sheet-body').scrollTop = 0;
  const first = $('sheet-body').querySelector('.md mark');
  if (first) first.scrollIntoView({ block: 'center' });
  history.replaceState(null, '', '#' + s.name);
}
$('copy-cmd').addEventListener('click', e => copy('/' + cur.name, e.currentTarget, 'Copy /' + cur.name));
$('copy-path').addEventListener('click', e => copy(cur.path, e.currentTarget, 'Copy path'));
$('sheet-close').addEventListener('click', () => sheet.close());
sheet.addEventListener('close', () => history.replaceState(null, '', location.pathname + location.search));

if (location.hash.length > 1) openSkill(decodeURIComponent(location.hash.slice(1)));
</script>
</body>
</html>
