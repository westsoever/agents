ion.\n- **Text mask reveals.** Large typography acting as a window to video or animated imagery behind it.\n\n### Layout Upgrades\n- **Broken grid / asymmetry.** Elements that deliberately ignore column structure — overlapping, bleeding off-screen, or offset with calculated randomness.\n- **Whitespace maximization.** Aggressive use of negative space to force focus on a single element.\n- **Parallax card stacks.** Sections that stick and physically stack over each other during scroll.\n- **Split-screen scroll.** Two halves of the screen sliding in opposite directions.\n\n### Motion Upgrades\n- **Smooth scroll with inertia.** Decouple scrolling from browser defaults for a heavier, cinematic feel.\n- **Staggered entry.** Elements cascade in with slight delays, combining Y-axis translation with opacity fade. Never mount everything at once.\n- **Spring physics.** Replace linear easing with spring-based motion for a natural, weighty feel on all interactive elements.\n- **Scroll-driven reveals.** Content entering through expanding masks, wipes, or draw-on SVG paths tied to scroll progress.\n\n### Surface Upgrades\n- **True glassmorphism.** Go beyond `backdrop-filter: blur`. Add a 1px inner border and a subtle inner shadow to simulate edge refraction.\n- **Spotlight borders.** Card borders that illuminate dynamically under the cursor.\n- **Grain and noise overlays.** A fixed, pointer-events-none overlay with subtle noise to break digital flatness.\n- **Colored, tinted shadows.** Shadows that carry the hue of the background rather than using generic black.\n\n## Fix Priority\n\nApply changes in this order for maximum visual impact with minimum risk:\n\n1. **Font swap** — biggest instant improvement, lowest risk\n2. **Color palette cleanup** — remove clashing or oversaturated colors\n3. **Hover and active states** — makes the interface feel alive\n4. **Layout and spacing** — proper grid, max-width, consistent padding\n5. **Replace generic components** — swap cliche patterns for modern alternatives\n6. **Add loading, empty, and error states** — makes it feel finished\n7. **Polish typography scale and spacing** — the premium final touch\n\n## Rules\n\n- Work with the existing tech stack. Do not migrate frameworks or styling libraries.\n- Do not break existing functionality. Test after every change.\n- Before importing any new library, check the project's dependency file first.\n- If the project uses Tailwind, check the version (v3 vs v4) before modifying config.\n- If the project has no framework, use vanilla CSS.\n- Keep changes reviewable and focused. Small, targeted improvements over big rewrites.\n"}, {"name": "release", "description": "Prepare and ship a cmux release end-to-end: choose the next version, curate user-facing changelog entries, bump versions, open and monitor a release PR, merge, tag, and verify published artifacts. Use when asked to cut, prepare, publish, or tag a new release.", "manual": false, "path": "~/.agents/skills/release", "file_count": 1, "files": ["agents/openai.yaml"], "body": "---\nname: release\ndescription: \"Prepare and ship a cmux release end-to-end: choose the next version, curate user-facing changelog entries, bump versions, open and monitor a release PR, merge, tag, and verify published artifacts. Use when asked to cut, prepare, publish, or tag a new release.\"\n---\n\n# Release\n\nRun this workflow to prepare and publish a cmux release.\n\n## Workflow\n\n1. Determine the version:\n- Read `MARKETING_VERSION` from `GhosttyTabs.xcodeproj/project.pbxproj`.\n- Default to a minor bump unless the user explicitly requests patch/major/specific version.\n\n2. Create a release branch:\n- `git checkout -b release/vX.Y.Z`\n\n3. Gather user-facing changes and contributors since the last tag:\n- `git describe --tags --abbrev=0`\n- `git log --oneline \u003clast-tag>..HEAD --no-merges`\n- Keep only end-user visible changes (features, bug fixes, UX/perf behavior).\n- **Collect contributors:** For each PR, get the author with `gh pr view \u003cN> --repo manaflow-ai/cmux --json author --jq '.author.login'`. Also check linked issue reporters with `gh issue view \u003cN> --json author --jq '.author.login'`.\n- Build a deduplicated list of all contributor `@handle`s.\n\n4. Update changelogs:\n- Update `CHANGELOG.md`.\n- Do not edit a separate docs changelog file; `web/app/docs/changelog/page.tsx` renders from `CHANGELOG.md`.\n- Use categories `Added`, `Changed`, `Fixed`, `Removed`.\n- **Credit contributors inline** (see Contributor Credits below).\n- If no user-facing changes exist, confirm with the user before continuing.\n\n5. Bump app version metadata:\n- Prefer `./scripts/bump-version.sh`:\n  - `./scripts/bump-version.sh` (minor)\n  - `./scripts/bump-version.sh patch|major|X.Y.Z`\n- Ensure both `MARKETING_VERSION` and `CURRENT_PROJECT_VERSION` are updated.\n\n6. Commit and push branch:\n- Stage release files (changelog + version updates).\n- Commit with `Bump version to X.Y.Z`.\n- `git push -u origin release/vX.Y.Z`.\n\n7. Create release PR:\n- `gh pr create --title \"Release vX.Y.Z\" --body \"...\"`\n- Include a concise changelog summary in the PR body.\n\n8. Watch CI and resolve failures:\n- `gh pr checks --watch`\n- Fix failing checks, push, and wait for green.\n\n9. Merge and sync `main`:\n- `gh pr merge --squash --delete-branch`\n- `git checkout main && git pull --ff-only`\n\n10. Create and push tag:\n- `git tag vX.Y.Z`\n- `git push origin vX.Y.Z`\n\n11. Verify release workflow and assets:\n- `gh run watch --repo manaflow-ai/cmux`\n- Confirm release exists in GitHub Releases and includes `cmux-macos.dmg`.\n\n## Changelog Rules\n\n- Include only user-visible changes.\n- Exclude internal-only changes (CI, tests, docs-only edits, refactors without behavior changes).\n- Write concise user-facing bullets in present tense.\n\n## Contributor Credits\n\nCredit the people who made each release happen:\n\n- **Per-entry:** Append `— thanks @user!` for community code contributions. Use `— thanks @user for the report!` for bug reporters (when different from PR author). No callout for core team (`lawrencecchen`, `austinywang`) — core work is the baseline.\n- **Summary:** Add a `### Thanks to N contributors!` section at the bottom of each release with an alphabetical list of all `[@handle](https://github.com/handle)` links (including core team).\n- **GitHub Release body:** Include the same \"Thanks to N contributors!\" section with linked handles.\n"}, {"name": "repo-health", "description": "Repo hygiene audit of the docs — orphaned docs, stale docs, a stale plan file, and broken links — ending in a fix list. Use when asked to check repo health, audit the docs, or find broken links.", "manual": false, "path": "~/.agents/skills/repo-health", "file_count": 0, "files": [], "body": "---\nname: repo-health\ndescription: Repo hygiene audit of the docs — orphaned docs, stale docs, a stale plan file, and broken links — ending in a fix list. Use when asked to check repo health, audit the docs, or find broken links.\nallowed-tools: Read, Bash\n---\n\n# Repo Health\n\nFull audit of this repo's documentation. Takes 2-3 minutes. Run periodically or before major decisions.\n\n## Step 1 — Orphaned docs\n```bash\nfind . -name \"*.md\" -not -path './node_modules/*' -not -path './.git/*' -not -path './.claude/*' -not -path './.obsidian/*' | sort\n```\nFlag any markdown file not linked from `README.md` or any other doc in the repo.\n\n## Step 2 — Stale docs\n```bash\ngit log -1 --format=%cd --date=short -- \u003cfile>\n```\nFlag docs untouched in the last 90 days.\n\n## Step 3 — Stale plan\nIf a plan file exists (`ACTIVE_PLAN.md`, `PLAN.md`, `TODO.md`, or `ROADMAP.md` — first match), flag if:\n- No update in >14 days (via `git log`), or\n- All tasks are checked off but the file isn't marked done/archived\n\nIf no plan file exists, skip this step.\n\n## Step 4 — Broken links\nScan markdown files for links (`[text](path)` and `[[wikilink]]` if present) that point at files that don't exist. List each broken link with its source file.\n\n## Step 5 — Report\nOutput:\n```\n## Repo Health Report — [date]\n\n**Orphaned docs:** [list or \"none\"]\n**Stale docs:** [list or \"none\"]\n**Stale plan:** [flag or \"none\"]\n**Broken links:** [list or \"none\"]\n\n**Action queue:**\n- [ ] [specific fix needed]\n```\n"}, {"name": "research", "description": "Researches a question properly. Before searching, it sharpens the question (type, scope, population or context, what counts as an answer, feasibility), using Megan Peters' method for developing good research questions (Nature Human Behaviour, 2025). Then it reads widely and closely with primary sources, and writes an answer-first result with linked evidence and open questions. In the COS vault it files the result as a research note in 04-Resources/Library/Research/. Use when the user says \"research this\", \"look into\", \"find out whether\", \"what does the evidence say about\", \"dig into\", \"is it true that\", or types /research.", "manual": false, "path": "~/.agents/skills/research", "file_count": 0, "files": [], "body": "---\nname: research\ndescription: Researches a question properly. Before searching, it sharpens the question (type, scope, population or context, what counts as an answer, feasibility), using Megan Peters' method for developing good research questions (Nature Human Behaviour, 2025). Then it reads widely and closely with primary sources, and writes an answer-first result with linked evidence and open questions. In the COS vault it files the result as a research note in 04-Resources/Library/Research/. Use when the user says \"research this\", \"look into\", \"find out whether\", \"what does the evidence say about\", \"dig into\", \"is it true that\", or types /research.\n---\n\n# Research\n\nTurns a loose question into a sharp one, answers it from sources, and says how sure the answer is. The method comes from Peters, M. A. K. (2025). How to develop good research questions. *Nature Human Behaviour* 9, 1759-1761. https://doi.org/10.1038/s41562-025-02292-5. Her four phases map onto steps 1 to 4 below, and her four traps are the checks in step 5.\n\nHard rules:\n- **Never fabricate a source, quote, number, author, DOI or URL.** Cite only what you opened in this session. If you could not open a source, say \"not read, cited from \u003cwhere>\".\n- Primary sources first: the paper, dataset, spec, official docs, statute, or company filing. A news article or blog post about a paper is a pointer to the paper, not evidence.\n- Give every source a date (published or last updated). Flag anything older than the field moves (for example, more than 2 years for AI tools, more than 10 for medicine) as possibly stale.\n- Keep separate what a source states, what you infer, and what is unknown. Mark inference as `(inferred)`.\n- Ask Lennert at most two questions, and only when the question is genuinely ambiguous and the answer would change what you search. Otherwise state the sharpened question and proceed.\n- Health, legal and money questions: state the evidence level (review, trial, observational study, expert opinion, anecdote) for each key claim.\n\n## 1. Sharpen the question (Peters phase 1: self-critical brainstorm)\n\nWrite a short \"Sharpened question\" block before any search:\n\n- **Question:** one sentence, specific enough that you could tell when it is answered.\n- **Type:** descriptive (\"what happens / what do people do\"), mechanistic (\"how does X come about\"), normative or comparative (\"why X and not Y\", \"which is better for Z\"), or a fact check. Do not force a falsifiable hypothesis when the question is descriptive (trap 1).\n- **Scope:** population or context (who, where, which version, which time period), the key variables or options being compared, and what is out of scope.\n- **What counts as an answer:** for example \"a number with a range\", \"a ranked shortlist of 3 with trade-offs\", \"yes/no with the strongest study on each side\".\n- **Feasibility:** can public sources answer it in this session? If not, narrow it and say what you dropped.\n- **Critique:** the one or two ways a sceptic would attack the question as phrased (vague term, hidden assumption, wrong comparison). Fix them in the question.\n\nFor intervention questions (health, training, nutrition), PICO helps with scope: population, intervention, comparison, outcome. This is a standard checklist, not part of Peters' method.\n\nIf the question is ambiguous in a way that changes the search, ask (max two questions, with your default answer stated). Otherwise print the block and continue.\n\n## 2. Read wide (phase 2: build context and connections)\n\n- Search with several phrasings, including the field's own terms. Use WebSearch, then WebFetch to open the actual sources.\n- Read beyond the obvious field: include at least one adjacent discipline or angle when it could change the answer (trap 4, \"hammer and nail\").\n- In the vault, check first what Lennert already has: `grep -ril \"\u003ckey term>\" 04-Resources 05-Knowledge 06-Wiki`. Link relevant notes rather than re-researching them.\n- Tag each source **primary** (directly answers the sharpened question) or **secondary** (context, method, adjacent field), with a one-line reason.\n- If a publisher page blocks the fetch, get metadata from Crossref (`curl -s https://api.crossref.org/works/\u003cdoi>`), PubMed, arXiv or Semantic Scholar, and look for an open copy. Do not guess the content.\n\n## 3. Read close (phase 3: distil to the essence)\n\nRe-read the primary sources. For each, note: what exactly they measured, in whom, how big the effect or finding is, and the main limitation. Then ask \"what if they had done it differently?\" (another population, control, measure, or time frame). This shows where the evidence stops and where the open questions are.\n\n## 4. Answer (phase 4: the final product)\n\nDecide the answer to the sharpened question given the evidence. List the plausible alternative explanations and confounds, and say which the evidence rules out and which it does not. Give a confidence level (high, medium, low) with one line of reason.\n\n## 5. Check the traps\n\n- **Attachment (trap 2):** if the reading shows the question was wrong, already settled, or not the useful one, say so and answer the better question instead. Do not force the original framing.\n- **\"Someone already did it\" (trap 3):** if a source already answers it, say so plainly, then name what differs for Lennert's case (context, scale, date, population).\n- **Hypothesis (trap 1)** and **hammer and nail (trap 4):** confirm the answer fits the question type from step 1 and did not default to one field's lens.\n\n## 6. Write the result\n\nUse this structure, in plain direct prose (see the `writing-style` skill):\n\n```markdown\n## Answer first\n\u003c2-5 bullets: the answer to the sharpened question, with the key numbers, and the confidence level.>\n\n## Sharpened question\n\u003cthe block from step 1, compact>\n\n## Evidence\n- \u003cclaim> — \u003csource title>, \u003cauthor/org>, \u003cdate>. \u003curl or doi>. (primary|secondary; evidence level)\n\n## Alternative explanations and limits\n- \u003cwhat the evidence does not rule out>\n\n## Open questions\n- \u003cwhat is still unknown, and what would answer it>\n\n## Sources\n1. \u003cfull citation with link>\n```\n\nOutside the vault, print it in chat. Keep it as long as the question needs and no longer.\n\n## 7. File it (only in the COS vault)\n\nIf the current directory has `04-Resources/Library/Research/`, also save the result as `04-Resources/Library/Research/\u003cTitle>.md`. Pick a descriptive title (topic plus what it answers). Check the name is free first; if it is taken, add a qualifier rather than overwrite.\n\n```markdown\n---\ntype: research\ntitle: \"\u003cTitle>\"\nstatus: to-read\nsource: in-session\ncreated: \u003cYYYY-MM-DD>\ndescription: \u003cone sentence with the answer, not the topic>\nauthors:\nyear:\nvenue:\nurl:\ndoi:\narxiv:\ncollection:\ncategory:\n---\n# \u003cTitle>\nMap: [[Areas and Resources]]\n```\n\nThe `# Title` goes on the line directly after the closing `---`, then the `Map:` line, then the body from step 6. Fill `authors`, `year`, `venue`, `url` and `doi` only when the note centres on one paper; otherwise leave them empty. Add a `Related:` line with `[[wikilinks]]` to vault notes from step 2, and a `Task:` line if a backlog task asked for this research. Do not commit unless asked.\n\n## 8. Report\n\nIn chat: the answer-first bullets, the note path (if filed), and the open questions. Say which sources you could not open.\n\n## Research prompt template\n\nLennert can paste this into any Claude chat to get the same discipline without the skill:\n\n```text\nResearch question: \u003cyour question>\n\nBefore you search:\n1. Restate my question as one specific, answerable sentence. Say its type\n   (descriptive, mechanistic, comparative, or fact check), the scope\n   (who/where/when, which options), and what would count as an answer.\n2. Name the weakest point in my question as phrased and fix it. Ask me at\n   most two questions, only if the answer would change what you search;\n   otherwise proceed.\n\nThen:\n3. Search widely, including one adjacent field. Prefer primary sources\n   (papers, data, official docs). Give every source a date and a link.\n   Never invent a citation; say so if you could not open a source.\n4. Re-read the closest sources and note what they measured, in whom, how\n   big the effect was, and the main limitation.\n5. If my question turns out to be wrong or already answered, say so and\n   answer the better question.\n\nOutput: answer first (with confidence: high/medium/low), then the evidence\nwith links, then alternative explanations, then open questions.\n```\n"}, {"name": "sheets-dashboard", "description": "Build a self-updating dashboard inside a Google Sheet with Apps Script (Code.gs) - a hidden calc tab of formulas over the data tab, plus a Dashboard tab with KPI tiles, charts and month/quarter dropdowns that recompute when new data lands. Use when the owner types /sheets-dashboard or asks for a dashboard, KPI tab, charts or a period picker in a Google Sheet, built or rebuilt by a script.", "manual": false, "path": "~/.agents/skills/sheets-dashboard", "file_count": 2, "files": ["reference/Dashboard.gs", "scripts/mock-run.js"], "body": "---\nname: sheets-dashboard\ndescription: Build a self-updating dashboard inside a Google Sheet with Apps Script (Code.gs) - a hidden calc tab of formulas over the data tab, plus a Dashboard tab with KPI tiles, charts and month/quarter dropdowns that recompute when new data lands. Use when the owner types /sheets-dashboard or asks for a dashboard, KPI tab, charts or a period picker in a Google Sheet, built or rebuilt by a script.\n---\n\n# Sheets dashboard\n\nBuild a dashboard tab in a Google Sheet from a script the owner pastes into Extensions > Apps Script. The script writes formulas, not numbers, so the dashboard keeps itself current: new rows in the data tab (from a fetch script, an import or a paste) recompute every tile, chart and dropdown. The script only runs again when the layout changes.\n\nWorked example: `~/git/westsoever/hectorenergy/appsscript/Code.gs` (section `Dashboard`), with its mockup in `mockups/dashboard/`. The generic starting point is `reference/Dashboard.gs` beside this file.\n\n## The shape\n\n```\nData tab (one row per record, headers in row 1)      written by a script, or imported/pasted by hand\n   │  read by header name, never by position\n   ▼\n\u003cName>Calc tab (hidden, formulas only)                A month key · B quarter key · C day · D… values\n   │                                                  L/M dropdown choices · O… small tables for charts\n   ▼\nDashboard tab                                         tiles, overview charts, one section per dropdown\n```\n\n- **Calc tab:** one row per record. `C` is the day as a real date. `A` (`2026-10 Oct`) and `B` (`2026-Q4`) are built from `C`. The value columns come from the data tab through `INDEX(Data!$A$2:$Z,0,MATCH(\"\u003cheader>\",Data!$A$1:$Z$1,0))`, filtered to rows that have a timestamp. `L` and `M` hold the dropdown choices, newest first. From `O` onward are the `QUERY` tables the charts read.\n- **Dashboard tab:** tiles are `SUM(FILTER(calc column, condition))`. The overview uses `calc!A2:A\u003c>\"\"`, and a section uses `calc!A2:A=$B$\u003crow>`. Each section has a dropdown in `B\u003ctop>` (validation `requireValueInRange` on `L` or `M`). Charts are `EmbeddedChartBuilder`s over the calc tables.\n- **Rebuilt from scratch** by `makeDashboard(ss)`: remove the charts, break apart merges, clear validations, clear the tab, then write everything again. The dropdown choices are read first and kept if they still exist. Call it at the end of the data-refresh function and add a menu item (`Build dashboard`).\n\n## Steps\n\n1. **Read the real data first.** Get an export of the sheet (xlsx or csv) and treat it as untrusted. Copy it into its own folder in `/tmp`, then read it with `python3 -I` and `zipfile` plus regex (openpyxl isn't installed). Write down the exact header names, whether dates are text or date numbers, the sort order and the row count. The owner's sheet often differs from what the script that wrote it would produce: columns reordered, sorted by another column, pivot tabs added. That's why the calc tab reads by header name.\n2. **Ask only what changes the build** (one `AskUserQuestion`): where the dashboard lives (default: a Dashboard tab in the same sheet), what it shows first (multiSelect), and which periods get a dropdown (default: month and quarter).\n3. **Mockup first when the owner wants one:** `/stageshow`, a single still, simple, real numbers from the export, a Sheets-like window with tabs. Get a yes before building.\n4. **Build.** Copy `reference/Dashboard.gs` into the project's `Code.gs` and adapt the `ADAPT` block: tab names, `TIME_COL`, `NEEDS`, `VALUES`, `TILES`, `CHART_VALUE`. Add charts or breakdown tables the brief needs (the Hector example has an hour-of-day combo chart and a cost breakdown). Every number stays a formula. If the project already has a `Code.gs`, merge the dashboard section into it rather than adding a second file that declares the same names.\n5. **Verify** (below), then hand over.\n\n## Rules learned the hard way\n\n- **Dropdown keys must not look like a date or number.** A bare `2026-10` in the dropdown cell is read as 1 Oct 2026, so validation says \"Input must fall within specified range\" and every tile shows 0. Use `2026-10 Oct`, which still sorts by date. `2026-Q4` is fine.\n- **No `TEXT()` for keys.** Its format codes follow the sheet's locale. Build keys with `YEAR`, `MONTH`, `RIGHT(\"0\"&…,2)` and `MID(\"JanFeb…\",MONTH*3-2,3)`.\n- **Timestamps come in two types:** text (`2026-05-02T13:00:00`, when a script wrote it to a text-formatted column) or a date number (when Sheets parsed an import). Handle both: `IF(ISNUMBER(t), INT(ROUND(t*24)/24), DATEVALUE(LEFT(t,10)))`. Round before taking `INT` or `HOUR`, because stored times drift by tiny fractions.\n- **Sum with `FILTER`, not `SUMIFS`, for text keys.** A `SUMIFS` criterion like `2026-10` is read as a date.\n- **`QUERY` returns days as serial numbers** (46296). Set `d mmm` on the output column; the chart labels its axis from the cell format.\n- **Create the Dashboard tab before writing calc formulas** that reference its cells, because a formula naming a tab that doesn't exist yet stays `#REF`. `insertSheet` makes the new tab active, so `setActiveSheet(dash)` before `calc.hideSheet()`.\n- **Set `'@'` (text) format on the dropdown cell before `setValue`,** so Sheets stores the key exactly as written.\n- **Array results need rows:** `ensureSize(calc, max(20000, dataRows + 1000), cols)`. The data tab must have at least 26 columns for `A:Z` references.\n- **Formulas set from Apps Script use English names and commas,** whatever the sheet's locale.\n- **Fixed chart ranges** (`O1:O400`) with empty trailing rows are fine.\n\n## Verify before handing over\n\n1. `cp Code.gs /tmp/check.js && node --check /tmp/check.js`\n2. `node ~/.agents/skills/sheets-dashboard/scripts/mock-run.js Code.gs --source \u003cDataTab> --header \"\u003cexact headers, comma separated>\" --choices \"2026-10 Oct,2026-09 Sep\"`. This runs the build against a strict fake of the Sheets API, so an invented or misspelled method throws. It ends with `ok: … ran end to end; N charts`. Read the printed formulas: quoting inside `QUERY` strings, `$B$\u003crow>` pointing at the right dropdown, tiles referencing the right cells.\n3. **Compute the expected numbers independently** from the export with Python (same filters and sums) for the overview, one month and one quarter. Check them against any summary the sheet already has, and give them to the owner to compare with the real dashboard.\n4. **Run it for real if you can.** If the Google account that owns the sheet is signed into Chrome (`claude-in-chrome`), open the sheet, run Build dashboard and read the result. If not, say so plainly: the formulas themselves are untested until the owner runs it.\n\n## Hand over\n\nTell the owner:\n- The install steps: Extensions > Apps Script, paste `Code.gs`, save, reload, then the menu's Build dashboard.\n- What the dashboard shows.\n- The expected numbers to compare against.\n- What wasn't tested.\n\nIf something looks off, ask for one exact piece of evidence (a screenshot, or what the formula bar shows in the cell) rather than guessing twice.\n"}, {"name": "skillfactory", "description": "Turns a process into a reusable Claude Code skill. The user describes a workflow, or points at one that just happened in this session, and skillfactory works out the trigger, steps, inputs, outputs and hard rules, then writes the skill in the house style with a strong description. In the technobbq/agent-skills repo it adds the skill as a plugin to the team marketplace; in any other repo (a vault, soii itself, a code repo) it writes .claude/skills/\u003cname>/SKILL.md there and adds it to the repo's cheatsheet if one exists. Commits, never pushes, and refuses to overwrite an existing skill without an explicit yes. Use when the user says \"make this a skill\", \"turn what we just did into a command\", \"I keep doing this, automate it\", \"share this with the team\", or types /skillfactory.", "manual": false, "path": "~/.agents/skills/skillfactory", "file_count": 0, "files": [], "body": "---\nname: skillfactory\ndescription: Turns a process into a reusable Claude Code skill. The user describes a workflow, or points at one that just happened in this session, and skillfactory works out the trigger, steps, inputs, outputs and hard rules, then writes the skill in the house style with a strong description. In the technobbq/agent-skills repo it adds the skill as a plugin to the team marketplace; in any other repo (a vault, soii itself, a code repo) it writes .claude/skills/\u003cname>/SKILL.md there and adds it to the repo's cheatsheet if one exists. Commits, never pushes, and refuses to overwrite an existing skill without an explicit yes. Use when the user says \"make this a skill\", \"turn what we just did into a command\", \"I keep doing this, automate it\", \"share this with the team\", or types /skillfactory.\n---\n\n# skillfactory\n\nTurns a repeatable process into a skill file anyone can run with `/name`. The skill goes into **the repo this session is in**.\n\nHard rules:\n- **Never overwrite an existing skill without an explicit yes** (show a diff first). Never touch other skills.\n- Never put secrets, tokens, absolute personal paths or a person's private details into a skill. Skills get shared and copied.\n- The skill you write must work with the current directory as the repo root, and use relative paths.\n- Add files only: the new skill (or plugin), its listing rows, one commit. No pushes. Never `push --force` or `reset --hard`.\n\n## 1. Where am I\n\n```bash\ngit rev-parse --show-toplevel\ncat .claude-plugin/marketplace.json 2>/dev/null | head -5\nls .claude/skills 2>/dev/null\nls docs/skills.md .claude/SKILLS.md 2>/dev/null\n```\n\n- `.claude-plugin/marketplace.json` exists with `\"name\": \"techbbq\"`: it's the **team marketplace** (`technobbq/agent-skills`). The skill becomes a plugin; see step 4b.\n- Repo has `scripts/check-vault.ts` and `docs/skills.md`: it's **soii itself**. A repo skill, with cheatsheet `docs/skills.md`; use the `soii-` prefix (except for tools that aren't about a vault), and `bun test scripts` must pass after step 5 (it checks every skill has a row). In soii's repo, soii's scripts are at `scripts/`.\n- Has `.obsidian/` or `soii.config.yml`: a **vault**. A repo skill, with cheatsheet `.claude/SKILLS.md` if it exists. Never name it `soii-*`: that prefix is soii's, and `soii update` overwrites those folders. In a vault, soii's scripts are at `.soii/soii/scripts/`; don't mention soii's internals beyond what the skill needs.\n- Otherwise it's a **repo skill**: it goes in `.claude/skills/\u003cname>/SKILL.md` and loads for everyone who opens this repo. The cheatsheet is `docs/skills.md` or `.claude/SKILLS.md` if one exists (don't create one unless the user asks).\n- No git repo: say so, write the skill anyway, and skip the commit.\n\nIf the process isn't tied to this repo and the user wants colleagues to have it everywhere, suggest running skillfactory from a clone of `technobbq/agent-skills` instead.\n\n## 2. Get the process\n\nEither the user describes it, or it is something that **just happened in this session** (\"make that a skill\"). In the second case, reconstruct it from the conversation: what triggered it, the commands and files used, the decisions the user made along the way. Don't ask for what you can read.\n\nFill in this list, asking one question at a time with AskUserQuestion where it is a choice, and in plain text where it is open:\n\n1. **Name.** Lowercase, hyphenated, short, not already taken by a skill or plugin here.\n2. **Trigger.** When should Claude pick this up? Real phrases the user would say. This becomes the `description`.\n3. **Inputs.** What it needs (a file, a topic, a date) and what it can find on its own.\n4. **Steps.** 3 to 8 steps, concrete: exact commands, exact files, what to show before writing.\n5. **Outputs.** What changes (files, commits) and what it prints.\n6. **Hard rules.** What it must never do: no deletes, ask before writes, no pushes. Anything the user said \"never\" about during the session.\n7. **Tools.** Only what the steps need (shell, Read/Edit/Write, WebSearch/WebFetch, AskUserQuestion).\n\nSummarise it back in five lines and ask **Looks right / Change something**.\n\n## 3. Check for a clash\n\n```bash\ntest -e .claude/skills/\u003cname>/SKILL.md && echo EXISTS     # repo skill\ntest -e plugins/\u003cname> && echo EXISTS                      # team marketplace\n```\n\nIf it exists: show the first 15 lines, then ask **Overwrite / Pick another name / Cancel**. Only an explicit **Overwrite** continues. Even then, write the new text and show `git diff` afterwards.\n\n## 4a. Write the skill (repo skill)\n\n`.claude/skills/\u003cname>/SKILL.md`, in the house style:\n\n```markdown\n---\nname: \u003cname>\ndescription: \u003cwhat it does, in one or two sentences, then \"Use when the user says ...\" with real trigger phrases, then \"or types /\u003cname>\".>\n---\n\n# \u003cTitle>\n\n\u003cOne paragraph: what this does and when. Plain words.>\n\nHard rules:\n- \u003cthe never-do list>\n\n## 1. \u003cFirst step>\n\u003cExact commands in code blocks. What to show the user before writing.>\n\n## 2. ...\n\n## N. Report\n\u003cWhat to print at the end: short.>\n```\n\nThe house style:\n- `name:` is exactly the folder name, and the file starts with `---` on the first line then `name: \u003cname>`. Anything else and the skill isn't found.\n- The `description` is the trigger. Write it so Claude would pick the skill from a casual request: say what it does, what it changes, and the phrases that should trigger it. It's one line in YAML: if it contains `: ` quote the whole thing.\n- Plain-spoken, second person to Claude (\"You check...\"), short steps, exact commands, no filler.\n- State hard rules near the top. Say what it shows before it writes, and that it asks first.\n- Work with the repo root as the working directory.\n- Aim for under 150 lines. If a step needs a long reference, say where it lives instead of copying it.\n\n## 4b. Write the plugin (team marketplace)\n\nSame `SKILL.md` and house style as 4a, at `plugins/\u003cname>/skills/\u003cname>/SKILL.md`, plus:\n\n1. `plugins/\u003cname>/.claude-plugin/plugin.json`:\n   ```json\n   {\n     \"name\": \"\u003cname>\",\n     \"version\": \"1.0.0\",\n     \"description\": \"\u003cone sentence>\",\n     \"author\": { \"name\": \"TechBBQ\" }\n   }\n   ```\n2. An entry in `.claude-plugin/marketplace.json` `plugins`, matching the others: `name`, `\"source\": \"./plugins/\u003cname>\"`, `description`.\n3. One row in the README's **Plugins** table and one `/plugin install \u003cname>@techbbq` line under **Install**, matching the rows already there.\n4. `claude plugin validate .` must pass. Fix what it reports.\n\n## 5. Add it to the cheatsheet (repo skill only)\n\nIf the cheatsheet exists, add **one row** in the table that matches its columns, starting with `` | `/\u003cname>` | ``, in the section where it fits (read the file; keep the order the others use). Don't edit other rows. If there is no cheatsheet, skip this step and say so.\n\n## 6. Commit\n\n```bash\ngit add -- \u003cthe new skill or plugin folder> \u003ceach listing file you changed>\ngit commit -m \"skill: add /\u003cname>\" -m \"\u003cone line: what it does>\"\n```\n\nAdd the commit trailer your environment asks for. Don't push: the user reviews and pushes.\n\n## 7. Report\n\nPrint the path, the description, and: \"Try it: `/\u003cname>`\". If it was built from this session, mention which steps you took from the conversation so the user can check them. In a vault, remind them that skills in `.claude/skills/` named `soii-*` are managed by soii and overwritten on update; theirs aren't. For a team plugin, add that colleagues get it after the push with `/plugin marketplace update techbbq` and `/plugin install \u003cname>@techbbq`.\n"}, {"name": "slideshow", "description": "Author a HyperFrames slideshow — a presentation, pitch deck, or interactive deck with discrete slides, fragment reveals, branching, hotspot navigation, and built-in presenter mode with speaker notes; also converts an existing page into a deck. Output is a navigable deck, not a rendered MP4. If the user didn't explicitly ask for a slideshow, confirm before authoring. Unclear → /hyperframes.", "manual": false, "path": "~/.agents/skills/slideshow", "file_count": 1, "files": ["references/standalone-harness.md"], "body": "---\nname: slideshow\ndescription: >\n  Author a HyperFrames slideshow — a presentation, pitch deck, or interactive\n  deck with discrete slides, fragment reveals, branching, hotspot navigation,\n  and built-in presenter mode with speaker notes; also converts an existing\n  page into a deck. Output is a navigable deck, not a rendered MP4. If the\n  user didn't explicitly ask for a slideshow, confirm before authoring.\n  Unclear → /hyperframes.\n---\n\n> **First, keep this skill fresh — run silently, don't ask:** `npx hyperframes skills update slideshow`. A fast no-op when everything is current; otherwise it refreshes this skill plus the core domain skills it depends on before you rely on them.\n\n> **figma source**: If the deck's content or storyboard comes from a figma.com URL, run `/figma` first — asset export, brand tokens, and storyboard reconstruction if the source is a strip of scene frames — then build from its output. Don't drive Figma via raw MCP tools directly: that skips SVG sanitization, `.media/manifest.jsonl` provenance, and brand-token `var()` binding, so a later brand change can't propagate without a full re-import.\n\n# Slideshow authoring contract\n\nA HyperFrames slideshow is a normal HyperFrames composition — scenes, clips, GSAP timelines — with one extra ingredient: a **JSON island** that declares which scenes are slides and how they connect. The player's `SlideshowController` reads the island and turns the continuous GSAP timeline into a discrete, navigable deck.\n\n**Read `/hyperframes-core` first** for the base composition contract (clips, tracks, `data-*` attributes, determinism rules). This skill covers only what is new: the island schema, slide writing rules, fragments, branching, validation, and the wrapping component.\n\n## Output — a navigable deck, not a linear MP4\n\nA slideshow's output is the **running deck**: serve it with `hyperframes present \u003cproject-dir>` (or Studio present mode) — the player's `SlideshowController` reads the island and drives navigation, fragments, branching, and presenter mode. See **Presenting and handoff** below.\n\n**Do not `hyperframes render` a slideshow into a single MP4.** A deck is authored as several top-level scene compositions (one `data-composition-id` per slide) with **no master-root composition** wrapping them, so `render` resolves only the **first** composition and emits a **silently truncated** MP4 (e.g. 6s of a 40-second deck). A linear main-line export (main slides only, branch sequences excluded) is **deferred** — until it ships, the supported outputs are the live `present` deck and per-slide `snapshot` stills. If a user needs a linear MP4 today, surface this limitation rather than pointing `render` at the deck.\n\n## Intent confirmation\n\nIf the user explicitly asks for a slideshow, slide show, or HyperFrames slideshow, proceed with this skill. When the request arrived through `/hyperframes`, the intent layer's triage owns this confirmation — routed here means already confirmed, so don't re-ask; the layer's run-shape questions don't apply (the deliverable is a deck, not a rendered video). A `BRIEF.md`, when present, carries the confirmed intent — read it.\n\nIf the skill triggered from an adjacent request such as \"presentation\", \"pitch deck\", \"deck\", \"interactive deck\", or \"convert this page\", pause before authoring and frame the choice before asking for confirmation. Briefly explain that a HyperFrames slideshow means a runnable deck with discrete slides, built-in navigation and presenter mode, editable speaker notes, shared media handling, and validation before handoff. For source-page conversions, also mention that the goal is to preserve the original page's visual design, interactions, motion, and media behavior while translating page movement into slide-to-slide transitions.\n\nThen ask a short confirmation question:\n\n> Do you want this as a HyperFrames slideshow?\n\nUse a yes/no choice UI when the environment provides one; otherwise ask the question in plain text.\n\nDo not implement the slideshow until the user says yes. If they say no, stop using this skill — read `/hyperframes` and let the intent layer re-route. This confirmation is a **routing decision**, not a preference gate — per `../hyperframes-core/references/brief-contract.md` § 1 it survives autonomous mode (\"surprise me\" does not skip it): building the wrong deliverable type is a quality failure, not a creative call.\n\n---\n\n## The two pieces\n\n### 1. Scenes — declared the normal way\n\nEvery slide is backed by a scene. Declare scenes with `data-composition-id`, `data-start`, `data-duration`, and `data-label`:\n\n```html\n\u003cdiv\n  data-composition-id=\"problem\"\n  data-start=\"0\"\n  data-duration=\"8\"\n  data-label=\"The problem\"\n  data-width=\"1920\"\n  data-height=\"1080\"\n>\n  \u003c!-- clips go here -->\n\u003c/div>\n```\n\nBranch slides (reachable only via a hotspot, excluded from the main line) are declared exactly the same way — they just appear only in a `slideSequences` entry in the island, not in the main `slides` array.\n\n### 2. The JSON island — one script block per composition\n\nAdd exactly one `\u003cscript type=\"application/hyperframes-slideshow+json\">` block to the composition HTML. It holds all slideshow metadata:\n\n```html\n\u003cscript type=\"application/hyperframes-slideshow+json\">\n  {\n    \"slides\": [...],\n    \"slideSequences\": [...]\n  }\n\u003c/script>\n```\n\nThe island is the single source of truth for slide order, notes, fragment hold-points, hotspots, and branch sequences. Keep it near the top of the `\u003cbody>`, before the scene divs, so it is easy to find.\n\nDo not hide the slideshow manifest behind an alternate `\u003cscript type=\"application/json\">` block plus runtime code that creates the island. The `present` command reads the composition HTML statically and expects the real `application/hyperframes-slideshow+json` island to already be present.\n\n---\n\n## Schema\n\n### `SlideshowManifest` (the top-level island object)\n\n```json\n{\n  \"slides\": [\n    /* SlideRef[] — the main line, in order */\n  ],\n  \"slideSequences\": [\n    /* SlideSequence[] — off-line branch sequences */\n  ]\n}\n```\n\n### `SlideRef`\n\n```json\n{\n  \"sceneId\": \"problem\",\n  \"notes\": \"Lead with the pain, not the company.\",\n  \"fragments\": [3.5, 5.2, 7.0],\n  \"hotspots\": [\n    /* SlideHotspot[] */\n  ],\n\n  \"ttsScript\": null,\n  \"ttsAudioUrl\": null,\n  \"ttsDurationMs\": null\n}\n```\n\n| Field                                       | Required | Notes                                                                                                                                                   |\n| ------------------------------------------- | -------- | ------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| `sceneId`                                   | yes      | Must match a scene's `data-composition-id` exactly (or provide explicit `startTime`/`endTime`). The lint rule resolves scenes by `data-composition-id`. |\n| `notes`                                     | no       | Presenter-only text. Never shown to the audience.                                                                                                       |\n| `fragments`                                 | no       | Array of times (seconds) within the slide's `[start, end]` range — see Fragments below.                                                                 |\n| `hotspots`                                  | no       | Interactive overlays that trigger a branch — see Branching below.                                                                                       |\n| `startTime`                                 | no       | Optional. Override the matched scene's time bounds; defaults to the scene's start/end.                                                                  |\n| `endTime`                                   | no       | Optional. Override the matched scene's time bounds; defaults to the scene's start/end.                                                                  |\n| `ttsScript`, `ttsAudioUrl`, `ttsDurationMs` | no       | **Reserved.** Schema fields exist but TTS playback is not yet wired. Omit unless you are pre-populating for a future build.                             |\n\n### `SlideHotspot`\n\n```json\n{\n  \"id\": \"h1\",\n  \"label\": \"How did we calculate this?\",\n  \"target\": \"market-deep-dive\",\n  \"region\": { \"x\": 60, \"y\": 10, \"w\": 35, \"h\": 20 }\n}\n```\n\n| Field    | Required | Notes                                                                                                                           |\n| -------- | -------- | ------------------------------------------------------------------------------------------------------------------------------- |\n| `id`     | yes      | Unique within the slide.                                                                                                        |\n| `label`  | yes      | Tooltip / button text shown to the audience.                                                                                    |\n| `target` | yes      | Must match a `SlideSequence.id` in `slideSequences`.                                                                            |\n| `region` | no       | Percentage-of-slide bounding box: `{x, y, w, h}` in `0–100`. Omit to render the hotspot as a full-slide labeled button instead. |\n\n### `SlideSequence`\n\n```json\n{\n  \"id\": \"market-deep-dive\",\n  \"label\": \"Market sizing methodology\",\n  \"slides\": [{ \"sceneId\": \"mkt-1\" }, { \"sceneId\": \"mkt-2\" }]\n}\n```\n\n`slides` inside a sequence uses the same `SlideRef` shape as the main line. Fragments and nested hotspots are allowed.\n\n---\n\n## Slide writing rules\n\nThese are hard constraints, not suggestions. A slide that violates them will be outright replaced when a reviewer sees it.\n\n- **Headline is a complete-sentence claim, not a label.** Write \"SMBs spend 14 hours/week on manual scheduling\" not \"Scheduling problem\". The sentence should stand alone if the visual is ignored.\n- **One idea + one visual per slide.** If you are tempted to add a second bullet cluster or a second chart, split the slide.\n- **Lead with the punchline.** The strongest point goes first — on the slide and in the deck order. Investors read left-to-right, top-to-bottom, and they stop.\n- **Bottom-up market sizing only.** Never write \"$50B TAM\" without showing the math. Build from unit economics up: accounts × ACV, or transactions × take-rate.\n- **Font minimum 30pt equivalent.** At 1920×1080, a headline is 72–96px; body copy is 48px. Never go below 40px for any text the audience must read.\n\n## Porting source pages\n\nWhen converting an existing page into a slideshow, source fidelity is part of the contract. Do not replace source-specific widgets with simplified approximations unless the user explicitly asks for a redesign.\n\n- Preserve the original page's visual design, motion language, interactive behavior, media behavior, and presentation affordances as closely as practical. When the slideshow system supports presenter mode, include speaker notes using the shared editable-notes behavior rather than a deck-specific implementation.\n- Port mechanical visuals from the source DOM/CSS/JS as exactly as practical: custom players, canvas visualizers, timelines, playheads, stems, expanding circles, hover states, and other interactive details should survive the conversion.\n- Treat native `\u003cvideo>` / `\u003caudio>` elements as the source of truth for any custom media chrome, canvas visualizer, waveform, beat grid, or playhead. Wire the source's media events (`play`, `pause`, `timeupdate`, `seeking`, `seeked`, `ended`, `ratechange`, `volumechange`) and derive visual state from `media.currentTime`; do not run a separate timer that can drift away from actual playback.\n- Every copied `\u003cvideo>` or `\u003caudio>` with `src` must have HyperFrames timing attributes before lint: `data-start` and `data-duration`, plus `data-has-audio=\"true\"` when audible native audio should be preserved. Use the scene's time range for slide-specific media; for user-controlled evidence videos that may be played from multiple focused slides, use a deck-wide range. Do not leave `preload=\"none\"` on media; use `metadata` or `auto`.\n- Resolve source font tokens before validation. If preserving custom source fonts, add `@font-face` rules for local/captured font files. If using system fallbacks, replace tokenized declarations such as `font-family: var(--f-body)` with concrete render-safe stacks such as `system-ui, sans-serif` or `ui-monospace, monospace`; do not leave `var(...)` as the font family value.\n- Audit the source for atypical page movement, especially behavior driven by scroll, wheel, touch, hash state, resize, or a requestAnimationFrame loop. Treat fixed viewports with translated/scaled \"world\" layers, parallax, pinned panels, horizontal scrollers, scroll-scrubbed timelines, section snapping, and zoom-to-element cameras as source behavior. Scroll is often the source's transition trigger, so preserve the transition by extracting its progress stops, easing, and camera/focus states, then re-host that motion on slideshow navigation through timeline positions, fragments, or a reusable player/harness hook. Standalone wrappers that jump to slide hold-points still need an explicit navigation-camera transition hook; computing per-slide camera transforms is not enough. Do not simulate a literal page-scroll-down transition inside the slide; the viewer should feel camera travel/zoom from one focal point to another, not see a webpage being scrolled. Keep each slide-to-slide camera move continuous: avoid intermediate route stops that reverse x/y direction or zoom unless the source visibly does that at the same boundary. A transition that darts around before landing is worse than a simpler direct focal move.\n- Preserve the source's media crop semantics. Treat screenshots, tweets/social posts, product UI captures, charts, docs, code, leaderboards, and any image with readable text as content evidence, not decorative media: use the source aspect ratio (`height: auto`) or `object-fit: contain` inside a stable frame. Use `object-fit: cover` only when the source did, or for intentionally decorative/background/cinematic thumbnails. After fitting these captures into a slide, inspect all four edges for truncated text, logos, controls, or captions; a visible crop on meaningful content is a bug unless the source itself cropped it.\n- If a behavior is generic to slideshows, put it in the player/controller or in a reusable skill snippet. Do not solve it with one-off deck scripts.\n- Stacked scene frames must never block interaction on the active slide. Hidden frames need both visual hiding and event gating:\n\n```css\n.scene-frame {\n  opacity: 0;\n  visibility: hidden;\n  pointer-events: none;\n}\n\n.scene-frame.is-active {\n  opacity: 1;\n  visibility: visible;\n  pointer-events: auto;\n}\n```\n\nIf visibility is driven imperatively, set all three properties (`opacity`, `visibility`, and `pointerEvents`) in the visibility controller. `opacity: 0` alone still leaves an invisible layer that can swallow clicks.\n\n---\n\n## Fragments: reveal hold-points within a slide\n\nA fragment is an absolute composition-timeline time (seconds) within a slide's `[start, end]` range where the controller should hold a reveal state.\n\n**How it works:**\n\n1. Player enters a fragmented slide — seeks directly to `fragments[0]` and holds there.\n2. User presses Next (or →) — controller seeks to `fragments[1]` and holds.\n3. After the last fragment, Next advances to the next slide.\n4. A slide without fragments enters at a rest frame inside the slide, usually its midpoint, not exactly at `slide.end`.\n\nFragment times must fall within `[start, end]` (inclusive of both bounds). The lint rule rejects only fragments outside that range (`time \u003c start` or `time > end`).\n\nFragment times are **absolute composition-timeline positions** — the same coordinate space as `data-start` — not offsets relative to the scene's start.\n\nNavigation is seek-driven, not play-driven. The controller never starts playback just to move between fragments; each navigation command is a deterministic seek to the target hold time. Design fragment states so they are correct at the target timeline time.\n\n---\n\n## Branching: hotspots and slide sequences\n\nBranch slides are real scenes in the same composition timeline. They are listed only under `slideSequences` and are excluded from main-line navigation — the player never visits them unless a hotspot fires.\n\n**Navigation model:**\n\n- Clicking a hotspot pushes `{sequenceId, slideIndex: 0}` onto the nav stack and enters the branch's first slide.\n- **back()** pops the stack and returns to the exact parent slide (the one that held the hotspot).\n- **backToMain()** clears the entire stack and returns to the root slide.\n- Breadcrumb renders from the stack: `Main deck › Market sizing methodology › Slide 2`.\n- The slide counter inside a branch is scoped to that sequence (`1 of 2`, not the main-deck total).\n\n**What to avoid:**\n\n- Do not add branch scene IDs to the main `slides` array. They must appear only inside a `slideSequences` entry. The lint rule flags overlap.\n- Branch scenes are included in the continuous timeline, so a naive linear video export would include them. Export reads main-line slides only (deferred; flagged in the spec).\n\n---\n\n## Worked example: 3-slide deck with fragments and a branch\n\n### Scene HTML (skeleton)\n\n```html\n\u003cbody style=\"margin: 0\">\n  \u003cscript type=\"application/hyperframes-slideshow+json\">\n    {\n      \"slides\": [\n        {\n          \"sceneId\": \"hook\",\n          \"notes\": \"Open with the stat. Pause on the $40B number.\"\n        },\n        {\n          \"sceneId\": \"problem\",\n          \"notes\": \"Walk through each pain point one at a time.\",\n          \"fragments\": [11.0, 15.0],\n          \"hotspots\": [\n            {\n              \"id\": \"h1\",\n              \"label\": \"Where does the $40B figure come from?\",\n              \"target\": \"market-detail\",\n              \"region\": { \"x\": 55, \"y\": 60, \"w\": 40, \"h\": 20 }\n            }\n          ]\n        },\n        {\n          \"sceneId\": \"solution\",\n          \"notes\": \"One sentence: what we do and who it is for.\"\n        }\n      ],\n      \"slideSequences\": [\n        {\n          \"id\": \"market-detail\",\n          \"label\": \"Market sizing methodology\",\n          \"slides\": [{ \"sceneId\": \"mkt-math\", \"notes\": \"Bottom-up: 2.3M SMBs × $17k ACV.\" }]\n        }\n      ]\n    }\n  \u003c/script>\n\n  \u003c!-- Slide 1 — hook -->\n  \u003cdiv\n    data-composition-id=\"hook\"\n    data-start=\"0\"\n    data-duration=\"6\"\n    data-label=\"The hook\"\n    data-width=\"1920\"\n    data-height=\"1080\"\n    style=\"position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0a\"\n  >\n    \u003csection\n      class=\"clip\"\n      data-start=\"0\"\n      data-duration=\"6\"\n      data-track-index=\"1\"\n      style=\"position: absolute; inset: 0; display: grid; place-items: center\"\n    >\n      \u003ch1 id=\"hook-headline\" style=\"font-size: 80px; color: #fff; font-family: sans-serif\">\n        SMBs lose $40B/year to manual scheduling\n      \u003c/h1>\n    \u003c/section>\n  \u003c/div>\n\n  \u003c!-- Slide 2 — problem (3 fragments) -->\n  \u003cdiv\n    data-composition-id=\"problem\"\n    data-start=\"6\"\n    data-duration=\"15\"\n    data-label=\"The problem\"\n    data-width=\"1920\"\n    data-height=\"1080\"\n    style=\"position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0a\"\n  >\n    \u003csection\n      class=\"clip\"\n      data-start=\"6\"\n      data-duration=\"15\"\n      data-track-index=\"1\"\n      style=\"position: absolute; inset: 0; padding: 120px 160px; box-sizing: border-box\"\n    >\n      \u003ch2 id=\"pain-headline\" style=\"font-size: 64px; color: #fff; font-family: sans-serif\">\n        Three gaps operators can not close\n      \u003c/h2>\n      \u003cp id=\"pain-1\" style=\"font-size: 48px; color: #ccc; opacity: 0; font-family: sans-serif\">\n        No-shows cost 23% of booked revenue\n      \u003c/p>\n      \u003cp id=\"pain-2\" style=\"font-size: 48px; color: #ccc; opacity: 0; font-family: sans-serif\">\n        Manual reminders take 4h/week per staff\n      \u003c/p>\n      \u003cp id=\"pain-3\" style=\"font-size: 48px; color: #ccc; opacity: 0; font-family: sans-serif\">\n        Rescheduling friction drives 40% churn\n      \u003c/p>\n    \u003c/section>\n  \u003c/div>\n\n  \u003c!-- Slide 3 — solution -->\n  \u003cdiv\n    data-composition-id=\"solution\"\n    data-start=\"21\"\n    data-duration=\"8\"\n    data-label=\"The solution\"\n    data-width=\"1920\"\n    data-height=\"1080\"\n    style=\"position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0a\"\n  >\n    \u003csection\n      class=\"clip\"\n      data-start=\"21\"\n      data-duration=\"8\"\n      data-track-index=\"1\"\n      style=\"position: absolute; inset: 0; display: grid; place-items: center\"\n    >\n      \u003ch2 id=\"solution-headline\" style=\"font-size: 72px; color: #fff; font-family: sans-serif\">\n        Acme automates scheduling for service SMBs — no-shows down 80% in 90 days\n      \u003c/h2>\n    \u003c/section>\n  \u003c/div>\n\n  \u003c!-- Branch slide — excluded from main line -->\n  \u003cdiv\n    data-composition-id=\"mkt-math\"\n    data-start=\"29\"\n    data-duration=\"7\"\n    data-label=\"Market math\"\n    data-width=\"1920\"\n    data-height=\"1080\"\n    style=\"position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #111\"\n  >\n    \u003csection\n      class=\"clip\"\n      data-start=\"29\"\n      data-duration=\"7\"\n      data-track-index=\"1\"\n      style=\"position: absolute; inset: 0; display: grid; place-items: center\"\n    >\n      \u003cp id=\"mkt-formula\" style=\"font-size: 56px; color: #fff; font-family: sans-serif\">\n        2.3M SMBs × $17k ACV = $39B serviceable market\n      \u003c/p>\n    \u003c/section>\n  \u003c/div>\n\n  \u003cscript>\n    window.__timelines = window.__timelines || {};\n\n    // Slide 2 fragment entrance animations\n    gsap.registerPlugin(); // load any plugins before use\n\n    const tl = gsap.timeline({ paused: true });\n    window.__timelines[\"problem\"] = tl;\n\n    // Insert positions are absolute composition-timeline times (same as data-start / fragment values).\n    tl.from(\"#pain-1\", { opacity: 0, y: 20, duration: 0.4 }, 11.0);\n    tl.from(\"#pain-2\", { opacity: 0, y: 20, duration: 0.4 }, 15.0);\n    // pain-3 lands at end of slide\n    tl.from(\"#pain-3\", { opacity: 0, y: 20, duration: 0.4 }, 13.0);\n  \u003c/script>\n\u003c/body>\n```\n\n### Key points in the example\n\n- The island `sceneId` values (`\"hook\"`, `\"problem\"`, `\"solution\"`, `\"mkt-math\"`) exactly match `data-composition-id` values on scene divs.\n- `mkt-math` appears only in `slideSequences` — it is never in the top-level `slides` array.\n- Fragment times (`11.0`, `15.0`) are within the `problem` scene's `[6, 21]` range (times are absolute composition-timeline positions).\n- The hotspot `region` (`x: 55, y: 60, w: 40, h: 20`) positions the clickable area in the lower-right quadrant of the problem slide.\n- GSAP timelines are registered on `window.__timelines` and are paused — the HyperFrames engine drives playback; do not call `.play()` at construction time.\n\n---\n\n## Wrapping component\n\nWrap the composition in `\u003chyperframes-slideshow>` around `\u003chyperframes-player>` in any embedding context:\n\n```html\n\u003chyperframes-slideshow>\n  \u003chyperframes-player src=\"deck.html\">\u003c/hyperframes-player>\n\u003c/hyperframes-slideshow>\n```\n\n`\u003chyperframes-slideshow>` provides the navigation chrome (Present, Prev / Next, counter, global mute when `sound` is present, fullscreen), keyboard handling (← / →, Space / Backspace, and P for Present), touch swipe, and hotspot overlays.\n\nThe slideshow automatically sets the `interactive` attribute on every inner `\u003chyperframes-player>` at mount time, so clickable controls, links, native media controls, and custom players inside the composition iframe receive pointer events as expected. (Outside a slideshow wrapper, you must add `interactive` manually on `\u003chyperframes-player>` — the player defaults to `pointer-events: none` on the iframe so clicks on the player host don't get hijacked into toggling timeline playback.)\n\n**Presenter mode:** use the built-in Present icon button in the slideshow nav capsule, or press P. It calls `window.open('?mode=audience')` for a fullscreen audience tab; the originating tab becomes the presenter view (current slide reduced, next-slide preview, notes, elapsed timer). The two tabs sync via `BroadcastChannel('hf-slideshow:' + location.pathname)`. Do not add a custom wrapper-level Present button; the shared component owns its placement, icon, styling, and audience-mode hiding.\n\n**Presenting over Google Meet / Zoom (screen share):** share the _audience_ surface, keep the presenter view on your own screen.\n\n- **Google Meet (or any in-Chrome share):** Present → in Meet choose **Share screen → A tab** → pick the audience tab → switch back to the presenter tab. Chrome keeps a captured tab rendering while backgrounded, so animations and slide nav stay live. Do **not** share \"A window\" or \"Entire screen\" — a fully covered window stops rendering (frozen slides for viewers), and entire-screen exposes your notes.\n- **Zoom (desktop app):** drag the audience tab out into its own window and share that window. Zoom captures via the OS, so if the audience window becomes _fully_ covered it freezes — use a second monitor, or keep a sliver of the audience window visible behind the presenter view.\n\nPresenter-driven media playback has an autoplay-policy constraint: `BroadcastChannel` can sync intent, time, and state, but it cannot transfer the presenter's user activation to the audience tab. The shared slideshow player mirrors native media events and starts remote audience playback muted first; only fall back to the standalone harness's audience unlock behavior if muted `media.play()` is rejected or if the deck specifically requires audible audience playback. Do not keep applying remote `timeupdate` messages after a rejected play, or the audience will silently seek through the video without playback.\n\nPresenter notes are editable in the presenter view. Edits are stored in `localStorage` per deck and slide, layered over the manifest notes without rewriting the composition file. Do not add one-off note-editing scripts to decks; rely on the shared slideshow player behavior. If a standalone/custom wrapper truly needs to implement this outside the shared player, use the deterministic storage snippet in `skills/slideshow/references/standalone-harness.md`.\n\n### Media cleanup on slide exit\n\nThe slideshow controller owns slide-exit media cleanup. When navigation changes slide or sequence, it calls `hyperframes-player.stopMedia()` before entering the next slide. That command:\n\n- posts `stop-media` to the iframe runtime, which stops WebAudio and pauses native `\u003cvideo>` / `\u003caudio>` elements;\n- pauses same-origin iframe media directly as a fallback; and\n- pauses parent-frame proxies adopted from iframe media.\n\nSame-slide fragment navigation does **not** stop media. Global/deck-level parent audio, such as a background track wired through `audio-src`, is not treated as slide media.\n\nDo not add per-slide cleanup scripts for normal media players. Keep slide video/audio as normal media in the composition; use `data-has-audio=\"true\"` only when the player should preserve audible native video audio instead of treating it as silent visual media.\n\nIf the source page has custom controls or visualizations attached to media, those controls must listen to the same native element the slideshow player stops and mutes. A pause caused by slide exit, presenter sync, native controls, custom controls, or the global mute button should all update the visible custom UI through media events, not through parallel state.\n\nWhen implementing direct iframe fallback cleanup, treat iframe media as cross-realm DOM. Do not test iframe nodes with the parent page's `el instanceof HTMLMediaElement`; that returns false in real browsers. Use `el.ownerDocument.defaultView.HTMLMediaElement` (or an equivalent tag/duck-type guard) before setting `muted` or calling `pause()`.\n\n### Global nav mute\n\nWhen `\u003chyperframes-slideshow sound>` renders the nav mute button, that button is the global mute control for the page. It must mute:\n\n- child `\u003chyperframes-player>` instances, including same-origin iframe media;\n- top-level page `\u003caudio>` / `\u003cvideo>` elements; and\n- wrapper-owned SFX/global `Audio` objects via the `hf-sound` event.\n\nDo not add a second mute button inside the composition. If a wrapper script creates `new Audio(...)` objects that are not attached to the DOM, it must listen for `hf-sound` and set `clip.muted = detail.muted` on each object, not merely skip future plays.\n\nThe same cross-realm rule applies here: global mute must reach iframe `\u003cvideo>` / `\u003caudio>` elements through the child frame's DOM realm. A passing unit test in a single DOM realm is not enough; verify in a browser that the actual iframe media elements report `muted: true` after clicking the nav mute button.\n\n`hyperframes present` serves built bundles from `packages/player/dist`. After changing player or slideshow chrome behavior, run `bun run build` in `packages/player` and restart the present server before testing in a browser.\n\nPresenter notes are editable in the presenter view. Edits are stored in `localStorage` per deck and slide, layered over the manifest notes without rewriting the composition file. Do not add one-off note-editing scripts to decks; rely on the shared slideshow player behavior. If a standalone/custom wrapper truly needs to implement this outside the shared player, use the deterministic storage snippet in `skills/slideshow/references/standalone-harness.md`.\n\n### Media cleanup on slide exit\n\nThe slideshow controller owns slide-exit media cleanup. When navigation changes slide or sequence, it calls `hyperframes-player.stopMedia()` before entering the next slide. That command:\n\n- posts `stop-media` to the iframe runtime, which stops WebAudio and pauses native `\u003cvideo>` / `\u003caudio>` elements;\n- pauses same-origin iframe media directly as a fallback; and\n- pauses parent-frame proxies adopted from iframe media.\n\nSame-slide fragment navigation does **not** stop media. Global/deck-level parent audio, such as a background track wired through `audio-src`, is not treated as slide media.\n\nDo not add per-slide cleanup scripts for normal media players. Keep slide video/audio as normal media in the composition; use `data-has-audio=\"true\"` only when the player should preserve audible native video audio instead of treating it as silent visual media.\n\nWhen implementing direct iframe fallback cleanup, treat iframe media as cross-realm DOM. Do not test iframe nodes with the parent page's `el instanceof HTMLMediaElement`; that returns false in real browsers. Use `el.ownerDocument.defaultView.HTMLMediaElement` (or an equivalent tag/duck-type guard) before setting `muted` or calling `pause()`.\n\n### Global nav mute\n\nWhen `\u003chyperframes-slideshow sound>` renders the nav mute button, that button is the global mute control for the page. It must mute:\n\n- child `\u003chyperframes-player>` instances, including same-origin iframe media;\n- top-level page `\u003caudio>` / `\u003cvideo>` elements; and\n- wrapper-owned SFX/global `Audio` objects via the `hf-sound` event.\n\nDo not add a second mute button inside the composition. If a wrapper script creates `new Audio(...)` objects that are not attached to the DOM, it must listen for `hf-sound` and set `clip.muted = detail.muted` on each object, not merely skip future plays.\n\nThe same cross-realm rule applies here: global mute must reach iframe `\u003cvideo>` / `\u003caudio>` elements through the child frame's DOM realm. A passing unit test in a single DOM realm is not enough; verify in a browser that the actual iframe media elements report `muted: true` after clicking the nav mute button.\n\n`hyperframes present` serves built bundles from `packages/player/dist`. After changing player or slideshow chrome behavior, run `bun run build` in `packages/player` and restart the present server before testing in a browser.\n\n---\n\n## Running a slideshow standalone (interim)\n\nThe **durable answer** is engine-hosted: `hyperframes preview --slideshow` / studio present mode will host the composition over the real HyperFrames engine, which drives seek-timelines, owns the gesture frame, and reads the island from the composition. That path is coming; prefer it once it ships.\n\nUntil then, standalone demos (a composition opened via the bare player bundle in a browser, without the engine) require workarounds for three gaps: the composition must expose a seekable root timeline, the island must be duplicated into the wrapper, and wrapper-owned SFX/global audio should live in the parent frame. These patterns are documented in:\n\n```\nskills/slideshow/references/standalone-harness.md\n```\n\nDo not treat the patterns there as the blessed model — they exist only to bridge the gap until the engine-hosted path lands.\n\n## Handoff\n\nFor a public or user-facing slideshow project, the root `index.html` should be a runnable slideshow entrypoint. Opening it in a browser should show slideshow navigation and respond to Next/Prev; it should not expose only the raw composition and require the user to know about Studio or an internal wrapper file. If the raw HyperFrames composition must remain separate for CLI compatibility, put it in a subdirectory such as `composition/index.html` and point scripts/commands at that directory.\n\nThe direct-open wrapper must rely on the built-in Present icon button rendered by `\u003chyperframes-slideshow>`. Do not add a bespoke `#present-btn`, fixed-position button, or wrapper-specific Present styling. The shared component owns the control bar, hides Present in `?mode=audience`, and supports P as a keyboard shortcut.\n\nValidate the direct-open path before handoff. If `file://` browser restrictions break iframe media, local scripts, or same-origin player access, use a self-contained wrapper or make the handoff command start a local server and open the working URL; do not leave `index.html` in a broken or ambiguous state.\n\nFor a completed slideshow deck, the primary user-facing next step is presenter mode, not Studio. Run or provide:\n\n```bash\nnpx hyperframes present \u003cproject-dir>\n```\n\nStudio/`preview` is useful for editing a composition, but it is not a clear final destination for a slideshow user. If you create a `package.json` for a slideshow project where the raw composition lives in `composition/`, make the default runnable script start presenter mode:\n\n```json\n{\n  \"scripts\": {\n    \"dev\": \"npx hyperframes present ./composition\",\n    \"studio\": \"npx hyperframes preview ./composition\"\n  }\n}\n```\n\nAt handoff, include the local presenter URL printed by the command and the minimal instruction: \"Click Present, or press P, to open the audience tab.\" If the user will present over Google Meet or Zoom, also pass on the screen-share guidance from the Presenting section above (share the audience tab in Meet; a dragged-out audience window in Zoom). Keep the server running if the user asked you to start it.\n\n---\n\n## Validation\n\nAfter authoring or editing a slideshow composition, run:\n\n```bash\nnpx hyperframes lint\n```\n\nThen run runtime validation:\n\n```bash\nnpx hyperframes check\n```\n\nTreat lint errors and validation `StaticGuard` contract messages as blockers even if a command exits successfully. Fix the file and rerun until lint reports `0 error(s)` and validation reports no runtime errors.\n\nThe slideshow lint rule checks:\n\n- Every `slide.sceneId` resolves to an existing scene (by `data-composition-id`).\n- Every `hotspot.target` references a defined `slideSequence` id.\n- Fragment times fall within each slide's `[start, end]` range.\n- No two main-line slides overlap in time.\n\nFix all violations before previewing. A composition that fails lint will not parse correctly in the player.\n"}, {"name": "stageshow", "description": "Build faux product UI that looks like a real product, as a still illustration or an animated demo with a cursor. Browser and app windows, dashboards, phones, notifications, terminals, bento grids and cursor walkthroughs, framed, masked and cropped the way a marketing page, feature card or docs hero needs them. Use whenever someone wants a fake or mocked UI, a product demo or walkthrough animation, a hero or feature-card illustration of an app, a product shot in the style of a polished marketing site, or an animated cursor doing things in an interface, even if they never say \"faux UI\". React and plain CSS.", "manual": false, "path": "~/.agents/skills/stageshow", "file_count": 24411, "files": ["LICENSE", "NOTICE.md", "README.md", "assets/app-icons.ts", "examples/ai-cards/cards.css", "examples/ai-cards/index.tsx", "examples/ai-chat/chat.css", "examples/ai-chat/index.tsx", "examples/annotations/annotations.css", "examples/annotations/composed.css", "examples/annotations/composed.tsx", "examples/annotations/index.tsx", "examples/backgrounds/backgrounds.css", "examples/backgrounds/index.tsx", "examples/bento/bento.css", "examples/bento/index.tsx", "examples/brand-marks/brands.css", "examples/brand-marks/index.tsx", "examples/calendar/calendar.css", "examples/calendar/index.tsx", "examples/chart-scrub/index.tsx", "examples/chart-scrub/scrub.css", "examples/choreography/choreography.css", "examples/choreography/index.tsx", "examples/chrome/chrome.css", "examples/chrome/index.tsx", "examples/close-up/close.css", "examples/close-up/index.tsx", "examples/controls/controls.css", "examples/controls/index.tsx", "examples/corner-chip/chip.css", "examples/corner-chip/index.tsx", "examples/cursor-morph/README.md", "examples/cursor-morph/cursor-morph.css", "examples/cursor-morph/cursor-morph.tsx", "examples/cursor-morph/index.tsx", "examples/cursor-resize/cursor-resize.css", "examples/cursor-resize/index.tsx", "examples/cursors/cursors.css", "examples/cursors/index.tsx", "examples/dark-bento/bento.css", "examples/dark-bento/index.tsx", "examples/dark-hero/hero.css", "examples/dark-hero/index.tsx", "examples/device-pair/index.tsx", "examples/device-pair/payments.css", "examples/dynamic-island/index.tsx", "examples/dynamic-island/island.css", "examples/excel/excel.css", "examples/excel/index.tsx", "examples/fade-crop/fade.css", "examples/fade-crop/index.tsx", "examples/figma/figma.css", "examples/figma/index.tsx", "examples/finder/finder.css", "examples/finder/index.tsx", "examples/finder-glass/finder-glass.css", "examples/finder-glass/index.tsx", "examples/flowbuddy-quickadd/FlowbuddyQuickAdd.tsx", "examples/flowbuddy-quickadd/REHEARSAL.md"], "body": "---\nname: stageshow\ndescription: Build faux product UI that looks like a real product, as a still illustration or an animated demo with a cursor. Browser and app windows, dashboards, phones, notifications, terminals, bento grids and cursor walkthroughs, framed, masked and cropped the way a marketing page, feature card or docs hero needs them. Use whenever someone wants a fake or mocked UI, a product demo or walkthrough animation, a hero or feature-card illustration of an app, a product shot in the style of a polished marketing site, or an animated cursor doing things in an interface, even if they never say \"faux UI\". React and plain CSS.\n---\n\n# Stageshow\n\nMiniature product UI: a believable interface, framed in its space, as one still or a short animation in which one thing happens. The viewer recognizes the screen and sees the thing happen.\n\n## The one idea\n\n**It reads as a real product, simplified to what the viewer needs, framed with intent, and every motion has a cause.**\n\nFive ways it fails:\n\n- **Too much.** Real text in every row, numbers everywhere, everything packed. The more detail, the more it looks generated.\n- **Wireframe.** Two gray blobs and a button. Built too small, or stripped of what made it recognizable.\n- **Boxed.** A whole window shrunk into a card with even margins: a screenshot pasted in, not a product shot.\n- **Flat.** Every object the same weight in the same bordered card. The eye has nowhere to land.\n- **Bland.** A gray window with a cursor, whatever the brief said. The brief's look and energy (a blueprint, glass over color, a Dynamic Island, a mascot) are the point; take what it asks for and build it to the rules, as `examples/hero-demo` does with its typed popup and terminal satellite (a satellite is a smaller second object, a receipt, phone or detail card, straddling the hero's edge).\n\nThe fix: a full, structured screen in quiet grays, real words only on what the story is about, placeholder lines for the rest, room to breathe, a crop that puts the eye where the story is. Simplify the words, not the context. An empty corner, a void under a list, rows spread to fill a pane, a window floating on a plate (a backdrop or tinted field behind it): unfinished, not calm.\n\nThese are authored illustrations, not browser automation: `a.click()` draws the cursor pressing, `a.set()` changes the scene.\n\n## How hard to press\n\nBuild it the way a product designer builds a launch page they will be judged on. The gold examples in `examples/` are the bar, not a reference: if yours is the emptier, flatter or smaller one beside the closest gold, that is the first fix. Then look at the frame the way the most exacting designer you know would, the one who screenshots the one wrong thing and sends it back with \"what is this?\": a dot off its avatar, a unit on its own line, a grabber under the island, copy touching a card. If you can picture that screenshot, you have found the next fix.\n\n## Workflow\n\nMost of the quality is decided before any code. Write the plan first: where it sits, the focal object, the action, the payoff, what can be left out.\n\n1. **Medium and place.** Still or animation (loop, once in view, or hover). The page, its ground, its width. Design at the size it will be seen, about 720 × 340 for a hero beside copy (`hero-demo`), 900 to 1100 wide for a full-width hero (`linear`), 400 × 300 for a card, shown at 1:1; never under about 320 wide for a demo, though a bento tile or a satellite card may be smaller. Every demo that can sit in a phone column ships a `compact` design at the column's width (358), a redesign not a squeeze (`references/framing.md`, Small formats and the page). A grid of tiles is one set: plan it with `references/bento.md`.\n2. **Look.** With the product's code or site at hand, map its tokens to the kit's (`references/looks.md`); if the developer asks for their own components, use them inside the stage instead of the kit's small parts. Otherwise a theme (light, dark, blueprint, glass), a palette (accent, mono) and a fidelity: `minimal` is all bars, `standard` is words where they carry meaning and bars elsewhere, `realistic` is real content everywhere. Default light, accent, standard; go realistic at hero scale, for a named real product, or a still whose subject is a list or page. Write filler once with `Text filler` and the fidelity decides. The product's own icons, its real chrome, the content that makes it recognizable. A brief with a style (kawaii, paper, a poster color) gets that style in full, still built to these rules.\n3. **The story.** Its shape (`references/motion.md`, Story): how it feels to use, a flow, or what the system does. Three to five beats and a payoff, 10 to 16 seconds. No cursor move you can't explain. Data never rewinds in view without a cause. Between a richer story and a calmer frame, choose the frame.\n4. **Start from an example.** Find the closest gold example (the Gold table below) and film it (`node scripts/film.mjs \"\u003cpreview>/?capture=\u003cgold>\" --select '#example' --still --out gold.png`; `npm run dev` serves the preview). Copy its folder into your project as the starting point; don't rewrite it from a glance. The quickest loop: copy it to `examples/\u003cyours>
