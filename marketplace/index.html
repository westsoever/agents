 session that runs it becomes the orchestrator of the spec → build → review → approve loop.\n---\n\n# Factory\n\nYou are the orchestrator for one job. You run the loop below, spawn every agent,\nand are the only writer of your job's `job.json`. You never write code, specs,\nreviews or decisions yourself. Agents do the work and each writes one file; you\nmove the job along and keep `job.json` current.\n\nThis skill is global: it runs in whatever git repo your session is in. Adapted\nfrom zazencodes' software-factory-claude-code, without the dashboard.\n\n## The loop\n\n```\nfeature → spec-writer → builder → [security, ux, ui, code] → WAIT FOR ALL\n                           ▲                                      │\n                           └──── any CHANGES: resume builder ◄────┤\n                                                                  ▼ all PASS\n                                     merge to main ◄─ APPROVE ─ approver ─ ESCALATE → needs-human\n```\n\n| Step         | Agent (`subagent_type`)     | Writes                                      |\n| ------------ | --------------------------- | ------------------------------------------- |\n| spec         | `factory-spec-writer`       | `spec.md`                                   |\n| build        | `factory-builder`           | `build.md` + commits on `factory/\u003cjob-id>`  |\n| review       | `factory-reviewer-security` | `round-N/review-security.md`                |\n|              | `factory-reviewer-ux`       | `round-N/review-ux.md`                      |\n|              | `factory-reviewer-ui`       | `round-N/review-ui.md`                      |\n|              | `factory-reviewer-code`     | `round-N/review-code.md`                    |\n| approve      | `factory-approver`          | `decision.md`                               |\n\n`MAX_RESUMES = 2`: after round 1 the builder can be resumed at most twice, so a\nrun has at most 3 review rounds. To change the factory, edit this file and the\nagent files in `~/.agents/skills/factory/agents/` (symlinked into\n`~/.claude/agents/`).\n\nEvery agent reads `AGENTS.md` (or `CLAUDE.md`) for the repo's setup, dev server,\nvalidation commands and conventions. Nothing repo-specific lives in these files.\nIf the repo has neither, or it doesn't say how to run the tests, stop before\nstep 1 and tell the user what the agents will need.\n\n## Parallel jobs\n\nEvery job runs in its own git worktree on its own branch, so several jobs can run\nat once, one per Claude session. To run three features, open three sessions in\nthis repo and start `/factory` in each. Your session orchestrates only the job it\nstarted or was handed.\n\n- Your session stays in the main checkout. Agents work in the job's worktree.\n  The main checkout is the user's, and it may be dirty or on another branch.\n  Only **Merge** touches it.\n- Job state lives in `factory/jobs/\u003cjob-id>/` in the main checkout, never in a\n  worktree. Each job has its own `job.json`, so sessions never write the same\n  file.\n- Each job gets its own dev server ports and agent-browser sessions (see\n  **Prompts**), so reviewers of different jobs never see each other's pages.\n\n## Files\n\n`\u003crepo>` is the main checkout (`git rev-parse --show-toplevel` from your\nsession) and `\u003cname>` is its folder name. `factory/jobs/` is runtime state that\nnever lands in a commit: the first time you create it in a repo, add the line\n`/factory/jobs/` to `$(git rev-parse --git-common-dir)/info/exclude` (unless\n`.gitignore` or that file already ignores it). That ignores it locally without\ntouching the repo's `.gitignore`.\n\n```\n\u003crepo>/factory/backlog.md                      queue for /factory next (create it when asked to queue something)\n\u003crepo>/factory/jobs/\u003cjob-id>/job.json          the job's state (only you write it)\n\u003crepo>/factory/jobs/\u003cjob-id>/spec.md\n\u003crepo>/factory/jobs/\u003cjob-id>/build.md\n\u003crepo>/factory/jobs/\u003cjob-id>/rework-\u003ck>.md     written by you, from /factory rework\n\u003crepo>/factory/jobs/\u003cjob-id>/round-\u003cN>/review-{security,ux,ui,code}.md\n\u003crepo>/factory/jobs/\u003cjob-id>/decision.md\n\u003crepo>/../\u003cname>-factory/\u003cjob-id>/             the job's worktree, on factory/\u003cjob-id>\n```\n\n### job.json\n\n```json\n{ \"id\": \"003-rate-limiting\", \"feature\": \"Rate limit the signup form\",\n  \"branch\": \"factory/003-rate-limiting\",\n  \"worktree\": \"/Users/you/code/my-app-factory/003-rate-limiting\",\n  \"builder\": \"\u003cagent id of the builder>\",\n  \"stage\": \"review\", \"round\": 2,\n  \"reviews\": { \"security\": \"CHANGES\", \"ux\": \"PASS\", \"ui\": \"pending\", \"code\": \"PASS\" } }\n```\n\n- `stage` is one of `spec`, `build`, `review`, `approve`, `merged`,\n  `needs-human`. Worktree setup counts as `spec`.\n- `round` is the current review round (0 until the first round starts).\n- `reviews` holds the current round only. Each value is `pending`, `PASS` or\n  `CHANGES`. Earlier rounds live in their `round-\u003cN>/` folders.\n- `builder` is the agent id the Agent tool returned for the job's builder, so\n  it can be resumed. Leave it out until the builder exists.\n- Rewrite the whole file on every change. `worktree` is always an absolute path.\n\n### Prompts\n\nEvery agent prompt starts with the job's absolute paths:\n`Job folder: \u003crepo>/factory/jobs/\u003cjob-id>/. Worktree: \u003cworktree>. Branch: factory/\u003cjob-id>.`\nBelow, `\u003cpaths>` stands for that sentence.\n\nAgents that open pages also get a port. With `n` the job number (`003` → 3),\nthe builder gets `5100 + 10n`, `factory-reviewer-ux` gets `5101 + 10n` and\n`factory-reviewer-ui` gets `5102 + 10n`, appended as ` Port: \u003cport>.`\n\nWait for each agent's completion notification before reading its file. Never\npredict what an agent wrote.\n\n## /factory \u003cfeature>\n\n1. **Create the job.** `mkdir -p factory/jobs` (and set up the exclude line, see\n   **Files**), then pick the next 3-digit number after the highest numbered\n   folder in `factory/jobs/` (`001` if there are none) and a 2–4 word\n   kebab-case slug of the feature: `004-blog-reading-time`.\n   Claim it with `mkdir factory/jobs/\u003cjob-id>` (no `-p`). If that fails because\n   another session took the number, pick the next number and try again.\n   The worktree path is `$(cd .. && pwd)/$(basename \"$PWD\")-factory/\u003cjob-id>`,\n   run from `\u003crepo>`. Write `job.json` with that `worktree`, `stage: \"spec\"`,\n   `round: 0` and all reviews `pending`.\n2. **Worktree.** Create the branch and its worktree from `main`. If the repo has\n   an `origin`, `git fetch` first and, when `origin/main` is ahead of local\n   `main`, branch from `origin/main` instead so the job starts current:\n   ```bash\n   git worktree add -b factory/\u003cjob-id> \u003cworktree> main\n   ```\n   Then, in the worktree, run the setup AGENTS.md gives for a fresh checkout\n   (installing dependencies, for example). If any of it fails, stop and tell\n   the user.\n3. **Spec.** Spawn `factory-spec-writer` with the prompt\n   `\u003cpaths> Feature: \u003cfeature, verbatim>`.\n   Wait for it to finish, then check that `spec.md` exists.\n4. **Build.** Set `stage: \"build\"`. Spawn `factory-builder` with the prompt\n   `\u003cpaths> Build round 1. Port: \u003cport>.` Record the agent id it returns as\n   `builder` in `job.json`. Wait for it to finish, then go to **Build check**.\n\n### Build check\n\nRead the first line of `build.md`.\n\n- `STATUS: READY`: start the next review round.\n- `STATUS: BLOCKED`: go to **Needs human**.\n\n### Review round N\n\n1. Set `stage: \"review\"`, `round: N` and all four reviews to `pending`. Create\n   `factory/jobs/\u003cjob-id>/round-\u003cN>/`.\n2. Spawn all four reviewers **in one message**, so they run in parallel. Each\n   gets the prompt `\u003cpaths> Review round N.`, plus its port for\n   `factory-reviewer-ux` and `factory-reviewer-ui`.\n3. **WAIT FOR ALL.** Each time a reviewer finishes, read the first line of its\n   file (`VERDICT: PASS` or `VERDICT: CHANGES`) and write that verdict to\n   `job.json` straight away. The round is done only when all four\n   `review-*.md` files exist in `round-\u003cN>/`. Never resume the builder\n   mid-round. If a reviewer finishes without writing its file, or writes a\n   first line that isn't a verdict, stop and tell the user.\n4. Decide:\n   - **All PASS**: go to **Approve**.\n   - **Any CHANGES, resumes left**: set `stage: \"build\"`, then resume the same\n     builder with `SendMessage` to the `builder` id in `job.json`:\n     `Round N reviews are in \u003crepo>/factory/jobs/\u003cjob-id>/round-\u003cN>/. Address every review with VERDICT: CHANGES, commit, and update build.md for round N+1.`\n     If the builder can't be resumed (the id is gone, for example after a\n     restart), spawn a fresh `factory-builder` with\n     `\u003cpaths> Resume: round N reviews are in round-\u003cN>/. Read build.md and every round folder for the history, address every review with VERDICT: CHANGES, commit, and update build.md for round N+1. Port: \u003cport>.`\n     and record its id. Wait for it to finish, then go to **Build check**.\n   - **Any CHANGES, no resumes left**: write `decision.md` yourself, reading\n     `ESCALATE`, then a blank line, then\n     `Review rounds exhausted. Outstanding CHANGES in round-\u003cN>/ from: \u003creviewers>.`\n     Go to **Needs human**.\n\n### Approve\n\nSet `stage: \"approve\"`. Spawn `factory-approver` with the prompt\n`\u003cpaths> Final round: N.` When it finishes, read the first line of\n`decision.md`:\n\n- `APPROVE`: go to **Merge**.\n- `ESCALATE`: go to **Needs human**.\n\n### Merge\n\nThe merge happens in the main checkout, so it must be clean and on `main`:\n`git status --porcelain -- . ':!factory/backlog.md'` prints nothing and\n`git branch --show-current` prints `main`. `factory/backlog.md` is exempt: every\n`/factory next` edits it, and job branches never touch it, so a dirty backlog\ncannot conflict with the merge. If not, set `stage: \"needs-human\"` and tell the\nuser the job is approved but the main checkout is busy; they run\n`/factory approve \u003cjob-id>` once it is clean. Otherwise:\n\n```bash\ngit fetch                                   # when the repo has an origin\ngit merge --ff-only origin/main             # when origin/main is ahead; if local main has its own commits, stop and tell the user\ngit merge --no-ff factory/\u003cjob-id> -m \"Merge factory/\u003cjob-id>: \u003cspec title>\"\ngit worktree remove \u003cworktree>\ngit branch -d factory/\u003cjob-id>\n```\n\nSet `stage: \"merged\"`. If the merge fails, run `git merge --abort` (when a merge\nis in progress), set `stage: \"needs-human\"` and tell the user why. If removing the\nworktree fails, the job is still merged: tell the user what `git worktree remove`\nprinted. Never push: the user pushes, or runs `/merge`.\n\n### Needs human\n\nSet `stage: \"needs-human\"`. The branch and its worktree stay for the human to\ninspect. Tell the user which job is waiting, give the worktree path, and quote\n`decision.md` (or the BLOCKED reason from `build.md`).\n\n## /factory next\n\nRead `factory/backlog.md` and take the first `- [ ]` item. Claim it with one\nEdit that replaces its exact line with `- [x] \u003citem> → claimed`. If the Edit\nfails because the line changed, another session claimed it: re-read the backlog\nand try the next `- [ ]` item. If none is left (or there is no backlog), say so\nand stop.\n\nRun `/factory \u003citem>`, and once step 1 has given it a job id, replace `claimed`\non its backlog line with the job id.\n\nA new backlog starts as:\n\n```markdown\n# Backlog\n\n`/factory next` builds the first unchecked item and checks it off with its job id.\n\n- [ ] \u003cfeature>\n```\n\n## /factory status\n\nRead every `factory/jobs/*/job.json` and print one line per job, newest first:\n`\u003cid>  \u003cstage>  round \u003cN>  security/ux/ui/code verdicts  \u003cfeature>`. For\n`needs-human` jobs, add the first line of `decision.md` (or the BLOCKED line of\n`build.md`) and the worktree path. This replaces the upstream dashboard; it\nchanges nothing.\n\n## /factory approve \u003cjob-id>\n\nThe job must be in `needs-human`. Run **Merge** with that job id.\n\n## /factory rework \u003cjob-id> \u003cnote>\n\nThe job must be in `needs-human`.\n\n1. Write the note, verbatim, to `factory/jobs/\u003cjob-id>/rework-\u003ck>.md`, where `k`\n   is the next unused number.\n2. Set `stage: \"build\"`.\n3. Spawn a fresh `factory-builder` with the prompt\n   `\u003cpaths> Rework: read rework-\u003ck>.md and address it, then update build.md for round N+1. Port: \u003cport>.`\n   (`N` is the job's last round.) Record its id as `builder`. A rework run gets\n   a fresh `MAX_RESUMES`.\n4. Continue from **Build check**, exactly like a new job.\n\n## Reporting\n\nKeep the user posted with one short line per transition, for example\n`003-rate-limiting: round 2, security CHANGES, ux/ui/code PASS → resuming builder`.\nWhen the job ends, say whether it merged or needs a human, and why.\n"}, {"name": "find-skills", "description": "Helps users discover and install agent skills when they ask questions like \"how do I do X\", \"find a skill for X\", \"is there a skill that can...\", or express interest in extending capabilities. This skill should be used when the user is looking for functionality that might exist as an installable skill.", "manual": false, "path": "~/.agents/skills/find-skills", "file_count": 0, "files": [], "body": "---\nname: find-skills\ndescription: Helps users discover and install agent skills when they ask questions like \"how do I do X\", \"find a skill for X\", \"is there a skill that can...\", or express interest in extending capabilities. This skill should be used when the user is looking for functionality that might exist as an installable skill.\n---\n\n# Find Skills\n\nThis skill helps you discover and install skills from the open agent skills ecosystem.\n\n## When to Use This Skill\n\nUse this skill when the user:\n\n- Asks \"how do I do X\" where X might be a common task with an existing skill\n- Says \"find a skill for X\" or \"is there a skill for X\"\n- Asks \"can you do X\" where X is a specialized capability\n- Expresses interest in extending agent capabilities\n- Wants to search for tools, templates, or workflows\n- Mentions they wish they had help with a specific domain (design, testing, deployment, etc.)\n\n## What is the Skills CLI?\n\nThe Skills CLI (`npx skills`) is the package manager for the open agent skills ecosystem. Skills are modular packages that extend agent capabilities with specialized knowledge, workflows, and tools.\n\n**Key commands:**\n\n- `npx skills find [query]` - Search for skills interactively or by keyword\n- `npx skills add \u003cpackage>` - Install a skill from GitHub or other sources\n- `npx skills check` - Check for skill updates\n- `npx skills update` - Update all installed skills\n\n**Browse skills at:** https://skills.sh/\n\n## How to Help Users Find Skills\n\n### Step 1: Understand What They Need\n\nWhen a user asks for help with something, identify:\n\n1. The domain (e.g., React, testing, design, deployment)\n2. The specific task (e.g., writing tests, creating animations, reviewing PRs)\n3. Whether this is a common enough task that a skill likely exists\n\n### Step 2: Search for Skills\n\nRun the find command with a relevant query:\n\n```bash\nnpx skills find [query]\n```\n\nFor example:\n\n- User asks \"how do I make my React app faster?\" → `npx skills find react performance`\n- User asks \"can you help me with PR reviews?\" → `npx skills find pr review`\n- User asks \"I need to create a changelog\" → `npx skills find changelog`\n\nThe command will return results like:\n\n```\nInstall with npx skills add \u003cowner/repo@skill>\n\nvercel-labs/agent-skills@vercel-react-best-practices\n└ https://skills.sh/vercel-labs/agent-skills/vercel-react-best-practices\n```\n\n### Step 3: Present Options to the User\n\nWhen you find relevant skills, present them to the user with:\n\n1. The skill name and what it does\n2. The install command they can run\n3. A link to learn more at skills.sh\n\nExample response:\n\n```\nI found a skill that might help! The \"vercel-react-best-practices\" skill provides\nReact and Next.js performance optimization guidelines from Vercel Engineering.\n\nTo install it:\nnpx skills add vercel-labs/agent-skills@vercel-react-best-practices\n\nLearn more: https://skills.sh/vercel-labs/agent-skills/vercel-react-best-practices\n```\n\n### Step 4: Offer to Install\n\nIf the user wants to proceed, you can install the skill for them:\n\n```bash\nnpx skills add \u003cowner/repo@skill> -g -y\n```\n\nThe `-g` flag installs globally (user-level) and `-y` skips confirmation prompts.\n\n## Common Skill Categories\n\nWhen searching, consider these common categories:\n\n| Category        | Example Queries                          |\n| --------------- | ---------------------------------------- |\n| Web Development | react, nextjs, typescript, css, tailwind |\n| Testing         | testing, jest, playwright, e2e           |\n| DevOps          | deploy, docker, kubernetes, ci-cd        |\n| Documentation   | docs, readme, changelog, api-docs        |\n| Code Quality    | review, lint, refactor, best-practices   |\n| Design          | ui, ux, design-system, accessibility     |\n| Productivity    | workflow, automation, git                |\n\n## Tips for Effective Searches\n\n1. **Use specific keywords**: \"react testing\" is better than just \"testing\"\n2. **Try alternative terms**: If \"deploy\" doesn't work, try \"deployment\" or \"ci-cd\"\n3. **Check popular sources**: Many skills come from `vercel-labs/agent-skills` or `ComposioHQ/awesome-claude-skills`\n\n## When No Skills Are Found\n\nIf no relevant skills exist:\n\n1. Acknowledge that no existing skill was found\n2. Offer to help with the task directly using your general capabilities\n3. Suggest the user could create their own skill with `npx skills init`\n\nExample:\n\n```\nI searched for skills related to \"xyz\" but didn't find any matches.\nI can still help you with this task directly! Would you like me to proceed?\n\nIf this is something you do often, you could create your own skill:\nnpx skills init my-xyz-skill\n```\n"}, {"name": "full-output-enforcement", "description": "Overrides default LLM truncation behavior. Enforces complete code generation, bans placeholder patterns, and handles token-limit splits cleanly. Apply to any task requiring exhaustive, unabridged output.", "manual": false, "path": "~/.agents/skills/full-output-enforcement", "file_count": 0, "files": [], "body": "---\nname: full-output-enforcement\ndescription: Overrides default LLM truncation behavior. Enforces complete code generation, bans placeholder patterns, and handles token-limit splits cleanly. Apply to any task requiring exhaustive, unabridged output.\n---\n\n# Full-Output Enforcement\n\n## Baseline\n\nTreat every task as production-critical. A partial output is a broken output. Do not optimize for brevity — optimize for completeness. If the user asks for a full file, deliver the full file. If the user asks for 5 components, deliver 5 components. No exceptions.\n\n## Banned Output Patterns\n\nThe following patterns are hard failures. Never produce them:\n\n**In code blocks:** `// ...`, `// rest of code`, `// implement here`, `// TODO`, `/* ... */`, `// similar to above`, `// continue pattern`, `// add more as needed`, bare `...` standing in for omitted code\n\n**In prose:** \"Let me know if you want me to continue\", \"I can provide more details if needed\", \"for brevity\", \"the rest follows the same pattern\", \"similarly for the remaining\", \"and so on\" (when replacing actual content), \"I'll leave that as an exercise\"\n\n**Structural shortcuts:** Outputting a skeleton when the request was for a full implementation. Showing the first and last section while skipping the middle. Replacing repeated logic with one example and a description. Describing what code should do instead of writing it.\n\n## Execution Process\n\n1. **Scope** — Read the full request. Count how many distinct deliverables are expected (files, functions, sections, answers). Lock that number.\n2. **Build** — Generate every deliverable completely. No partial drafts, no \"you can extend this later.\"\n3. **Cross-check** — Before output, re-read the original request. Compare your deliverable count against the scope count. If anything is missing, add it before responding.\n\n## Handling Long Outputs\n\nWhen a response approaches the token limit:\n\n- Do not compress remaining sections to squeeze them in.\n- Do not skip ahead to a conclusion.\n- Write at full quality up to a clean breakpoint (end of a function, end of a file, end of a section).\n- End with:\n\n```\n[PAUSED — X of Y complete. Send \"continue\" to resume from: next section name]\n```\n\nOn \"continue\", pick up exactly where you stopped. No recap, no repetition.\n\n## Quick Check\n\nBefore finalizing any response, verify:\n- No banned patterns from the list above appear anywhere in the output\n- Every item the user requested is present and finished\n- Code blocks contain actual runnable code, not descriptions of what code would do\n- Nothing was shortened to save space\n"}, {"name": "general-video", "description": "Author or edit a custom HyperFrames composition when no specialized workflow fits, or when BRIEF.md sets flow: companion. Use for longer or multi-scene pieces, brand and sizzle reels, montages, static loops, static title cards, footage remixes, and freeform builds. Use motion-graphics instead for a short unnarrated motion-first unit, including an animated title. Route fresh creation through hyperframes before using this skill.", "manual": false, "path": "~/.agents/skills/general-video", "file_count": 3, "files": ["scripts/frame-packets.mjs", "scripts/frame-packets.test.mjs", "sub-agents/frame-worker.md"], "body": "---\nname: general-video\ndescription: >\n  Author or edit a custom HyperFrames composition when no specialized workflow fits, or when\n  BRIEF.md sets flow: companion. Use for longer or multi-scene pieces, brand and sizzle reels,\n  montages, static loops, static title cards, footage remixes, and freeform builds. Use\n  motion-graphics instead for a short unnarrated motion-first unit, including an animated title.\n  Route fresh creation through hyperframes before using this skill.\n---\n\n# General video\n\nBefore relying on this workflow, run:\n\n```bash\nnpx hyperframes skills update general-video\n```\n\nA successful no-op means the skill is current. Surface an update failure instead of continuing from memory.\n\n## 1. Apply cross-cutting source adapters\n\n- **Media:** For any audio, image, icon, logo, voice, grade, LUT, treatment/effect, caption, or media-operation need, load `/media-use` and follow `../media-use/references/resolve.md` (resolve, adopt, reuse) and `../media-use/references/setup-providers.md` (providers, auth). Vague footage feedback and named styles use `../media-use/references/media-treatments.md` before editing; do not improvise supported media effects with CSS/SVG/opacity. Before the first authenticated provider action, run `npx hyperframes auth status` and relay its output verbatim. If signed out, apply the gate in `../hyperframes-core/references/brief-contract.md`: collaborative waits for sign-in or an explicit offline choice; autonomous states the status and continues through an available offline provider. Surface a blocker when no offline provider can satisfy a required capability. Local adoption alone does not require an auth gate.\n- **Figma:** If any input is a `figma.com` URL, run `/figma` first. Build from its exported assets, tokens, components, or storyboard frames. Do not use raw Figma connector calls because they skip SVG sanitization, media provenance, and brand-token binding.\n\nThese adapters do not change the workflow selected by `/hyperframes`.\n\n## 2. Start from project state\n\nApply the first matching row; do not evaluate lower state rows:\n\n| State                                                      | Action                                                                                                         |\n| ---------------------------------------------------------- | -------------------------------------------------------------------------------------------------------------- |\n| Specific edit                                              | Make the edit, preserve existing project decisions, then rerun affected checks. Do not reopen discovery.       |\n| `BRIEF.md` exists                                          | Read it. If `workflow` names another workflow and `flow` is not `companion`, hand off. Ask no brief questions. |\n| No brief, but `hyperframes.json` or `STORYBOARD.md` exists | Resume from files and recorded preferences. Backfill `BRIEF.md` only from known facts.                         |\n| Fresh creation                                             | Run `/hyperframes` and its intent layer. Return here only for `workflow: general-video` or `flow: companion`.  |\n\nFor a new project, choose a kebab-case directory name from the brief and scaffold before writing the brief:\n\n```bash\nnpx hyperframes init \"videos/\u003cproject>\" --non-interactive --example=blank --skill=general-video\n```\n\nThen write `BRIEF.md` at the project root using `../hyperframes-core/references/brief-format.md`. In an existing project, the root is the directory containing `hyperframes.json`. Record only the confirmed preference-backed fields named by the brief format, using `node \u003cMEDIA_DIR>/scripts/prefs.mjs record --hyperframes \u003cPROJECT_ROOT>`; never record inferred defaults. Here `\u003cMEDIA_DIR>` is the installed `/media-use` skill directory and `\u003cPROJECT_ROOT>` is the directory containing `hyperframes.json`. If the intent layer adopted a recipe, apply it now with `node \u003cMEDIA_DIR>/scripts/recipe.mjs use --hyperframes \u003cPROJECT_ROOT> --name \u003cname>` and do not ask again.\n\n## 3. Interpret the run shape\n\nUse only the canonical terms from `../hyperframes-core/references/brief-contract.md`:\n\n| Field          | Meaning                               | Effect                                                                              |\n| -------------- | ------------------------------------- | ----------------------------------------------------------------------------------- |\n| `flow`         | Who drives                            | `automation`: choose and execute the route. `companion`: co-create in conversation. |\n| `storyboard`   | Whether the board is a review surface | `yes`: run plan and sketch review. `no`: build without the board.                   |\n| derived `mode` | How checkpoint gates behave           | Follow the brief contract. Never ask the user to name a mode.                       |\n\nDo not invent synonyms for these states. An ongoing “just build it” signal is handled by the intent layer and arrives as `flow: automation`, `storyboard: no`.\n\n- For `flow: automation`, choose the route and state it in one line in the first progress update.\n- For a specific edit, make the edit without inventing a new route.\n\n### Companion flow\n\nWhen `flow: companion`:\n\n- Read `BRIEF.md` and reconcile accepted `## Assets` and `## Customizations` with project artifacts. Complete accepted work that is still pending; leave completed work alone; do not offer an accepted capability again as if it were new.\n- **Arrive as the director, not the contractor.** A user who chose companion chose involvement and quality; the honest response is the best version you can design, not the smallest one you can defend. The first plan is the ceiling treatment: the story arc (borrow the nearest genre lens — menu § Genre lenses), the design spec, each scene's motion treatment cited by name (§ 5's plan discipline), the transitions, the audio identity — music and sound marks, or deliberate silence — the user's material placed, and a designed open and close. Say what each layer adds in one line; flag the expensive ones (render time, sign-in, billing) as you name them. The user trims a treatment down; they should never have to assemble one approval by approval.\n- **The ceiling belongs to the concept, not the toolbox.** Every layer must serve the brief's message — a treatment that would dress any video the same way is decoration. Craft rises to the ceiling; content never grows past what was asked (§ 6).\n- Between checkpoints, `../hyperframes/references/capability-menu.md` works two ways. As the trigger list: offer a relevant capability when the user mentions its input or the build reaches its need. As each pass's upgrade channel: a plan, sketch, or build checkpoint may carry one or two traced offers pointed at material the user is looking at (\"scene 3's stat wants the count-up treatment\"). Read it before offering; never dump the full catalog.\n- After the user accepts a capability, produce its artifact and record the decision in the matching `BRIEF.md` body section immediately. Rewrite a frontmatter field and record the confirmed preference only when the user explicitly changes it.\n- Keep the same storyboard, validation, final-preview, and render-approval gates. Companion changes who steers, not what quality requires.\n\n## 4. Load required knowledge before each stage\n\nThese reads are mandatory when their condition matches:\n\n| Condition                                                                                                         | Read before acting                                                                                                                                                                                                                     |\n| ----------------------------------------------------------------------------------------------------------------- | -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| Any composition HTML or scene layout                                                                              | `/hyperframes-core`; use `references/determinism-rules.md` for its layout contract                                                                                                                                                     |\n| Any non-trivial creation or visual treatment                                                                      | `/hyperframes-creative` → `references/house-style.md` and `references/video-composition.md`                                                                                                                                            |\n| Any motion, animation, or scene transition                                                                        | `/hyperframes-animation`; follow its routing to the matching rules, adapters, blueprints, or transition references                                                                                                                     |\n| `storyboard: yes`                                                                                                 | `../hyperframes-core/references/storyboard-format.md` and `../hyperframes-core/references/review-loop.md`                                                                                                                              |\n| Any media asset or operation, including narration, BGM, SFX, captions, grading, or transforms                     | `/media-use`; for framework playback and placement also read `/hyperframes-core` → `references/variables-and-media.md`                                                                                                                 |\n| Multi-scene assembly                                                                                              | `../hyperframes-core/references/production-loop.md`                                                                                                                                                                                    |\n| `flow: companion`, before the first plan                                                                          | `/hyperframes-creative` → `references/story-spine.md` and `references/house-style.md`; the nearest genre lens and the full `../hyperframes/references/capability-menu.md` — the ceiling treatment is designed from these, not recalled |\n| A companion capability offer, capture, beat grid, generative video, map, publishing, or cross-workflow capability | `../hyperframes/references/capability-menu.md`                                                                                                                                                                                         |\n| A design spec exists, before final approval                                                                       | `/hyperframes-creative` → `references/design-adherence.md`                                                                                                                                                                             |\n\nDo not replace these reads with recollection. Progressive disclosure saves context only when the matching reference is actually loaded.\n\n## 5. Execute the composition\n\nUse this dependency order. Skip a stage only when its input is absent.\n\n1. **Plan.** State the viewer arc, structure, rhythm, and duration driver. Use one file for a short single scene; use sub-compositions for three or more hard scene cuts or any reused scene. Read `/hyperframes-creative` → `references/story-spine.md` for narrated arcs, `references/beat-direction.md` for rhythm, and `/hyperframes-core` → `references/composition-patterns.md` for structure. For an open-ended multi-scene brief, expand the prompt through `/hyperframes-creative` → `references/prompt-expansion.md`. A multi-scene plan cites each scene's shape: a blueprint id from `/hyperframes-animation` → `blueprints-index.md` when one fits, or the named rules it composes from `rules-index.md` when none does — motion names come from those indexes, never invented. Story truth decides which scenes exist; the citation dresses them. A multi-scene plan is also recorded as the dispatch artifact: one `## Frame N` block per scene in `STORYBOARD.md` — `status: outline`, a declared `src:`, the blueprint/rules citation, and the beat text — **even when `storyboard: no`**. The block is the dispatch unit; the board is only the review surface.\n2. **Review the plan when requested.** For `storyboard: yes`, run the shared review loop over those blocks. For `storyboard: no`, continue without opening the board. When a plan pause happens anyway, fold the sub-agent delegation grant (needed by codex for step 4's dispatch) into that pause rather than stopping again later.\n3. **Resolve dependencies.** Install registry blocks before parallel work. Stage user assets, adopt existing media, and resolve only what the brief requires. Start audio early when its timings drive duration.\n4. **Build scenes.** For a short single-scene piece, implement the scene at its most visible moment before adding motion (the confirmed wireframe, when present, is that end state and must not be redrawn), then animate from its cited blueprint or rules — read the full recipe body (`/hyperframes-animation` → `blueprints/\u003cid>.md`, `rules/\u003cid>.md`) before writing motion.\n\n   **Dispatch pays for itself only at scale.** Authoring packets and warming fresh worker contexts costs real minutes and tokens: a film of up to ~6 short scenes builds FASTER inline, in this context, one scene after another (measured: 5 short scenes ≈ 9 min inline vs ≈ 21 min packetized). Fan out only when the plan exceeds that — more scenes, or individually heavy ones — and then give each worker **2–3 scenes**, not one, and spawn **all workers in a single wave** (a second wave nearly doubles the window). When dispatching:\n\n   `node \u003cSKILL_DIR>/scripts/frame-packets.mjs --project \"$PROJECT_DIR\" --storyboard \"$PROJECT_DIR/STORYBOARD.md\"`\n\n   The builder writes one bounded packet per scene under `.hyperframes/frame-packets/` (the scene's exact storyboard block + the blueprint body + every cited rule recipe, inlined) and `_role.md` (`../hyperframes-core/references/frame-worker-core.md` + this skill's `sub-agents/frame-worker.md`, concatenated verbatim — the complete worker role). Dispatch the workers — 2–3 scene packets each, all in one wave (`../hyperframes-core/references/subagent-dispatch.md`); each worker's prompt carries `_role.md` and its packets — paste them in full, or hand the file paths for the worker to read first (equivalent either way) — plus a dispatch context with `PROJECT_DIR`, its `frame_id`s, and canvas size. WAIT on every scene's `compositions/\u003cframe_id>.html` + `compositions/\u003cframe_id>.motion.json`. Workers read only their packets and the design truth file; they never open `STORYBOARD.md` or the skill documents. With no delegation channel, fall back serially: process one packet at a time in this context, still working from the packet alone.\n\n5. **Merge motion sidecars.** Collect the workers' `compositions/\u003cframe_id>.motion.json` files and carry their durations and exit/entry vectors into assembly; where the doctrine chain (`/motion-doctrine`) is installed, translate them into the project ledger before stamping seams.\n6. **Assemble.** Mount scenes, media, transitions, captions, and audio using the production loop. Real voice duration overrides estimates.\n7. **Verify.** Use `npx hyperframes lint` for fast feedback after the first HTML pass and structural changes. For the final gate, run `npx hyperframes check`; it reruns lint internally, so do not run a redundant standalone lint immediately before it. For sub-compositions, inspect midpoint snapshots. For multi-scene work, review the animation map.\n8. **Final approval.** Open the final Studio preview only after checks pass. Ask whether to render or revise. Render only after approval.\n\n## 6. Gates that always apply\n\n### Keep scope exact\n\nBuild what the user asked for. A title card is not a title card plus three scenes, music, and captions. Offer additions before adding them.\n\n### Establish design before HTML\n\nResolve the design source in this order: `frame.md` → `design.md` → `DESIGN.md`. Treat the first file found as brand truth.\n\nWhen no design spec exists, complete all four items before writing composition HTML:\n\n1. Ground the visual identity in `house-style.md` and `video-composition.md`.\n2. Write one sentence naming the concept angle for every non-trivial creation.\n3. Choose an embeddable font pairing from `/hyperframes-creative` → `references/typography.md`; do not assume an unbundled display font exists in cloud rendering.\n4. Define the focal element, edge anchors, supporting detail, and background treatment.\n\nMatch density to the requested format and message. Density examples are guidance for produced frames, not permission to invent claims, scenes, or a fixed number of elements.\n\nFor a named style or mood, read `/hyperframes-creative` → `references/visual-styles.md`. When the user needs to choose visually and no shipped preset fits, read `/hyperframes-creative` → `references/design-picker.md` and run the interactive design selection there.\n\n### Preserve the composition contract\n\nTimed elements use `class=\"clip\"`; the root and relevant ancestors are sized; each composition registers one paused, seek-safe timeline on `window.__timelines`; rendering is deterministic. Do not use render-time network fetches, clocks, or unseeded randomness.\n\n### Borrow workflows safely\n\nWhen the piece resembles a shipped workflow, borrow its genre references as examples. First run `npx hyperframes skills update \u003cworkflow-name>`. Borrow its story shape and taste, not its private scripts, pipeline state, or directory contract. The generic build remains owned by this skill.\n\n## 7. Done\n\nA run is complete only when:\n\n- requested scope is implemented;\n- for `flow: companion`, the treatment is delivered, not just the scope: every scene's cited blueprint or rules realized, the audio identity present (or the silence chosen and said), the open and close designed rather than defaulted;\n- `npx hyperframes check` passes, including its built-in lint stage;\n- design adherence is reviewed against `/hyperframes-creative` → `references/design-adherence.md` when a design spec exists;\n- contrast findings are resolved;\n- sub-composition snapshots are inspected when applicable;\n- an autonomous handoff includes an inspected contact or snapshot sheet; multi-scene sheets use scene midpoints;\n- the handoff names the final preview or rendered artifact as applicable and reports the actual duration for a time-based deliverable;\n- `hyperframes-animation/scripts/animation-map.mjs` is reviewed for multi-scene work;\n- the user approves the final Studio preview before render;\n- the rendered file is verified when a render was requested.\n\nAfter final approval, offer once to freeze the run as a recipe, following `../hyperframes-core/references/review-loop.md` § 4.\n"}, {"name": "goldfish", "description": "Search and reconstruct the user's past on-screen activity with Goldfish, their local personal memory of what they do on this computer (apps, documents, browser pages, chats, meetings), plus an entity wiki about the people and projects in their life and passive time tracking. Use whenever the user references something they personally did, saw, or read — \"what was I working on\", \"find that thing I read\", \"who is X\", \"how much time did I spend on Y\" — or when their real context would improve the answer, even when Goldfish is not mentioned by name.", "manual": false, "path": "~/.agents/skills/goldfish", "file_count": 0, "files": [], "body": "---\nname: goldfish\ndescription: Search and reconstruct the user's past on-screen activity with Goldfish, their local personal memory of what they do on this computer (apps, documents, browser pages, chats, meetings), plus an entity wiki about the people and projects in their life and passive time tracking. Use whenever the user references something they personally did, saw, or read — \"what was I working on\", \"find that thing I read\", \"who is X\", \"how much time did I spend on Y\" — or when their real context would improve the answer, even when Goldfish is not mentioned by name.\n---\n\n# Goldfish memory\n\nGoldfish runs on this machine and keeps a local, continuously updated archive of the user's activity: the text of apps, documents, browser pages, chats, and meetings, stored as deduplicated snapshots, plus LLM-written period summaries (chronicles), an entity wiki, and passive time tracking. Everything stays on this computer. Retrieval is fast and cheap, so err on the side of checking Goldfish before answering from assumption.\n\n## How to reach it\n\nPreferred: the `goldfish` MCP server (tools like `search_memory`, `get_snapshots`). If those tools are available, use them; their schemas are the authoritative reference for parameters, and this file only adds strategy.\n\nFallback, when the MCP tools are absent but you can run shell commands: the Goldfish daemon serves the same read-only data over local HTTP.\n\n- Base URL `http://127.0.0.1:3333` (3333 is the default port; it is configurable in Goldfish settings).\n- Auth: `Authorization: Bearer \u003ctoken>`, where the token is the contents of `~/.goldfish/api-token` (Windows: `%USERPROFILE%\\.goldfish\\api-token`). Read the token from the file each time; never write it into any config or output.\n- Liveness: `GET /health` needs no auth and returns `{\"status\":\"ok\"}` when ready.\n- Example:\n  `curl -s -H \"Authorization: Bearer $(cat ~/.goldfish/api-token)\" \"http://127.0.0.1:3333/search?q=quarterly+report&limit=20\"`\n- Endpoints (all GET, all read-only, JSON responses):\n  - `/search?q=\u003cterms>&limit=20` — full-text search over all history\n  - `/working-memory?limit=40` — last few hours, full window text, newest first\n  - `/recent-activity?minutes=30&limit=12` — just-now timeline, oldest first\n  - `/snapshots?ids=\u003cid1,id2>` — full verbatim content by snapshot id\n  - `/chronicle?level=\u003chour|day|week|month|year>&period=\u003ckey>` — period summaries\n  - `/wiki/search?q=\u003centity>` · `/wiki/page?slug=\u003cslug>` · `/wiki/list?limit=50&type=\u003cperson|project|topic|tool|org>` — the entity wiki\n  - `/time/report?period=\u003ctoday|yesterday|this_week|last_week|this_month|last_7_days|last_30_days>` (or `from`/`to` dates) · `/time/rules` — time tracking\n- If the daemon is unreachable, tell the user to open the Goldfish app; do not guess at what the memory would have said.\n\n## Choosing the right layer\n\n- What the user was JUST doing (last ~30 minutes): recent activity. Cheapest probe; start here when the user says \"this\", \"that thing\", or asks without naming a source.\n- The last few hours: working memory (full text included, no follow-up fetch needed).\n- Whole days, weeks, or months (\"what did I do last Tuesday\"): chronicle at the right level. Period formats: hour `YYYY-MM-DDTHH`, day `YYYY-MM-DD`, week `YYYY-Www`, month `YYYY-MM`, year `YYYY`.\n- A specific topic, keyword, person, URL, or file: search, then open the top snapshot ids.\n- People, projects, orgs (\"who is X\", \"what do I know about Y\"): wiki search, then the full wiki page; follow its links to related entities.\n- Time spent or billing questions: the time report. Frame results as tracked screen time, not a sworn timesheet.\n\n## How to interpret the data (important)\n\n- Snapshots are accessibility-tree text of the foreground window: the whole visible interface, not just the document. Content visible in a snapshot was not necessarily written or done at capture time; look for embedded timestamps or infer from surrounding activity.\n- Search results, excerpts, wiki pages, and chronicles are compressed indexes, NOT evidence. Search excerpts truncate after ~200 characters; message bodies, quotes, numbers, and names below the fold are usually missing. Before asserting exact wording, a number, a time, or the content of a message, open the snapshot ids — snapshots are the only source of full verbatim text.\n- Messaging apps (Slack, WhatsApp, Discord, Teams, iMessage, Gmail, Outlook) excerpt as sidebar and channel metadata; always open snapshots before answering anything about a conversation.\n- Snapshots carry a focused-element breadcrumb (`focused_name`, `focused_role`, `focused_path`) identifying the control the user was typing in. Read it to tell which thread, field, or message the user actually meant before inferring from raw content.\n- `captured_at` vs `last_seen_at`: re-sighted identical content updates `last_seen_at` in place. Recency of a sighting is not when the content was created.\n\n## Strategy\n\n1. Route by time or by entity using the layers above; when unsure, check recent activity first.\n2. Confirm leads: open the 1–3 most relevant snapshot ids before concluding anything. Opening snapshots is cheap; a wrong \"not found\" is not.\n3. If a first search misses, retry with different phrasing (synonyms, full names, channel names) before giving up, and narrow or widen the time window deliberately.\n\n## Guardrails\n\n- Ground every claim in retrieved content. If Goldfish does not contain the answer, say so plainly; never invent memories.\n- The data is the user's private activity. Quote only what is needed to answer, and never send it to external services the user did not ask for.\n- Hide technical details (snapshot ids, endpoints, tokens) from the user unless asked.\n"}, {"name": "gpt-taste", "description": "Elite UX/UI & Advanced GSAP Motion Engineer. Enforces Python-driven true randomization for layout variance, strict AIDA page structure, wide editorial typography (bans 6-line wraps), gapless bento grids, strict GSAP ScrollTriggers (pinning, stacking, scrubbing), inline micro-images, and massive section spacing.", "manual": false, "path": "~/.agents/skills/gpt-taste", "file_count": 0, "files": [], "body": "---\nname: gpt-taste\ndescription: Elite UX/UI & Advanced GSAP Motion Engineer. Enforces Python-driven true randomization for layout variance, strict AIDA page structure, wide editorial typography (bans 6-line wraps), gapless bento grids, strict GSAP ScrollTriggers (pinning, stacking, scrubbing), inline micro-images, and massive section spacing.\n---\n\n# CORE DIRECTIVE: AWWWARDS-LEVEL DESIGN ENGINEERING\nYou are an elite, award-winning frontend design engineer. Standard LLMs possess severe statistical biases: they generate massive 6-line wrapped headings by using narrow containers, leave ugly empty gaps in bento grids, use cheap meta-labels (\"QUESTION 05\", \"SECTION 01\"), output invisible button text, and endlessly repeat the same Left/Right layouts. \n\nYour goal is to aggressively break these defaults. Your outputs must be highly creative, perfectly spaced, motion-rich (GSAP), mathematically flawless in grid execution, and heavily rely on varied, high-end assets.\n\nDO NOT USE EMOJIS IN YOUR CODE, COMMENTS, OR OUTPUT. Maintain strictly professional formatting.\n\n## 1. PYTHON-DRIVEN TRUE RANDOMIZATION (BREAKING THE LOOP)\nLLMs are inherently lazy and always pick the first layout option. To prevent this, you MUST simulate a Python script execution in your `\u003cdesign_plan>` before writing any UI code. \nUse a deterministic seed (e.g., character count of the user prompt modulo math) to simulate `random.choice()` and strictly select:\n- 1 Hero Architecture (from Section 3)\n- 1 Typography Stack (Satoshi, Cabinet Grotesk, Outfit, or Geist. NEVER Inter)\n- 3 Unique Component Architectures (from Section 6)\n- 2 Advanced GSAP Paradigms (from Section 5)\nYou are forbidden from defaulting to the same UI twice. You must follow the exact output of your simulated Python randomization.\n\n## 2. AIDA STRUCTURE & SPACING\nEvery page MUST begin with a highly creative, premium Navigation Bar (e.g., floating glass pill, or minimal split nav).\nThe rest of the page MUST follow the AIDA framework:\n- **Attention (Hero):** Cinematic, clean, wide layout.\n- **Interest (Features/Bento):** High-density, mathematically perfect grid or interactive typographic components.\n- **Desire (GSAP Scroll/Media):** Pinned sections, horizontal scroll, or text-reveals.\n- **Action (Footer/Pricing):** Massive, high-contrast CTA and clean footer links.\n**SPACING RULE:** Add huge vertical padding between all major sections (e.g., `py-32 md:py-48`). Sections must feel like distinct, cinematic chapters. Do not cramp elements together.\n\n## 3. HERO ARCHITECTURE & THE 2-LINE IRON RULE\nThe Hero must breathe. It must NOT be a narrow, 6-line text wall.\n- **The Container Width Fix:** You MUST use ultra-wide containers for the H1 (e.g., `max-w-5xl`, `max-w-6xl`, `w-full`). Allow the words to flow horizontally.\n- **The Line Limit:** The H1 MUST NEVER exceed 2 to 3 lines. 4, 5, or 6 lines is a catastrophic failure. Make the font size smaller (`clamp(3rem, 5vw, 5.5rem)`) and the container wider to ensure this.\n- **Hero Layout Options (Randomly Assigned via Python):**\n  1. *Cinematic Center (Highly Preferred):* Text perfectly centered, massive width. Below the text, exactly two high-contrast CTAs. Below the CTAs or behind everything, a stunning, full-bleed background image with a dark radial wash.\n  2. *Artistic Asymmetry:* Text offset to the left, with an artistic floating image overlapping the text from the bottom right.\n  3. *Editorial Split:* Text left, image right, but with massive negative space.\n- **Button Contrast:** Buttons must be perfectly legible. Dark background = white text. Light background = dark text. Invisible text is a failure.\n- **BANNED IN HERO:** Do NOT use arbitrary floating stamp/badge icons on the text. Do NOT use pill-tags under the hero. Do NOT place raw data/stats in the hero.\n\n## 4. THE GAPLESS BENTO GRID\n- **Zero Empty Space in Grids:** LLMs notoriously leave blank, dead cells in CSS grids. You MUST use Tailwind's `grid-flow-dense` (`grid-auto-flow: dense`) on every Bento Grid. You must mathematically verify that your `col-span` and `row-span` values interlock perfectly. No grid shall have a missing corner or empty void.\n- **Card Restraint:** Do not use too many cards. 3 to 5 highly intentional, beautifully styled cards are better than 8 messy ones. Fill them with a mix of large imagery, dense typography, or CSS effects.\n\n## 5. ADVANCED GSAP MOTION & HOVER PHYSICS\nStatic interfaces are strictly forbidden. You must write real GSAP (`@gsap/react`, `ScrollTrigger`).\n- **Hover Physics:** Every clickable card and image must react. Use `group-hover:scale-105 transition-transform duration-700 ease-out` inside `overflow-hidden` containers.\n- **Scroll Pinning (GSAP Split):** Pin a section title on the left (`ScrollTrigger pin: true`) while a gallery of elements scrolls upwards on the right side.\n- **Image Scale & Fade Scroll:** Images must start small (`scale: 0.8`). As they scroll into view, they grow to `scale: 1.0`. As they scroll out of view, they smoothly darken and fade out (`opacity: 0.2`).\n- **Scrubbing Text Reveals:** Opacity of central paragraph words starts at 0.1 and scrubs to 1.0 sequentially as the user scrolls.\n- **Card Stacking:** Cards overlap and stack on top of each other dynamically from the bottom as the user scrolls down.\n\n## 6. COMPONENT ARSENAL & CREATIVITY\nSelect components from this arsenal based on your randomization:\n- **Inline Typography Images:** Embed small, pill-shaped images directly INSIDE massive headings. Example: `I shape \u003cspan className=\"inline-block w-24 h-10 rounded-full align-middle bg-cover bg-center mx-2\" style={{backgroundImage: 'url(...)'}}>\u003c/span> digital spaces.`\n- **Horizontal Accordions:** Vertical slices that expand horizontally on hover to reveal content and imagery.\n- **Infinite Marquee (Trusted Partners):** Smooth, continuously scrolling rows of authentic `@phosphor-icons/react` or large typography.\n- **Feedback/Testimonial Carousel:** Clean, overlapping portrait images next to minimalist typography quotes, controlled by subtle arrows.\n\n## 7. CONTENT, ASSETS & STRICT BANS\n- **The Meta-Label Ban:** BANNED FOREVER are labels like \"SECTION 01\", \"SECTION 04\", \"QUESTION 05\", \"ABOUT US\". Remove them entirely. They look cheap and unprofessional.\n- **Image Context & Style:** Use `https://picsum.photos/seed/{keyword}/1920/1080` and match the keyword to the vibe. Apply sophisticated CSS filters (`grayscale`, `mix-blend-luminosity`, `opacity-90`, `contrast-125`) so they do not look like boring stock photos.\n- **Creative Backgrounds:** Inject subtle, professional ambient design. Use deep radial blurs, grainy mesh gradients, or shifting dark overlays. Avoid flat, boring colors.\n- **Horizontal Scroll Bug:** Wrap the entire page in `\u003cmain className=\"overflow-x-hidden w-full max-w-full\">` to absolutely prevent horizontal scrollbars caused by off-screen animations.\n\n## 8. MANDATORY PRE-FLIGHT \u003cdesign_plan>\nBefore writing ANY React/UI code, you MUST output a `\u003cdesign_plan>` block containing:\n1. **Python RNG Execution:** Write a 3-line mock Python output showing the deterministic selection of your Hero Layout, Component Arsenal, GSAP animations, and Fonts based on the prompt's character count.\n2. **AIDA Check:** Confirm the page contains Navigation, Attention (Hero), Interest (Bento), Desire (GSAP), Action (Footer).\n3. **Hero Math Verification:** Explicitly state the `max-w` class you are applying to the H1 to GUARANTEE it will flow horizontally in 2-3 lines. Confirm NO stamp icons or spam tags exist.\n4. **Bento Density Verification:** Prove mathematically that your grid columns and rows leave zero empty spaces and `grid-flow-dense` is applied.\n5. **Label Sweep & Button Check:** Confirm no cheap meta-labels (\"QUESTION 05\") exist, and button text contrast is perfect.\nOnly output the UI code after this rigorous verification is complete.\n"}, {"name": "grill-me", "description": "A relentless interview to sharpen a plan or design.", "manual": true, "path": "~/.agents/skills/grill-me", "file_count": 1, "files": ["agents/openai.yaml"], "body": "---\nname: grill-me\ndescription: A relentless interview to sharpen a plan or design.\ndisable-model-invocation: true\n---\n\nRun a `/grilling` session.\n"}, {"name": "high-end-visual-design", "description": "Teaches the AI to design like a high-end agency. Defines the exact fonts, spacing, shadows, card structures, and animations that make a website feel expensive. Blocks all the common defaults that make AI designs look cheap or generic.", "manual": false, "path": "~/.agents/skills/high-end-visual-design", "file_count": 0, "files": [], "body": "---\nname: high-end-visual-design\ndescription: Teaches the AI to design like a high-end agency. Defines the exact fonts, spacing, shadows, card structures, and animations that make a website feel expensive. Blocks all the common defaults that make AI designs look cheap or generic.\n---\n\n# Agent Skill: Principal UI/UX Architect & Motion Choreographer (Awwwards-Tier)\n\n## 1. Meta Information & Core Directive\n- **Persona:** `Vanguard_UI_Architect`\n- **Objective:** You engineer $150k+ agency-level digital experiences, not just websites. Your output must exude haptic depth, cinematic spatial rhythm, obsessive micro-interactions, and flawless fluid motion. \n- **The Variance Mandate:** NEVER generate the exact same layout or aesthetic twice in a row. You must dynamically combine different premium layout archetypes and texture profiles while strictly adhering to the elite \"Apple-esque / Linear-tier\" design language.\n\n## 2. THE \"ABSOLUTE ZERO\" DIRECTIVE (STRICT ANTI-PATTERNS)\nIf your generated code includes ANY of the following, the design instantly fails:\n- **Banned Fonts:** Inter, Roboto, Arial, Open Sans, Helvetica. (Assume premium fonts like `Geist`, `Clash Display`, `PP Editorial New`, or `Plus Jakarta Sans` are available).\n- **Banned Icons:** Standard thick-stroked Lucide, FontAwesome, or Material Icons. Use only ultra-light, precise lines (e.g., Phosphor Light, Remix Line).\n- **Banned Borders & Shadows:** Generic 1px solid gray borders. Harsh, dark drop shadows (`shadow-md`, `rgba(0,0,0,0.3)`). \n- **Banned Layouts:** Edge-to-edge sticky navbars glued to the top. Symmetrical, boring 3-column Bootstrap-style grids without massive whitespace gaps.\n- **Banned Motion:** Standard `linear` or `ease-in-out` transitions. Instant state changes without interpolation.\n\n## 3. THE CREATIVE VARIANCE ENGINE\nBefore writing code, silently \"roll the dice\" and select ONE combination from the following archetypes based on the prompt's context to ensure the output is uniquely tailored but always premium:\n\n### A. Vibe & Texture Archetypes (Pick 1)\n1. **Ethereal Glass (SaaS / AI / Tech):** Deepest OLED black (`#050505`), radial mesh gradients (e.g., subtle glowing purple/emerald orbs) in the background. Vantablack cards with heavy `backdrop-blur-2xl` and pure white/10 hairlines. Wide geometric Grotesk typography.\n2. **Editorial Luxury (Lifestyle / Real Estate / Agency):** Warm creams (`#FDFBF7`), muted sage, or deep espresso tones. High-contrast Variable Serif fonts for massive headings. Subtle CSS noise/film-grain overlay (`opacity-[0.03]`) for a physical paper feel.\n3. **Soft Structuralism (Consumer / Health / Portfolio):** Silver-grey or completely white backgrounds. Massive bold Grotesk typography. Airy, floating components with unbelievably soft, highly diffused ambient shadows.\n\n### B. Layout Archetypes (Pick 1)\n1. **The Asymmetrical Bento:** A masonry-like CSS Grid of varying card sizes (e.g., `col-span-8 row-span-2` next to stacked `col-span-4` cards) to break visual monotony.\n   - **Mobile Collapse:** Falls back to a single-column stack (`grid-cols-1`) with generous vertical gaps (`gap-6`). All `col-span` overrides reset to `col-span-1`.\n2. **The Z-Axis Cascade:** Elements are stacked like physical cards, slightly overlapping each other with varying depths of field, some with a subtle `-2deg` or `3deg` rotation to break the digital grid.\n   - **Mobile Collapse:** Remove all rotations and negative-margin overlaps below `768px`. Stack vertically with standard spacing. Overlapping elements cause touch-target conflicts on mobile.\n3. **The Editorial Split:** Massive typography on the left half (`w-1/2`), with interactive, scrollable horizontal image pills or staggered interactive cards on the right.\n   - **Mobile Collapse:** Converts to a full-width vertical stack (`w-full`). Typography block sits on top, interactive content flows below with horizontal scroll preserved if needed.\n\n**Mobile Override (Universal):** Any asymmetric layout above `md:` MUST aggressively fall back to `w-full`, `px-4`, `py-8` on viewports below `768px`. Never use `h-screen` for full-height sections — always use `min-h-[100dvh]` to prevent iOS Safari viewport jumping.\n\n## 4. HAPTIC MICRO-AESTHETICS (COMPONENT MASTERY)\n\n### A. The \"Double-Bezel\" (Doppelrand / Nested Architecture)\nNever place a premium card, image, or container flatly on the background. They must look like physical, machined hardware (like a glass plate sitting in an aluminum tray) using nested enclosures.\n- **Outer Shell:** A wrapper `div` with a subtle background (`bg-black/5` or `bg-white/5`), a hairline outer border (`ring-1 ring-black/5` or `border border-white/10`), a specific padding (e.g., `p-1.5` or `p-2`), and a large outer radius (`rounded-[2rem]`).\n- **Inner Core:** The actual content container inside the shell. It has its own distinct background color, its own inner highlight (`shadow-[inset_0_1px_1px_rgba(255,255,255,0.15)]`), and a mathematically calculated smaller radius (e.g., `rounded-[calc(2rem-0.375rem)]`) for concentric curves.\n\n### B. Nested CTA & \"Island\" Button Architecture\n- **Structure:** Primary interactive buttons must be fully rounded pills (`rounded-full`) with generous padding (`px-6 py-3`). \n- **The \"Button-in-Button\" Trailing Icon:** If a button has an arrow (`↗`), it NEVER sits naked next to the text. It must be nested inside its own distinct circular wrapper (e.g., `w-8 h-8 rounded-full bg-black/5 dark:bg-white/10 flex items-center justify-center`) placed completely flush with the main button's right inner padding.\n\n### C. Spatial Rhythm & Tension\n- **Macro-Whitespace:** Double your standard padding. Use `py-24` to `py-40` for sections. Allow the design to breathe heavily.\n- **Eyebrow Tags:** Precede major H1/H2s with a microscopic, pill-shaped badge (`rounded-full px-3 py-1 text-[10px] uppercase tracking-[0.2em] font-medium`).\n\n## 5. MOTION CHOREOGRAPHY (FLUID DYNAMICS)\nNever use default transitions. All motion must simulate real-world mass and spring physics. Use custom cubic-beziers (e.g., `transition-all duration-700 ease-[cubic-bezier(0.32,0.72,0,1)]`).\n\n### A. The \"Fluid Island\" Nav & Hamburger Reveal\n- **Closed State:** The Navbar is a floating glass pill detached from the top (`mt-6`, `mx-auto`, `w-max`, `rounded-full`).\n- **The Hamburger Morph:** On click, the 2 or 3 lines of the hamburger icon must fluidly rotate and translate to form a perfect 'X' (`rotate-45` and `-rotate-45` with absolute positioning), not just disappear.\n- **The Modal Expansion:** The menu should open as a massive, screen-filling overlay with a heavy glass effect (`backdrop-blur-3xl bg-black/80` or `bg-white/80`). \n- **Staggered Mask Reveal:** The navigation links inside the expanded state do not just appear. They fade in and slide up from an invisible box (`translate-y-12 opacity-0` to `translate-y-0 opacity-100`) with a staggered delay (`delay-100`, `delay-150`, `delay-200` for each item).\n\n### B. Magnetic Button Hover Physics\n- Use the `group` utility. On hover, do not just change the background color.\n- Scale the entire button down slightly (`active:scale-[0.98]`) to simulate physical pressing.\n- The nested inner icon circle should translate diagonally (`group-hover:translate-x-1 group-hover:-translate-y-[1px]`) and scale up slightly (`scale-105`), creating internal kinetic tension.\n\n### C. Scroll Interpolation (Entry Animations)\n- Elements never appear statically on load. As they enter the viewport, they must execute a gentle, heavy fade-up (`translate-y-16 blur-md opacity-0` resolving to `translate-y-0 blur-0 opacity-100` over 800ms+).\n- For JavaScript-driven scroll reveals, use `IntersectionObserver` or Framer Motion's `whileInView`. Never use `window.addEventListener('scroll')` — it causes continuous reflows and kills mobile performance.\n\n## 6. PERFORMANCE GUARDRAILS\n- **GPU-Safe Animation:** Never animate `top`, `left`, `width`, or `height`. Animate exclusively via `transform` and `opacity`. Use `will-change: transform` sparingly and only on elements that are actively animating.\n- **Blur Constraints:** Apply `backdrop-blur` only to fixed or sticky elements (navbars, overlays). Never apply blur filters to scrolling containers or large content areas — this causes continuous GPU repaints and severe mobile frame drops.\n- **Grain/Noise Overlays:** Apply noise textures exclusively to fixed, `pointer-events-none` pseudo-elements (`position: fixed; inset: 0; z-index: 50`). Never attach them to scrolling containers.\n- **Z-Index Discipline:** Do not use arbitrary `z-50` or `z-[9999]`. Reserve z-indexes strictly for systemic layers: sticky nav, modals, overlays, tooltips.\n\n## 7. EXECUTION PROTOCOL\nWhen generating UI code, follow this exact sequence:\n1. **[SILENT THOUGHT]** Roll the Variance Engine (Section 3). Choose your Vibe and Layout Archetypes based on the prompt's context to ensure a unique output.\n2. **[SCAFFOLD]** Establish the background texture, macro-whitespace scale, and massive typography sizes.\n3. **[ARCHITECT]** Build the DOM strictly using the \"Double-Bezel\" (Doppelrand) technique for all major cards, inputs, and feature grids. Use exaggerated squircle radii (`rounded-[2rem]`).\n4. **[CHOREOGRAPH]** Inject the custom `cubic-bezier` transitions, the staggered navigation reveals, and the button-in-button hover physics.\n5. **[OUTPUT]** Deliver flawless, pixel-perfect React/Tailwind/HTML code. Do not include basic, generic fallbacks.\n\n## 8. PRE-OUTPUT CHECKLIST\nEvaluate your code against this matrix before delivering. This is the last filter.\n- [ ] No banned fonts, icons, borders, shadows, layouts, or motion patterns from Section 2 are present\n- [ ] A Vibe Archetype and Layout Archetype from Section 3 were consciously selected and applied\n- [ ] All major cards and containers use the Double-Bezel nested architecture (outer shell + inner core)\n- [ ] CTA buttons use the Button-in-Button trailing icon pattern where applicable\n- [ ] Section padding is at minimum `py-24` — the layout breathes heavily\n- [ ] All transitions use custom cubic-bezier curves — no `linear` or `ease-in-out`\n- [ ] Scroll entry animations are present — no element appears statically\n- [ ] Layout collapses gracefully below `768px` to single-column with `w-full` and `px-4`\n- [ ] All animations use only `transform` and `opacity` — no layout-triggering properties\n- [ ] `backdrop-blur` is only applied to fixed/sticky elements, never to scrolling content\n- [ ] The overall impression reads as \"$150k agency build\", not \"template with nice fonts\"\n"}, {"name": "human-review", "description": "Open an HTML file, Markdown file, or localhost page in the browser so the user can edit text directly and leave comments on specific parts, then send all edits and comments back to you. Use after writing or updating something the user will read — specs, plans, reports, newsletter drafts, landing pages, slide decks, and locally running web pages.", "manual": false, "path": "~/.agents/skills/human-review", "file_count": 0, "files": [], "body": "---\nname: human-review\ndescription: Open an HTML file, Markdown file, or localhost page in the browser so the user can edit text directly and leave comments on specific parts, then send all edits and comments back to you. Use after writing or updating something the user will read — specs, plans, reports, newsletter drafts, landing pages, slide decks, and locally running web pages.\n---\n\n# human-review\n\nThe user reviews your HTML, Markdown, or localhost page in a real browser: they fix small things\nby typing, select anything to comment on it, and send you the whole batch at once.\n\nMarkdown files open rendered. Their quotes and edits reference the rendered text,\nand the file itself is never touched — apply every change to the Markdown source,\nkeeping its formatting syntax.\n\n## The loop\n\n1. Write or update the HTML or Markdown file, or start the local page being reviewed.\n2. Open it for the user:\n\n   ```sh\n   npx -y human-review path/to/file.html\n   ```\n\n   For a page served by a local development server, open the real route instead\n   of recreating it as a separate HTML file:\n\n   ```sh\n   npx -y human-review http://localhost:3000/wiki\n   ```\n\n3. Wait for feedback. This command blocks until the user hits Send in the\n   browser, then prints their batch and exits:\n\n   ```sh\n   npx -y human-review poll path/to/file.html\n   ```\n\n   The command exits only when the user clicks Send or closes the review.\n   There is nothing to re-run, no interval to poll on, and no `--timeout` to\n   add. It survives the local server restarting, and feedback is saved even\n   if the poll dies, so nothing is ever lost. How you wait depends on your\n   harness:\n\n   - **Claude Code:** run it with `run_in_background: true` and end your turn.\n     Claude Code wakes you with the output the moment the command exits.\n   - **Codex, Cursor, and everything else:** run it in the **foreground**,\n     inside your active turn, and stay on it until it prints `feedback` or\n     `closed`. Do not detach it or start it as a background session: nothing\n     wakes you when a detached command finishes. While the review is active:\n     - If the user sends a message, answer it as commentary and immediately\n       resume the foreground poll in the same turn. Do not send a final\n       response until the poll returns `feedback` or `closed` — a final\n       response ends the turn and kills the wait.\n     - If your shell tool caps command duration, pass `--timeout` a little\n       under the cap and run bounded polls back to back in the same active\n       turn until one returns `feedback` or `closed`.\n\n     Know the limit: this is reliable only while your turn stays active. A\n     turn that has already ended is not woken when the user hits Send; the\n     user has to message you, and you then run `status` and `poll` to pick\n     the batch up. There is no integration that resumes an ended task when\n     the poll exits.\n\n   If it prints `{\"status\":\"closed\"}`, the review is over: the user ended it,\n   closed the tab, or never had one open (`reason` says which). Stop and do\n   not start another poll. `unsent` counts feedback they left behind; if it is\n   not zero, tell the user in one line that it is kept and they can restore or\n   discard it next time. `{\"status\":\"superseded\"}` means a newer poll of\n   yours owns the wait — stop this one silently. `{\"status\":\"timeout\"}` only\n   appears after 12 hours; run `status` and start the wait again if the\n   review is still open.\n\n4. Apply what comes back, then start the next background poll. `--ack` clears\n   the batch you just handled:\n\n   ```sh\n   npx -y human-review poll path/to/file.html --ack\n   ```\n\nRepeat 3–4 until the user says they are done.\n\nNot sure whether feedback is already waiting — say, at the start of a new turn\nwith no poll running? This answers instantly without blocking:\n\n```sh\nnpx -y human-review status path/to/file.html\n```\n\nIt prints `{\"status\": \"feedback-waiting\"}` when a batch is ready for a poll,\nplus counts of unsent comments and edits still in the browser.\n\n## What you get\n\nOne batch covers every page the user visited, grouped by file or localhost URL.\n\n```json\n{\n  \"status\": \"feedback\",\n  \"pages\": [\n    {\n      \"file\": \"/abs/path/to/page.html\",\n      \"edits_saved\": true,\n      \"comments\": [\n        { \"id\": \"c_1\", \"kind\": \"selection\", \"quote\": \"the exact text they selected\",\n          \"anchor\": { \"prefix\": \"...\", \"quote\": \"...\", \"suffix\": \"...\" },\n          \"feedback\": \"what they want changed\" }\n      ],\n      \"edits\": [\n        { \"label\": \"Problem body\", \"kind\": \"edited\",\n          \"before\": \"the original wording\",\n          \"after\": \"their exact new wording\",\n          \"after_html\": \"their exact new wording with \u003cstrong>formatting\u003c/strong>\" }\n      ]\n    }\n  ],\n  \"overall_note\": \"feedback not tied to any one page\"\n}\n```\n\n## Rules\n\n- **`edits` are changes the user already made.** `after` is their exact wording —\n  carry it across verbatim and never revert it. If the HTML was generated from\n  something else (MDX, Markdown, a template), apply `after` to the **source** too,\n  or their fix disappears on the next build.\n- **`edits_saved: true` means those edits are already in the file on disk.**\n  Plain HTML files autosave as the user types, so your copy of the file is\n  stale. Re-read the file before touching it and make targeted changes only;\n  never regenerate it from what you wrote earlier, or their work disappears.\n  `edits_saved: false` (Markdown, localhost pages, self-rendering HTML) means the\n  edits exist only in this batch — apply them to the source yourself.\n- An edit with `kind: \"deleted\"` means the user removed that whole block:\n  delete it from the source too, without asking why.\n- An edit marked `truncated: true` had its text cut at 200k characters; read\n  the block from the page itself rather than from `after_html`.\n- When `before_html`/`after_html` are present, the user changed formatting, not\n  just words — bold, italic, underline, links. Use the HTML version to carry the\n  formatting into the source, translated to its syntax (e.g. `\u003cstrong>` → `**`\n  in Markdown/MDX).\n- A page with `kind: \"url\"` was edited directly in the review UI. Its `file`\n  and `url` fields name the localhost route, not a writable file. Find the\n  matching project source (such as MDX, TSX, or a template), apply every edit\n  and deletion there, then acknowledge so the route reloads. Never write the\n  rendered HTTP response back into the app.\n- When an edit's `after_html` contains `\u003cimg src=\"assets/...\">`, the user pasted\n  an image: the file already exists in an `assets/` folder next to the reviewed\n  file. Keep that relative path — in Markdown, reference it as\n  `![](assets/...)`. Never regenerate or inline the image.\n- On a localhost page, a pasted image arrives under `staged_assets`. Copy its\n  local `path` into the app's appropriate asset folder, replace the temporary\n  preview URL in `after_html`, and preserve the image at the user's insertion\n  point. Never leave the temporary preview URL in source.\n- An edit with `kind: \"moved\"` means the user relocated that whole block.\n  Reposition it in the source without rewriting its content: it now sits right\n  after the block whose text starts with `moved_after`, and right before the\n  block whose text starts with `moved_before` (both are clipped to 90\n  characters and may end in `…`). An empty `moved_after` means it is now the\n  first block in its container.\n- Find each comment by its `quote`. It is the **rendered** text the user\n  selected, so in Markdown or templated HTML it may span formatting syntax or\n  tags; `anchor.prefix` and `anchor.suffix` give the surrounding text to\n  disambiguate.\n- `kind: \"element\"` points at a whole block, so `quote` is its label, not body text.\n- Copy any `staged_assets` files before you ack: `--ack` deletes them.\n- A batch with only an `overall_note` has an empty `pages` array.\n- Fix every page in `pages`, not just the first.\n- **Do not write a reply.** There is no chat. The user sees your work when the page\n  reloads, which happens on its own the moment you save the file.\n\n## Better edit labels (optional)\n\nName the sections you author and the user's edit list uses your names instead of\nguessing from the DOM:\n\n```html\n\u003cp data-block=\"Problem body\">…\u003c/p>\n\u003cdiv data-container=\"Metrics callout\">…\u003c/div>\n```\n\n`data-block` names a region for the edit list. `data-container` also makes the block\nclickable as a comment target.\n"}, {"name": "hyperframes", "description": "Mandatory entry point: read this first for any request to make, create, edit, animate, or render a video, animation, or motion graphic, including a promo, explainer, captioned clip, title card, overlay, slideshow or interactive deck, Remotion port, or any HyperFrames HTML composition. Also use it to inspect, diagnose, validate, preview, publish, or batch-render an existing HyperFrames project. Inputs may be a website URL, GitHub PR, Figma design or URL, text or brief, existing footage, or music. It resumes project state, captures intent when applicable, selects and installs the owning workflow, and routes domain capabilities. HyperFrames is the default output framework unless the user explicitly chooses another framework for the deliverable or asks only to record a browser session.", "manual": false, "path": "~/.agents/skills/hyperframes", "file_count": 16, "files": ["references/capability-menu.md", "references/intent-interview.md", "references/pitch-round.md", "references/route-briefs.md", "references/routes/embedded-captions.md", "references/routes/faceless-explainer.md", "references/routes/general-video.md", "references/routes/motion-graphics.md", "references/routes/music-to-video.md", "references/routes/pr-to-video.md", "references/routes/product-launch-video.md", "references/routes/remotion-to-hyperframes.md", "references/routes/slideshow.md", "references/routes/talking-head-recut.md", "references/skill-lifecycle.md", "references/workflow-catalog.md"], "body": "---\nname: hyperframes\ndescription: >\n  Mandatory entry point: read this first for any request to make, create, edit, animate, or render a\n  video, animation, or motion graphic, including a promo, explainer, captioned clip, title card,\n  overlay, slideshow or interactive deck, Remotion port, or any HyperFrames HTML composition. Also\n  use it to inspect, diagnose, validate, preview, publish, or batch-render an existing HyperFrames\n  project. Inputs may be a website URL, GitHub PR, Figma design or URL, text or brief, existing\n  footage, or music. It resumes project state, captures intent when applicable, selects and installs\n  the owning workflow, and routes domain capabilities. HyperFrames is the default output framework\n  unless the user explicitly chooses another framework for the deliverable or asks only to record a\n  browser session.\n---\n\n# HyperFrames entry point\n\nHyperFrames **renders video from HTML** — a composition is an HTML file whose DOM declares timing with `data-*` attributes, whose animation runtime is seekable, and whose media playback is owned by the framework. The full authoring contract lives in `/hyperframes-core`; read it before writing composition HTML.\n\n#
