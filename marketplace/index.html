<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My skills</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #fafaf9; --fg: #1c1917; --muted: #6b645d; --card: #ffffff; --line: #e7e5e4;
  --accent: #2f5d50; --accent-soft: #e6efec; --mark: #fde68a; --ring: #2f5d50;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141413; --fg: #ecebe8; --muted: #a09a92; --card: #1c1b1a; --line: #2e2c2a;
    --accent: #7fc4ae; --accent-soft: #20302b; --mark: #5c4b0e; --ring: #7fc4ae;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
button { font: inherit; color: inherit; }

header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 16px; }
h1 { font-size: 18px; margin: 0; font-weight: 650; }
.meta { color: var(--muted); font-size: 13px; flex: 1; min-width: 0; }
.search-btn { display: flex; align-items: center; gap: 10px; width: 280px; max-width: 45vw; padding: 8px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; color: var(--muted); cursor: pointer; text-align: left; }
.search-btn:hover { border-color: var(--muted); }
.search-btn span:first-child { flex: 1; }
kbd { font: 12px var(--mono); padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--muted); }

main { max-width: 1200px; margin: 0 auto; padding: 24px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.card { display: flex; flex-direction: column; gap: 8px; text-align: left; padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; min-height: 150px; }
.card:hover { border-color: var(--accent); }
.card .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.name { font: 600 14px var(--mono); overflow-wrap: anywhere; }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.card .desc { color: var(--muted); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
.card .foot { font-size: 12px; color: var(--muted); }

dialog { border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 0; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(0,0,0,.45); }

#palette { width: min(680px, 94vw); margin: 10vh auto auto; max-height: 76vh; }
#palette[open] { display: flex; flex-direction: column; }
#q { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--fg); font: 17px inherit; padding: 16px 18px; outline: none; }
#q:focus-visible { outline: none; box-shadow: inset 0 -2px 0 var(--ring); }
#results { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; }
#results li { padding: 9px 12px; border-radius: 8px; cursor: pointer; }
#results li[aria-selected="true"] { background: var(--accent-soft); }
#results .r-top { display: flex; gap: 8px; align-items: baseline; }
#results .r-desc, #results .r-snip { font-size: 13px; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#results .r-snip { font-family: var(--mono); font-size: 12px; opacity: .9; }
.empty { padding: 28px 18px; color: var(--muted); text-align: center; }
.hint { display: flex; gap: 16px; padding: 8px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }

#sheet { width: min(860px, 96vw); height: min(88vh, 900px); margin: auto; }
#sheet[open] { display: flex; flex-direction: column; }
.sheet-head { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.sheet-title { display: flex; align-items: center; gap: 10px; }
.sheet-title .name { font-size: 18px; flex: 1; }
.sheet-desc { color: var(--muted); font-size: 14px; margin: 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { padding: 5px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.path { font: 12px var(--mono); color: var(--muted); }

#sheet { --text: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; font-family: var(--text); }
#sheet .name, #sheet .path, #sheet code, #sheet pre { font-family: var(--mono); }
.sheet-body { overflow: auto; flex: 1; padding: 20px 28px 32px; }
.files { margin: 0 0 18px; font-size: 13px; color: var(--muted); line-height: 1.7; }
.files code { font-size: 12px; }
.md { font-size: 16px; line-height: 1.65; max-width: 72ch; overflow-wrap: break-word; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { line-height: 1.25; margin: 1.5em 0 .5em; font-weight: 600; }
.md h1 { font-size: 1.55em; } .md h2 { font-size: 1.28em; } .md h3 { font-size: 1.1em; } .md h4, .md h5, .md h6 { font-size: 1em; }
.md > :first-child { margin-top: 0; }
.md p, .md ul, .md ol, .md pre, .md blockquote, .md table { margin: 0 0 .9em; }
.md ul, .md ol { padding-left: 1.5em; }
.md li { margin: .25em 0; }
.md li > p { margin: 0 0 .4em; }
.md li > ul, .md li > ol { margin: .25em 0 .25em; }
.md code { font-size: .84em; background: var(--accent-soft); padding: .1em .38em; border-radius: 4px; overflow-wrap: break-word; }
.md pre.code { padding: 12px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; overflow: auto; font-size: 13px; line-height: 1.5; }
.md pre.code code { background: none; padding: 0; font-size: inherit; overflow-wrap: normal; }
.md blockquote { border-left: 3px solid var(--line); padding-left: 14px; color: var(--muted); }
.md blockquote > :last-child { margin-bottom: 0; }
.md table { border-collapse: collapse; display: block; overflow-x: auto; font-size: .94em; }
.md th, .md td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
.md th { background: var(--bg); font-weight: 600; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 1.6em 0; }
.md a { color: var(--accent); }
.md .ref { text-decoration: underline dotted; text-underline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 560px) { .meta { display: none; } .search-btn { max-width: none; width: 100%; } }
</style>

<script type="application/json" id="data">{"generated": "2026-11-03 11:51", "source": "~/.agents/skills", "count": 69, "skills": [{"name": "active-plan", "description": "Load the active project, reconcile with reality, pick next task and execute. Creates the project on first use.", "manual": false, "path": "~/.agents/skills/active-plan", "file_count": 0, "files": [], "body": "---\nname: active-plan\ndescription: Load the active project, reconcile with reality, pick next task and execute. Creates the project on first use.\nallowed_tools: [\"Read\", \"Bash\", \"Write\", \"Edit\"]\n---\n\n## Step 0 — Check for a queued-task inbox (if this project has one)\n\nSome projects have an automation that drops auto-generated task prompts into an inbox folder. Check for it:\n```bash\nls 00-Inbox/agent-queue/*.md 2>/dev/null\n```\n\n**If `00-Inbox/agent-queue/` doesn't exist, skip this step entirely** — it's specific to projects that have wired up that automation.\n\n**If queued files exist:** read each one and tell the user what's waiting. For each, offer:\n- (a) Spin it up as a new project via the Step 1 creation flow below, or\n- (b) Run it as a one-off task in the current session, no new project needed\n\n**On completion of a queued item** (either path): flip its frontmatter `status: queued` → `status: done` — don't delete the file.\n\n## Step 1 — Find or create the active plan\n\nDetect which mode this repo is in:\n\n**PARA-vault mode** — if `02-Projects/` exists at the repo root:\n```bash\n./09-agents/tasks-db/tasks-db run tasks overview   # if that script exists\nls 02-Projects/ 2>/dev/null\n```\nUse the vault's per-project convention: each project is `02-Projects/\u003cname>/ACTIVE_PLAN.md`.\n\n**Generic mode** — otherwise, look for a single plan file at the repo root, first match wins: `ACTIVE_PLAN.md`, `PLAN.md`, `TODO.md`, `ROADMAP.md`.\n\n**If no plan exists (either mode), or the user is starting a new one:** Ask:\n1. \"What's the project name?\" (used as the folder name in PARA-vault mode, ignored in generic mode)\n2. \"What's the goal in one sentence?\"\n3. \"What's the deadline or timeframe?\"\n\nThen create the plan using this structure — at `02-Projects/\u003cname>/ACTIVE_PLAN.md` in PARA-vault mode, or `ACTIVE_PLAN.md` at the repo root in generic mode:\n\n```markdown\n# [Project Name]\n\n**Goal:** [One sentence — what done looks like]\n**Deadline:** [Date or timeframe]\n**Owner:** [You]\n\n---\n\n## Session Protocol\n- 🤖 Claude can do autonomously\n- 🤝 Claude drafts, human reviews\n- 🧑 Human-only action required\n- Never skip a GATE — these are explicit checkpoints requiring sign-off\n\n## Human-Action Queue\n*(tasks Claude can't do — needs you)*\n\n---\n\n## Phase 1 — [Phase name]\n- [ ] 🤖 ▶ NEXT [First task]\n- [ ] 🤖 [Second task]\n- [ ] 🧑 GATE: [Checkpoint description]\n\n## Phase 2 — [Phase name]\n- [ ] 🤖 [Task]\n\n---\n\n## Blockers\n*(anything waiting on input, credentials, or external events)*\n\n## Status Log\n| Date | Summary |\n|------|---------|\n| [today] | Project created |\n```\n\nIn PARA-vault mode, also create `02-Projects/\u003cname>/README.md` with the project name and a link to `ACTIVE_PLAN.md`, and add the project to `index.md`'s Active Projects table, if that file exists.\n\n**If one plan exists:** Read it directly.\n\n**If multiple plans exist (PARA-vault mode, several `02-Projects/` entries):** Ask which one to work on.\n\n---\n\n## Step 2 — Reconcile with reality\nCheck `## Blockers` first — anything resolved? Then verify the project's files still match what the plan describes.\n\nCross-reference against the plan's checkboxes:\n- Items clearly done → tick them off\n- New blockers → add to `## Blockers`\n- Order still optimal? → reorder if needed, never skip a GATE\n\n## Step 3 — Pick the next task\nGo to the `▶ NEXT` marker. If the task is 🧑, prepare everything Claude can, add it to the Human-Action Queue, and move `▶ NEXT` to the next non-blocked task. Say which task you're starting.\n\n## Step 4 — Execute\nWork the task. Add discovered sub-tasks to the plan immediately. When done, tick the checkbox and move `▶ NEXT`.\n\n## Step 5 — After each task\nAppend to `## Status Log` (date + one line). Loop to Step 3 until stopping.\n\n## Completing the project\nWhen the project goal is met:\n1. Confirm with the user: \"Project complete — archive it?\"\n2. If yes:\n   - **PARA-vault mode:** move `02-Projects/\u003cname>/` to `08-Archive/\u003cname>/`, and remove it from `index.md`'s Active Projects table.\n   - **Generic mode:** create `docs/archive/` if it doesn't exist, and move the plan file there (e.g. `docs/archive/ACTIVE_PLAN.md`; add a suffix if one's already there).\n3. Return: \"Project archived. Run this skill again to start a new one.\"\n\n## Stopping (project not yet complete)\nIf this project has a wrap-up convention (e.g. a `/wrap-up` skill), run it. Otherwise, just make sure the most recent `## Status Log` entry captures exactly where you stopped and what's next.\n"}, {"name": "ad-execute", "description": "Cut through context loss — reconcile the current plan file, CLAUDE.md, and claude-mem into a short TL;DR plus ready-to-paste agent prompts for what's actually left", "manual": false, "path": "~/.agents/skills/ad-execute", "file_count": 0, "files": [], "body": "---\nname: ad-execute\ndescription: Cut through context loss — reconcile the current plan file, CLAUDE.md, and claude-mem into a short TL;DR plus ready-to-paste agent prompts for what's actually left\nallowed_tools: [\"Read\", \"Bash\", \"mcp__plugin_claude-mem_mcp-search__search\"]\n---\n\n# /ad-execute\n\nBuilt for the moment context has slipped — too many open loops, unclear what's already done, hard to hold the thread. This skill does the reconciliation work so you don't have to hold it in your head: it checks the project's own sources against each other, cuts anything already resolved, and hands you copy-paste-ready prompts for what's left. No essay, no re-reading old sessions.\n\n## Step 1 — Load the current plan\nCheck for these files at the repo root, first match wins: `ACTIVE_PLAN.md`, `PLAN.md`, `TODO.md`, `ROADMAP.md`. If one exists, read it and pull out only:\n- Anything marked as next/in-progress/blocked\n- Unchecked items\n- A \"Blockers\" or \"Waiting on\" section, if present\n\nIf none of these files exist, skip this step — there's nothing to reconcile against yet.\n\n## Step 2 — Load hard rules and pre-flight context\nCheck for `CLAUDE.md`, `AGENTS.md`, or `README.md` (first match) and read it. Note any hard rules and any pre-flight memory-search convention — every prepared prompt in Step 5 must bake this check in, so handed-off agents don't repeat work. If none of these files exist, skip.\n\n## Step 3 — Cross-check against a task tracker, then claude-mem\nIf this project has its own task-tracking script (e.g. a `tasks-db`-style CLI under `09-agents/` or similar) and it's present and executable, run its \"open items\" query instead of guessing from the plan file. Otherwise, treat the unchecked items from Step 1 as the current open-loop list directly.\n\nFor anything left — items that are conversational/ambiguous commitments not yet captured in any plan file — fall back to claude-mem free-text search to see if it's already been resolved since the plan was last updated:\n```\nmcp__plugin_claude-mem_mcp-search__search\n  query: \"\u003citem keywords>\"\n  project: \"\u003ccurrent repo's directory name, or its git remote name if set>\"\n  orderBy: \"date_desc\"\n  limit: 5\n```\nDrop any item claude-mem shows as done. Keep items that are still open, partially done, or ambiguous — flag ambiguous ones rather than guessing.\n\n## Step 4 — Reconcile into one clean list\nMerge Step 1 + Step 3 into a single deduplicated list of what is *actually* still outstanding right now. Order by: blockers first (nothing else can proceed without these), then anything flagged next/in-progress, then everything else. Cap at 5 items — if there are more, keep the top 5 and name the rest in one line (\"+N more in \\\u003cplan file\\>\").\n\n## Step 5 — Generate the TL;DR\nFormat for a 10-second scan, not a read:\n```\n## 🎯 Right now\n- [ ] \u003cverb-first, one line, ≤12 words>\n- [ ] \u003cverb-first, one line, ≤12 words>\n...\n\n⛔ Blocked on: \u003cthing>, from \u003cperson/system>   (omit if none)\n```\n\n## Step 6 — Generate ready-to-hand-off agent prompts\nFor every item in the TL;DR, write one self-contained prompt block — assume the reader (a fresh agent) has zero memory of this conversation:\n\n```\n### \u003citem title>\n\\`\\`\\`\nTask: \u003cone sentence, concrete outcome>\nContext: \u003c2-3 sentences — why this matters, what's already true>\nBefore starting: query mcp__plugin_claude-mem_mcp-search__search for\n  \"\u003crelevant keywords>\" (project: \"\u003ccurrent repo name>\") — do not redo work that's already there.\nFiles/sources: \u003cexact paths or doc names>\nDone when: \u003cone concrete, checkable condition>\n\\`\\`\\`\n```\n\n## Step 7 — Output order\n1. The TL;DR block (Step 5) — always first, always short.\n2. The prompt blocks (Step 6) — one per item, ready to paste into a new agent session.\n3. Nothing else. No recap, no \"let me know if,\" no summary paragraph after the prompts.\n"}, {"name": "better-writing", "description": "Writes and reviews interface copy, from labels and errors to empty states and confirmations, so it matches the product's voice and tells people what to do next.", "manual": false, "path": "~/.agents/skills/better-writing", "file_count": 2, "files": ["agents/openai.yaml", "patterns.md"], "body": "---\nname: better-writing\ndescription: Writes and reviews interface copy, from labels and errors to empty states and confirmations, so it matches the product's voice and tells people what to do next.\n---\n\n# Writing\n\nThis skill writes and reviews interface copy such as labels, errors, empty states and confirmations, along with the terms that run through them. It matches the product's existing voice and flags copy that misleads people or leaves them without a way forward.\n\nA deliberate brand voice is not a defect. Raise a departure from plain language only when it creates inconsistency, ambiguity, translation risk or a tone the stakes don't support. Rewording that merely suits your taste is not a finding.\n\nHow copy renders, including `text-transform`, truncation and smart punctuation, belongs to `better-typography`. Error markup, announcements and the attributes that carry accessible names belong to `better-accessibility`. Room for translated strings belongs to `better-layout`.\n\nThose `better-*` rules are reference files at [../interface-review/reference/](../interface-review/reference/), as `better-\u003cname>/rules.md`.\n\n## Inventory the existing strings first\n\nBefore writing or reviewing, find where the copy lives and read the copy around the change:\n\n1. Search for the translation call (`t(`, `i18n.`, `\u003cFormattedMessage`, `$t(`) and the locale files it reads, such as `locales/**/*.json`, `messages/*.json`, `*.po` and `*.strings`. Copy may also come from a CMS or the API.\n2. List the noun used for each object and the verb used for each action, as in \"project\" or \"workspace\" and \"Delete\" or \"Remove\".\n3. Note the case used per element type and any voice or content style guide.\n\nNew copy uses the terms on that list. A synonym is a finding only where the same thing is named two ways.\n\n## One voice, one vocabulary\n\nThe product has one voice and its existing copy establishes it. A local edit does not get to invent a new one. If it's \"Archive\" in the menu, it isn't \"Move to storage\" in the toast.\n\nA multi-step flow uses one vocabulary throughout: \"Get started\" to enter, either \"Continue\" or \"Next\" to advance, \"Done\" to finish. Tone flexes with the stakes:\n\n| Context | Tone |\n| --- | --- |\n| Success, onboarding, empty states | Warm, can be light |\n| Routine actions, settings | Neutral, minimal |\n| Errors, destructive confirmations | Calm, plain, zero playfulness |\n| Data loss, security | Serious, explicit |\n\n## Address the reader directly\n\nIn instructional copy, write \"you\", not \"the user\". In errors, \"we\" reads as deflection, so prefer \"Unable to load content. Check your connection and try again.\" An established first-person voice can stay in low-stakes copy where it still reads clearly.\n\nUse possessives sparingly: \"Favorites\" beats \"Your favorites\". Never mix perspectives in one flow, such as \"My account\" beside \"Your settings\".\n\n## Plain words over clever ones\n\nChoose words a tired reader gets on the first pass, and delete every word that does no work. No idioms, no colloquialisms and no humor that won't translate.\n\nSkip unnecessary gender: \"Subscribers can post recipes\", not \"each subscriber can post his or her recipes\". Match the input device: \"tap\" on touch, \"click\" with a pointer, \"select\" when both are possible.\n\n## Build strings whole\n\nNever assemble a sentence from fragments around a variable (`\"You have \" + n + \" new messages\"`), because word order changes per language. Write one message with placeholders, and use the locale's plural rules rather than `n === 1 ? \"\" : \"s\"`. Many languages have more than two plural forms. Format numbers, dates and lists through `Intl`. Recipes are in [patterns.md](patterns.md#plurals-and-placeholders).\n\n## Verb-first buttons\n\nA button label starts with a verb naming the action: \"Send\", \"Save draft\", \"Delete project\". Never \"OK!\" or \"Let's go!\".\n\nAn icon-only button's accessible name follows the same rule. It names the action, \"Delete project\", never the glyph, \"Trash icon\". The attribute that carries it is `better-accessibility`'s.\n\n## Links describe their destination\n\nLink text makes sense out of context, because screen-reader users navigate by a list of the page's links. Write \"Read the billing docs\", never \"Click here\".\n\nA bare \"Learn more\" breaks down as soon as two appear on one page. Suffix each one: \"Learn more about exports\".\n\n## One capitalization policy\n\nPick title case or sentence case per element type, then apply it to every instance of that type. Sentence case is the default where the project has no policy. \"Save Changes\" beside \"Discard changes\" reads as sloppiness.\n\n## Settings describe the ON state\n\nLabel a toggle for what happens when it is on. \"Send read receipts\" lets users infer the off state; \"Don't send read receipts\" turns the toggle into a double negative.\n\nLink straight to a referenced setting rather than describing the path to it: a \"Notification settings\" link, not \"Go to Settings > Notifications > Email\".\n\n## Errors say how to fix, next to where it broke\n\nAn error is an instruction, and it belongs beside the field that failed:\n\n| Bad | Good |\n| --- | --- |\n| That password is too short | Choose a password with at least 8 characters |\n| Invalid date | Enter a date as DD/MM/YYYY |\n| Oops! Something went wrong. | Unable to save. Check your connection and try again. |\n\nNo blame, no \"oops\" and no exclamation marks. Phrase hints positively, as in \"Use at least 8 characters\" rather than \"Don't use fewer than 8\". Show a known requirement as helper text before input, not only in the error. When the same error keeps firing, redesign the interaction so it cannot happen.\n\n## Undo beats confirmation\n\nPrefer undo when the action can be reversed and people perform it often, such as archiving, moving or deleting into a trash. Act at once and offer undo in the result: \"Project archived. Undo\".\n\nConfirm before acting when the action cannot be reversed, affects other people or destroys many items at once. The confirmation repeats the consequence, so the dialog is answerable without reading the body:\n\n- The title names the action and the object, \"Delete 'Q3 report'?\", never \"Are you sure?\".\n- The body says what is lost and what cannot be recovered, with counts where they apply.\n- The buttons are verb plus object, `Delete project` and `Cancel`, never `Yes` and `No`.\n- For an account, a workspace or a repository, ask the person to type the object's name.\n\nTemplates are in [patterns.md](patterns.md#destructive-flows). The destructive button's distinct color is `better-colors`'.\n\n## Empty states point forward\n\nAn empty state says what this place is and how to fill it, and offers one clear next action:\n\n```html\n\u003c!-- Bad: a shrug -->\n\u003cp>No results.\u003c/p>\n\n\u003c!-- Good: orientation plus a next step -->\n\u003cp class=\"font-medium\">No projects yet\u003c/p>\n\u003cp class=\"text-sm text-zinc-500\">Projects keep your tasks and files together.\u003c/p>\n\u003cbutton class=\"mt-4\">Create a project\u003c/button>\n```\n\nA filtered empty state names the query and offers an exit: \"No results for 'quarterly'. Clear filters\". Never park persistent information in an empty state. It disappears the moment content exists.\n\nLoading, saving and success copy is in [patterns.md](patterns.md#status-copy).\n\n## Placeholders show an example\n\nA placeholder shows a realistic example in the format the field accepts, `name@example.com` or `DD/MM/YYYY`, never an instruction. Whether the field also needs a visible label is `better-accessibility`'s.\n\n## Before you finish\n\n| Detection pattern | Fix |\n| --- | --- |\n| `Click here`, a link reading `here` or two identical `Learn more` links | Name the destination |\n| `Oops`, `Something went wrong` or `!` in an error string | Say what failed and the next step |\n| `\" + n + \"`, a template literal holding a sentence fragment, or `=== 1 ? \"\" : \"s\"` | One ICU message with a plural argument |\n| `>OK\u003c`, `>Yes\u003c` or `>No\u003c` on a dialog button | Verb plus object |\n| `Are you sure` | Name the action and the object |\n| `successfully` | Cut it: \"Changes saved\" |\n| `Please` in a routine instruction | Cut it |\n| A toggle label starting `Don't`, `Disable` or `Hide` | Describe the ON state |\n| `aria-label=\"Trash\"`, `\"Close icon\"` or `\"X\"` | Name the action: \"Delete project\", \"Close dialog\" |\n| `toLocaleDateString()` with no locale, or a date built from `getMonth()` | `Intl.DateTimeFormat` with the user's locale |\n| `Save Changes` beside `Discard changes` | One case per element type |\n\n## Reporting\n\n**Severity.** `HIGH` misleads the user or hides how to recover from an error. An error that names no way to recover is always `HIGH`, as is a destructive action with neither confirmation nor undo. `MEDIUM` breaks voice, terminology or capitalization consistency. `LOW` is isolated wording polish.\n\n**Verification.** Check every label against the action it invokes, every error for a stated fix and every term against the inventory. Read locale files as well as components. Report strings supplied by the server or a CMS that you could not see as `Not verified`.\n\n**Format.** Group findings under the principle each violates, ordered by severity, one row per root cause listing every location it appears in:\n\n| Severity | Location | Before | After | Why |\n| --- | --- | --- | --- | --- |\n\n`Location` is `path/to/file:line`. `Why` names the principle and the user impact.\n\nEnd with `Block` when any `HIGH` remains, `Approve` otherwise, leaving the rest in the table as work to do. Never `Approve` coverage you did not inspect. With nothing to report, state \"No actionable writing findings\" and report verification.\n"}, {"name": "braindump", "description": "Transform raw thoughts into structured knowledge with domain classification", "manual": false, "path": "~/.agents/skills/braindump", "file_count": 0, "files": [], "body": "---\nname: braindump\ndescription: Transform raw thoughts into structured knowledge with domain classification\nallowed_tools: [\"Read\", \"Write\", \"Edit\", \"Bash\"]\n---\n\n# Braindump\n\nWhen the user gives you a raw dump of thoughts, notes, or ideas:\n\n## Step 1 — Read context\nIf present, skim `CLAUDE.md`, `AGENTS.md`, or `README.md` (first match) for project context. If none exist, skip — work from the conversation alone.\n\n## Step 2 — Classify domains\nSort the input across these domains (use only what applies):\n- **Strategy** — positioning, business model, competitive moves\n- **Sales** — prospects, outreach, pipeline moves\n- **Automation** — flow ideas, tool notes, client requirements\n- **People** — contacts, relationships, observations\n- **Learning** — frameworks, articles, ideas worth keeping\n- **Operations** — process, admin, logistics\n\n## Step 3 — Append to docs/braindump.md\nCreate `docs/` if it doesn't exist yet, and `docs/braindump.md` if it doesn't exist yet. Append a new dated heading (`## YYYY-MM-DD`) with one sub-heading per domain that has content this round. Don't scatter entries across other files — this is the single running capture log.\n\n## Step 4 — Confirm\nList what was appended and under which domain headings. Ask if anything needs deeper development.\n"}, {"name": "brandkit", "description": "Premium brand-kit image generation skill for creating high-end brand-guidelines boards, logo systems, identity decks, and visual-world presentations. Trained for minimalist, cinematic, editorial, dark-tech, luxury, cultural, security, gaming, developer-tool, and consumer-app brand systems. Optimized for intentional logo concepting, refined composition, sparse typography, strong symbolic meaning, premium mockups, art-directed imagery, and flexible grid layouts.", "manual": false, "path": "~/.agents/skills/brandkit", "file_count": 0, "files": [], "body": "---\nname: brandkit\ndescription: Premium brand-kit image generation skill for creating high-end brand-guidelines boards, logo systems, identity decks, and visual-world presentations. Trained for minimalist, cinematic, editorial, dark-tech, luxury, cultural, security, gaming, developer-tool, and consumer-app brand systems. Optimized for intentional logo concepting, refined composition, sparse typography, strong symbolic meaning, premium mockups, art-directed imagery, and flexible grid layouts.\n---\n\n# BRANDKIT IMAGE GENERATION SKILL\n\nYou are an elite brand identity art director, logo designer, visual-system strategist, and presentation designer.\n\nYour job is to generate premium brand-kit images that feel like they came from a serious identity studio.\n\nThe output must feel:\n- intentional\n- premium\n- minimal\n- coherent\n- strategic\n- visually expensive\n- brand-system driven\n- presentation-ready\n\nDo not generate generic logos.  \nDo not generate random mockups.  \nDo not generate messy AI moodboards.\n\nCreate a complete brand world in one image.\n\n---\n\n# REFERENCE STYLE DNA\n\nThe desired visual quality is inspired by premium brand-guidelines decks with:\n\n- dark charcoal outer canvas\n- clean grid-based presentation boards\n- strong gutters between panels\n- restrained visual density\n- very sparse typography\n- large negative space\n- cinematic brand atmosphere\n- simple but memorable logo marks\n- UI mockups used as brand applications\n- browser chrome / app headers / terminal frames\n- image-led panels with subtle overlays\n- halftone, grain, scanline, or print texture\n- geometric construction diagrams\n- small labels and page-number details\n- muted but powerful accent colors\n- logo repeated across multiple touchpoints\n- one strong brand idea per board\n\nThe references are not a fixed style.  \nThey define the quality bar, restraint, and presentation logic.\n\n---\n\n# CORE PRINCIPLE\n\nA premium brand kit is not decoration.\n\nIt is a visual argument for why the brand exists.\n\nEvery generated board must answer:\n\n1. What does this brand represent?\n2. What is the core metaphor?\n3. How does the logo express that?\n4. How does the system scale across UI, print, image, and detail?\n5. Why does the whole thing feel ownable?\n\n---\n\n# DEFAULT OUTPUT\n\nUnless the user specifies otherwise:\n\n- Generate one brand-kit overview image\n- Default layout: `3 × 3`\n- Default aspect ratio: `4:3` or `16:10`\n- Use a clean presentation grid\n- Use consistent gutters\n- Use minimal text\n- Make every panel feel connected\n\nAllowed layouts:\n- `3 × 3` full identity system\n- `2 × 3` cinematic brand deck overview\n- `2 × 2` compact concept board\n- `1 × 3` horizontal brand strip\n- `4 × 2` wide contact-sheet layout\n- custom layout when requested\n\nIf the user gives references, match their quality and rhythm, not their exact content.\n\n---\n\n# BRAND STRATEGY FIRST\n\nBefore generating, infer the brand strategy.\n\nThink through:\n\n- category\n- audience\n- product function\n- emotional promise\n- cultural position\n- trust level\n- visual world\n- symbolic metaphor\n- what the brand should avoid\n\nThe visual system must be based on meaning.\n\nExamples:\n\n| Category | Core Ideas | Possible Symbol Logic |\n|---|---|---|\n| Developer tool | building, speed, precision, control | cursor, frame, bolt, scaffold, grid |\n| AI assistant | delegation, intelligence, clarity | spark, orbit, signal, path, node |\n| Security | protection, vigilance, boundary | shield, eye, seal, protected core |\n| Gaming / betting | chance, reward, tension, speed | dice, gem, card, signal, trophy |\n| Voice AI | sound, rhythm, command, flow | waveform, mic, orb, speech path |\n| Compliance | trust, order, rules, protection | seal, dog, badge, document, shield |\n| Drone / robotics | flight, control, vision, mission | wing, owl, crosshair, path, zone |\n| Luxury / editorial | taste, material, ritual, restraint | monogram, seal, paper, emboss, mark |\n| Productivity | focus, momentum, clarity | path, check, block, calendar, light |\n\nDo not pick symbols randomly.\n\n---\n\n# LOGO GENERATION STANDARD\n\nThe logo must be professional.\n\nIt should be:\n- simple\n- memorable\n- symbolic\n- scalable\n- ownable\n- visually balanced\n- connected to the brand idea\n- usable as icon, wordmark, badge, UI mark, and pattern\n\nAvoid:\n- generic lightning bolts unless strongly justified\n- random animals\n- fake luxury crests\n- copied famous marks\n- overcomplicated symbols\n- clipart-style icons\n- meaningless sparkles\n- inconsistent logo variants\n\nThe logo should feel like it came from research and reduction.\n\n---\n\n# LOGO CONCEPT METHODS\n\nUse one or combine two maximum.\n\n## 1. Monogram + Meaning\n\nCombine the brand initial with a metaphor.\n\nExamples:\n- `K` + kite / frame / direction\n- `N` + path / folded system\n- `S` + sound wave / speech flow\n- `A` + ascent / architecture / momentum\n\nDo not make a boring letter icon.  \nUse negative space, cuts, folds, or geometry.\n\n---\n\n## 2. Product Action\n\nTurn the product's main action into a symbol.\n\nExamples:\n- build → frame, scaffold, block, cursor\n- protect → shield, boundary, watch mark\n- convert → switch, arrow, transformation shape\n- speak → waveform, mic, pulse\n- hunt threats → eye, raptor, radar, trace\n- automate → loop, handoff, path\n\nMake it abstract and premium, not literal.\n\n---\n\n## 3. Metaphor Fusion\n\nCombine two meaningful ideas into one reduced mark.\n\nExamples:\n- owl + drone vision\n- shield + mountain\n- moon + waveform\n- dog + compliance seal\n- dice + mobile game economy\n- cursor + lightning speed\n- kite + product frame\n\nThe fusion should be subtle and readable.\n\n---\n\n## 4. Negative Space\n\nUse empty space to create intelligence.\n\nExamples:\n- hidden arrow\n- protected center\n- cutout initial\n- internal path\n- folded corner\n- eye formed by crossing shapes\n\nNegative space should be crisp.\n\n---\n\n## 5. Construction Geometry\n\nCreate a mark from a clear system.\n\nUse:\n- circles\n- diagonal cuts\n- grids\n- frames\n- modular blocks\n- layered cards\n- orbital paths\n- crosshairs\n- measured linework\n\nOne panel can show construction logic.\n\n---\n\n# BOARD COMPOSITION DNA\n\nA strong brand-kit board should feel like a curated sequence.\n\nUse:\n- large calm cover panel\n- one digital mockup panel\n- one image-led atmosphere panel\n- one system/construction panel\n- one physical or icon application panel\n- one quiet tagline panel\n\nDo not make every panel equally loud.\n\nThe board should have rhythm:\n- quiet\n- functional\n- emotional\n- technical\n- atmospheric\n- detailed\n\n---\n\n# DEFAULT 3 × 3 PANEL SYSTEM\n\nUse this if no layout is specified:\n\n## 1. Logo Cover\nLarge logo and wordmark.  \nMinimal title.  \nStrong negative space.\n\n## 2. Logo Construction\nSymbol breakdown, grid, geometry, or negative-space logic.  \nShow why the mark exists.\n\n## 3. Digital Application\nBrowser chrome, app header, terminal, dashboard fragment, or app icon.\n\n## 4. Brand Essence\nOne short tagline.  \nLarge readable typography.  \nSparse composition.\n\n## 5. Color System\nSwatches, gradient strips, color discs, material chips, or palette cards.\n\n## 6. Typography\nLarge type specimen, alphabet row, or primary/secondary type pairing.\n\n## 7. Physical Application\nCard, folder, badge, poster, label, seal, packaging, or object mockup.\n\n## 8. Image Direction\nCinematic landscape, product crop, halftone poster, editorial scene, material texture.\n\n## 9. System Detail\nUI chips, input bar, command line, icon row, badge system, component strip, pattern detail.\n\n---\n\n# 2 × 3 REFERENCE-STYLE LAYOUT\n\nFor boards like the uploaded references, use:\n\n1. **Logo / Wordmark**\n   - centered or offset\n   - extremely minimal\n\n2. **Browser / Product Surface**\n   - browser bar, app frame, prompt input, or URL field\n\n3. **Command / Functional Panel**\n   - terminal, prompt bar, input state, install command, dashboard fragment\n\n4. **Atmosphere / Campaign Image**\n   - halftone landscape, cinematic image, product-world visual, or art-directed photo\n\n5. **Symbol / Construction / Badge**\n   - logo mark in target, seal, geometric frame, icon construction\n\n6. **Tagline / System Promise**\n   - one short line\n   - large type\n   - quiet background\n\nThis layout should feel like a premium mini-deck.\n\n---\n\n# VISUAL MODES\n\nChoose based on the brand.\n\n## Dark Developer / Builder\n\nUse for:\ndeveloper tools, coding agents, infra, automation, AI builders.\n\nVisual cues:\n- near-black panels\n- monospace accents\n- command lines\n- terminal windows\n- prompt bars\n- subtle grid\n- cyan, blue, coral, or lime accents\n- pixel or CRT texture if appropriate\n\nLogo logic:\n- cursor + frame\n- bolt + build speed\n- scaffold + monogram\n- terminal glyph + symbol\n- modular construction mark\n\nMood:\nprecise, sharp, confident, builder-native.\n\n---\n\n## Dark Product / Operator\n\nUse for:\nbusiness tools, growth tools, sales agents, automation, productivity.\n\nVisual cues:\n- black / dark red / amber\n- glowing UI chips\n- card systems\n- segmented flows\n- icon rows\n- reward/progress motifs\n- minimal hero text\n\nLogo logic:\n- signal, gift, path, operator mark, switch, loop, command system\n\nMood:\nfast, operational, tactical, premium.\n\n---\n\n## Dark Nature / Calm System\n\nUse for:\nstrategy, travel, wellness, climate, quiet premium SaaS.\n\nVisual cues:\n- deep green\n- lime accent\n- misty landscapes\n- image UI circles\n- soft overlays\n- calm page labels\n- dark editorial grid\n\nLogo logic:\n- path, leaf, moon, horizon, compass, portal, folded mark\n\nMood:\ncalm, trustworthy, focused.\n\n---\n\n## Dark Security / Threat Intelligence\n\nUse for:\nsecurity, compliance, monitoring, network products.\n\nVisual cues:\n- black/navy\n- shield forms\n- radar lines\n- threat labels\n- subtle motion traces\n- red/blue alert chips\n- controlled gradients\n\nLogo logic:\n- shield, raptor, eye, watch, boundary, protected core\n\nMood:\nserious, vigilant, precise.\n\n---\n\n## Light Editorial / Compliance\n\nUse for:\nlegal, privacy, compliance, documents, trust brands.\n\nVisual cues:\n- warm ivory\n- paper texture\n- small serif labels\n- seals / badges\n- color wheel / palette object\n- calm stationery\n- deep blue, red, gold accents\n\nLogo logic:\n- seal, dog, shield, document, stamp, monogram\n\nMood:\ntrustworthy, refined, institutional but modern.\n\n---\n\n## Luxury / Beauty / Fashion\n\nUse for:\nbeauty, fashion, hospitality, premium services.\n\nVisual cues:\n- ivory / stone / espresso\n- serif wordmark\n- elegant monogram\n- paper grain\n- embossing\n- product labels\n- editorial crops\n- soft shadows\n\nLogo logic:\n- monogram, seal, petal, vessel, ritual object, refined typographic mark\n\nMood:\ntasteful, adult, expensive.\n\n---\n\n## Voice / Communication\n\nUse for:\nvoice AI, chat, assistants, speech, audio.\n\nVisual cues:\n- dark indigo\n- lilac glow\n- waveform\n- mic motif\n- phone crop\n- command input\n- app icon\n\nLogo logic:\n- wave + initial\n- sound orb\n- speech path\n- microphone abstraction\n- pulse ring\n\nMood:\nfluid, intelligent, intimate.\n\n---\n\n## Cultural / Experimental\n\nUse for:\nmusic, creative tools, events, gaming-adjacent, cultural products.\n\nVisual cues:\n- halftone\n- CRT texture\n- analog print\n- bold accent color\n- poster-style panels\n- unexpected image crops\n- simple but punchy logo\n\nLogo logic:\n- custom wordmark\n- icon with attitude\n- symbolic mascot\n- print-inspired mark\n\nMood:\nmemorable, creative, still controlled.\n\n---\n\n# PREMIUM DETAIL LANGUAGE\n\nUse details like:\n- small page numbers\n- tiny footer labels\n- precise alignment marks\n- construction lines\n- subtle crosshair grids\n- thin rules\n- browser bars\n- rounded rectangles\n- image masks\n- soft shadows\n- low-opacity texture\n- halftone image treatment\n- one highlighted word\n- one accent chip\n- one strong icon state\n\nDo not overuse them.\n\nPremium detail should reward looking closer.\n\n---\n\n# TEXT RULES\n\nUse very little text.\n\nGood text:\n- brand name\n- one tagline\n- one URL\n- one command\n- 2–5 section labels\n- short UI chips\n\nBad text:\n- long paragraphs\n- tiny fake body copy\n- lots of menu items\n- lorem ipsum\n- dense explanations\n- unreadable labels\n\nText should be large enough and sparse enough to render well.\n\n---\n\n# TAGLINE STYLE\n\nTaglines should be short and specific.\n\nGood:\n- \"What will you build today?\"\n- \"Nothing random.\"\n- \"Your network. Our watch.\"\n- \"Build better.\"\n- \"On guard.\"\n- \"Every mission under control.\"\n- \"Everything operators need.\"\n- \"Clarity builds confidence.\"\n\nAvoid:\n- generic corporate slogans\n- long marketing copy\n- buzzword soup\n- fake inspirational fluff\n\n---\n\n# IMAGE DIRECTION\n\nImages should feel art-directed.\n\nUse:\n- cinematic mountains\n- dusk skies\n- landscapes with brand overlays\n- halftone clouds\n- CRT screen scenes\n- dark product closeups\n- dramatic object crops\n- textured paper backgrounds\n- moody architecture\n- abstract but controlled visual systems\n\nAvoid:\n- generic stock people\n- random office photos\n- cliché robot imagery\n- overbusy scenes\n- unrelated imagery\n\nImages should match the palette and metaphor.\n\n---\n\n# MOCKUP DIRECTION\n\nMockups should be minimal and believable.\n\nUse:\n- browser chrome\n- URL bar\n- terminal window\n- command prompt\n- app icon\n- phone corner crop\n- card stack\n- badge\n- seal\n- folder\n- UI chips\n- dashboard fragment\n- input bar\n- product label\n\nAvoid:\n- full fake dashboards with too much data\n- cheap glossy mockups\n- random device overload\n- busy app screens\n- excessive icons\n\nMockups are identity applications, not feature demos.\n\n---\n\n# COLOR DISCIPLINE\n\nUse one dominant palette.\n\nDefault:\n- base color\n- primary accent\n- secondary accent\n- neutrals\n\nGood reference-style palettes:\n- black + cyan + muted coral\n- black + red + cream + blue\n- forest green + lime + fog gray\n- navy + white + steel\n- ivory + deep blue + red + gold\n- black + lilac + soft purple\n- black + amber + red\n- charcoal + white + pale blue\n\nRules:\n- accents must repeat across panels\n- no random rainbow unless requested\n- no generic purple-blue AI glow unless appropriate\n- one accent can carry the entire system\n\n---\n\n# ANTI-GENERIC RULES\n\nNever make:\n- random floating icons\n- generic startup gradients\n- overdesigned logos\n- meaningless blobs\n- messy layout collages\n- fake tiny UI\n- inconsistent logo marks\n- too many colors\n- cheap neon\n- stock-template brand boards\n- corporate PowerPoint slides\n- soulless SaaS dashboards\n\nMake the design quieter, sharper, and more intentional.\n\n---\n\n# REFERENCE USAGE\n\nWhen the user provides references:\n\nExtract:\n- layout rhythm\n- grid style\n- spacing\n- typography scale\n- visual density\n- logo placement\n- amount of text\n- image treatment\n- accent color logic\n- brand-system behavior\n\nDo not copy:\n- exact logo\n- exact brand name\n- exact composition\n- exact slogan\n- unique visual asset\n\nUse references as quality training, not as templates.\n\n---\n\n# PROMPT TEMPLATE\n\nUse this structure internally:\n\nCreate a premium brand-kit overview image for \"[BRAND NAME]\".\n\nBrand strategy:\n- category: [category]\n- audience: [audience]\n- personality: [traits]\n- core metaphor: [metaphor]\n- logo idea: [how the mark combines symbol + name + category meaning]\n\nLayout:\n[3×3 / 2×3 / custom] grid on a dark or light presentation canvas with strong gutters, clean alignment, and refined negative space.\n\nPanels:\n- logo cover\n- logo concept / construction\n- digital application\n- tagline / brand essence\n- color system\n- typography\n- physical application\n- image direction\n- system detail\n\nVisual mode:\n[mode]\n\nPalette:\n[disciplined palette]\n\nStyle:\npremium, sparse, cinematic, intentional, polished, brand-guidelines deck, no clutter, no copied real-world logos.\n\nTypography:\nreadable, minimal, high hierarchy, no tiny fake text.\n\nLogo:\nprofessional, symbolic, simple, ownable, based on the brand's purpose, repeated consistently across panels.\n\n---\n\n# FINAL OUTPUT STANDARD\n\nThe image must look like:\n- a premium identity deck\n- a senior designer's presentation board\n- a brand-system case study\n- a visual launch direction\n- a professional logo concept board\n\nThe final result should be:\n- clean\n- strategic\n- symbolic\n- minimal\n- coherent\n- premium\n- art-directed\n- implementation-friendly\n- stronger than normal AI-generated brand visuals\n"}, {"name": "break", "description": "Renders a component you choose under every scenario that can reach it on a temporary page and stress tests it.", "manual": true, "path": "~/.agents/skills/break", "file_count": 2, "files": ["agents/openai.yaml", "scenarios.md"], "body": "---\nname: break\ndescription: Renders a component you choose under every scenario that can reach it on a temporary page and stress tests it.\ndisable-model-invocation: true\n---\n\n# Break\n\nThis skill takes one component and renders it on a harness page under every scenario that can actually reach it. That page is the deliverable: a visual report the user scrolls through, every scenario side by side, with the breaks marked.\n\nIt observes rather than judges. A finding here is something that visibly broke on the page, named in the vocabulary of the domain skill that owns the fix. Reviewing code against a standard is `interface-review` and `better-interface`; exploring design alternatives is `variant`; working through a component's product states one at a time is `state-machine`.\n\nThe `better-*` domain rules used to name each finding live in [../interface-review/reference/](../interface-review/reference/) as `better-\u003cname>/rules.md`; `better-writing` is its own skill. `variant` is not installed.\n\nWhere `variant` insists on the real page, this skill isolates on purpose. You are not judging how the component looks in context. You are checking whether it defends itself when the content is worst-case.\n\nThe whole run is build, look once, report: minutes, not a session. Nothing in it justifies instrumentation, browser debugging or a second pass.\n\n## 1. Scope one component\n\nOne component per run. \"The settings page\" is not a component; the profile form's text input is. Where the request spans several, list the candidates and ask which one to test.\n\nRestate what the component is in one sentence: what it accepts, what it renders and where it will live.\n\n## 2. Infer the scenarios from the component\n\nStress only what varies. A scenario earns a slot when the component accepts something that can take that shape in production. So read the component first: its props, its slots, its states and the data it renders.\n\n[scenarios.md](scenarios.md) holds the axes, the values on each and the cue that says whether an axis applies. Walk it against the component and keep only the axes whose cue matches. A text input gets content length and states, never item quantity. A static icon button with a fixed label gets container and environment, never long text.\n\nWrite the kept scenarios down before building, one line each. Then say which axes you dropped and why, in one line, so a wrong inference is cheap to catch.\n\n## 3. Build the harness page\n\nThe harness page renders the component once per scenario in a single column, with a short text label above each instance.\n\nA scratch route inside the app holds the real component, imported from the project and untouched. The route inherits the app's layout, fonts, global styles and providers for free.\n\nWhere the framework splits server from client components, the page is client code, `\"use client\"` in Next. Otherwise fixture data can silently vanish crossing that boundary, and the page renders empty.\n\nLabels, container widths and fixture props are everything the page adds. No fonts or styles of its own, no simulated themes or token swaps, no probes. A component observed under any of those is a different component.\n\nFeed scenarios as props and fixture data. The harness never imports production state, never wires to live data and production never imports from the harness.\n\n## 4. Look once\n\nLoad the page once in a browser already at hand, skim every scenario top to bottom and note what visibly broke. \"Text escapes the field's right edge\", never \"spacing feels tight\". A predicted failure is not a finding.\n\nWith no browser at hand, say so and hand the URL over for the user to check. Launching, window-wrangling or debugging a browser is out of budget. When you skipped the look, the report is the URL and the scenario list, with no findings table and no page notes.\n\nThen mark each break you did see on the page, a one-line note under that scenario's label, in a single edit. The page has to read as the report on its own.\n\n## 5. Report what broke and stop\n\nReport findings as a table, broken scenarios first:\n\n| Scenario | Observed | Owner |\n| --- | --- | --- |\n| One unbreakable 60-character string | Overflows the card, no wrap and no truncation | `better-typography` |\n| Zero items | Blank region with no message | `better-writing` |\n\nThis skill owns no domain rules and issues no verdict.\n\n\"Everything survived\" is a complete and useful report. Say which scenarios are on the page and where it is running, so the user can see every one themselves. End there rather than padding the result with preferences.\n\nDo not fix anything unasked. On a request to fix, follow the owner skill's rules, then re-render the failing scenarios to confirm.\n\n## 6. Leave the page up, delete it on request\n\nThe page is half the report, so it outlives the findings table. Leave it running. Delete it and its fixtures only when the user says they are done with it. Then search for the route and fixture names, and check the diff leaves nothing of the harness behind.\n\n## Before you finish\n\n| Mistake | Fix |\n| --- | --- |\n| Every axis run against every component | Keep only the axes whose cue matches, and say which you dropped |\n| A predicted failure reported as observed | Render it, or leave it out |\n| A scenario missing the content it was fed | The harness is broken, not the component; make the page client code and reload once |\n| A rebuilt lookalike component in the harness | Import the real component from the project |\n| The harness restyles or re-themes the component | The app's layout, fonts and tokens as they are; labels and widths are all the page adds |\n| A browser launched, debugged or screenshotted per scenario | One load and one look, or hand the URL over and skip the look |\n| Findings phrased as taste | Report what was visible on the page, or nothing |\n| A break reported without an owner | Name the domain skill whose rules diagnose it |\n| A clean run padded with suggestions | \"Everything survived\" plus the scenario list is the report |\n| The viewport resized scenario by scenario | Widths are fixed containers on the page; one load shows them all |\n| A break in the table but unmarked on the page | Note it under the scenario's label; the page reads as the report on its own |\n| Page deleted in the same turn as the report | The page is half the report; delete only on the user's word |\n"}, {"name": "bulk-read", "description": "Delegate reading of large files or many files to the cheap bulk-reader subagent (Haiku) instead of loading them into the main context. Use when a question spans several files, a file is long (over ~400 lines), or you need an overview of a folder, a codebase, a log or a long document, and you will not edit the text you are reading. Also explains the big-read-guard hook that blocks whole-file reads of large files, and how to tune or turn it off.", "manual": false, "path": "~/.agents/skills/bulk-read", "file_count": 4, "files": ["README.md", "agents/bulk-reader.md", "hooks/big-read-guard", "install-hook.sh"], "body": "---\nname: bulk-read\ndescription: Delegate reading of large files or many files to the cheap bulk-reader subagent (Haiku) instead of loading them into the main context. Use when a question spans several files, a file is long (over ~400 lines), or you need an overview of a folder, a codebase, a log or a long document, and you will not edit the text you are reading. Also explains the big-read-guard hook that blocks whole-file reads of large files, and how to tune or turn it off.\n---\n\n# bulk-read\n\nMost reading is I/O, not thinking. Send it to a cheap model and keep only the answer.\nSame idea as Spotify's shunt plugin (portal-ai-plugins), but it runs on Claude Code's own subagents, so it needs no Portal account.\n\n## How to delegate\n\nCall the Agent tool with `subagent_type: \"bulk-reader\"`. In the prompt give:\n- the paths, a folder or a glob, and\n- one specific question (\"list every route and its handler with path:line\", not \"look at this\").\n\nAsk several questions in one call when they concern the same files. The reply has `path:line` refs. Before you edit, Read just that section with `offset`/`limit`.\n\n## When not to delegate\n- You are about to edit the text: read the section yourself (targeted read).\n- Subtle reasoning: debugging, concurrency, security review, design decisions. Haiku misses things there.\n- Small files (under the threshold): reading directly is cheaper than the round trip.\n\n## The guard hook\n\n`hooks/big-read-guard` is a PreToolUse hook on `Read|Bash`, registered in `~/.claude/settings.json`. In the main thread it denies:\n- a Read of a text file over the threshold without `offset`/`limit`;\n- a plain `cat`/`bat`/`less`/`more` of files whose total is over the threshold (pipes, redirects and chains pass).\n\nIt always allows subagent calls (they carry `agent_id`), targeted reads, images, PDFs and notebooks. The deny message tells Claude to use bulk-reader, a targeted read, or an explicit `limit` when the whole file really must be in context.\n\nSettings (env, in the shell or in `settings.json` `env`):\n- `BIG_READ_MIN_LINES`: threshold, default 400.\n- `BIG_READ_GUARD=off`: turn the guard off.\n\n## Install\nRun `~/.agents/install.sh` (links the skill), then `skills/bulk-read/install-hook.sh` (links `~/.claude/agents/bulk-reader.md` and registers the hook in `~/.claude/settings.json`, with a backup). Both are idempotent. The agent-terminal guard (`~/.claude/agent-terminal/bin/guard.sh`) blocks agents from editing `settings.json`, so the owner runs the hook script (`! ~/.agents/skills/bulk-read/install-hook.sh`).\n\n## Measured (2026-11-02)\nOne question about a 1,147-line Python file, Sonnet main thread: $0.194 with the guard vs $0.244 without (20% cheaper), and about 15k fewer tokens in the main context. Savings grow in long sessions, because a directly read file is carried in context on every later turn.\n"}, {"name": "clairy", "description": "Recap what was just explained in plain, no-jargon, no-fluff language — tailored for ADHD", "manual": false, "path": "~/.agents/skills/clairy", "file_count": 0, "files": [], "body": "---\nname: clairy\ndescription: Recap what was just explained in plain, no-jargon, no-fluff language — tailored for ADHD\nallowed_tools: [\"Read\"]\n---\n\n# /clairy\n\nNot a status check. Not a daily brief. This only looks at what was **just said in this conversation** — the last explanation, plan, or wall of text — and rewrites it so it's actually easy to hold onto.\n\n## Step 1 — The tone rules (the law for every output this skill produces)\n1. Write in plain, simple language. Use the vocabulary of a smart friend texting.\n2. If you must use a technical or industry term, define it instantly in parentheses using a basic analogy.\n3. Never use AI clichés like \"In today's world,\" \"Let's dive in,\" \"Delve,\" or \"Tapestry.\"\n4. Keep sentences short and active. Break big blocks of text into short lists or tiny paragraphs.\n5. Focus on what the user needs to know or do right now, rather than abstract theory.\n\nFollow these exactly — don't paraphrase them into something softer.\n\n## Step 2 — Find what to clarify\nTake the assistant's most recent substantive message in this conversation — the explanation, plan, or decision just given. Not the user's message. Not files. Not any daily brief or memory search.\n\n## Step 3 — Strip it down\nPull out only:\n- What is actually true or decided\n- What needs to happen (if anything)\n- Any word a non-expert would have to look up\n\nCut everything else: reasoning walk-throughs, hedging, \"as mentioned above,\" restated context.\n\n## Step 4 — Rewrite under the tone rules\n- Plain words. Texting-a-smart-friend register.\n- Any technical/industry term → define it instantly in parentheses with a basic analogy.\n- No AI clichés (\"In today's world,\" \"Let's dive in,\" \"Delve,\" \"Tapestry,\" etc).\n- Short, active sentences. No walls of text.\n\n## Step 5 — Format for ADHD scanning\n- Tiny paragraphs (1-2 sentences max) or short bullet lists — never a dense block.\n- One bolded line for the single most important thing, if there is one.\n- If there's an action needed, put it last, on its own line, starting with a verb.\n\n## Step 6 — Output\nJust the recap. No \"Here's a summary:\" preamble, no meta-commentary about what you did, no closing \"let me know if.\" Start directly with the content.\n"}, {"name": "cmux", "description": "End-user control of cmux topology and routing (windows, workspaces, panes/surfaces, focus, moves, reorder, identify, trigger flash). Use when automation needs deterministic placement and navigation in a multi-pane cmux layout.", "manual": false, "path": "~/.agents/skills/cmux", "file_count": 5, "files": ["agents/openai.yaml", "references/handles-and-identify.md", "references/panes-surfaces.md", "references/trigger-flash-and-health.md", "references/windows-workspaces.md"], "body": "---\nname: cmux\ndescription: End-user control of cmux topology and routing (windows, workspaces, panes/surfaces, focus, moves, reorder, identify, trigger flash). Use when automation needs deterministic placement and navigation in a multi-pane cmux layout.\n---\n\n# cmux Core Control\n\nUse this skill to control non-browser cmux topology and routing.\n\n## Core Concepts\n\n- Window: top-level macOS cmux window.\n- Workspace: tab-like group within a window.\n- Pane: split container in a workspace.\n- Surface: a tab within a pane (terminal or browser panel).\n\n## Fast Start\n\n```bash\n# identify current caller context\ncmux identify --json\n\n# list topology\ncmux list-windows\ncmux list-workspaces\ncmux list-panes\ncmux list-pane-surfaces --pane pane:1\n\n# create/focus/move\ncmux new-workspace\ncmux new-split right --panel pane:1\ncmux move-surface --surface surface:7 --pane pane:2 --focus true\ncmux reorder-surface --surface surface:7 --before surface:3\n\n# attention cue\ncmux trigger-flash --surface surface:7\n```\n\n## Handle Model\n\n- Default output uses short refs: `window:N`, `workspace:N`, `pane:N`, `surface:N`.\n- UUIDs are still accepted as inputs.\n- Request UUID output only when needed: `--id-format uuids|both`.\n\n## Deep-Dive References\n\n| Reference | When to Use |\n|-----------|-------------|\n| [references/handles-and-identify.md](references/handles-and-identify.md) | Handle syntax, self-identify, caller targeting |\n| [references/windows-workspaces.md](references/windows-workspaces.md) | Window/workspace lifecycle and reorder/move |\n| [references/panes-surfaces.md](references/panes-surfaces.md) | Splits, surfaces, move/reorder, focus routing |\n| [references/trigger-flash-and-health.md](references/trigger-flash-and-health.md) | Flash cue and surface health checks |\n| [../cmux-browser/SKILL.md](../cmux-browser/SKILL.md) | Browser automation on surface-backed webviews |\n| [../cmux-markdown/SKILL.md](../cmux-markdown/SKILL.md) | Markdown viewer panel with live file watching |\n"}, {"name": "cmux-browser", "description": "End-user browser automation with cmux. Use when you need to open sites, interact with pages, wait for state changes, and extract data from cmux browser surfaces.", "manual": false, "path": "~/.agents/skills/cmux-browser", "file_count": 10, "files": ["agents/openai.yaml", "references/authentication.md", "references/commands.md", "references/proxy-support.md", "references/session-management.md", "references/snapshot-refs.md", "references/video-recording.md", "templates/authenticated-session.sh", "templates/capture-workflow.sh", "templates/form-automation.sh"], "body": "---\nname: cmux-browser\ndescription: End-user browser automation with cmux. Use when you need to open sites, interact with pages, wait for state changes, and extract data from cmux browser surfaces.\n---\n\n# Browser Automation with cmux\n\nUse this skill for browser tasks inside cmux webviews.\n\n## Core Workflow\n\n1. Open or target a browser surface.\n2. Verify navigation with `get url` before waiting or snapshotting.\n3. Snapshot (`--interactive`) to get fresh element refs.\n4. Act with refs (`click`, `fill`, `type`, `select`, `press`).\n5. Wait for state changes.\n6. Re-snapshot after DOM/navigation changes.\n\n```bash\ncmux --json browser open https://example.com\n# use returned surface ref, for example: surface:7\n\ncmux browser surface:7 get url\ncmux browser surface:7 wait --load-state complete --timeout-ms 15000\ncmux browser surface:7 snapshot --interactive\ncmux browser surface:7 fill e1 \"hello\"\ncmux --json browser surface:7 click e2 --snapshot-after\ncmux browser surface:7 snapshot --interactive\n```\n\n## Surface Targeting\n\n```bash\n# identify current context\ncmux identify --json\n\n# open routed to a specific topology target\ncmux browser open https://example.com --workspace workspace:2 --window window:1 --json\n```\n\nNotes:\n- CLI output defaults to short refs (`surface:N`, `pane:N`, `workspace:N`, `window:N`).\n- UUIDs are still accepted on input; only request UUID output when needed (`--id-format uuids|both`).\n- Keep using one `surface:N` per task unless you intentionally switch.\n\n## Wait Support\n\ncmux supports wait patterns similar to agent-browser:\n\n```bash\ncmux browser \u003csurface> wait --selector \"#ready\" --timeout-ms 10000\ncmux browser \u003csurface> wait --text \"Success\" --timeout-ms 10000\ncmux browser \u003csurface> wait --url-contains \"/dashboard\" --timeout-ms 10000\ncmux browser \u003csurface> wait --load-state complete --timeout-ms 15000\ncmux browser \u003csurface> wait --function \"document.readyState === 'complete'\" --timeout-ms 10000\n```\n\n## Common Flows\n\n### Form Submit\n\n```bash\ncmux --json browser open https://example.com/signup\ncmux browser surface:7 get url\ncmux browser surface:7 wait --load-state complete --timeout-ms 15000\ncmux browser surface:7 snapshot --interactive\ncmux browser surface:7 fill e1 \"Jane Doe\"\ncmux browser surface:7 fill e2 \"jane@example.com\"\ncmux --json browser surface:7 click e3 --snapshot-after\ncmux browser surface:7 wait --url-contains \"/welcome\" --timeout-ms 15000\ncmux browser surface:7 snapshot --interactive\n```\n\n### Clear an Input\n\n```bash\ncmux browser surface:7 fill e11 \"\" --snapshot-after --json\ncmux browser surface:7 get value e11 --json\n```\n\n### Stable Agent Loop (Recommended)\n\n```bash\n# navigate -> verify -> wait -> snapshot -> action -> snapshot\ncmux browser surface:7 get url\ncmux browser surface:7 wait --load-state complete --timeout-ms 15000\ncmux browser surface:7 snapshot --interactive\ncmux --json browser surface:7 click e5 --snapshot-after\ncmux browser surface:7 snapshot --interactive\n```\n\nIf `get url` is empty or `about:blank`, navigate first instead of waiting on load state.\n\n## Deep-Dive References\n\n| Reference | When to Use |\n|-----------|-------------|\n| [references/commands.md](references/commands.md) | Full browser command mapping and quick syntax |\n| [references/snapshot-refs.md](references/snapshot-refs.md) | Ref lifecycle and stale-ref troubleshooting |\n| [references/authentication.md](references/authentication.md) | Login/OAuth/2FA patterns and state save/load |\n| [references/authentication.md#saving-authentication-state](references/authentication.md#saving-authentication-state) | Save authenticated state right after login |\n| [references/session-management.md](references/session-management.md) | Multi-surface isolation and state persistence patterns |\n| [references/video-recording.md](references/video-recording.md) | Current recording status and practical alternatives |\n| [references/proxy-support.md](references/proxy-support.md) | Proxy behavior in WKWebView and workarounds |\n\n## Ready-to-Use Templates\n\n| Template | Description |\n|----------|-------------|\n| [templates/form-automation.sh](templates/form-automation.sh) | Snapshot/ref form fill loop |\n| [templates/authenticated-session.sh](templates/authenticated-session.sh) | Login once, save/load state |\n| [templates/capture-workflow.sh](templates/capture-workflow.sh) | Navigate + capture snapshots/screenshots |\n\n## Limits (WKWebView)\n\nThese commands currently return `not_supported` because they rely on Chrome/CDP-only APIs not exposed by WKWebView:\n- viewport emulation\n- offline emulation\n- trace/screencast recording\n- network route interception/mocking\n- low-level raw input injection\n\nUse supported high-level commands (`click`, `fill`, `press`, `scroll`, `wait`, `snapshot`) instead.\n\n## Troubleshooting\n\n### `js_error` on `snapshot --interactive` or `eval`\n\nSome complex pages can reject or break the JavaScript used for rich snapshots and ad-hoc evaluation.\n\nRecovery steps:\n\n```bash\ncmux browser surface:7 get url\ncmux browser surface:7 get text body\ncmux browser surface:7 get html body\n```\n\n- Use `get url` first so you know whether the page actually navigated.\n- Fall back to `get text body` or `get html body` when `snapshot --interactive` or `eval` returns `js_error`.\n- If the page is still failing, navigate to a simpler intermediate page, then retry the task from there.\n"}, {"name": "cmux-debug-windows", "description": "Manage cmux debug windows and related debug menu wiring for Sidebar Debug, Background Debug, and Menu Bar Extra Debug. Use this when the user asks to open/tune these debug controls, add or adjust Debug menu entries, or capture/copy a combined debug config snapshot.", "manual": false, "path": "~/.agents/skills/cmux-debug-windows", "file_count": 2, "files": ["agents/openai.yaml", "scripts/debug_windows_snapshot.sh"], "body": "---\nname: cmux-debug-windows\ndescription: Manage cmux debug windows and related debug menu wiring for Sidebar Debug, Background Debug, and Menu Bar Extra Debug. Use this when the user asks to open/tune these debug controls, add or adjust Debug menu entries, or capture/copy a combined debug config snapshot.\n---\n\n# cmux Debug Windows\n\nKeep this workflow focused on existing debug windows and menu entries. Do not add a new utility/debug control window unless the user asks explicitly.\n\n## Workflow\n\n1. Verify debug menu wiring in `Sources/cmuxApp.swift` under `CommandMenu(\"Debug\")`.\n   - Menu path in app: `Debug` → `Debug Windows` → window entry.\n   - The `Debug` menu only exists in DEBUG builds (`./scripts/reload.sh --tag ...`).\n   - Release builds (`reloadp.sh`, `reloads.sh`) do not show this menu.\n2. Keep these actions available in `Menu(\"Debug Windows\")`:\n- `Sidebar Debug…`\n- `Background Debug…`\n- `Menu Bar Extra Debug…`\n- `Open All Debug Windows`\n3. Reuse existing per-window copy buttons (`Copy Config`) in each debug window before adding new UI.\n4. For one combined payload, run:\n```bash\nskills/cmux-debug-windows/scripts/debug_windows_snapshot.sh --copy\n```\n5. After code edits, run build + tagged reload:\n```bash\nxcodebuild -project GhosttyTabs.xcodeproj -scheme cmux -configuration Debug -destination 'platform=macOS' build\n./scripts/reload.sh --tag \u003ctag>\n```\n\n## Key Files\n\n- `Sources/cmuxApp.swift`: Debug menu entries and debug window controllers/views.\n- `Sources/AppDelegate.swift`: Menu bar extra debug settings payload and defaults keys.\n\n## Script\n\n- `scripts/debug_windows_snapshot.sh`\n\nPurpose:\n- Reads current debug-related defaults values.\n- Prints one combined snapshot for sidebar/background/menu bar extra.\n- Optionally copies it to clipboard.\n\nExamples:\n```bash\nskills/cmux-debug-windows/scripts/debug_windows_snapshot.sh\nskills/cmux-debug-windows/scripts/debug_windows_snapshot.sh --copy\nskills/cmux-debug-windows/scripts/debug_windows_snapshot.sh --domain \u003cbundle-id> --copy\n```\n"}, {"name": "cmux-markdown", "description": "Open markdown files in a formatted viewer panel with live reload. Use when you need to display plans, documentation, or notes alongside the terminal with rich rendering (headings, code blocks, tables, lists).", "manual": false, "path": "~/.agents/skills/cmux-markdown", "file_count": 3, "files": ["agents/openai.yaml", "references/commands.md", "references/live-reload.md"], "body": "---\nname: cmux-markdown\ndescription: Open markdown files in a formatted viewer panel with live reload. Use when you need to display plans, documentation, or notes alongside the terminal with rich rendering (headings, code blocks, tables, lists).\n---\n\n# Markdown Viewer with cmux\n\nUse this skill to display markdown files in a dedicated panel with rich formatting and live file watching.\n\n## Core Workflow\n\n1. Write your plan or notes to a `.md` file.\n2. Open it in a markdown panel.\n3. The panel auto-updates when the file changes on disk.\n\n```bash\n# Open a markdown file as a split panel next to the current terminal\ncmux markdown open plan.md\n\n# Absolute path\ncmux markdown open /path/to/PLAN.md\n\n# Target a specific workspace\ncmux markdown open design.md --workspace workspace:2\n```\n\n## When to Use\n\n- Displaying an agent plan or task list alongside the terminal\n- Showing documentation, changelogs, or READMEs while working\n- Reviewing notes that update in real-time (e.g., a plan file being written by another process)\n\n## Live File Watching\n\nThe panel automatically re-renders when the file changes on disk. This works with:\n\n- Direct writes (`echo \"...\" >> plan.md`)\n- Editor saves (vim, nano, VS Code)\n- Atomic file replacement (write to temp, rename over original)\n- Agent-generated plan files that are updated progressively\n\nIf the file is deleted, the panel shows a \"file unavailable\" state. During atomic replace, the panel attempts automatic reconnection within its short retry window. If the file returns later, close and reopen the panel.\n\n## Agent Integration\n\n### Opening a plan file\n\nWrite your plan to a file, then open it:\n\n```bash\ncat > plan.md \u003c\u003c 'EOF'\n# Task Plan\n\n## Steps\n1. Analyze the codebase\n2. Implement the feature\n3. Write tests\n4. Verify the build\nEOF\n\ncmux markdown open plan.md\n```\n\n### Updating a plan in real-time\n\nThe panel live-reloads, so simply overwrite the file as work progresses:\n\n```bash\n# The markdown panel updates automatically when the file changes\necho \"## Step 1: Complete\" >> plan.md\n```\n\n### Recommended AGENTS.md instruction\n\nAdd this to your project's `AGENTS.md` to instruct coding agents to use the markdown viewer:\n\n```markdown\n## Plan Display\n\nWhen creating a plan or task list, write it to a `.md` file and open it in cmux:\n\n    cmux markdown open plan.md\n\nThe panel renders markdown with rich formatting and auto-updates when the file changes.\n```\n\n## Routing\n\n```bash\n# Open in the caller's workspace (default -- uses CMUX_WORKSPACE_ID)\ncmux markdown open plan.md\n\n# Open in a specific workspace\ncmux markdown open plan.md --workspace workspace:2\n\n# Open splitting from a specific surface\ncmux markdown open plan.md --surface surface:5\n\n# Open in a specific window\ncmux markdown open plan.md --window window:1\n```\n\n## Deep-Dive References\n\n| Reference | When to Use |\n|-----------|-------------|\n| [references/commands.md](references/commands.md) | Full command syntax and options |\n| [references/live-reload.md](references/live-reload.md) | File watching behavior, atomic writes, edge cases |\n\n## Rendering Support\n\nThe markdown panel renders:\n\n- Headings (h1-h6) with dividers on h1/h2\n- Fenced code blocks with monospaced font\n- Inline code with highlighted background\n- Tables with alternating row colors\n- Ordered and unordered lists (nested)\n- Blockquotes with left border\n- Bold, italic, strikethrough\n- Links (clickable)\n- Horizontal rules\n- Images (inline)\n\nSupports both light and dark mode.\n"}, {"name": "commit", "description": "Use when asked to commit, save or back up this session's work without landing it on main (\"commit this\", \"/commit\", \"commit and push\", \"save my work\", \"push the branch\"). Commits only this session's files and pushes the branch so the work is safe on the remote; the branch or worktree stays open for later. Landing on main is /merge.", "manual": false, "path": "~/.agents/skills/commit", "file_count": 0, "files": [], "body": "---\nname: commit\ndescription: Use when asked to commit, save or back up this session's work without landing it on main (\"commit this\", \"/commit\", \"commit and push\", \"save my work\", \"push the branch\"). Commits only this session's files and pushes the branch so the work is safe on the remote; the branch or worktree stays open for later. Landing on main is /merge.\n---\n\n# Commit and push (no merge)\n\nSave this session's work as a commit and push it, so closing the session can't lose anything. The branch or worktree stays as it is; landing it on `main` is `/merge`'s job. Commit right away when asked, then report.\n\n## Steps\n\n1. **Orient.** `git fetch`. Note your branch and whether you're in a worktree (`git worktree list`). Read the repo's `AGENTS.md`/`CLAUDE.md`: its commit message, branch, push and deploy rules win over this skill. `/commit` is the owner asking you to push.\n\n2. **Pick your files.** `git status`. Stage only files this session changed, by explicit path. Files you didn't touch belong to another session: leave them unstaged and list them in the report. Never stage secrets (`.env*`, keys, tokens, anything named like `SECRETS`); if one of yours is among the changes, stop and say so.\n\n3. **Choose where the commit goes.**\n   - **On a branch or in a worktree:** commit there.\n   - **On `main` (or the default branch):** if the repo's rules have work land through branches or PRs, or every push to `main` deploys, move the work to a branch first: `git switch -c \u003cshort-topic>` (uncommitted changes come along), then commit there. Commit straight on `main` only when the repo's rules or its history show that's how it works (a vault with direct commits, no merge commits on `git log --first-parent origin/main`). If you can't tell, take the branch.\n\n4. **Commit.** Message in the repo's convention (`git log -10 --oneline`; for example the vault's `task \u003cid>: \u003cwhat changed>`), otherwise `\u003carea>: \u003cwhat changed>`, with one bullet per change in the body when there is more than one. End with the attribution trailers from this session's instructions. One commit per logical change is fine; don't squash other sessions' commits.\n\n5. **Push.**\n   - Branch, first push: `git push -u origin \u003cbranch>`. Later: `git push`.\n   - Rejected because the remote moved (someone else pushed to the same branch or to `main`): `git fetch`, then `git merge origin/\u003cbranch>` (or `git pull --rebase` for your own unpushed commits on `main`), resolve keeping both sides' intent, run the tests if the repo has a quick command, push again. Never force. When the right combination isn't clear, abort the merge and stop with a recommendation.\n\n6. **Verify.** `git status -sb` shows nothing ahead, and `git log origin/\u003cbranch>..HEAD` is empty. On `main`, also `git log HEAD..origin/main` is empty (nothing from the remote dropped).\n\n7. **Leave a resume point.** Add one line to this session's `STATE.md` (the SessionStart context names its directory): `\u003cdate> committed \u003chash> on \u003cbranch>, pushed; not merged`. If `NEXT.md` exists, make sure its \"Do now\" still matches. Don't remove the worktree or the branch.\n\n8. **Report** in a few lines: the commit hash and message, the branch and where it was pushed, the files left uncommitted because they aren't yours, and the next step (`/merge` when it should land, or nothing if it stays a branch).\n\n## Common mistakes\n\n- `git add -A`, `commit -a` or `stash` to get a clean tree. Other sessions' files stay as they are.\n- Pushing straight to `main` in a repo that lands through branches or deploys on push. Branch first.\n- Committing without pushing: the work is still only on this machine.\n- Merging, removing the worktree or deleting the branch. That's `/merge`, and only when asked.\n"}, {"name": "cos-unbox", "description": "The COS vault's own /unbox (run it in ~/cos; soii updates never overwrite it, unlike soii's template /unbox). Unboxes the Inbox: takes everything out and puts it where it belongs in the vault. Reads every note in 00-Inbox/ (clippings and any agent-queue/ above all), fetches linked pages the way the Obsidian Web Clipper does, files each item as a typed note (article, video, research) in 04-Resources/Library/, sends 'check this out' items, job posts and tasks to the flowbuddy Inbox through its ingest endpoint (tasks live in flowbuddy since 2026-11-01, see AGENTS.md), logs count captures such as '20 pushups' to their count goal (with the capture's day and time), archives the handled queue notes, and, only if you use Todoist with an agent that queues tasks into your Inbox, marks those tasks complete once filed, because flowbuddy owns the task list (Todoist is optional: without it that step never runs). Shows the plan before it writes and never pushes. Run it whenever, not just weekly. Use when the owner says 'clean up the inbox', 'empty the inbox', 'process the agent queue', 'file my clippings', 'unbox t
