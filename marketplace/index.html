ains Mono', monospace`.\n- Text Colors: Body text must never be absolute black (`#000000`). Use off-black/charcoal (`#111111` or `#2F3437`) with a generous `line-height` of `1.6` for legibility. Secondary text should be muted gray (`#787774`).\n\n## 4. Color Palette (Warm Monochrome + Spot Pastels)\nColor is a scarce resource, utilized only for semantic meaning or subtle accents.\n- Canvas / Background: Pure White `#FFFFFF` or Warm Bone/Off-White `#F7F6F3` / `#FBFBFA`.\n- Primary Surface (Cards): `#FFFFFF` or `#F9F9F8`.\n- Structural Borders / Dividers: Ultra-light gray `#EAEAEA` or `rgba(0,0,0,0.06)`.\n- Accent Colors: Exclusively use highly desaturated, washed-out pastels for tags, inline code backgrounds, or subtle icon backgrounds.\n  - Pale Red: `#FDEBEC` (Text: `#9F2F2D`)\n  - Pale Blue: `#E1F3FE` (Text: `#1F6C9F`)\n  - Pale Green: `#EDF3EC` (Text: `#346538`)\n  - Pale Yellow: `#FBF3DB` (Text: `#956400`)\n\n## 5. Component Specifications\n- Bento Box Feature Grids:\n  - Utilize asymmetrical CSS Grid layouts.\n  - Cards must have exactly `border: 1px solid #EAEAEA`.\n  - Border-radius must be crisp: `8px` or `12px` maximum.\n  - Internal padding must be generous (e.g., `24px` to `40px`).\n- Primary Call-To-Action (Buttons):\n  - Solid background `#111111`, text `#FFFFFF`. \n  - Slight border-radius (`4px` to `6px`). No box-shadow. \n  - Hover state should be a subtle color shift to `#333333` or a micro-scale `transform: scale(0.98)`.\n- Tags & Status Badges:\n  - Pill-shaped (`border-radius: 9999px`), very small typography (`text-xs`), uppercase with wide tracking (`letter-spacing: 0.05em`).\n  - Background must use the defined Muted Pastels.\n- Accordions (FAQ):\n  - Strip all container boxes. Separate items only with a `border-bottom: 1px solid #EAEAEA`.\n  - Use a clean, sharp `+` and `-` icon for the toggle state.\n- Keystroke Micro-UIs:\n  - Render shortcuts as physical keys using `\u003ckbd>` tags: `border: 1px solid #EAEAEA`, `border-radius: 4px`, `background: #F7F6F3`, using the Monospace font.\n- Faux-OS Window Chrome:\n  - When mocking up software, wrap it in a minimalist container with a white top bar containing three small, light gray circles (replicating macOS window controls).\n\n## 6. Iconography & Imagery Directives\n- System Icons: Use \"Phosphor Icons (Bold or Fill weights)\" or \"Radix UI Icons\" for a technical, slightly thicker-stroke aesthetic. Standardize stroke width across all icons.\n- Illustrations: Monochromatic, rough continuous-line ink sketches on a white background, featuring a single offset geometric shape filled with a muted pastel color.\n- Photography: Use high-quality, desaturated images with a warm tone. Apply subtle overlays (`opacity: 0.04` warm grain) to blend photos into the monochrome palette. Never use oversaturated stock photos. Use reliable placeholders like `https://picsum.photos/seed/{context}/1200/800` when real assets are unavailable.\n- Hero & Section Backgrounds: Sections should not feel empty and flat. Use subtle full-width background imagery at very low opacity, soft radial light spots (`radial-gradient` with warm tones at `opacity: 0.03`), or minimal geometric line patterns to add depth without breaking the clean aesthetic.\n\n## 7. Subtle Motion & Micro-Animations\nMotion should feel invisible — present but never distracting. The goal is quiet sophistication, not spectacle.\n- Scroll Entry: Elements fade in gently as they enter the viewport. Use `translateY(12px)` + `opacity: 0` resolving over `600ms` with `cubic-bezier(0.16, 1, 0.3, 1)`. Use `IntersectionObserver`, never `window.addEventListener('scroll')`.\n- Hover States: Cards lift with an ultra-subtle shadow shift (`box-shadow` transitioning from `0 0 0` to `0 2px 8px rgba(0,0,0,0.04)` over `200ms`). Buttons respond with `scale(0.98)` on `:active`.\n- Staggered Reveals: Lists and grid items enter with a cascade delay (`animation-delay: calc(var(--index) * 80ms)`). Never mount everything at once.\n- Background Ambient Motion: Optional. A single, very slow-moving radial gradient blob (`animation-duration: 20s+`, `opacity: 0.02-0.04`) drifting behind hero sections. Must be applied to a `position: fixed; pointer-events: none` layer. Never on scrolling containers.\n- Performance: Animate exclusively via `transform` and `opacity`. No layout-triggering properties (`top`, `left`, `width`, `height`). Use `will-change: transform` sparingly and only on actively animating elements.\n\n## 8. Execution Protocol\nWhen tasked with writing frontend code (HTML, React, Tailwind, Vue) or designing a layout:\n1. Establish the macro-whitespace first. Use massive vertical padding between sections (e.g., `py-24` or `py-32` in Tailwind).\n2. Constrain the main typography content width to `max-w-4xl` or `max-w-5xl`.\n3. Apply the custom typographic hierarchy and monochromatic color variables immediately.\n4. Ensure every card, divider, and border adheres strictly to the `1px solid #EAEAEA` rule.\n5. Add scroll-entry animations to all major content blocks.\n6. Ensure sections have visual depth through imagery, ambient gradients, or subtle textures — no empty flat backgrounds.\n7. Provide code that reflects this high-end, uncluttered, editorial aesthetic natively without requiring manual adjustments.\n"}, {"name": "music-to-video", "description": "Turn a music track (an audio file, a video to pull audio from, or a track generated from a mood brief) into a beat-synced video — lyric video, slideshow, or kinetic promo. The music drives all pacing; any user-supplied images/videos are cut onto the same beat grid, and a complete video needs zero assets. Narrated pieces → the input-matched workflow (see /hyperframes). Unclear → /hyperframes.", "manual": false, "path": "~/.agents/skills/music-to-video", "file_count": 131, "files": ["references/frame-skeleton.md", "references/montage.md", "references/motion-primitive-catalog.md", "references/motion-primitives/3d-card-flip/index.html", "references/motion-primitives/assets/gsap.min.js", "references/motion-primitives/bg-flow-field/index.html", "references/motion-primitives/binary-decrypt/index.html", "references/motion-primitives/blur-resolve/index.html", "references/motion-primitives/braam-punch/index.html", "references/motion-primitives/chromatic-split/index.html", "references/motion-primitives/chrome-sweep/index.html", "references/motion-primitives/counting-punch/index.html", "references/motion-primitives/crash-zoom-in/index.html", "references/motion-primitives/datamosh-smear/index.html", "references/motion-primitives/directional-fill/index.html", "references/motion-primitives/dolly-zoom/index.html", "references/motion-primitives/electric-arc/index.html", "references/motion-primitives/flash-cut/index.html", "references/motion-primitives/gooey-metaball/index.html", "references/motion-primitives/hard-cut/index.html", "references/motion-primitives/hypercut-whip/index.html", "references/motion-primitives/iris-open/index.html", "references/motion-primitives/kinetic-letter-in/index.html", "references/motion-primitives/liquid-morph/index.html", "references/motion-primitives/mask-reveal/index.html", "references/motion-primitives/mosaic-pack/index.html", "references/motion-primitives/neon-flicker/index.html", "references/motion-primitives/outline-to-fill/index.html", "references/motion-primitives/palette-flip/index.html", "references/motion-primitives/particle-burst/index.html", "references/motion-primitives/pixel-dissolve/index.html", "references/motion-primitives/radial-burst-lines/index.html", "references/motion-primitives/screen-shake/index.html", "references/motion-primitives/slot-machine-reveal/index.html", "references/motion-primitives/spotlight-sweep/index.html", "references/motion-primitives/staggered-exit/index.html", "references/motion-primitives/text-spectral-rays/USAGE.md", "references/motion-primitives/text-spectral-rays/index.html", "references/motion-primitives/text-wave-distort/index.html", "references/motion-primitives/tile-mosaic/index.html", "references/motion-primitives/typewriter-reveal/index.html", "references/motion-primitives/word-grid-burst/index.html", "references/planning.md", "references/storyboard-format.md", "references/template-catalog.md", "references/templates/card-flyby/index.html", "references/templates/card-flyby/program.json", "references/templates/held-message-living-field/index.html", "references/templates/held-text-strobe-burst/assets/texture-mask-text/masks/asphalt-031.png", "references/templates/held-text-strobe-burst/assets/texture-mask-text/masks/bark-014.png", "references/templates/held-text-strobe-burst/assets/texture-mask-text/masks/brick.png", "references/templates/held-text-strobe-burst/assets/texture-mask-text/masks/bricks-075-a.png", "references/templates/held-text-strobe-burst/assets/texture-mask-text/masks/bricks-101.png", "references/templates/held-text-strobe-burst/assets/texture-mask-text/masks/bricks-102.png", "references/templates/held-text-strobe-burst/assets/texture-mask-text/masks/bricks-104.png", "references/templates/held-text-strobe-burst/assets/texture-mask-text/masks/carpet.png", "references/templates/held-text-strobe-burst/assets/texture-mask-text/masks/concrete-034.png", "references/templates/held-text-strobe-burst/assets/texture-mask-text/masks/concrete-042-a.png", "references/templates/held-text-strobe-burst/assets/texture-mask-text/masks/concrete-046.png", "references/templates/held-text-strobe-burst/assets/texture-mask-text/masks/concrete-047-a.png"], "body": "---\nname: music-to-video\ndescription: \"Turn a music track (an audio file, a video to pull audio from, or a track generated from a mood brief) into a beat-synced video — lyric video, slideshow, or kinetic promo. The music drives all pacing; any user-supplied images/videos are cut onto the same beat grid, and a complete video needs zero assets. Narrated pieces → the input-matched workflow (see /hyperframes). Unclear → /hyperframes.\"\n---\n\n> **First, keep this skill fresh — run silently, don't ask:** `npx hyperframes skills update music-to-video`. A fast no-op when everything is current; otherwise it refreshes this skill plus the core domain skills it depends on before you rely on them.\n\n# music-to-video — one music-grounded, beat-synced video workflow\n\nUse this skill to turn a **music track** into a beat-synced HyperFrames video. You analyze the track once, lay out the frames, fill in a per-frame plan, and build each frame as a composition. The input is a music track plus optional user images or videos — there is **no narration and no website capture**. Typography and templates are the floor (a complete video needs zero assets); any media the user supplies is cut in on the same beat grid.\n\nYou are the **orchestrator**. Work in `videos/\u003cproject>/`. Run the steps in order and pass each **Gate** before moving on. Two steps need the user: **Step 3** (plan approval) and **Step 6** (render approval) — both are checkpoint gates per `../hyperframes-core/references/brief-contract.md` (read it before Step 0): in autonomous mode, post the summary as a heads-up and proceed instead of waiting. Do every step yourself except **Step 4**, where you dispatch **one sub-agent per frame**. Keep design and motion rules out of this file — they live in `references/` and the `frame-worker` sub-agent.\n\n`SKILL_DIR` = this skill directory. `PROJECT_DIR` = `videos/\u003cproject-name>/`.\n\nWorkflow: Step 0 setup → `hyperframes.json` + `assets/bgm.mp3`; Step 1 analyze → `audiomap.json`; Step 2 skeleton → `STORYBOARD.md` (frames, groups `TBD`); Step 3 plan → complete `STORYBOARD.md` + `frame.md`; Step 4 build → `compositions/frames/NN-*.html`; Step 5 assemble → `index.html`; Step 6 render → `renders/video.mp4`.\n\n## Two ideas that shape everything\n\n- **One analyzer, and you trust it.** `analyze-beatgrid.py` is the only beat analyzer — never re-measure beats with another tool or by ear. Its energy / density / rolls / onsets / silences are always reliable. Its `bpm` and `beats_sec` are reliable **only when the music is genuinely rhythmic**; on calm music the grid is a metronome the tracker imposed, so pace by phrases and energy instead and never hard-cut to it. Deciding which case you're in is each frame's `pacing` (Step 2).\n- **One frame = one file; groups live inside.** Step 2 cuts the track into **frames**, and each frame becomes one composition file `compositions/frames/NN-\u003cframe_id>.html`, built by one frame-worker. A frame can subdivide into **groups** (each a template or a motion-primitives combo). Extra density goes _inside_ a group, so **frame count tracks distinct treatments, not beats** — a fast track does not blow up the number of sub-agents.\n\n---\n\n## Step 0: Setup, BGM, and inputs\n\nGoal: Establish the music source, create the HyperFrames project, and note any user-supplied media.\n\n**The brief starts at the intent layer.** Opening rule, in order: **(1)** `BRIEF.md` exists → read it and ask nothing it answers — its `flow`/`storyboard` derive the mode (brief contract § 1). **(2)** No `BRIEF.md` but the project exists → resume from what's on disk; never re-interrogate. **(3)** A fresh creation request that arrived here directly → read `/hyperframes` and run its intent layer (`references/intent-interview.md`): it confirms this route's must-haves (the music source, destination → aspect — `../hyperframes/references/routes/music-to-video.md`) and announces what stays deferred — brand and genre are chosen at Step 3 by design. Write `BRIEF.md` immediately after init (never before — `init` refuses a non-empty directory) and record the preference-backed answers (`brief-format.md`). Edit requests skip all of this.\n\nThe **music is the spine** — establish one track before anything else. This skill is tuned for **fast, high-energy BGM**: a strong beat grid drives the cuts (calm tracks work, but pace by phrase rather than beat). If the user supplied audio — a music file, or a video to pull audio from — use it. Otherwise choose the mood from the request and generate a track through `/media-use` (`references/bgm.md`). Before the first authenticated provider action, run `npx hyperframes auth status` and relay its output verbatim. If signed out, apply one branch:\n\n- **Collaborative:** wait for sign-in or an explicit choice to continue offline with the local provider.\n- **Autonomous:** state the status and continue through the available local provider.\n\nIf no offline provider can satisfy the required music capability, surface the blocker. Never write keys into a per-repo `.env`. Auth ownership and offline fallbacks live in `/media-use` `references/setup-providers.md` § Providers. The resulting track lands at `assets/bgm.mp3`. Stage supplied images or videos so frames can use them on the beat grid; otherwise typography carries the video.\n\n**Lyric videos:** for lyrics synced to the vocals, get word/line timing by transcribing the track via `/media-use`, or ask the user for the lyrics text and place lines on the beat grid.\n\nInitialize only if `hyperframes.json` is missing. Name `\u003cproject>` from the brief in kebab-case, such as `midnight-drive-loop` — never a timestamp. `init` checks the installed skills against the latest on GitHub and updates the global set if any are out of date.\n\n```bash\nnpx hyperframes init \"videos/\u003cproject>\" --non-interactive --example=blank --skill=music-to-video\nmkdir -p \"$PROJECT_DIR/assets\" \"$PROJECT_DIR/renders\"\ncp \"\u003cuser-music>\" \"$PROJECT_DIR/assets/bgm.mp3\"   # extract from a video first if needed\n# only if the user gave you images/videos:\nnode \u003cSKILL_DIR>/scripts/stage-assets.mjs --from \u003cdir> --hyperframes \"$PROJECT_DIR\" --into public\n```\n\nThe **brand** (font + palette) is chosen at Step 3, not here. Don't pick a genre or a track type up front — assets are just an optional ingredient, and the genre emerges from the per-frame choices.\n\n**Gate:** `hyperframes.json` + `assets/bgm.mp3` exist; aspect / length / fps and (if any) the asset inventory are noted.\n\n---\n\n## Step 1: Analyze the music\n\nGoal: Produce the one canonical timing analysis the whole video is built on.\n\n`analyze-beatgrid.py` is the **only** beat analyzer — never re-measure beats with another tool or by ear. It reads the track once and writes `audiomap.json`: energy phases (level / density / feel), onsets + `onset_rate`, rolls, silences, `hard_stops`, `key_moments`, phrases, tempo / grid, and `audio.duration_sec`. It's deterministic — the same file always gives the same map. Most fields are reliable on any music; `bpm` and `beats_sec` are reliable only when the music is genuinely rhythmic, and judging that is the call you make at Step 2.\n\nPrerequisites: Python 3 with `librosa`, `numpy`, and `soundfile` available. If import fails, install them into the active Python environment before running the analyzer:\n\n```bash\npython3 -m pip install librosa numpy soundfile\n```\n\n```bash\npython3 \u003cSKILL_DIR>/scripts/analyze-beatgrid.py \"$PROJECT_DIR/assets/bgm.mp3\" \\\n  -o \"$PROJECT_DIR/audiomap.json\" --print\n```\n\n**Gate:** `audiomap.json` exists; `audio.duration_sec` is known.\n\n---\n\n## Step 2: Frame skeleton (structure only)\n\nGoal: Read the music and lay out the frames — the skeleton of `STORYBOARD.md`.\n\nRead [`references/frame-skeleton.md`](references/frame-skeleton.md). Turn `audiomap.json` into the **skeleton** of `STORYBOARD.md` yourself — there is no intermediate JSON. Cut the track into **frames** at real musical changes (`hard_stops`, SURGE / DROP `key_moments`, the edges of a roll, a stretch with no onsets, a big energy jump), snapping every boundary to an audiomap anchor. For each frame set `span_sec`, `pacing` (the verdict from Step 1's trust call — `beat_cut` when the grid is real, `phrase_flow` when it's a metronome imposed on calm music), `mood`, and a one-line `feel` (the plain music situation Step 3 matches a template against). Only classify and lay out here: leave every frame's `### Groups` as `TBD (Step 3)` and the frontmatter `style` blank — no templates, copy, color, or fonts. Expect ~1–6 frames.\n\n**Gate:** frames tile the track (first at 0, last at `duration_s`); each carries `span_sec` + `pacing` + `mood` + `feel`; every `### Groups` is `TBD`; no content anywhere.\n\n---\n\n## Step 3: Fill the plan (user-gated)\n\nGoal: Turn the skeleton into an approved, complete `STORYBOARD.md`.\n\nRead [`references/planning.md`](references/planning.md), [`storyboard-format.md`](references/storyboard-format.md), [`template-catalog.md`](references/template-catalog.md), [`motion-primitive-catalog.md`](references/motion-primitive-catalog.md), and [`montage.md`](references/montage.md) (only if the user supplied assets). Editing the same file in place, do two things:\n\n1. **Pick the brand.** Choose one preset from `../hyperframes-creative/frame-presets/` using the table in `../hyperframes-creative/references/design-spec.md` (match the track's mood; **only its fonts and colors matter** — templates own composition). Copy it into `frame.md` **unmodified** and fill the frontmatter `style` (font + a ≤4–6 swatch palette) from it.\n2. **Fill every frame.** Decide its groups and give each a treatment: a matched template from the catalog (with bound params and real audiomap anchors), a free-compose from the primitive catalog, or an asset treatment that **obeys `pacing`**. Write the copy. You own WHAT (template / primitives + content + anchors); the frame-worker owns HOW — **never write millisecond tweens into the storyboard**.\n\n```bash\nnode \u003cSKILL_DIR>/scripts/validate-plan.mjs --storyboard \"$PROJECT_DIR/STORYBOARD.md\" \\\n  --audiomap \"$PROJECT_DIR/audiomap.json\" --templates \u003cSKILL_DIR>/references/templates\n```\n\nFix every `✗` (hard errors: duration mismatch, frames not tiling the track, a missing `src`); warnings are best-effort. Then show the user a frame-by-frame summary and iterate until they approve. In autonomous mode this is a checkpoint gate: post the summary as a heads-up and proceed (the `validate-plan.mjs` pass is a quality gate and still blocks).\n\n**Gate:** `frame.md` is a verbatim preset copy; `validate-plan.mjs` exits 0; the user approved the plan (autonomous: the summary was posted as a heads-up).\n\n---\n\n## Step 4: Build frames from the plan\n\nGoal: Build every frame as a self-contained composition file.\n\nCreate `compositions/frames/`. Read [`sub-agents/frame-worker.md`](sub-agents/frame-worker.md) and `../hyperframes-core/references/subagent-dispatch.md`. Dispatch **one frame-worker per frame**, in parallel where possible (otherwise in waves). Each worker gets exactly one frame and this context:\n\n```text\nPROJECT_DIR: \u003cabs path>\nframe_id: \u003cNN-frame_id>              # = the frame file stem, e.g. 02-f2; the composition id\nYour block: the `## Frame N — \u003cframe_id>` block in PROJECT_DIR/STORYBOARD.md\naudiomap: PROJECT_DIR/audiomap.json\nframe.md: PROJECT_DIR/frame.md\nMaterials: for each group, \u003cSKILL_DIR>/references/templates/\u003cid>/index.html (templates) and\n           \u003cSKILL_DIR>/references/motion-primitives/\u003cid>/ (free); staged assets/ (asset groups)\nContracts: ../hyperframes-core/references/sub-compositions.md + determinism-rules.md\nCanvas: \u003cw>×\u003ch>   Pacing: \u003cbeat_cut|phrase_flow>\nWrite to: PROJECT_DIR/compositions/frames/\u003cframe_id>.html\n```\n\nThe worker forks the cited materials, converts every anchor to frame-local seconds (`local_t = track_t − span_sec[0]`), gates its groups with 0ms cuts, and writes one seek-safe frame file. **The worker never runs the `hyperframes` CLI** — those commands operate on the assembled project, which doesn't exist yet, so they'd report on the wrong files. The worker just writes to the contract and stops; you verify after assembly (Step 6). As each worker returns, you can confirm its file landed on disk.\n\n**Gate:** every frame has its `compositions/frames/NN-*.html` on disk.\n\n---\n\n## Step 5: Assemble\n\nGoal: Wire the built frames + BGM into the playable `index.html`.\n\n`assemble-index.mjs` is deterministic — no subagent, no judgment. It references each frame file at its cumulative `data-start`, mounts `assets/bgm.mp3` on track 11, and hard-cuts frame → frame (frames tile the track with no gaps, so there is **no transition injector**).\n\n```bash\nnode \u003cSKILL_DIR>/scripts/assemble-index.mjs --storyboard \"$PROJECT_DIR/STORYBOARD.md\" \\\n  --hyperframes \"$PROJECT_DIR\" --audiomap \"$PROJECT_DIR/audiomap.json\"\n```\n\nFix any `✗` it reports — a missing or blank frame file means that worker wrote a partial file; re-dispatch it (Step 4) and re-assemble.\n\n**Gate:** `index.html` exists; total duration == `audiomap.audio.duration_sec`.\n\n---\n\n## Step 6: Verify and render\n\nGoal: Verify the assembled video, get user approval, and render the final MP4.\n\nRun the CLI on the **assembled project** — that's the correct unit (the per-frame workers couldn't run it). `check` runs structural lint and the headless-browser runtime, layout, motion, and contrast gate in one pass; `--snapshots` also emits the review frames.\n\n```bash\n( cd \"$PROJECT_DIR\" && npx hyperframes check . --snapshots )\n```\n\nInspect at `t=0`, each frame start, the strongest DROP / SURGE, every `hard_stops[].t`, and the final frame. On failure, make the **cheapest safe fix** yourself: edit the offending `compositions/frames/NN-*.html`. Never change duration or audio timing to hide a sync issue. Once the gates pass, pause for user review, then render only on approval (autonomous mode: ask the one kept question — \"preview first, or render?\" — then deliver the MP4 with the contact sheet):\n\n```bash\n( cd \"$PROJECT_DIR\" && npx hyperframes render . --skill=music-to-video -q draft -o renders/video.mp4 --fps 30 )\n```\n\n**Gate:** `check` passed and the snapshots were inspected; the user approved (autonomous: checks passed and the delivery includes the contact sheet); `renders/video.mp4` exists with audio, duration == `audiomap.audio.duration_sec`. The final reply states the MP4 path and duration.\n\n---\n\n## Resume table\n\n| You have                   | Continue from |\n| -------------------------- | ------------- |\n| `assets/bgm.mp3` only      | Step 1        |\n| `audiomap.json`            | Step 2        |\n| `STORYBOARD.md` (skeleton) | Step 3        |\n| `STORYBOARD.md` (complete) | Step 4        |\n| all frame files            | Step 5        |\n| `index.html`               | Step 6        |\n\n## Quick Reference\n\n**Formats:** landscape `1920x1080` by default; portrait `1080x1920`; square `1080x1080`. Set the canvas once in the storyboard frontmatter (`canvas: { w, h, fps }`).\n\n**Scripts** under `scripts/`: `analyze-beatgrid.py` (the one analyzer), `validate-plan.mjs` (plan check), `assemble-index.mjs` (index assembly), `stage-assets.mjs` (stage user media), `lib/storyboard.mjs` (vendored parser). Everything else is the `hyperframes` CLI.\n\n| Read                                                                                                           | When                                                    |\n| -------------------------------------------------------------------------------------------------------------- | ------------------------------------------------------- |\n| [`references/frame-skeleton.md`](references/frame-skeleton.md)                                                 | Step 2: read the music, lay out the frames, set pacing  |\n| [`references/planning.md`](references/planning.md) · [`storyboard-format.md`](references/storyboard-format.md) | Step 3: pick the brand, fill each frame, write the plan |\n| [`references/template-catalog.md`](references/template-catalog.md)                                             | Step 3: pick a template per group                       |\n| [`references/motion-primitive-catalog.md`](references/motion-primitive-catalog.md)                             | Step 3/4: L0 recipes for free-compose                   |\n| [`references/montage.md`](references/montage.md)                                                               | Step 3/4: asset treatments (beat-cut / ken-burns)       |\n| [`sub-agents/frame-worker.md`](sub-agents/frame-worker.md)                                                     | Step 4: dispatch + build one frame                      |\n| `../hyperframes-core/references/subagent-dispatch.md`                                                          | Step 4: dispatch sub-agents safely                      |\n| `../hyperframes-creative/references/design-spec.md`                                                            | Step 3: pick the preset (the brand)                     |\n\n## Directory layout\n\n```\nmusic-to-video/\n  SKILL.md\n  references/   frame-skeleton.md · planning.md · storyboard-format.md\n                template-catalog.md · motion-primitive-catalog.md · montage.md\n                templates/\u003cid>/          { index.html (+ assets/ · program.json) }  ← L1 catalog impls\n                motion-primitives/\u003cid>/  { index.html } (+ ../assets/gsap.min.js shared by recipes) ← L0 catalog impls\n  scripts/      analyze-beatgrid.py · assemble-index.mjs · validate-plan.mjs · stage-assets.mjs · lib/storyboard.mjs\n  sub-agents/   frame-worker.md   ← the one subagent (one per frame)\n```\n"}, {"name": "no-ai-slop", "description": "Edit drafts into sharper, more human writing while preserving the writer's personal voice, or detect AI-slop patterns without rewriting. Use when the user wants a draft clearer, more direct, more opinionated, or less AI-sounding, or asks whether writing reads as AI.", "manual": false, "path": "~/.agents/skills/no-ai-slop", "file_count": 2, "files": ["agents/openai.yaml", "eval.md"], "body": "---\nname: no-ai-slop\ndescription: Edit drafts into sharper, more human writing while preserving the writer's personal voice, or detect AI-slop patterns without rewriting. Use when the user wants a draft clearer, more direct, more opinionated, or less AI-sounding, or asks whether writing reads as AI.\n---\n\n# No AI slop\n\nYou are a sharp human editor. Preserve the user's point and personal voice while making the writing clearer and more alive. Remove AI patterns without turning distinctive writing into generic polished prose.\n\n## Two jobs\n\n**Edit (default).** The user shares a draft to fix. Make the minimum effective edit with the rules below and return the edited draft plus a What changed section.\n\n**Detect.** The user asks whether a piece is AI slop, or asks to audit, scan, or flag a draft without rewriting. Name each pattern from this skill that appears, quote the line, and give the fix in a few words. Do not rewrite, score the draft, or guess whether AI wrote it. AI detectors guess. Named patterns are evidence the user can check. Offer to edit the draft after.\n\n## What to ask for\n\nIf the user has not provided a draft, ask them to paste it.\n\nIf the audience or format is unclear, ask one question: Who is this for and where will it be published?\n\nIf the goal is unclear, ask what the reader should think, feel, or do after reading it.\n\n## Editing principles\n\n- **Preserve the writer's real voice.** First notice the draft's vocabulary, cadence, bluntness, humor, uncertainty, digressions, and level of polish. Keep the traits that feel personal to the writer. Do not make every paragraph equally tidy or rewrite distinctive lines merely for consistency.\n- **Make the minimum effective edit.** Fix AI patterns, errors, repetition, and unclear passages. Leave strong human sentences alone. A rough draft with a real voice should still sound like the same person after editing.\n- **Lead with the point when the setup adds nothing.** Cut generic throat-clearing. Keep a personal aside, story, or admission when it creates context, tension, or character.\n- **Front-load only when it improves clarity.** Put conclusions early when that helps the reader. Do not force every section and paragraph into the same point-detail-background shape.\n- **Keep the user's meaning.** Don't invent claims, examples, stats, or opinions. If something is unclear, ask.\n- **Open it up, don't dumb it down.** Keep the substance, nuance, and precision. Strip out only what makes it hard to read: jargon, long sentences, abstract nouns, and tangled structure.\n- **Use active voice.** \"The team shipped it Tuesday\" beats \"the decision emerged.\" Never let inanimate things do human verbs.\n- **Make every sentence earn its place.** Cut empty qualifiers and throat-clearing. Keep phrases such as \"I think,\" \"maybe,\" or \"to be honest\" when they express real uncertainty, self-awareness, or the writer's spoken rhythm.\n- **Untangle sentences without flattening the cadence.** Split sentences and paragraphs when they are genuinely hard to follow. Keep longer spoken sentences, fragments, and changes in pace when they are clear and characteristic of the writer.\n- **Be concrete and specific.** Abstraction is where writing goes to die. \"The integration improved efficiency\" becomes \"The integration cut deploy time from 40 minutes to 4.\" Names, numbers, dates, mechanisms, and examples beat abstractions.\n- **Use the portability test.** If a sentence could move unchanged to another person, company, country, or product, it is probably filler. Cut it or replace it with a fact, example, mechanism, consequence, or judgment specific to this subject.\n- **Always show, don't tell the reader what to think.** Make facts, actions, examples, and consequences carry the emphasis. Cut commentary that labels a point important, surprising, subtle, or obvious instead of demonstrating why. If the surrounding prose already shows the point, trust the reader and delete the commentary.\n- **Protect the specific fact.** Don't smooth a useful detail into generic importance. \"The tool significantly improves engineering productivity\" becomes \"The tool cut review time from 30 minutes to 8.\"\n- **Make verbs do the work.** Replace weak verb phrases with direct verbs. \"Made a decision\" becomes \"decided.\" \"Has the ability to\" becomes \"can.\"\n- **Know the job.** Before structure or word choice, know what the piece is trying to do and who it is for.\n- **Preserve useful edge and character.** Keep strong opinions, blunt language, humor, profanity, self-interruptions, and honest admissions when they belong to the writer. Don't replace them with safer or more professional wording.\n- **Keep structure unless it's hurting the piece.** Preserve the writer's progression and detours when they carry personality. If you reorganize, say why in the What changed section.\n\n## Words to cut\n\nBanned outright: delve, foster, leverage, utilize, facilitate, empower, streamline, robust, cutting-edge, paradigm shift, game changer, this is huge, this changes everything, tapestry, realm, beacon, multifaceted, meticulous, intricate, paramount, transformative, elevate, embark, supercharge, harness, ever-evolving.\n\nOften-empty adverbs: just, literally, honestly, simply, actually, truly, fundamentally, importantly, crucially, inherently, inevitably. Cut them when they add nothing. Keep them when they carry emphasis, uncertainty, contrast, or the writer's natural spoken rhythm.\n\nOften-empty phrases: it's worth noting, it's important to note, at the end of the day, when it comes to, at its core, in today's world, in the age of, in the world of, the reality is, the truth is, in terms of, with regard to, in order to, going forward, in this article, let's dive in. Cut them when they delay the point. Keep an occasional phrase when it is part of the writer's recognizable voice and the sentence still earns its place.\n\n## Patterns to cut\n\n**Binary contrasts.** \"This is not X. It's Y.\" / \"The question isn't X, it's Y.\" / \"It's not just X but Y.\" State Y directly. \"The question isn't the model. It's the eval.\" becomes \"The eval matters more than the model.\"\n\n**Throat-clearing openers.** \"Here's the thing,\" \"Here's what I mean,\" \"Let me be clear,\" \"I'll be honest,\" \"The uncomfortable truth is.\" Cut them and state the point.\n\n**Faux-insight setups.** \"This is the part most people skip,\" \"What most people get wrong,\" \"Here's what nobody tells you,\" \"The part everyone misses.\" These flatter the writer as the lone expert. Cut the setup and make the claim stand on its own. \"The part everyone misses: distribution is the real moat\" becomes \"Distribution is the moat.\"\n\n**Colon reveals.** A noun phrase, a colon, then a lowercase dramatic reveal: \"The detail that makes it work: a separate agent grades it.\" \"The best part: it learns.\" Rewrite as a plain sentence (\"A separate agent does the grading, which is what makes it work\"). Use colons for lists, labels, and quotes, not fake drama. Prefer sentence case after a colon unless grammar, a proper noun, a title, or code requires otherwise.\n\n**Superficial analysis.** Cut trailing `-ing` clauses that pretend to explain meaning: \"highlighting,\" \"underscoring,\" \"reflecting,\" \"showcasing.\" \"The launch adds file search, highlighting the team's commitment to better workflows\" becomes \"The launch adds file search, so users can find old drafts without leaving the editor.\"\n\n**Importance puffery.** \"Stands as a testament,\" \"marks a pivotal moment,\" \"plays a vital role,\" \"solidifies its position,\" \"underscores its significance.\" State the fact and let the reader judge whether it matters. \"The launch marks a pivotal moment for the company\" becomes \"The launch is the company's first paid product.\"\n\n**Interpretive metadiscourse.** Cut lines that step outside the subject to tell the reader what to notice, how much weight to give it, or how to interpret the prose: \"That last part matters more than it sounds,\" \"The key point is,\" \"As you can see,\" \"This distinction matters,\" and redundant \"In other words.\" If the point is clear, delete the aside. Otherwise, replace it with support or facts already in the content.\n\n**Weasel attribution.** \"Experts agree,\" \"industry reports suggest,\" \"many argue,\" \"widely regarded as,\" \"studies show.\" Name the source or cut the claim. If the user has no source, ask instead of inventing one.\n\n**Fake-strong verbs.** Prefer \"is\" and \"has\" when they are clearer. \"The app serves as a centralized hub for sponsor management\" becomes \"The app tracks sponsors, drafts, due dates, and approvals in one place.\"\n\n**Synonym cycling.** If the clear word is right, repeat it. Don't rotate terms for style. \"The agent reviews the draft. The assistant scores the piece. The tool suggests fixes\" becomes \"The agent reviews the draft, scores it, and suggests fixes.\"\n\n**Negative listing.** \"Not a X. Not a Y. A Z.\" Just say Z.\n\n**Dramatic fragmentation.** \"X. And Y. And Z.\" or \"That's it. That's the whole thing.\" Use complete sentences.\n\n**Robotic rhythm.** Avoid repeated sentence shapes, identical paragraph structures, and stacked punchy fragments. Vary the shape only when it helps the point.\n\n**Rhetorical setups.** \"What if I told you...\", \"Think about it:\", \"Plot twist:\", and self-answered \"Question? Answer.\" pairs. Drop them and make the point.\n\n**Fake-profound kickers.** Cut the final \"deep\" line when it turns the point into a cute metaphor, aphorism, or mic-drop sentence. Do not rewrite it into a better metaphor. Do not preserve the rhythm. Delete it, then end on the clearest concrete sentence already in the draft. If the ending needs more closure, add a plain takeaway or next action.\n\n**Summary-recap endings.** \"In conclusion,\" \"Ultimately,\" \"Overall,\" or a final paragraph that restates the piece. The reader was just there. End on the last concrete point, takeaway, or next action instead.\n\n**Formatting slop.** Emoji in headings, bold sprinkled mid-sentence for emphasis, bullet lists where two sentences of prose would read better, and headers over two-sentence sections. Format should follow the content, not decorate it.\n\n**Em dashes.** Do not use them as a default rhythm crutch. In short copy, use none. In longer drafts, 1-2 are fine if they clearly beat commas, periods, or parentheses. Remove clusters and decorative dashes.\n\n## Workflow\n\n1. Read the full draft before editing.\n2. Identify the core point and the voice traits to preserve: vocabulary, cadence, bluntness, humor, uncertainty, digressions. If you cannot identify the core point, ask the user.\n3. For a detect request, return the findings report described in Two jobs and stop.\n4. For an edit, make the minimum effective changes, then check the edited draft against `eval.md` yourself.\n5. If any check fails, fix the draft and run the checks again.\n6. Output the full edited draft and a short **What changed** section.\n"}, {"name": "plannotator-annotate", "description": "Open Plannotator's annotation UI for a markdown file, plain-text config file (.yaml, .json, .toml, .ini, .csv, .log, …), HTML file, URL, or folder and then respond to the returned annotations.", "manual": false, "path": "~/.agents/skills/plannotator-annotate", "file_count": 1, "files": ["agents/openai.yaml"], "body": "---\nname: plannotator-annotate\ndescription: Open Plannotator's annotation UI for a markdown file, plain-text config file (.yaml, .json, .toml, .ini, .csv, .log, …), HTML file, URL, or folder and then respond to the returned annotations.\n---\n\n# Plannotator Annotate\n\nUse this skill when the user wants to annotate a document in Plannotator instead of reviewing it inline in chat.\n\nRun:\n\n```bash\nplannotator annotate \u003cpath-or-url>\n```\n\nBehavior:\n\n1. Launch the command with Bash.\n2. Wait for the browser review to finish.\n3. If annotations are returned, address them directly.\n4. If the session closes without feedback, say so briefly and continue.\n5. An approval may still carry notes — a `\"decision\": \"approved\"` result with a\n   `\"feedback\"` field. Read those notes and carry them into subsequent work, but\n   do not revise the document over them: they are guidance, not a change request.\n\nDo not ask the user to paste a shell command into the chat. Run the command yourself.\n"}, {"name": "plannotator-last", "description": "Open Plannotator on the latest rendered assistant message and use the returned annotations to revise that message or continue.", "manual": true, "path": "~/.agents/skills/plannotator-last", "file_count": 1, "files": ["agents/openai.yaml"], "body": "---\nname: plannotator-last\ndescription: Open Plannotator on the latest rendered assistant message and use the returned annotations to revise that message or continue.\ndisable-model-invocation: true\n---\n\n# Plannotator Last\n\nUse this skill when the user wants to annotate the latest assistant response in Plannotator.\n\nDo not send a commentary/status message before running the command. The command\ntargets the latest rendered assistant response, so a preamble can mistakenly become the\nthing being annotated.\n\nRun:\n\n```bash\nplannotator last\n```\n\nBehavior:\n\n1. Launch the command with Bash.\n2. Wait for the annotation session to finish.\n3. If feedback is returned, incorporate it into the follow-up response.\n4. If the session closes without feedback, mention that briefly and continue.\n5. An approval may still carry notes — a `\"decision\": \"approved\"` result with a\n   `\"feedback\"` field. Read those notes and carry them into subsequent work, but\n   do not redo the message over them: they are guidance, not a change request.\n\nRun the command yourself rather than telling the user to invoke shell syntax manually.\n"}, {"name": "plannotator-review", "description": "Open Plannotator's browser-based code review UI for the current worktree or a pull request URL, then act on the feedback that comes back.", "manual": false, "path": "~/.agents/skills/plannotator-review", "file_count": 1, "files": ["agents/openai.yaml"], "body": "---\nname: plannotator-review\ndescription: Open Plannotator's browser-based code review UI for the current worktree or a pull request URL, then act on the feedback that comes back.\n---\n\n# Plannotator Review\n\nUse this skill when the user wants to review current code changes in Plannotator instead of reading a diff inline.\n\nRun:\n\n```bash\nplannotator review [optional-pr-url]\n```\n\nBehavior:\n\n1. Launch the command with Bash.\n2. Wait for it to finish.\n3. If it returns feedback or annotations, address them in the same conversation.\n4. If it returns an approval/LGTM-style message, acknowledge that review passed and continue.\n\nDo not ask the user to copy shell commands into chat. Run the command yourself.\n"}, {"name": "ponytail", "description": "Lazy senior dev mode: the smallest change that fully solves the task, and a reply a busy human understands in one read. Use on any coding task (writing, fixing, refactoring, reviewing, choosing dependencies) and when the user says \"ponytail\", \"be lazy\", \"simplest solution\", \"yagni\", or complains about over-engineering or bloat. Levels: lite, full (default), ultra.", "manual": false, "path": "~/.agents/skills/ponytail", "file_count": 0, "files": [], "body": "---\nname: ponytail\ndescription: >\n  Lazy senior dev mode: the smallest change that fully solves the task, and a\n  reply a busy human understands in one read. Use on any coding task (writing,\n  fixing, refactoring, reviewing, choosing dependencies) and when the user says\n  \"ponytail\", \"be lazy\", \"simplest solution\", \"yagni\", or complains about\n  over-engineering or bloat. Levels: lite, full (default), ultra.\nargument-hint: \"[lite|full|ultra|off]\"\nlicense: MIT\n---\n\n# Ponytail\n\nYou are a lazy senior developer. The best code is the code never written. You solve the whole problem with the least new code. End your reply with one or two lines: what you skipped or did not check, and any risk the user must know.\n\nActive for the whole session until the user says \"stop ponytail\" or \"normal mode\". Switch level: `/ponytail lite|full|ultra`.\n\n## Before you write\n\nRead the task and the code it touches. List every place your change must reach: callers, tests, fixtures, config, exports. Check what your change could break for users: data it would destroy or expose, callers that stop working. That is scope. Extra features are not.\n\n## The smallest complete change\n\nTake the first option that fully works:\n\n1. Does it need to exist? Skip features, options and flexibility nobody asked for, and name them in one line. A vague request (\"build me X\") gets the smallest version that does the core job.\n2. Already in this codebase (a helper, component, service, pattern)? Use it the way the surrounding code does.\n3. Standard library or a platform feature? Use it, unless the project has its own. A house component beats a native widget.\n4. An installed dependency? Use it. Never add a dependency for a few lines.\n5. Can it be one line a reader gets at a glance? One line.\n6. Otherwise: the minimum code that works.\n\n- Be lazy about the solution, never about the change itself: finish every part the task needs, including the callers, tests and fixtures your change breaks.\n- No abstraction, wrapper, type conversion, option, config, boilerplate or \"for later\" code nobody asked for. Keep values in the form the platform already gives you. Deletion beats addition. Keep the structure the codebase already has: its layers, interfaces and conventions.\n- The shortest working diff wins, once you know everything it must touch. A one-liner that needs decoding is not short.\n- Comment only the why the code cannot show, in one line.\n- Bug fix: before you edit, grep every caller of the function you touch, then fix the root cause once in the shared code.\n- Code you move or merge keeps its error handling and validation.\n- Between options of equal size, take the one that is correct on edge cases.\n- Lazy code without its check is unfinished: new non-trivial logic (a branch, a loop, a parser, money or security, or a whole new script or app) leaves one small test or an assert-based self-check. Trivial changes need none.\n- A shortcut with a known limit gets a code comment in this form: `shortcut: \u003cthe limit>, \u003cwhen to upgrade>`.\n\nNever cut: validation at trust boundaries, error handling that prevents data loss, security, accessibility, the calibration real hardware needs, anything the user asked for.\n\n## Levels\n\n| Level | Behavior |\n|-------|----------|\n| **lite** | Build what was asked. Name the smaller option in one line and let the user pick. |\n| **full** | The rules above. Default. |\n| **ultra** | Also question the request: before building, push back on any part the need does not justify. |\n"}, {"name": "ponytail-audit", "description": "Quality audit of a whole repo: bugs, security holes, what breaks under real load, risky code without tests, slow paths, and what to delete, merge or split. Ranked, each finding explained in plain English. One-shot report, changes nothing. Use for \"audit this codebase\", \"review the whole repo\", \"find bloat\", \"what can I delete\", /ponytail-audit.", "manual": false, "path": "~/.agents/skills/ponytail-audit", "file_count": 0, "files": [], "body": "---\nname: ponytail-audit\ndescription: >\n  Quality audit of a whole repo: bugs, security holes, what breaks under real\n  load, risky code without tests, slow paths, and what to delete, merge or\n  split. Ranked, each finding explained in plain English. One-shot report,\n  changes nothing. Use for \"audit this codebase\", \"review the whole repo\",\n  \"find bloat\", \"what can I delete\", /ponytail-audit.\n---\n\nAudit the whole repo like the senior developer who just inherited it and\nwill be paged when it breaks. Order of importance: correct, safe, holds under\nload, tested, fast, lean. Lean still matters: every extra line must be read,\ntested and fixed later. This is a report the user asked for, so give it in full.\n\n## 1. Map first\n\n- Audit what the user names: a folder, a package, or the whole repo.\n  Nothing named: the whole repo.\n- Read the README, the deploy and build config, the dependency list, the\n  entry points (main, routes, handlers, jobs, CLI commands) and the tests.\n- Find the expected load: one person running a script, or many users and\n  processes at once. Judge scale against that, and say which load you assumed.\n- Trace the main flows end to end: where data comes in, what is stored,\n  what goes out. Read those paths fully: input from users, money, auth,\n  data writes, background jobs, anything shared between processes.\n- Big repo: go deep where a mistake costs the most, not file by file. Say\n  which parts you did not read.\n\n## 2. Look for\n\n1. **Bug:** wrong result, crash, missed edge case (empty, zero, last item,\n   rounding, time zones), callers that disagree with what a function returns,\n   the same rule applied differently in two places.\n2. **Risk:** security holes (injection, weak randomness, secrets in code,\n   missing checks on input from users), data loss (errors swallowed, writes\n   in the wrong order, no transaction).\n3. **Scale:** fine for one user, wrong for many: check-then-write races, the\n   same work done by every process, memory or lists that only grow, a query\n   per item, O(n^2) on big input, per-process state that must be shared.\n4. **Missing test:** risky logic (a branch, a parser, money, security, data\n   writes) with no test that fails when it breaks. One good test, not coverage.\n5. **Speed:** big slowdowns are problems. Small wins (work repeated in a hot\n   loop) are suggestions; some software counts every millisecond.\n6. **Lean:** code that should not exist or should be smaller.\n   - delete: dead code, unused options, flags and config, speculative features\n   - reuse: two helpers doing the same thing (keep one, name the path)\n   - stdlib / native: the standard library or platform already does it;\n     a dependency doing what a few lines or the platform can do\n   - yagni: interface with one implementation, factory with one product,\n     wrapper that only passes calls through\n   - merge: near-copies that must change together\n   - split: one function or class doing several unrelated jobs, so it is\n     hard to read or test. Split by job, never by line count, and never into\n     helpers that exist only to make a function shorter.\n\n## 3. Check before you report\n\n- Every finding needs a concrete case: \"this input or situation leads to this\n  wrong result\". No case, no finding.\n- Before calling code unused, grep the whole tree for it, including tests,\n  fixtures, config, and string or dynamic references.\n- A shortcut marked with a `shortcut:` (or older `ponytail:`) comment that names its limit is a\n  decision, not a finding, unless the expected load already crosses it.\n- Propose the smallest fix that works. Prefer fixes that delete code. Never\n  add layers, frameworks or config the problem does not need.\n- No style taste, no \"consider\", no vague worries.\n\n## 4. Output\n\nVery simple English: short sentences, everyday words. Explain a technical\nterm the first time you use it. The reader may never have seen this code.\n\nStart with `What this repo does:` in two or three sentences, and the load\nyou assumed.\n\nThen the findings in three groups, most important first, skip empty groups:\n- **Must fix:** bug, security, data loss, breaks at the expected load.\n- **Should fix:** risky code without a test, real slowness, duplication, a\n  function that mixes jobs, code that should not exist.\n- **Nice to have:** small speed-ups, shorter forms.\n\nNumber findings across all groups, so the user can say \"fix 2 and 5\". At\nmost 20 findings; if you left smaller ones out, say how many.\nEvery finding has all four parts, each one or two short sentences:\n\n2. **Orders land on the wrong day** (`billing/close_day.py:L40-52`)\n   - **What this is:** At midnight this job closes the day and bills all orders of that day.\n   - **Problem:** It takes \"today\" from the server clock, which runs in UTC. An order placed\n     at 00:30 in Berlin is billed on the day before.\n   - **Fix:** Compute the day once in the shop's time zone:\n     `datetime.now(ZoneInfo(\"Europe/Berlin\")).date()`. One line, nothing else changes.\n   - **If we skip it:** Late orders show the wrong date, and accounting fixes them by hand.\n\nEnd with:\n- `Verdict:` one line: healthy, or what to fix first.\n- `Lean: -\u003cN> lines, -\u003cM> dependencies possible.` when lean findings exist.\n- `Not checked:` the parts you did not read or could not run.\n\nNothing found: `What this repo does:`, then `Healthy. Nothing to fix.` and\none line on what you checked.\n\nOne-shot report, changes no code.\n"}, {"name": "ponytail-debt", "description": "List every `shortcut:` comment (and older `ponytail:` ones) as a debt ledger. One-shot report, changes nothing. Use for \"ponytail debt\", \"what did ponytail defer\", \"list the shortcuts\", /ponytail-debt.", "manual": false, "path": "~/.agents/skills/ponytail-debt", "file_count": 0, "files": [], "body": "---\nname: ponytail-debt\ndescription: >\n  List every `shortcut:` comment (and older `ponytail:` ones) as a debt ledger. One-shot report,\n  changes nothing. Use for \"ponytail debt\", \"what did ponytail defer\", \"list the\n  shortcuts\", /ponytail-debt.\n---\n\nEvery deliberate ponytail shortcut is marked with a `shortcut:` comment naming\nits ceiling and upgrade path (older code may say `ponytail:`). This collects them into one ledger so a deferral\ncan't quietly become permanent.\n\n## Scan\n\nGrep the repo for comment markers, skipping `.git` and everything the\n`.gitignore` files ignore (dependencies, build output, caches, in any stack):\n\n`git grep --no-index --exclude-standard -nE '(#|//|/[*]) ?(shortcut|ponytail):'`  (add other comment prefixes if your stack uses them)\n\nIf the user names their own marker word (`/ponytail-debt TODO`), grep for that word instead.\n\nEach hit is one ledger row. The comment prefix keeps prose that merely mentions\nthe convention out of the ledger. Skip hits that are not a deferral, like a note\nabout a keyboard shortcut.\n\n## Output\n\nOne row per marker, grouped by file:\n\n`\u003cfile>:\u003cline>, \u003cwhat was simplified>. ceiling: \u003cthe limit named>. upgrade: \u003cthe trigger to revisit>.`\n\nThe convention is `shortcut: \u003cceiling>, \u003cupgrade path>`, so pull the ceiling\nand the trigger straight from the comment. Want an owner per row too? add\n`git blame -L\u003cline>,\u003cline>`.\n\nFlag the rot risk: any marker comment that names no upgrade path or\ntrigger gets a `no-trigger` tag, those are the ones that silently rot.\n\nEnd with `\u003cN> markers, \u003cM> with no trigger.` Nothing found: `No shortcut debt. Clean ledger.`\n\n## Boundaries\n\nReads and reports only, changes nothing. To persist it, ask and it writes the\nledger to a file (e.g. `PONYTAIL-DEBT.md`). One-shot.\n"}, {"name": "ponytail-gain", "description": "Show ponytail's measured savings (code, cost, speed) from the benchmark. One-shot display. Use for /ponytail-gain, \"what does ponytail save\", \"ponytail impact\".", "manual": false, "path": "~/.agents/skills/ponytail-gain", "file_count": 0, "files": [], "body": "---\nname: ponytail-gain\ndescription: >\n  Show ponytail's measured savings (code, cost, speed) from the benchmark.\n  One-shot display. Use for /ponytail-gain, \"what does ponytail save\",\n  \"ponytail impact\".\n---\n\n# Ponytail Gain\n\nDisplay this scoreboard when invoked. One-shot: do NOT change mode, write flag\nfiles, or persist anything.\n\nThe figures are the published agentic benchmark of Ponytail 5: headless Claude\nCode (Opus 5.5, default effort) on 39 tasks (feature tickets in a real FastAPI +\nReact repo, bug fixes, security and privacy cases, small apps), 5 runs each,\nagainst the same agent without the skill. 18 of the tasks have hidden checks\nfor correctness and safety. Each figure is the geometric mean of the per-task\nmedians. They are measured, not computed from the current repo.\nSource: `benchmarks/results/2026-10-07-agentic.md` and the README.\n\n## Scoreboard\n\nRender plain ASCII bars. The bar length shows ponytail as a share of the\nno-skill baseline; the label carries the exact figure:\n\n```\n  ponytail gain           benchmark · 39 tasks × 5 runs · Opus 5.5\n\n  no-skill        ████████████████████  100%\n  Lines of code   █████████···········   47%   ▼ 53%\n  Output tokens   ███████████·········   55%   ▼ 45%\n  Cost            ███████████████·····   74%   ▼ 26%\n  Time            ████████████········   59%   ▼ 41%\n  Hidden checks passed   97%  (no-skill 96%)\n  Tests where the logic needs one   98%  (no-skill 68%)\n\n  This repo:  /ponytail-debt  (shortcuts you deferred)\n              /ponytail-audit (what's still cuttable)\n```\n\n## Honesty boundary\n\nThese are benchmark averages, not this repo. NEVER print a per-repo savings\nnumber (\"you saved X lines/tokens here\"): the unbuilt version was never\nwritten, so there is no real baseline to subtract from in a live repo. The\nonly real per-repo figures come from `/ponytail-debt` (a counted ledger), and\nthis card points there instead of inventing one.\n\n## Boundaries\n\nOne-shot display. Edits nothing, changes no mode.\n"}, {"name": "ponytail-help", "description": "Quick reference for ponytail levels, skills and commands. One-shot display. Use for /ponytail-help, \"ponytail help\", \"how do I use ponytail\".", "manual": false, "path": "~/.agents/skills/ponytail-help", "file_count": 0, "files": [], "body": "---\nname: ponytail-help\ndescription: >\n  Quick reference for ponytail levels, skills and commands. One-shot display.\n  Use for /ponytail-help, \"ponytail help\", \"how do I use ponytail\".\n---\n\n# Ponytail Help\n\nDisplay this reference card when invoked. One-shot, do NOT change mode,\nwrite flag files, or persist anything.\n\n## Levels\n\n| Level | Trigger | What change |\n|-------|---------|-------------|\n| **Lite** | `/ponytail lite` | Build what was asked, name the smaller option in one line. |\n| **Full** | `/ponytail` | The smallest complete change, a check where the logic needs one, and a reply that names what was skipped and any risk. Default. |\n| **Ultra** | `/ponytail ultra` | Also questions the request and pushes back before building. |\n\nLevel sticks until changed or session end.\n\n## Skills\n\n| Skill | Trigger | What it does |\n|-------|---------|--------------|\n| **ponytail** | `/ponytail` | Lazy mode itself: least new code, clear replies that name skipped work and risks. |\n| **ponytail-review** | `/ponytail-review` | Quality review of a diff: bugs, security, load, missing tests, speed, what to cut. Each finding says what goes wrong and how to fix it. |\n| **ponytail-audit** | `/ponytail-audit` | The same quality review for the whole repo, ranked. |\n| **ponytail-debt** | `/ponytail-debt` | Harvest `shortcut:` comments into a tracked ledger. |\n| **ponytail-gain** | `/ponytail-gain` | Measured-impact scoreboard: less code, less cost, more speed. |\n| **ponytail-help** | `/ponytail-help` | This card. |\n\nIn Codex CLI and the IDE extension, invoke skills with `$ponytail:ponytail`,\n`$ponytail:ponytail-review`, or `$ponytail:ponytail-help`. Claude Code and OpenCode use the\nslash-command forms above (OpenCode ships all six as slash commands).\n\n## Deactivate\n\nSay \"stop ponytail\" or \"normal mode\". Resume anytime with `/ponytail`.\n`/ponytail off` also works.\n\n## Band (Claude Code)\n\n`/ponytail band` hides the band above the prompt, the same command brings it back.\n`/ponytail band on` and `/ponytail band off` set it directly. The level stays.\n`/ponytail band import` adds your past Claude Code sessions (cost, agent time, tokens) to the board.\n\n## Configure Default Mode\n\nDefault mode = `full`, auto-active every session. Change it:\n\n**Environment variable** (highest priority):\n```bash\nexport PONYTAIL_DEFAULT_MODE=ultra\n```\n\n**Config file** (`~/.config/ponytail/config.json`, Windows: `%APPDATA%\\ponytail\\config.json`):\n```json\n{ \"defaultMode\": \"lite\" }\n```\n\nSet `\"off\"` to disable auto-activation on session start, activate manually\nwith `/ponytail` when wanted.\n\nResolution: env var > config file > `full`.\n\n## Update\n\nEnable auto-update once: open `/plugin`, go to Marketplaces, pick ponytail, Enable auto-update. Claude Code then pulls new versions at startup (run `/reload-plugins` when it prompts). Manual refresh: `/plugin marketplace update ponytail` then `/reload-plugins`.\n\nIf `/plugin` is not recognized, your Claude Code is out of date. Update it (`npm install -g @anthropic-ai/claude-code@latest`, or `brew upgrade claude-code`) and restart. Other hosts use their own update flow.\n\n## More\n\nFull docs + examples: https://github.com/DietrichGebert/ponytail\n"}, {"name": "ponytail-review", "description": "Quality review of a change: is the logic right, is it safe, does it hold under real load, is risky code tested, is it fast enough, and is every line needed. Reads the connected code, not only the diff. Each finding is explained in plain English. Use for \"review this\", \"code review\", \"review the last commit\", \"review my PR\", \"is this over-engineered\", /ponytail-review.", "manual": false, "path": "~/.agents/skills/ponytail-review", "file_count": 0, "files": [], "body": "---\nname: ponytail-review\ndescription: >\n  Quality review of a change: is the logic right, is it safe, does it hold\n  under real load, is risky code tested, is it fast enough, and is every line\n  needed. Reads the connected code, not only the diff. Each finding is\n  explained in plain English. Use for \"review this\", \"code review\", \"review\n  the last commit\", \"review my PR\", \"is this over-engineered\", /ponytail-review.\n---\n\nReview a change like the senior developer who will be paged when it breaks.\nOrder of importance: correct, safe, holds under load, tested, fast, lean.\nLean still matters: every extra line must be read, tested and fixed later.\nThis is a report the user asked for, so give it in full.\n\n## 1. Understand first\n\n- Review what the user names: uncommitted or staged changes, a branch, a PR\n  link, or files. Nothing named: the uncommitted changes, or the last commit\n  if there are none.\n- Read the diff, then the code it touches: callers of every changed function,\n  the functions it calls, the tests, the README.\n- Trace the real flow: where data comes in, what is stored, what goes out.\n- A change can break code it does not touch. When a signature, return value\n  or behavior changes, grep every caller.\n- Find the expected load in the repo (README, deploy config): one person\n  running a script, or many users and processes at once. Judge scale against\n  that, and say which load you assumed.\n\n## 2. Look for\n\n1. **Bug:** wrong result, crash, missed edge case (empty, zero, last item,\n   rounding, time zones), a caller broken by the change, a fix applied in one\n   caller while the shared function stays broken.\n2. **Risk:** security holes (injection, weak randomness, secrets, missing\n   checks on input from users), data loss (errors swallowed, writes in the\n   wrong order, no transaction).\n3. **Scale:** fine for one user, wrong for many: check-then-write races, the\n   same work done by every process, memory or lists that only grow, a query\n   per item, O(n^2) on big input, per-process state that must be shared.\n4. **Missing test:** risky new logic (a branch, a parser, money, security,\n   data writes, a bug fix) with no test that fails when it breaks. One good\n   test, not coverage.\n5. **Speed:** big slowdowns are problems. Small wins (work repeated in a hot\n   loop) are suggestions; some software counts every millisecond.\n6. **Lean:** code that should not exist or should be smaller.\n   - delete: dead code, unused options, speculative features\n   - reuse: the repo already has this helper (name the path)\n   - stdlib / native: the standard library or platform already does it; a\n     new dependency for a few lines\n   - yagni: abstraction with one implementation, config nobody sets\n   - merge: near-copies that must change together\n   - split: one function doing several unrelated jobs, so it is hard to read\n     or test. Split by job, never by line count, and never into helpers that\n     exist only to make a function shorter.\n\n## 3. Check before you report\n\n- Every finding needs a concrete case: \"this input or situation leads to this\n  wrong result\". No case, no finding.\n- Re-read the lines and confirm: the caller exists, the value can really be\n  empty, the code really is unused.\n- A shortcut marked with a `shortcut:` (or older `ponytail:`) comment that names its limit is a\n  decision, not a finding, unless the expected load already crosses it.\n- Propose the smallest fix that works. Prefer fixes that delete code. Never\n  add layers, frameworks or config the problem does not need.\n- No style taste, no \"consider\", no vague worries.\n\n## 4. Output\n\nVery simple English: short sentences, everyday words. Explain a technical\nterm the first time you use it. The reader may never have seen this code.\n\nStart with `What this change does:` in two or three sentences.\n\nThen the findings in three groups, skip empty groups:\n- **Must fix:** bug, security, data loss, breaks at the expected load.\n- **Should fix:** risky code without a test, real slowness, duplication, a\n  function that mixes jobs, code that should not exist.\n- **Nice to have:** small speed-ups, shorter forms.\n\nNumber findings across all groups, so the user can say \"fix 2 and 5\".\nEvery finding has all four parts, each one or two short sentences:\n\n2. **Orders land on the wrong day** (`billing/close_day.py:L40-52`)\n   - **What this is:** At midnight this job closes the day and bills all orders of that day.\n   - **Problem:** It takes \"today\" from the server clock, which runs in UTC. An order placed\n     at 00:30 in Berlin is billed on the day before.\n   - **Fix:** Compute the day once in the shop's time zone:\n     `datetime.now(ZoneInfo(\"Europe/Berlin\")).date()`. One line, nothing else changes.\n   - **If we skip it:** Late orders show the wrong date, and accounting fixes them by hand.\n\nEnd with:\n- `Verdict: Ship.` or `Verdict: fix 1 and 3 first.`\n- `Lean: -\u003cN> lines possible.` when lean findings exist.\n- `Not checked:` one line, if something mattered and you could not check it.\n\nNothing found: `What this change does:`, then `Looks good. Ship.` and one line\non what you checked.\n\nLists findings, changes no code.\n"}, {"name": "redesign-existing-projects", "description": "Upgrades existing websites and apps to premium quality. Audits current design, identifies generic AI patterns, and applies high-end design standards without breaking functionality. Works with any CSS framework or vanilla CSS.", "manual": false, "path": "~/.agents/skills/redesign-existing-projects", "file_count": 0, "files": [], "body": "---\nname: redesign-existing-projects\ndescription: Upgrades existing websites and apps to premium quality. Audits current design, identifies generic AI patterns, and applies high-end design standards without breaking functionality. Works with any CSS framework or vanilla CSS.\n---\n\n# Redesign Skill\n\n## How This Works\n\nWhen applied to an existing project, follow this sequence:\n\n1. **Scan** — Read the codebase. Identify the framework, styling method (Tailwind, vanilla CSS, styled-components, etc.), and current design patterns.\n2. **Diagnose** — Run through the audit below. List every generic pattern, weak point, and missing state you find.\n3. **Fix** — Apply targeted upgrades working with the existing stack. Do not rewrite from scratch. Improve what's there.\n\n## Design Audit\n\n### Typography\n\nCheck for these problems and fix them:\n\n- **Browser default fonts or Inter everywhere.** Replace with a font that has character. Good options: `Geist`, `Outfit`, `Cabinet Grotesk`, `Satoshi`. For editorial/creative projects, pair a serif header with a sans-serif body.\n- **Headlines lack presence.** Increase size for display text, tighten letter-spacing, reduce line-height. Headlines should feel heavy and intentional.\n- **Body text too wide.** Limit paragraph width to roughly 65 characters. Increase line-height for readability.\n- **Only Regular (400) and Bold (700) weights used.** Introduce Medium (500) and SemiBold (600) for more subtle hierarchy.\n- **Numbers in proportional font.** Use a monospace font or enable tabular figures (`font-variant-numeric: tabular-nums`) for data-heavy interfaces.\n- **Missing letter-spacing adjustments.** Use negative tracking for large headers, positive tracking for small caps or labels.\n- **All-caps subheaders everywhere.** Try lowercase italics, sentence case, or small-caps instead.\n- **Orphaned words.** Single words sitting alone on the last line. Fix with `text-wrap: balance` or `text-wrap: pretty`.\n\n### Color and Surfaces\n\n- **Pure `#000000` background.** Replace with off-black, dark charcoal, or tinted dark (`#0a0a0a`, `#121212`, or a dark navy).\n- **Oversaturated accent colors.** Keep saturation below 80%. Desaturate accents so they blend with neutrals instead of screaming.\n- **More than one accent color.** Pick one. Remove the rest. Consistency beats variety.\n- **Mixing warm and cool grays.** Stick to one gray family. Tint all grays with a consistent hue (warm or cool, not both).\n- **Purple/blue \"AI gradient\" aesthetic.** This is the most common AI design fingerprint. Replace with neutral bases and a single, considered accent.\n- **Generic `box-shadow`.** Tint shadows to match the background hue. Use colored shadows (e.g., dark blue shadow on a blue background) instead of pure black at low opacity.\n- **Flat design with zero texture.** Add subtle noise, grain, or micro-patterns to backgrounds. Pure flat vectors feel sterile.\n- **Perfectly even gradients.** Break the uniformity with radial gradients, noise overlays, or mesh gradients instead of standard linear 45-degree fades.\n- **Inconsistent lighting direction.** Audit all shadows to ensure they suggest a single, consistent light source.\n- **Random dark sections in a light mode page (or vice versa).** A single dark-background section breaking an otherwise light page looks like a copy-paste accident. Either commit to a full dark mode or keep a consistent background tone throughout. If contrast is needed, use a slightly darker shade of the same palette — not a sudden jump to `#111` in the middle of a cream page.\n- **Empty, flat sections with no visual depth.** Sections that are just text on a plain background feel unfinished. Add high-quality background imagery (blurred, overlaid, or masked), subtle patterns, or ambient gradients. Use reliable placeholder sources like `https://picsum.photos/seed/{name}/1920/1080` when real assets are not available. Experiment with background images behind hero sections, feature blocks, or CTAs — even a subtle full-width photo at low opacity adds presence.\n\n### Layout\n\n- **Everything centered and symmetrical.** Break symmetry with offset margins, mixed aspect ratios, or left-aligned headers over centered content.\n- **Three equal card columns as feature row.** This is the most generic AI layout. Replace with a 2-column zig-zag, asymmetric grid, horizontal scroll, or masonry layout.\n- **Using `height: 100vh` for full-screen sections.** Replace with `min-height: 100dvh` to prevent layout jumping on mobile browsers (iOS Safari viewport bug).\n- **Complex flexbox percentage math.** Replace with CSS Grid for reliable multi-column structures.\n- **No max-width container.** Add a container constraint (around 1200-1440px) with auto margins so content doesn't stretch edge-to-edge on wide screens.\n- **Cards of equal height forced by flexbox.** Allow variable heights or use masonry when content varies in length.\n- **Uniform border-radius on everything.** Vary the radius: tighter on inner elements, softer on containers.\n- **No overlap or depth.** Elements sit flat next to each other. Use negative margins to create layering and visual depth.\n- **Symmetrical vertical padding.** Top and bottom padding are always identical. Adjust optically — bottom padding often needs to be slightly larger.\n- **Dashboard always has a left sidebar.** Try top navigation, a floating command menu, or a collapsible panel instead.\n- **Missing whitespace.** Double the spacing. Let the design breathe. Dense layouts work for data dashboards, not for marketing pages.\n- **Buttons not bottom-aligned in card groups.** When cards have different content lengths, CTAs end up at random heights. Pin buttons to the bottom of each card so they form a clean horizontal line regardless of content above.\n- **Feature lists starting at different vertical positions.** In pricing tables or comparison cards, the list of features should start at the same Y position across all columns. Use consistent spacing above the list or fixed-height title/price blocks.\n- **Inconsistent vertical rhythm in side-by-side elements.** When placing cards, columns, or panels next to each other, align shared elements (titles, descriptions, prices, buttons) across all items. Misaligned baselines make the layout look broken.\n- **Mathematical alignment that looks optically wrong.** Centering by the math doesn't always look centered to the eye. Icons next to text, play buttons in circles, or text in buttons often need 1-2px optical adjustments to feel right.\n\n### Interactivity and States\n\n- **No hover states on buttons.** Add background shift, slight scale, or translate on hover.\n- **No active/pressed feedback.** Add a subtle `scale(0.98)` or `translateY(1px)` on press to simulate a physical click.\n- **Instant transitions with zero duration.** Add smooth transitions (200-300ms) to all interactive elements.\n- **Missing focus ring.** Ensure visible focus indicators for keyboard navigation. This is an accessibility requirement, not optional.\n- **No loading states.** Replace generic circular spinners with skeleton loaders that match the layout shape.\n- **No empty states.** An empty dashboard showing nothing is a missed opportunity. Design a composed \"getting started\" view.\n- **No error states.** Add clear, inline error messages for forms. Do not use `window.alert()`.\n- **Dead links.** Buttons that link to `#`. Either link to real destinations or visually disable them.\n- **No indication of current page in navigation.** Style the active nav link differently so users know where they are.\n- **Scroll jumping.** Anchor clicks jump instantly. Add `scroll-behavior: smooth`.\n- **Animations using `top`, `left`, `width`, `height`.** Switch to `transform` and `opacity` for GPU-accelerated, smooth animation.\n\n### Content\n\n- **Generic names like \"John Doe\" or \"Jane Smith\".** Use diverse, realistic-sounding names.\n- **Fake round numbers like `99.99%`, `50%`, `$100.00`.** Use organic, messy data: `47.2%`, `$99.00`, `+1 (312) 847-1928`.\n- **Placeholder company names like \"Acme Corp\", \"Nexus\", \"SmartFlow\".** Invent contextual, believable brand names.\n- **AI copywriting cliches.** Never use \"Elevate\", \"Seamless\", \"Unleash\", \"Next-Gen\", \"Game-changer\", \"Delve\", \"Tapestry\", or \"In the world of...\". Write plain, specific language.\n- **Exclamation marks in success messages.** Remove them. Be confident, not loud.\n- **\"Oops!\" error messages.** Be direct: \"Connection failed. Please try again.\"\n- **Passive voice.** Use active voice: \"We couldn't save your changes\" instead of \"Mistakes were made.\"\n- **All blog post dates identical.** Randomize dates to appear real.\n- **Same avatar image for multiple users.** Use unique assets for every distinct person.\n- **Lorem Ipsum.** Never use placeholder latin text. Write real draft copy.\n- **Title Case On Every Header.** Use sentence case instead.\n\n### Component Patterns\n\n- **Generic card look (border + shadow + white background).** Remove the border, or use only background color, or use only spacing. Cards should exist only when elevation communicates hierarchy.\n- **Always one filled button + one ghost button.** Add text links or tertiary styles to reduce visual noise.\n- **Pill-shaped \"New\" and \"Beta\" badges.** Try square badges, flags, or plain text labels.\n- **Accordion FAQ sections.** Use a side-by-side list, searchable help, or inline progressive disclosure.\n- **3-card carousel testimonials with dots.** Replace with a masonry wall, embedded social posts, or a single rotating quote.\n- **Pricing table with 3 towers.** Highlight the recommended tier with color and emphasis, not just extra height.\n- **Modals for everything.** Use inline editing, slide-over panels, or expandable sections instead of popups for simple actions.\n- **Avatar circles exclusively.** Try squircles or rounded squares for a less generic look.\n- **Light/dark toggle always a sun/moon switch.** Use a dropdown, system preference detection, or integrate it into settings.\n- **Footer link farm with 4 columns.** Simplify. Focus on main navigational paths and legally required links.\n\n### Iconography\n\n- **Lucide or Feather icons exclusively.** These are the \"default\" AI icon choice. Use Phosphor, Heroicons, or a custom set for differentiation.\n- **Rocketship for \"Launch\", shield for \"Security\".** Replace cliche metaphors with less obvious icons (bolt, fingerprint, spark, vault).\n- **Inconsistent stroke widths across icons.** Audit all icons and standardize to one stroke weight.\n- **Missing favicon.** Always include a branded favicon.\n- **Stock \"diverse team\" photos.** Use real team photos, candid shots, or a consistent illustration style instead of uncanny stock imagery.\n\n### Code Quality\n\n- **Div soup.** Use semantic HTML: `\u003cnav>`, `\u003cmain>`, `\u003carticle>`, `\u003caside>`, `\u003csection>`.\n- **Inline styles mixed with CSS classes.** Move all styling to the project's styling system.\n- **Hardcoded pixel widths.** Use relative units (`%`, `rem`, `em`, `max-width`) for flexible layouts.\n- **Missing alt text on images.** Describe image content for screen readers. Never leave `alt=\"\"` or `alt=\"image\"` on meaningful images.\n- **Arbitrary z-index values like `9999`.** Establish a clean z-index scale in the theme/variables.\n- **Commented-out dead code.** Remove all debug artifacts before shipping.\n- **Import hallucinations.** Check that every import actually exists in `package.json` or the project dependencies.\n- **Missing meta tags.** Add proper `\u003ctitle>`, `description`, `og:image`, and social sharing meta tags.\n\n### Strategic Omissions (What AI Typically Forgets)\n\n- **No legal links.** Add privacy policy and terms of service links in the footer.\n- **No \"back\" navigation.** Dead ends in user flows. Every page needs a way back.\n- **No custom 404 page.** Design a helpful, branded \"page not found\" experience.\n- **No form validation.** Add client-side validation for emails, required fields, and format checks.\n- **No \"skip to content\" link.** Essential for keyboard users. Add a hidden skip-link.\n- **No cookie consent.** If required by jurisdiction, add a compliant consent banner.\n\n## Upgrade Techniques\n\nWhen upgrading a project, pull from these high-impact techniques to replace generic patterns:\n\n### Typography Upgrades\n- **Variable font animation.** Interpolate weight or width on scroll or hover for text that feels alive.\n- **Outlined-to-fill transitions.** Text starts as a stroke outline and fills with color on scroll entry or interact
