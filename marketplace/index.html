safe commercial, 10 = bold creative statement)`\n- IMPLEMENTATION_CLARITY: 9\n  `(1 = loose moodboard, 10 = very codeable UI reference)`\n- IMAGE_USAGE_PRIORITY: 9\n  `(1 = mostly typographic, 10 = strongly image-led)`\n- SPACING_GENEROSITY: 8\n  `(1 = compact / tight, 10 = very spacious / breathable)`\n- LAYOUT_VARIATION: 8\n  `(1 = same anchor repeats, 10 = bold composition variety across sections)`\n- CONVERSION_DISCIPLINE: 8\n  `(1 = pure art moodboard, 10 = clear funnel + premium design balance)`\n\nAI Instruction:\nUse these as global defaults unless the user clearly asks for something else.\nDo not ask the user to edit this file.\nAdapt these values dynamically from the prompt.\n\nInterpretation:\n- **Adaptation priority**: the user's brief always overrides defaults. Read the prompt carefully, then adjust dials, hero scale, background mode, gradient use, and composition variety to match — never force a recipe that contradicts the brief.\n- If the user says \"clean\", reduce density and increase clarity.\n- If the user says \"crazy creative\", increase variance and art direction.\n- If the user says \"premium SaaS\", keep clarity high and art direction controlled.\n- If the user says \"editorial\", allow stronger type and more asymmetry.\n- Bias toward stronger visual concepts, not safe layouts — but never against the brief.\n- Use imagery as a core design material — including as **full-bleed backgrounds**, not only as inline assets, **when the brief allows it**.\n- Vary composition: do not default to \"text left, image right\". Move text to bottom-left, center, top-right, etc. across sections.\n- Keep sections breathable. Do not over-pack the page.\n- Prefer slightly more whitespace between sections than default.\n- Stay conversion-aware: every section has a job (hook / proof / educate / convert).\n\n### Brief-to-direction mapping\nRead the brief. Then bias the picks like this:\n\nIf the user says **\"minimalist\" / \"clean\" / \"typography-only\" / \"swiss\" / \"ultra simple\"**:\n- Hero Scale: Mini Minimalist\n- Background Mode: solid surfaces, subtle texture, optional ONE color-blocked diptych\n- Gradients: skip or use only the softest tonal gradient\n- Composition: stacked center, generous negative space\n- Skip the \"must include full-bleed\" rule\n\nIf the user says **\"editorial\" / \"magazine\" / \"art-directed\" / \"fashion\"**:\n- Hero Scale: Mid Editorial or Giant Statement\n- Background Mode: editorial side-image, duotone treated image, atmospheric photo grade\n- Gradients: subtle tonal grades only\n- Composition: off-grid editorial offset, asymmetric pulls\n- Strong typography contrast\n\nIf the user says **\"cinematic\" / \"atmospheric\" / \"premium\" / \"luxury\" / \"bold\"**:\n- Hero Scale: Giant Statement\n- Background Mode: full-bleed image with tonal overlay, soft radial vignette + product, micro-noise gradient\n- Gradients: cinematic palette-matched welcomed\n- Composition: bottom-left over background image, centered low, image-as-canvas\n\nIf the user says **\"SaaS\" / \"product\" / \"dashboard\" / \"fintech\" / \"infra\"**:\n- Hero Scale: Mid Editorial\n- Background Mode: solid + inline asset, flat block + detail crop, occasional editorial side-image\n- Gradients: very subtle, palette-matched only\n- Composition: clear product framing, trust-driven anchors\n- Slightly higher implementation clarity\n\nIf the user says **\"agency\" / \"creative studio\" / \"portfolio\"**:\n- Hero Scale: Giant Statement OR Mini Minimalist (decisive)\n- Background Mode: vary boldly (full-bleed image, color-blocked diptych, duotone)\n- Gradients: editorial color washes acceptable\n- Composition: off-grid, poster-like\n\nIf the user says **\"e-commerce\" / \"shop\" / \"store\" / \"product page\"**:\n- Hero Scale: Mid Editorial with strong product focus\n- Background Mode: full-bleed product photo, soft radial vignette + crop, flat block + detail\n- Gradients: subtle, never competing with product\n- Composition: product-led; CTAs unmistakable\n\nIf the brief is silent on style:\n- Use defaults from §1 + §2 with confident background variety\n- Pick one Hero Scale decisively, do not split the difference\n\nNever force backgrounds, gradients, or full-bleed treatments where the brief asks for restraint. Never strip them out where the brief asks for atmosphere.\n\n---\n\n## 2. THE COMBINATORIAL VARIATION ENGINE\nTo avoid repetitive AI-looking output, internally choose one option from each category based on the prompt and commit to it consistently.\n\nDo not mash everything together into chaos.\nPick a strong combination and execute it clearly.\n\n### Theme Paradigm\nChoose 1:\n1. Pristine Light Mode\n   Off-white / cream / paper tones, sharp dark text, editorial confidence.\n2. Deep Dark Mode\n   Charcoal / graphite / zinc, elegant glow only when justified.\n3. Bold Studio Solid\n   Strong controlled color fields like oxblood, royal blue, forest, vermilion, or emerald with crisp contrasting UI.\n4. Quiet Premium Neutral\n   Bone, sand, taupe, stone, smoke, muted contrast, restrained luxury.\n\n### Background Character\nChoose 1:\n1. Subtle technical grid / dotted field\n2. Pure solid field with soft ambient gradient depth\n3. Full-bleed cinematic imagery with proper contrast control\n4. Quiet textured paper / material / tactile surface feel\n\n### Typography Character\nChoose 1:\n1. Satoshi-like clean grotesk\n2. Neue-Montreal-like refined grotesk\n3. Cabinet / Clash-like expressive display\n4. Monument-like compressed statement typography\n5. Elegant editorial serif + sans pairing\n6. Swiss rational sans with very strong hierarchy\n\nNever drift into boring default web typography energy.\n\n### Hero Architecture\nChoose 1:\n1. Cinematic Centered Minimalist\n2. Asymmetric Split Hero\n3. Floating Polaroid Scatter\n4. Inline Typography Behemoth\n5. Editorial Offset Composition\n6. Massive Image-First Hero with restrained text\n\n### Section System\nChoose 1 dominant structure:\n1. Strict modular bento rhythm\n2. Alternating editorial blocks\n3. Poster-like stacked storytelling\n4. Gallery-led visual cadence\n5. Swiss grid discipline\n6. Asymmetric premium marketing flow\n\n### Signature Component Set\nChoose exactly 4 unique components:\n- Diagonal Staggered Square Masonry\n- 3D Cascading Card Deck\n- Hover-Accordion Slice Layout\n- Pristine Gapless Bento Grid\n- Infinite Brand Marquee Strip\n- Turning Polaroid Arc\n- Vertical Rhythm Lines\n- Off-Grid Editorial Layout\n- Product UI Panel Stack\n- Split Testimonial Quote Wall\n- Oversized Metrics Strip\n- Layered Image Crop Frames\n\n### Motion-Implied Language\nChoose exactly 2:\n- scrubbing text reveal energy\n- pinned narrative section energy\n- staggered float-up energy\n- parallax image drift energy\n- smooth accordion expansion energy\n- cinematic fade-through energy\n\n### Composition Anchor (per-section)\nThe **left-text / right-image** layout is allowed, but it is the most overused AI pattern — do not use it as the default. Reach for it only when it is the genuinely best fit.\n\nEach section picks 1 anchor; across the site at least 3 different anchors must appear; vary the hero so the page does not open on the AI default.\n- Centered statement\n- Top-left lead, support bottom-right\n- Bottom-left text over background image\n- Bottom-right CTA cluster\n- Left-third caption + right-two-thirds visual (classic — use sparingly, never twice in a row)\n- Right-third caption + left-two-thirds visual (inverted classic)\n- Centered low (text in lower 40% over hero image)\n- Off-grid editorial offset (asymmetric pull)\n- Stacked center (label / headline / sub / CTA all centered, ultra minimalist)\n- Image-as-canvas with text overlaid in a clean safe area\n\n### Background Mode (per-section)\nPick 1 per section; vary across the page so it is never all the same mode. Be **confident** with backgrounds — they are a primary tool, not a risk.\n- Solid surface with inline asset\n- Subtle texture / paper / grid as background\n- Full-bleed image background with tonal overlay (text remains highly readable)\n- Editorial side-image (50/50, 60/40, 40/60 — invertible)\n- Image as the entire visual + text overlaid in a clean safe area\n- Flat color block + small product / detail crop as accent\n- Cinematic tonal gradient (palette-matched, low chroma, professional)\n- Atmospheric photo with strong color grade (single-tone graded for brand mood)\n- Duotone treated image (two-color photo treatment, palette-locked)\n- Soft radial vignette + product crop (luxury / editorial feel)\n- Micro-noise gradient over solid (premium tactile depth, not flashy)\n- Color-blocked diptych (two flat fields meeting, modernist)\n\n### CTA Variation\nPick the CTA style that fits each section, not a default pill every time:\n- Classic primary pill\n- Outline / ghost\n- Underlined inline link with arrow\n- Banner-style full-width CTA\n- Oversized headline + tiny CTA hint\n- CTA as caption under a strong visual\n\nAcross the site, vary CTA style at least once. The page's primary action stays unmistakable.\n\n### Hero Scale (per-page)\nPick 1 — must match brand mood:\n- Giant Statement Hero (massive type, large image, dominant first viewport)\n- Mid Editorial Hero (balanced type/image, cinematic but not screen-filling)\n- Mini Minimalist Hero (tiny logo + short statement + thin CTA, almost no image, lots of negative space)\n\nMini does not mean weak — it means confident restraint.\n\n### Narrative / Concept Spine\nPick 1 and let it thread through visuals and short copy across the page.\n- Artifact / collectible — proof, specimen, treasured object framing\n- Journey / pilgrimage — directional flow, waypoint sections, roadmap feeling\n- Tool / precision instrument — machined detail, calibrated UI, tactile controls\n- Living system / garden — organic growth metaphor, branching layout, nurtured tone\n- Stage / spotlight — theatrical contrast, performer + audience framing\n- Archive / dossier — indexed rows, captions, understated authority\n\n### Second-Read Moment\nPick exactly 1 unobvious but legible motif and place it deliberately, once across the page:\n- asymmetric bleed that still respects hierarchy\n- one oversized punctuation or numeral serving structure\n- a single unexpected material switch (paper vs gloss vs metal accent)\n- a narrow vertical side-rail editorial note style\n- a macro crop that carries brand color naturally\nAvoid gimmick-for-gimmick: the moment must aid scan order or brand recall.\n\nImportant:\nThese are not coding instructions.\nThey are visual-direction cues the generated design should imply.\n\n---\n\n## 3. FRONTEND REFERENCE RULE\nEvery generated image must clearly communicate:\n- layout\n- section hierarchy\n- spacing\n- typography scale\n- visual rhythm\n- CTA priority\n- component styling\n- image treatment\n- overall design system\n\nA developer or coding model should be able to look at the image and understand how to build it.\n\nDo not produce vague abstract artwork when the request is for frontend.\n\n---\n\n## 4. HERO MINIMALISM RULES\nThe hero must feel cinematic, clear, and intentional.\n\n### Hero Composition Bias\nThe **left-text / right-image hero is the most overused AI hero pattern**. It is allowed, but it should not be your default starting point.\n\nPrefer one of these instead, unless left-text / right-image is genuinely the strongest fit:\n- Centered statement over full-bleed image (text in lower 40%)\n- Bottom-left text over background image\n- Bottom-right text over background image\n- Top-left lead, support bottom-right\n- Stacked center (label / headline / sub / CTA all centered)\n- Image-as-canvas with text overlaid in a clean safe area\n- Right-text / left-image (inverted classic)\n- Off-grid editorial offset\n- Mini Minimalist Hero (tiny logo + short statement + thin CTA, mostly negative space)\n\n### Pre-output check\nBefore rendering the hero image, ask yourself: \"Am I drafting the default text-left / image-right layout out of habit?\" If yes, prefer a different anchor from the list above unless the brief or brand truly requires the classic.\n\n### Absolute Hero Rules\n- the hero must feel like a strong opening scene\n- keep the hero composition clean\n- do not overcrowd the first viewport\n- the main headline must feel short and powerful\n- headline should usually read like 5-10 strong words, not a paragraph\n- keep supporting text concise\n- prioritize negative space and contrast\n- avoid stuffing the hero with pills, fake stats, badges, tiny logos, and nonsense detail\n\n### Headline Rule\nThe H1 should visually read like a premium statement.\nDo not let it feel long, weak, or overly wrapped.\n\n### Typography Execution\nPrefer:\n- medium / normal / light elegance\n- tight tracking\n- controlled line count\n- strong scale contrast\n\nAvoid:\n- random extra-bold shouting everywhere\n- gradient text as a lazy premium effect\n- 6-line startup headings\n- text treatment that looks generated\n\n### Graphic Restraint\nDo not default to:\n- giant meaningless outline numbers\n- cheap SVG-looking filler graphics\n- generic AI blobs\n- random orb clutter\n\nUse:\n- typography\n- image crops\n- real layout tension\n- premium materials\n- strong framing\ninstead.\n\n---\n\n## 5. IMAGE COUNT & PAGE SLICING\n\n### THIS IS THE PRIMARY OUTPUT RULE\nGenerate **one separate horizontal image PER section**. Always.\n\n- never combine multiple sections in a single image\n- never return a single tall slice that contains the whole page\n- never return one \"best\" image and skip the rest\n- never replace several sections with one collage\n\nIf the request is ambiguous about section count, **default high**:\n- \"hero\" -> 1 image\n- \"landing page\" / \"site template\" -> default to 6 sections -> 6 images\n- \"full website\" -> default to 8 sections -> 8 images\n- \"marketing site\" -> default to 8 sections -> 8 images\n- \"product page\" -> default to 6 sections -> 6 images\n- \"portfolio\" -> default to 6 sections -> 6 images\n\nIf the model can only render one image per call, generate them **sequentially in the same response**, one after the other, labeled \"Section X of N: \u003cname>\" until the full set is delivered.\n\n### Format\n- Always horizontal (16:9, 16:10, or 21:9 depending on density)\n- Each image renders one focused section in high fidelity\n- Hero usually 16:9 or 21:9; narrower content sections may be 16:10\n\n### Counting rule\n- 1 section -> 1 horizontal image\n- 4 sections -> 4 horizontal images\n- 8 sections -> 8 horizontal images\n- 12 sections -> 12 horizontal images\n\nDo not collapse multiple sections into one tall slice. Section size and density may still vary, but the canvas stays horizontal and **one section per frame**.\n\n### Section size variety\nAcross the site, mix section ambition deliberately:\n- some sections are large, content-rich, art-directed\n- some sections are mini, ultra minimalist, mostly negative space\n- some sections are medium editorial blocks\n\nThis rhythm creates a premium scrollscape, not uniform slabs.\n\n### Continuity Rule\nAcross all per-section images, enforce one brand world:\n- same palette and accent logic\n- same typography family and scale\n- same CTA family (style variations are fine, identity is not)\n- same border radius language\n- same image treatment (color grade, materials, framing)\n- same tonal voice in any short copy\n\nA viewer scrolling through all frames must read them as one site.\n\n---\n\n## 6. CREATIVITY ESCALATION RULE\nThe design must show real creative ambition.\n\nDo not settle for the first obvious layout solution.\nPush the work beyond generic SaaS patterns.\n\nActively increase at least 3 of these:\n- stronger composition\n- more distinctive typography\n- more confident scale contrast\n- more memorable hero concept\n- more interesting image treatment\n- more expressive section rhythm\n- more original framing / cropping\n- more art-directed visual tension\n- more surprising but clear layout structure\n\nCreativity must feel intentional, not chaotic.\n\nDo:\n- make bold but controlled design decisions\n- use asymmetry when it improves the page\n- create visual moments that feel premium and memorable\n- make the page feel designed, not auto-generated\n\nDo not:\n- default to safe template layouts\n- repeat the same block structure too often\n- confuse creativity with clutter\n- make the page overly dense\n\n---\n\n## 7. IMAGE-FIRST ART DIRECTION\nThis skill must actively use images.\n\nImages are not optional decoration.\nImages are a core part of the frontend design language.\n\nStrongly prefer:\n- art-directed photography\n- product imagery\n- editorial imagery\n- image crops\n- framed image panels\n- layered image compositions\n- image-led hero sections\n- image-supported storytelling blocks\n\nUse images to:\n- create visual hierarchy\n- break up text-heavy layouts\n- build mood and brand character\n- support section transitions\n- make the design easier to interpret and implement\n\nImportant:\n- the design should not become text-only or card-only unless the user explicitly wants that\n- if a page has multiple sections, several sections should meaningfully include imagery\n- if a hero exists, it should usually contain a strong visual image, product visual, or art-directed media element\n- imagery should feel premium and intentional, not like stock filler\n\nAvoid:\n- tiny useless thumbnails\n- random decorative images with no structural role\n- one single image and then a completely text-heavy rest of page\n- overusing fake UI panels instead of real visual variety\n\n---\n\n## 8. ANTI-AI-SLOP RULES\nStrictly avoid these patterns unless explicitly requested.\n\n### Layout slop\n- endless centered sections\n- identical card rows repeated section after section\n- cloned left-text/right-image blocks\n- perfect but lifeless symmetry everywhere\n- fake complexity without hierarchy\n- empty decorative space with no purpose\n\n### Visual slop\n- default purple/blue AI gradients\n- too many glowing edges\n- floating spheres / blobs everywhere\n- glassmorphism stacked without reason\n- random futuristic details with no structure\n- over-rendered noise that hides the layout\n\n### Typography slop\n- giant heading + weak tiny subcopy\n- too many font moods in one page\n- awkward line breaks\n- lazy all-caps everywhere\n- gradient headline as shortcut for \"premium\"\n\n### Content slop\nBan generic copy vibes like:\n- unleash\n- elevate\n- revolutionize\n- next-gen\n- seamless\n- powerful solution\n- transformative platform\n\nAvoid fake brand slop:\n- Acme\n- Nexus\n- Flowbit\n- Quantumly\n- NovaCore\n- obvious nonsense wordmarks\n\nUse short, believable, design-friendly copy.\n\n### Density slop\n- no over-packed sections\n- no card overload in every block\n- no tiny spacing between major sections\n- no trying to fill every empty area\n- no visually exhausting wall-of-content layouts\n\n### Carousel / marquee slop (layout)\n- infinity logo strips repeating the same 6 blobs\n- “trusted by” ticker that is unreadable mosquito logos\n- auto-play-style hero dots with no semantic purpose\n\n### Data / KPI slop\n- three identical stat columns (99% satisfaction, $10 saved, ∞ scale) unless user asked for KPIs\n- fake dashboards with pointless charts shading the real layout\n\n---\n\n## 9. TYPOGRAPHY-FIRST DISCIPLINE\nTypography is not filler.\nTypography is a primary design material.\n\nAlways ensure:\n- clear size contrast\n- obvious reading order\n- strong display moments\n- supporting text that is readable and brief\n- labels, captions, and section headings that reinforce structure\n\nFor editorial directions:\n- let typography shape composition\n\nFor tech/product directions:\n- let typography communicate trust and precision\n\n---\n\n## 10. SECTION RHYTHM RULE\nA high-end site does not feel like repeated boxes.\n\nVary section rhythm across the page by changing:\n- density\n- image-to-text ratio\n- alignment\n- scale\n- whitespace\n- card grouping\n- background intensity\n- visual tempo\n\nDo not let every section feel generated from the same template.\n\nImportant:\n- rhythm variation should not break overall cleanliness\n- keep the page visually balanced from top to bottom\n- section heights may vary, but the spacing between sections should feel controlled and fairly even\n- avoid abrupt jumps between very small and very large sections without enough breathing room\n- the full page should feel curated, smooth, and consistent\n\n---\n\n## 11. COMPONENT EXECUTION GUIDELINES\n\n### Diagonal Staggered Square Masonry\nUse square image or content blocks with strong staggered vertical rhythm.\nShould feel curated and graphic, not messy.\n\n### 3D Cascading Card Deck\nCards layered as a physical stack with depth logic.\nShould feel premium and tactile, not gimmicky.\n\n### Hover-Accordion Slice Layout\nA row of compressed visual slices that feel expandable.\nIn static images, imply interaction clearly through proportions and emphasis.\n\n### Pristine Gapless Bento Grid\nMathematically clean grid.\nNo accidental gaps.\nMix large visual blocks with smaller dense information panels.\n\n### Turning Polaroid Arc\nClustered, rotated imagery with elegant composition.\nShould feel styled and intentional, not scrapbook-random.\n\n### Off-Grid Editorial Layout\nUse asymmetry and tension with control.\nMust remain readable and clearly structured.\n\n### Product UI Panel Stack\nLayer UI screens or interface crops to imply a product story.\nAvoid generic fake dashboards.\n\n### Vertical Rhythm Lines\nUse fine lines and spacing systems to reinforce order and elegance.\nNever let them become decorative clutter.\n\n---\n\n## 12. DENSITY & SPACING DISCIPLINE\nDo not make everything too dense.\n\nThe page should breathe.\nLeave slightly more blank space between sections than a default AI-generated design would.\n\nRules:\n- use more even vertical spacing between major sections\n- keep section-to-section spacing consistent unless there is a strong design reason not to\n- avoid one section feeling very cramped while the next feels too empty\n- prefer a clean, balanced cadence across the page\n- allow negative space to create rhythm and emphasis\n- separate denser sections with calmer sections\n- avoid stacking too many cards, labels, and content blocks too tightly\n- smaller sections should still receive enough surrounding space so the page feels polished and intentional\n\nA premium page should feel:\n- open\n- composed\n- balanced\n- confident\n- breathable\n\nNot:\n- cramped\n- noisy\n- uneven\n- overfilled\n- visually exhausted\n\nSection rhythm should alternate with control:\n- some sections can be more content-rich\n- some sections can be smaller and calmer\n- but the overall spacing cadence should still feel even, clean, and deliberate\n\nWhitespace is a design tool.\nUse it deliberately.\nDo not let spacing become random.\n\n---\n\n## 13. COLOR & MATERIAL RULES\n\n### Palette Discipline\nUse one controlled palette across the entire site:\n- 1 primary (brand anchor)\n- 1 secondary (supporting tone)\n- 1 accent (used sparingly for CTA / highlight)\n- a neutral scale (background, surface, text, hairline)\n\nSection-level mood shifts must reuse the same palette — no full theme swap per section.\n\n### Background-image harmony\nWhen using full-bleed image backgrounds:\n- the image must tonally match the palette (not fight it)\n- use overlays (dark, light, or color tint) to keep text fully readable\n- the brand accent stays consistent regardless of background image\n\n### Gradient Discipline\nGradients are **allowed and encouraged** when professional and subtle. They are not the same as AI slop gradients.\n\nAllowed (use confidently):\n- low-chroma palette-matched tonal gradients (e.g. ink to graphite, cream to sand, ivory to warm grey)\n- single-hue atmospheric grades behind hero photography\n- soft vignettes and radial depth that direct the eye\n- noise-textured gradients adding tactile depth without color noise\n- editorial color washes that match brand mood\n\nBanned (AI gradient slop):\n- rainbow / mesh blob gradients\n- purple-to-blue \"AI\" defaults\n- pink-to-orange \"creator\" defaults\n- neon edges and glow halos with no purpose\n- gradient text as a shortcut for \"premium\"\n- gradients that compete with imagery instead of supporting it\n\n### Background Confidence Rule\nDo not retreat to plain white surfaces by default. When the brief, brand mood, or section job calls for atmosphere, use:\n- a full-bleed image,\n- a duotone or graded photo,\n- a tonal gradient,\n- a tactile material,\nor a confident flat color field — picked deliberately, not as decoration.\n\n### Strong guidance\n- avoid rainbow randomness\n- avoid over-neon unless requested\n- keep contrast intentional\n- match accent colors to the chosen theme paradigm\n- gradients must always read as professional and intentional, never as visual noise\n\n### Materiality\nWhere appropriate, add:\n- paper feel\n- glass feel\n- brushed metal feel\n- soft blur depth\n- tactile matte surfaces\n- editorial photo treatment\n\nBut always keep the frontend structure readable.\n\n---\n\n## 14. IMAGE / MEDIA DIRECTION\nIf imagery is present, it must support the layout.\n\nAllowed:\n- art-directed product visuals\n- refined editorial photography\n- UI crops\n- abstract forms with structural purpose\n- framed objects\n- premium texture use\n- campaign-style visuals\n\nAvoid:\n- irrelevant scenery\n- stock-photo cliches\n- decorative junk\n- visuals that overpower the page hierarchy\n\n---\n\n## 15. DEFAULT SITE PACKS\n\n### 4-section pack\n1. Hero\n2. Features\n3. Social proof / testimonial\n4. CTA\n\n### 8-section pack\n1. Hero\n2. Trust bar\n3. Features\n4. Product showcase\n5. Benefits / use cases\n6. Testimonials\n7. Pricing\n8. CTA\n\n### 12-section pack\n1. Hero\n2. Trust bar\n3. Feature grid\n4. Product preview\n5. Problem / solution\n6. Benefits\n7. Workflow\n8. Metrics / proof / integration\n9. Testimonials\n10. Pricing\n11. FAQ\n12. CTA + footer\n\n---\n\n## 16. MULTI-IMAGE CONSISTENCY RULE\nBecause every section is its own image, consistency is critical. Across all per-section frames enforce:\n- same brand world\n- same type scale logic\n- same spacing discipline\n- same CTA family (style variations are fine, identity is not)\n- same icon or illustration mood\n- same image treatment (grade, framing, material vocabulary)\n- same tonal language in any copy\n\nVariation IS allowed in:\n- composition anchor (per section)\n- background mode (per section)\n- section size and density\n- which \"second-read\" moment appears\n\nA viewer flipping through every per-section frame must still recognize one brand. Anything that breaks brand recall is over-variation.\n\n---\n\n## 17. CLARITY CHECK\nBefore finalizing, verify internally:\n\n1. Is the hierarchy obvious?\n2. Is the hero clean enough?\n3. Is the design visually distinctive?\n4. Is it free of obvious AI tells?\n5. Is it premium rather than template-like?\n6. Can someone code from this?\n7. If multiple images exist, do they clearly belong together?\n8. Is imagery used strongly enough (with variation, not one repeated crop)?\n9. Does the page breathe, or is it too dense?\n10. Is there enough spacing between sections?\n11. Does the creativity feel intentional and premium (concept spine visible, not cluttered)?\n12. Is the spacing between sections even and controlled?\n13. Do smaller sections still have enough surrounding space to feel clean?\n14. Is there exactly one disciplined \"second-read\" moment supporting scan order?\n15. Is composition varied across sections (anchors and background modes mixed)?\n16. Is the hero scale (giant / mid / mini) chosen and executed cleanly?\n17. Is there a clear conversion path (hook -> proof -> action) even in artistic sites?\n18. Is the palette consistent across all per-section images?\n19. Is each image horizontal and one-section-only?\n20. Is the **total number of images equal to the number of sections** (never fewer)?\n21. Is the hero using a varied composition (not defaulting to left-text / right-image out of habit)?\n\nIf not, refine internally before output. If the count is wrong, regenerate the missing sections. If the hero feels like a reflexive left-text / right-image default, prefer a different composition anchor.\n\n---\n\n## 18. EXTRA CREATIVITY & IMPLEMENTATION EDGE\n\nApply unless the user opts out:\n\n### Cross-section contrast\nAcross the slice, deliberately vary foreground/background intensity at least twice (lighter → richer → calmer) so the scroll feels paced, not monotonous slabs.\n\n### CTA specificity\nPrefer one unmistakable primary action per major viewport tier; secondary actions must look secondary (scale, outline, ghost), not clones of primary.\n\n### Image variety inside one comp\nMix at least **two distinct image crops** where multiple sections exist — e.g. macro product + contextual environment, or portrait editorial + widescreen artifact — avoiding one repeated stock silhouette.\n\n### Data-viz restraint\nCharts, sparklines, and graphs appear only when the site type logically needs them (analytics, pricing, infra, observability brands). Else keep proof human (quotes, receipts, timelines, screenshots of real workflows).\n\n### Cultural / tonal alignment\nWhen the brief names an industry or region, steer palette and typographic temperament to match — don’t ship default “neutral SF startup” unless the brief is intentionally generic SaaS.\n\n### Mobile-implied fidelity (even for desktop mocks)\nMaintain tap-friendly hit sizes and readable caption sizes visually; stacking order should imply a sane single-column narrative.\n\n### Conversion focus\nEach section has a job. Even when the design is artistic, the page must read as a real product or brand site:\n- the hero communicates value in seconds and offers one obvious next action\n- proof sections (logos, quotes, metrics) feel earned, not stuffed\n- pricing or CTA sections feel decisive, not buried\n- the final section closes: a single strong CTA + supporting trust cue\nAvoid pure mood reels with no funnel logic.\n\n### Composition variety check\nAcross all per-section images, internally log the chosen composition anchor and background mode. Reject the set if:\n- the same composition anchor repeats more than 2 sections in a row\n- the same background mode repeats more than 3 sections in a row\n- every section is inline-asset (no full-bleed background ever appears) **AND** the brief does not call for minimalism / typography-only / swiss / ultra simple\n\nFor non-minimalist briefs: push for at least one full-bleed (or duotone / atmospheric) background and at least one mini minimalist section in any multi-section site.\n\nFor minimalist briefs: this rule is suspended. Restraint is the design.\n\n---\n\n## 19. RESPONSE BEHAVIOR\nWhen the user asks for a frontend design:\n1. infer site type and primary conversion goal\n2. infer number of sections (if unclear, use the defaults from §5: landing page = 6, full website = 8)\n3. **commit out loud** to the section count and announce it (\"Generating N horizontal images, one per section\")\n4. plan ONE horizontal image PER SECTION — always separate generations, never collapse\n5. choose Hero Scale for the whole site (giant / mid / mini)\n5. choose a strong visual combination (theme, type, hero arch, section system, motion, narrative spine, second-read moment)\n7. for each section: pick a Composition Anchor, Background Mode, and CTA Variation — vary across sections\n8. choose 4 signature components used appropriately across sections\n9. enforce hero minimalism + section size variety (some giant, some mini)\n10. enforce strong image usage including full-bleed backgrounds where it fits\n11. lock one consistent palette across all images\n12. apply §18 EXTRA CREATIVITY & IMPLEMENTATION EDGE\n13. keep spacing generous, even, and clean\n14. remove AI slop (including marquee / fake KPI clichés unless requested)\n15. run §17 CLARITY CHECK\n16. **generate every per-section horizontal image, labeled \"Section X of N: \u003cname>\"**, until the full set is delivered. Do not stop early. Do not summarize. Do not return only one image.\n\nDo not ask unnecessary follow-up questions if a strong interpretation is possible.\n\n---\n\n## 20. EXAMPLE INTERPRETATIONS\n\n### Example 1\nUser: \"make a hero section for an AI startup\"\n\nInterpretation:\n- 1 horizontal image\n- Hero Scale: Mid Editorial or Giant Statement\n- Composition Anchor: bottom-left text over full-bleed product/atmosphere image\n- Background Mode: full-bleed image with dark tonal overlay\n- CTA Variation: outlined inline + small label hint\n- Palette: Deep Dark or Bold Studio Solid, one consistent accent\n- no cliche dashboard spam, no purple AI glow\n\n### Example 2\nUser: \"design 8 sections for a fintech website\"\n\nInterpretation:\n- 8 separate horizontal images (one per section)\n- Hero Scale: Mid Editorial (trust-driven)\n- vary Composition Anchor across sections (centered low, right-third caption, bottom-left over chart visual, stacked center for closing CTA)\n- Background Mode mix: solid surface, full-bleed image background once, editorial side-image at use cases\n- one consistent palette (e.g. ink + paper + single brand accent)\n- conversion path: hook -> proof bar -> features -> use case -> testimonial -> pricing -> FAQ -> final CTA\n\n### Example 3\nUser: \"creative agency landing page, 12 sections\"\n\nInterpretation:\n- 12 horizontal images (one per section)\n- Hero Scale: Giant Statement OR Mini Minimalist (decisive choice, not in-between)\n- editorial / poster-like direction; off-grid composition appears 2-3 times\n- multiple Background Modes (full-bleed image at hero + showcase, editorial side-image at case studies, solid + accent for process)\n- palette consistent throughout, with one bold accent recurring\n- closing CTA section: mini minimalist, strong type, single primary action\n\n---\n\n## 21. FINAL GOAL\nGenerate frontend reference images that feel:\n- artistic\n- premium\n- clear\n- structured\n- image-led\n- breathable\n- memorable\n- anti-generic\n- implementation-friendly\n\nThe result should look like a top-tier website concept with strong imagery, confident creativity, and generous spacing - not a dense, repetitive AI layout.\n"}, {"name": "industrial-brutalist-ui", "description": "Raw mechanical interfaces fusing Swiss typographic print with military terminal aesthetics. Rigid grids, extreme type scale contrast, utilitarian color, analog degradation effects. For data-heavy dashboards, portfolios, or editorial sites that need to feel like declassified blueprints.", "manual": false, "path": "~/.agents/skills/industrial-brutalist-ui", "file_count": 0, "files": [], "body": "---\nname: industrial-brutalist-ui\ndescription: Raw mechanical interfaces fusing Swiss typographic print with military terminal aesthetics. Rigid grids, extreme type scale contrast, utilitarian color, analog degradation effects. For data-heavy dashboards, portfolios, or editorial sites that need to feel like declassified blueprints.\n---\n\n# SKILL: Industrial Brutalism & Tactical Telemetry UI\n\n## 1. Skill Meta\n**Name:** Industrial Brutalism & Tactical Telemetry Interface Engineering\n**Description:** Advanced proficiency in architecting web interfaces that synthesize mid-century Swiss Typographic design, industrial manufacturing manuals, and retro-futuristic aerospace/military terminal interfaces. This discipline requires absolute mastery over rigid modular grids, extreme typographic scale contrast, purely utilitarian color palettes, and the programmatic simulation of analog degradation (halftones, CRT scanlines, bitmap dithering). The objective is to construct digital environments that project raw functionality, mechanical precision, and high data density, deliberately discarding conventional consumer UI patterns.\n\n## 2. Visual Archetypes\nThe design system operates by merging two distinct but highly compatible visual paradigms. **Pick ONE per project and commit to it. Do not alternate or mix both modes within the same interface.**\n\n### 2.1 Swiss Industrial Print\nDerived from 1960s corporate identity systems and heavy machinery blueprints.\n*   **Characteristics:** High-contrast light modes (newsprint/off-white substrates). Reliance on monolithic, heavy sans-serif typography. Unforgiving structural grids outlined by visible dividing lines. Aggressive, asymmetric use of negative space punctuated by oversized, viewport-bleeding numerals or letterforms. Heavy use of primary red as an alert/accent color.\n\n### 2.2 Tactical Telemetry & CRT Terminal\nDerived from classified military databases, legacy mainframes, and aerospace Heads-Up Displays (HUDs).\n*   **Characteristics:** Dark mode exclusivity. High-density tabular data presentation. Absolute dominance of monospaced typography. Integration of technical framing devices (ASCII brackets, crosshairs). Application of simulated hardware limitations (phosphor glow, scanlines, low bit-depth rendering).\n\n## 3. Typographic Architecture\nTypography is the primary structural and decorative infrastructure. Imagery is secondary. The system demands extreme variance in scale, weight, and spacing.\n\n### 3.1 Macro-Typography (Structural Headers)\n*   **Classification:** Neo-Grotesque / Heavy Sans-Serif.\n*   **Optimal Web Fonts:** Neue Haas Grotesk (Black), Inter (Extra Bold/Black), Archivo Black, Roboto Flex (Heavy), Monument Extended.\n*   **Implementation Parameters:**\n    *   **Scale:** Deployed at massive scales using fluid typography (e.g., `clamp(4rem, 10vw, 15rem)`).\n    *   **Tracking (Letter-spacing):** Extremely tight, often negative (`-0.03em` to `-0.06em`), forcing glyphs to form solid architectural blocks.\n    *   **Leading (Line-height):** Highly compressed (`0.85` to `0.95`).\n    *   **Casing:** Exclusively uppercase for structural impact.\n\n### 3.2 Micro-Typography (Data & Telemetry)\n*   **Classification:** Monospace / Technical Sans.\n*   **Optimal Web Fonts:** JetBrains Mono, IBM Plex Mono, Space Mono, VT323, Courier Prime.\n*   **Implementation Parameters:**\n    *   **Scale:** Fixed and small (`10px` to `14px` / `0.7rem` to `0.875rem`).\n    *   **Tracking:** Generous (`0.05em` to `0.1em`) to simulate mechanical typewriter spacing or terminal matrices.\n    *   **Leading:** Standard to tight (`1.2` to `1.4`).\n    *   **Casing:** Exclusively uppercase. Used for all metadata, navigation, unit IDs, and coordinates.\n\n### 3.3 Textural Contrast (Artistic Disruption)\n*   **Classification:** High-Contrast Serif.\n*   **Optimal Web Fonts:** Playfair Display, EB Garamond, Times New Roman.\n*   **Implementation Parameters:** Used exceedingly sparingly. Must be subjected to heavy post-processing (halftone filters, 1-bit dithering) to degrade vector perfection and create textural juxtaposition against the clean sans-serifs.\n\n## 4. Color System\nThe color architecture is uncompromising. Gradients, soft drop shadows, and modern translucency are strictly prohibited. Colors simulate physical media or primitive emissive displays.\n\n**CRITICAL: Choose ONE substrate palette per project and use it consistently. Never mix light and dark substrates within the same interface.**\n\n### If Swiss Industrial Print (Light):\n*   **Background:** `#F4F4F0` or `#EAE8E3` (Matte, unbleached documentation paper).\n*   **Foreground:** `#050505` to `#111111` (Carbon Ink).\n*   **Accent:** `#E61919` or `#FF2A2A` (Aviation/Hazard Red). This is the ONLY accent color. Used for strike-throughs, thick structural dividing lines, or vital data highlights.\n\n### If Tactical Telemetry (Dark):\n*   **Background:** `#0A0A0A` or `#121212` (Deactivated CRT. Avoid pure `#000000`).\n*   **Foreground:** `#EAEAEA` (White phosphor). This is the primary text color.\n*   **Accent:** `#E61919` or `#FF2A2A` (Aviation/Hazard Red). Same red, same rules.\n*   **Terminal Green (`#4AF626`):** Optional. Use ONLY for a single specific UI element (e.g., one status indicator or one data readout) — never as a general text color. If it doesn't serve a clear purpose, omit it entirely.\n\n## 5. Layout and Spatial Engineering\nThe layout must appear mathematically engineered. It rejects conventional web padding in favor of visible compartmentalization.\n\n*   **The Blueprint Grid:** Strict adherence to CSS Grid architectures. Elements do not float; they are anchored precisely to grid tracks and intersections.\n*   **Visible Compartmentalization:** Extensive utilization of solid borders (`1px` or `2px solid`) to delineate distinct zones of information. Horizontal rules (`\u003chr>`) frequently span the entire container width to segregate operational units.\n*   **Bimodal Density:** Layouts oscillate between extreme data density (tightly packed monospace metadata clustered together) and vast expanses of calculated negative space framing macro-typography.\n*   **Geometry:** Absolute rejection of `border-radius`. All corners must be exactly 90 degrees to enforce mechanical rigidity.\n\n## 6. UI Components and Symbology\nStandard web UI conventions are replaced with utilitarian, industrial graphic elements.\n\n*   **Syntax Decoration:** Utilization of ASCII characters to frame data points.\n    *   *Framing:* `[ DELIVERY SYSTEMS ]`, `\u003c RE-IND >`\n    *   *Directional:* `>>>`, `///`, `\\\\\\\\`\n*   **Industrial Markers:** Prominent integration of registration (`®`), copyright (`©`), and trademark (`™`) symbols functioning as structural geometric elements rather than legal text.\n*   **Technical Assets:** Integration of crosshairs (`+`) at grid intersections, repeating vertical lines (barcodes), thick horizontal warning stripes, and randomized string data (e.g., `REV 2.6`, `UNIT / D-01`) to simulate active mechanical processes.\n\n## 7. Textural and Post-Processing Effects\nTo prevent the design from appearing purely digital, simulated analog degradation is engineered into the frontend via CSS and SVG filters.\n\n*   **Halftone and 1-Bit Dithering:** Transforming continuous-tone images or large serif typography into dot-matrix patterns. Achieved via pre-processing or CSS `mix-blend-mode: multiply` overlays combined with SVG radial dot patterns.\n*   **CRT Scanlines:** For terminal interfaces, applying a `repeating-linear-gradient` to the background to simulate horizontal electron beam sweeps (e.g., `repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.1) 2px, rgba(0,0,0,0.1) 4px)`).\n*   **Mechanical Noise:** A global, low-opacity SVG static/noise filter applied to the DOM root to introduce a unified physical grain across both dark and light modes.\n\n## 8. Web Engineering Directives\n1.  **Grid Determinism:** Utilize `display: grid; gap: 1px;` with contrasting parent/child background colors to generate mathematically perfect, razor-thin dividing lines without complex border declarations.\n2.  **Semantic Rigidity:** Construct the DOM using precise semantic tags (`\u003cdata>`, `\u003csamp>`, `\u003ckbd>`, `\u003coutput>`, `\u003cdl>`) to accurately reflect the technical nature of the telemetry.\n3.  **Typography Clamping:** Implement CSS `clamp()` functions exclusively for macro-typography to ensure massive text scales aggressively while maintaining structural integrity across viewports.\n"}, {"name": "interface-review", "description": "Reviews a branch, pull request or uncommitted change for the interface problems it introduced or regressed, across accessibility, layout, writing, typography, color and UI.", "manual": true, "path": "~/.agents/skills/interface-review", "file_count": 37, "files": ["agents/openai.yaml", "reference/LICENSE", "reference/better-accessibility/focus-and-keyboard.md", "reference/better-accessibility/forms.md", "reference/better-accessibility/hit-areas.md", "reference/better-accessibility/motion-and-zoom.md", "reference/better-accessibility/rules.md", "reference/better-accessibility/screen-readers.md", "reference/better-accessibility/semantics-and-aria.md", "reference/better-colors/color-formats.md", "reference/better-colors/color-usage.md", "reference/better-colors/contrast.md", "reference/better-colors/palette-generation.md", "reference/better-colors/palette-structure.md", "reference/better-colors/rules.md", "reference/better-colors/token-naming.md", "reference/better-interface/review-format.md", "reference/better-interface/rules.md", "reference/better-layout/grouping-and-alignment.md", "reference/better-layout/rules.md", "reference/better-layout/spacing-and-adaptivity.md", "reference/better-typography/choosing-fonts.md", "reference/better-typography/css-cheat-sheet.md", "reference/better-typography/details-and-accessibility.md", "reference/better-typography/rules.md", "reference/better-typography/spacing-and-sizing.md", "reference/better-typography/variable-fonts-and-opentype.md", "reference/better-typography/wrapping-and-punctuation.md", "reference/better-ui/animations.md", "reference/better-ui/enter-exit.md", "reference/better-ui/icon-transitions.md", "reference/better-ui/icons.md", "reference/better-ui/performance.md", "reference/better-ui/rules.md", "reference/better-ui/surfaces.md", "removed-signals.md", "scope-resolution.md"], "body": "---\nname: interface-review\ndisable-model-invocation: true\ndescription: Reviews a branch, pull request or uncommitted change for the interface problems it introduced or regressed, across accessibility, layout, writing, typography, color and UI.\n---\n\n# Interface review\n\nThis skill reviews a change rather than a screen. It resolves the scope, expands the changed files to the surfaces they affect, reads both sides of the diff and classifies every finding.\n\nIt owns the scope, the classification and the change-scoped report. Domain rules belong to the `better-*` skills. Severity, consolidation, coverage, the cap and the verdict belong to `better-interface`, which this skill hands the review to.\n\n**Where those rules live here.** The domain rules are reference files in this folder, not separate skills, so read them yourself rather than invoking a skill: `better-interface` is [reference/better-interface/rules.md](reference/better-interface/rules.md), and each other `better-\u003cname>` is `reference/better-\u003cname>/rules.md` (`accessibility`, `layout`, `typography`, `colors`, `ui`). The one exception is `better-writing`, which is a skill of its own at [../better-writing/SKILL.md](../better-writing/SKILL.md). Read the rules files only for the domains the change touches.\n\nCorrectness, tests, security and performance belong to the project's general code review. Name such a concern once, point at that review and drop it.\n\n## The change, not the codebase\n\nThe author is asking \"did I make this worse?\". Report what the change caused and stay mostly quiet about what it merely touched. Three pre-existing findings is a courtesy; thirty is a different review and one nobody asked for.\n\nRead the whole diff before forming an opinion of it. A skimmed diff produces findings about code the next hunk already fixed.\n\n## 1. Resolve the change scope first\n\nThe whole invocation is the target, so `/interface-review pr 482` reviews pull request 482. [Scope resolution](scope-resolution.md) holds the accepted targets and how each resolves.\n\nWith no target supplied, resolve in this order and stop at the first match:\n\n1. `HEAD` is ahead of `git merge-base origin/\u003cdefault-branch> HEAD`. Review that range **plus** any uncommitted changes, stating the commit count and the uncommitted file count separately.\n2. The working tree is dirty. Review the uncommitted changes.\n3. Neither. There is no change to review, so follow **With no change, ask rather than invent one**.\n\nRecord the base commit of the resolved range as `$BASE` and name it in the scope block. Every command in this skill and its references uses it.\n\nExclude lockfiles, snapshots, generated output, vendored code and binaries per [Excluded paths](scope-resolution.md#excluded-paths), and name what you excluded. If nothing survives the exclusions, treat it as no change.\n\n## 2. With no change, ask rather than invent one\n\nA clean tree with nothing ahead of the merge base means there is no change to review. Never fall back to `HEAD~1..HEAD` on your own. The last commit is whatever happened to land, often a merge or someone else's work.\n\nGather the facts in [Nothing to review](scope-resolution.md#nothing-to-review), state them, then offer these routes and wait:\n\n- **The open pull request** on the current branch, first when there is one. A branch whose commits already landed resolves to no change, while its pull request is still exactly what the user meant.\n- **The last commit**, `HEAD~1..HEAD`, named by short SHA and subject so the user sees what they would get.\n- **A target they name**, such as `pr \u003cn>`, a branch, a ref or a range.\n- **A whole-repository interface audit**, which is not a change review. Hand it to `better-interface` as a repository-scope review, without this skill's scope block, statuses or pre-existing section.\n\nWhere exclusions emptied the scope, name the excluded files in the offer. Never report a review of nothing as `Approve`.\n\n## 3. A diff is not a surface\n\nA changed file is evidence, not the review subject. Its **blast radius** is the set of surfaces it renders in; review those.\n\nExpand one hop by default, to the direct importers and callers. Expand a second hop only for design tokens, theme values and shared primitives, where one line reaches the whole product.\n\nReview at most five consumers in total across both hops, ordered by [the rule in Scope resolution](scope-resolution.md#expanding-to-consumers). State how many you did not expand, since an unstated cutoff reads as completeness.\n\n## 4. Read the removed lines\n\nRegressions are invisible in the post-change state. Read the `-` side of every hunk against [Removed signals](removed-signals.md).\n\nA signal is a lead, not a finding. A removal is a regression only when nothing in the change replaces it, and the domain skill owns that judgement. Route each unmatched removal to its owner, report only what that skill confirms and status it `Regression`.\n\n## 5. Classify every finding\n\nGive every finding one status:\n\n- `Introduced`: the change created it.\n- `Regression`: the change weakened something previously correct.\n- `Pre-existing`: present before the change and not made worse by it.\n\nStatus by cause, not by location. A finding a changed line causes is `Introduced` or `Regression` wherever it surfaces, including an untouched consumer of a changed token. A finding the change neither created nor worsened is `Pre-existing`, even three lines from a hunk.\n\nTo check whether a line predates the change, blame the reviewed range. A `^` prefix marks a line unchanged since the base:\n\n```bash\ngit blame -L \u003cline>,\u003cline> \"$BASE\"..\u003chead-ref> -- path/to/file\n```\n\nFor uncommitted work, drop the range. A line marked `Not Committed Yet` or blamed on a commit inside `$BASE..HEAD` belongs to the change.\n\n## 6. Hold the change to its stated intent\n\nRead the pull request title and body, the linked issue and the commit messages, then review whether the interface delivers what they claim.\n\nThis is how you find the **incomplete** change, which a surface review misses because it inspects only the states that exist. Look for the absent ones:\n\n- A new variant, size or theme applied to some states but not all of hover, focus, active, disabled, loading and selected.\n- A new user-facing string with no entry in the translation catalogue the project maintains.\n- A new component with no empty, loading, error, disabled or narrow-width state.\n- A control added to one surface but not to the siblings that already carry its peers.\n\nDo not report scope creep. Whether a change does too much is a process question, not an interface one.\n\n## 7. Hand the review to `better-interface`\n\nHand `better-interface` the scope block, the affected surfaces and a status on every finding, and report in the format below.\n\nIf `better-interface` is unavailable, report the resolved scope and the file inventory, name it as the missing skill and stop. Do not invent a severity scale, a cap or a verdict.\n\n## Never mutate the working tree\n\nA change review is read-only, including the checkout. `git fetch` writes only to `.git` and is permitted. `gh pr checkout`, `git checkout`, `git switch` and `git stash` rewrite the files the author has open, so they are never permitted. Fetch pull request refs and read them in place.\n\nRendered verification is opt-in here, in place of `better-interface`'s **Verify what can be verified**. Mark visual and runtime claims **Not verified** unless the project exposes a cheap preview or the user asks for a rendered review. For `working` and `branch`, the checkout already is the head, so render it in place. For any other target, render an isolated worktree such as `git worktree add /tmp/review-\u003cn> refs/remotes/pr/\u003cn>` and remove it when done.\n\n## Before you finish\n\n| Mistake | Fix |\n| --- | --- |\n| The scope block counts only uncommitted files while `HEAD` is ahead of the merge base | Review the branch range plus the uncommitted changes, with both counts |\n| A report on `HEAD~1..HEAD` the user never chose | State the facts and offer the routes in **With no change, ask rather than invent one** |\n| A changed shared component with no consumer under `Surfaces expanded` | Expand to its consumers and name the ones you skipped |\n| A deleted `aria-label`, `outline` or `prefers-reduced-motion` with no finding and no note | Route it to its owner through [Removed signals](removed-signals.md) |\n| A `Regression` whose removed attribute reappears elsewhere in the diff | Check the [equivalent replacements](removed-signals.md#equivalent-replacements) first |\n| A finding on an untouched consumer of a changed token statused `Pre-existing` | The change caused it, so it is `Introduced` or `Regression` |\n| A line outside every hunk statused `Introduced` with no causing change named | Blame it against the reviewed range |\n| `gh pr checkout` or `git switch` in the command log | Fetch the ref and read files with `git show` |\n| A cited line that does not match `git show \u003chead-ref>:path` | Cite against the head ref named in the scope block |\n\n## Review output format\n\nOpen with the scope block:\n\n| Field | Value |\n| --- | --- |\n| Target | `branch`, `working`, `staged`, `pr 482` or the range as entered |\n| Base ref | `origin/main` at `a1b2c3d` |\n| Head ref | `refs/remotes/pr/482` at `e4f5g6h` |\n| Commits | 7 committed, 2 files uncommitted |\n| Files in scope | 12 after exclusions |\n| Excluded | `pnpm-lock.yaml`, `src/__snapshots__/`, lockfile and snapshots |\n| Surfaces expanded | `CheckoutPage`, `SettingsPanel`; 3 further `Button` consumers not expanded |\n\nThe coverage table from `better-interface` follows it. A domain with no evidence in the change scope is `Not reviewed: no evidence in the change scope`, which is a coverage statement rather than a gap.\n\nThen the findings, with a `Status` column per **Classify every finding**:\n\n| Severity | Domain | Status | Location | Before | After | Why |\n| --- | --- | --- | --- | --- | --- | --- |\n| HIGH | Accessibility | Regression | `src/Dialog.tsx:42` | `aria-label=\"Close\"` removed in this change | Restore `aria-label=\"Close\"` on the icon-only control | The close control had an accessible name before this change and no longer does |\n\nWith no `Introduced` or `Regression` findings, omit the table and state \"No actionable interface findings in this change.\"\n\nThen `Pre-existing` findings, at most three, highest severity first, stated plainly as not this change's responsibility. Omit the section when there are none.\n\n| Severity | Domain | Location | Issue |\n| --- | --- | --- | --- |\n| MEDIUM | Typography | `src/Toolbar.tsx:7` | Numeric badges use proportional figures; predates this change |\n\nVerification and the verdict follow in `better-interface`'s format.\n"}, {"name": "master", "description": "Act as the MASTER session over every local Claude Code session. Check in on all of them, report insights, list the decisions the owner must take (each with a recommended option), pass approved decisions on to the right session, and track each session's goal and progress with regular check-ins. Use when the owner types /master, asks \"what are my sessions doing\", or wants one place to steer all running sessions.", "manual": false, "path": "~/.agents/skills/master", "file_count": 2, "files": ["scripts/digest.py", "scripts/sessions.sh"], "body": "---\nname: master\ndescription: Act as the MASTER session over every local Claude Code session. Check in on all of them, report insights, list the decisions the owner must take (each with a recommended option), pass approved decisions on to the right session, and track each session's goal and progress with regular check-ins. Use when the owner types /master, asks \"what are my sessions doing\", or wants one place to steer all running sessions.\n---\n\n# /master\n\nYou oversee all local Claude sessions. You don't do their work. You find out what each one is doing, keep a ledger of its goal and progress, surface decisions, and send the owner's answers to the session that owns the work.\n\nWhen the owner hands you specific sessions to follow through to the end (\"supervise @X\", \"keep tabs on it and report back when it's done\"), use `/supervise` for those sessions.\n\nArguments: none runs a full check-in. `checkin` runs a quiet scheduled check-in (see step 6). `stop` removes the recurring check-in.\n\n## 1. Find the sessions\n- `ListAgents`: live peers with name, busy or idle, and age. The names are the addresses you send to.\n- `~/.agents/skills/master/scripts/sessions.sh [hours]`: every session touched recently, from `~/.agent/sessions/*/meta`, with its state (`working`, `input`=waiting on the owner, `done`, `ended`), cwd, branch, context % and transcript path. Match peers to rows by cwd, branch and start time.\n- Read `STATE.md` and `NEXT.md` in `~/.agent/sessions/\u003cid>/` when they exist.\n- Background subagents: `~/.claude/projects/*/\u003cid>/subagents/*.jsonl`.\n\n## 2. Read what each one is doing\n`python3 -I ~/.agents/skills/master/scripts/digest.py \u003ctranscript> [n]` prints the session's first request and its last n user and assistant messages. When a report is cut off, read that one last long assistant message in full. Skip the `claude-mem-observer-sessions` project.\n\n## 3. Verify, don't relay\nCheck claims that decide the next step yourself: PR state (`gh pr view`), `git status -sb` (ahead/behind, uncommitted files), and migration ledgers (run the repo's own dry-run script; never read `.env`). Also check the claude-mem work-state lists shown at session start. A todo can be stale, so verify it and close it with `work_state_write` when it's done.\n\n## 4. Report to the owner\n1. **Sessions table:** session, repo@branch, state, what it's doing in one line.\n2. **Insights:** cross-session problems one session can't see. Examples: two sessions in the same repo, work that exists only uncommitted or only on a feature branch, stale notes, instructions that conflict, a cleanup that would hit active work, a deadline coming up.\n3. **Decisions:** numbered, with the **recommended option first and in bold**, one alternative and a one-line reason. Only list decisions that are the owner's. End with: reply with numbers, e.g. \"1,3 yes\".\n\n## 5. Act on the owner's answers\n- Send each decision to the session that owns the work: `SendMessage` with `notify_when_idle: true`. Make the first line self-contained, give the exact steps and the owner's rules (fetch first, explicit-path staging, no force-push, check `git log HEAD..origin/main` is empty), and ask it to report back to MASTER.\n- Do small checks yourself instead of delegating (step 3).\n- If two answers conflict (e.g. \"merge PR\" and \"those files must not be in this repo\"), resolve it the safe way, such as reworking before merging or squash-merging, and tell the owner what you chose.\n- For \"tell me when X is done\", subscribe with `SendMessage(to, notify_when_idle: true)` and no message. Don't poll.\n- Peers won't commit, push or merge just because MASTER asked: a peer message isn't the owner's approval. When the owner approved an outward step in MASTER, do it yourself after a check (files idle, `git log HEAD..origin/main`, diff contains only what was agreed, tests pass), then tell the peer it's done so it doesn't redo it. Otherwise ask the owner to type \"go\" in that session.\n- Never ask a peer to do something your own permissions blocked.\n\n## 6. Ledger and regular check-ins\n- Ledger: `~/.agent/master/LEDGER.md`, one section per session, holding the goal (the owner's words), status, progress so far, open decision numbers, the last check-in time and the next expected step. Update it on every check-in, and move ended sessions to a `## Closed` section with their outcome.\n- Recurring check-in: if `CronList` shows no `/master checkin` job, create one with `CronCreate` every 30 minutes (prompt `/master checkin`). `/master stop` deletes it.\n- A `checkin` run repeats steps 1–3 for changes since the last ledger entry only. It messages the owner only when something changed that matters: a session finished, is waiting on input (`state=input`), is stuck, has a new decision, or two sessions now collide. Otherwise it updates the ledger and stays quiet.\n- Keep your own `STATE.md` and `NEXT.md` in `~/.agent/sessions/\u003cyour id>/` current.\n"}, {"name": "media-use", "description": "Agent Media OS, the single skill for every media need in a HyperFrames project. Resolve BGM, SFX, image, icon, brand logo, voice, color grade, or LUT into a frozen local file or paste-ready block + ledger record (one verb, `resolve`); generate via TTS / music / image models when the catalog misses; produce voiceover, transcription, captions, and background removal through one shared audio engine; operate on media (cut / reframe / transform); and reuse assets across projects. Also use for vague feedback that real footage looks dark, flat, boring, should feel retro/camcorder/print/ASCII, needs privacy, or needs a media reveal.", "manual": false, "path": "~/.agents/skills/media-use", "file_count": 150, "files": ["audio/assets/sfx/CREDITS.md", "audio/assets/sfx/chime.mp3", "audio/assets/sfx/click-soft.mp3", "audio/assets/sfx/click.mp3", "audio/assets/sfx/error.mp3", "audio/assets/sfx/glitch-1.mp3", "audio/assets/sfx/glitch-2.mp3", "audio/assets/sfx/glitch-3.mp3", "audio/assets/sfx/impact-bass-1.mp3", "audio/assets/sfx/impact-bass-2.mp3", "audio/assets/sfx/key-press.mp3", "audio/assets/sfx/manifest.json", "audio/assets/sfx/notification.mp3", "audio/assets/sfx/ping.mp3", "audio/assets/sfx/pop.mp3", "audio/assets/sfx/riser.mp3", "audio/assets/sfx/sparkle.mp3", "audio/assets/sfx/typing.mp3", "audio/assets/sfx/whoosh-cinematic.mp3", "audio/assets/sfx/whoosh-short.mp3", "audio/assets/sfx/whoosh.mp3", "audio/references/bgm.md", "audio/references/captions/authoring.md", "audio/references/captions/motion.md", "audio/references/captions/transcript-handling.md", "audio/references/remove-background.md", "audio/references/requirements.md", "audio/references/sfx.md", "audio/references/transcribe.md", "audio/references/tts-to-captions.md", "audio/references/tts.md", "audio/scripts/audio.mjs", "audio/scripts/audio.test.mjs", "audio/scripts/heygen-tts.mjs", "audio/scripts/lib/bgm.mjs", "audio/scripts/lib/bgm.test.mjs", "audio/scripts/lib/concurrency.mjs", "audio/scripts/lib/concurrency.test.mjs", "audio/scripts/lib/heygen.mjs", "audio/scripts/lib/heygen.test.mjs", "audio/scripts/lib/python.mjs", "audio/scripts/lib/python.test.mjs", "audio/scripts/lib/sfx.mjs", "audio/scripts/lib/sfx.test.mjs", "audio/scripts/lib/tts.mjs", "audio/scripts/lib/tts.spawn.test.mjs", "audio/scripts/lib/tts.test.mjs", "audio/scripts/lyria-recipe.py", "audio/scripts/wait-bgm.mjs", "luts/README.md", "luts/index.json", "references/audio.md", "references/grading.md", "references/media-treatment-recipes.md", "references/media-treatments.md", "references/memory.md", "references/meta.md", "references/operations.md", "references/resolve.md", "references/setup-providers.md"], "body": "---\nname: media-use\ndescription: Agent Media OS, the single skill for every media need in a HyperFrames project. Resolve BGM, SFX, image, icon, brand logo, voice, color grade, or LUT into a frozen local file or paste-ready block + ledger record (one verb, `resolve`); generate via TTS / music / image models when the catalog misses; produce voiceover, transcription, captions, and background removal through one shared audio engine; operate on media (cut / reframe / transform); and reuse assets across projects. Also use for vague feedback that real footage looks dark, flat, boring, should feel retro/camcorder/print/ASCII, needs privacy, or needs a media reveal.\n---\n\n# media-use\n\nThe media OS for HyperFrames: resolve · generate · operate · remember — every media type, one skill, zero context noise.\n\nFirst run: install and sign in to the `heygen` CLI (the free-usage path), then verify with `node \u003cSKILL_DIR>/scripts/resolve.mjs --doctor`. Setup and providers: `references/setup-providers.md`.\n\n## Resolve — the one verb\n\n```bash\nnode \u003cSKILL_DIR>/scripts/resolve.mjs --type \u003ctype> --intent \"\u003cdescription>\" --project \u003cdir>\n```\n\nReturns one line: `resolved \u003cid> → \u003cpath> (\u003ctype>, \u003cmetadata>)`. All search noise stays on disk.\n\n| Type    | One-line intent                                                                     |\n| ------- | ----------------------------------------------------------------------------------- |\n| `bgm`   | background music (HeyGen catalog, 10k+ tracks)                                      |\n| `sfx`   | sound effects (bundled 19-file library + catalog)                                   |\n| `image` | photos, backgrounds (HeyGen asset search, 75k+ vectors)                             |\n| `icon`  | icons, symbols (transparent)                                                        |\n| `logo`  | official brand marks (svgl → simple-icons → GitHub avatar → favicon; never redrawn) |\n| `voice` | TTS voiceover (HeyGen free-usage path; optional local Kokoro)                       |\n| `grade` | measured correction candidate; broad polish/stylization follows Media Treatments    |\n| `lut`   | user-provided or explicitly chosen reusable validated `.cube` file                  |\n\nBefore resolving fresh, list reusable candidates with `--candidates` and judge fit yourself — reuse rules, all flags, ingest (`--from`), and adopt are in `references/resolve.md`.\n\n## Treat broad visual feedback as media intent\n\nWhen a user explicitly asks to fix, polish, stylize, obscure, emphasize, or\nreveal photographic media, read `references/media-treatments.md` even if they\ndo not name color grading or an effect. Inspect the real `\u003cimg>`/`\u003cvideo>`,\nchoose one primary intent, then use deterministic persistence and verification.\nUse a matching recipe as an optional tested seed, or inspect\n`hyperframes media-treatment --capabilities --json`, then request one relevant\nfamily/effect with `--capability \u003cid>` and assemble a custom treatment from\ncanonical controls. Never load `--all` for ordinary authoring. A treatment may\ncompose correction, a preset, finishing, compatible shader effects, supported\nkeyframes, and optional Registry overlays. Add only source-justified bounded\ntuning and compatible parts, never effects merely to make the result look more\nsophisticated. Persist the final combined payload with\n`hyperframes media-treatment`.\n\nUse one progressively escalating workflow. For video, inspect one labeled\nearly/middle/late contact sheet rather than reading frames separately. Apply one\ncandidate and inspect one after-sheet for ordinary correction or polish.\nEscalate to individual frames or moving draft evidence only when the result is\nambiguous, temporal, stylized, LUT-based, HDR/LOG-sensitive, private, or\nbrand-critical.\n\nFor ordinary correction or polish, persist the final treatment's\npreset/adjustment JSON.\nDo not generate a `.cube` LUT merely to encode exposure, shadows, contrast, or\nwarmth. Use a LUT only when the user supplies one or the selected treatment\nexplicitly owns one. `resolve --type grade --for ... --analyze` is measurement\nevidence, not permission to replace the chosen treatment with a generated LUT.\nDo not recreate supported vignette, grain, blur, pixelate, color, or treatment\neffects with CSS/SVG overlays; that bypasses Studio controls and the canonical\npreview/render shader path.\n\n## Be proactive — run a media opportunity pass\n\nThe human usually can't tell which media would lift the piece. You can. When you build or review a composition, do **one** grounded scan and then **ask once** — don't silently add, and don't nag per asset.\n\nSurface an opportunity only when a concrete signal is present:\n\n| Signal detected                                          | Offer                                                                                                  |\n| -------------------------------------------------------- | ------------------------------------------------------------------------------------------------------ |\n| On-screen text / a script with no voiceover              | TTS voiceover (audio engine)                                                                           |\n| Emoji or a `\u003cdiv>` styled as an icon                     | resolve real `icon`s                                                                                   |\n| Image that is a placeholder, tiny, or upscaled-looking   | a better `image` (and/or upscale — see `references/operations.md`)                                     |\n| Hard scene cuts / transitions with no sound              | transition `sfx`                                                                                       |\n| A piece over ~10s with no music bed                      | `bgm`                                                                                                  |\n| Footage that reads under/over-exposed or color-cast      | a corrective grade (inspect it with `hyperframes media-treatment --selector '#hero' --analyze --json`) |\n| Photographic media that feels visually flat or off-topic | one specific source-appropriate preset or custom treatment, with the intended target named             |\n| A meaningful media entrance/reveal that feels static     | one supported seek-safe treatment animation; preserve color unless the request also justifies a preset |\n\nRules that keep this a help, not nagware: **grounded, not generic** (no signal → no suggestion); **opinionated + concrete** (propose the specific fix with defaults chosen — the human approves **all / some / none**); **once per project** (one consolidated ask; respect \"leave it\"); **surface, never silently mutate** (color grades especially: propose and preview — a gray-world \"correction\" ruins an intentional sunset or neon look).\n\n## Where to look — read only the file your task needs\n\n| Task                                                                      | Read                             |\n| ------------------------------------------------------------------------- | -------------------------------- |\n| resolve / reuse / adopt / ingest, flags, cascade, inventory               | `references/resolve.md`          |\n| color grading, LUTs, smart grade (`--for`), grade-compare                 | `references/grading.md`          |\n| voiceover / TTS, music, SFX, captions, transcription (audio engine)       | `references/audio.md`            |\n| cut / reframe / transform existing media, exact error diffusion, HEVC     | `references/operations.md`       |\n| source-aware creative treatments, realtime effects, overlays, reveals     | `references/media-treatments.md` |\n| install + auth, provider table, RAM ladders, `--local-only`, `--provider` | `references/setup-providers.md`  |\n| remembered preferences + frozen recipes (user memory)                     | `references/memory.md`           |\n| ownership matrix, usage stats, telemetry, privacy (maintainer-facing)     | `references/meta.md`             |\n"}, {"name": "merge", "description": "Use when asked to merge, land or ship the current branch or worktree into main (\"merge it\", \"/merge\", \"get this on main\", \"merge and push\"), or when the agent terminal sends a merge request to this session.", "manual": false, "path": "~/.agents/skills/merge", "file_count": 0, "files": [], "body": "---\nname: merge\ndescription: Use when asked to merge, land or ship the current branch or worktree into main (\"merge it\", \"/merge\", \"get this on main\", \"merge and push\"), or when the agent terminal sends a merge request to this session.\n---\n\n# Merge to main\n\nLand this session's branch on `main` the way the owner's repos already look: a `--no-ff` merge commit named after the branch, tests green, nothing from `origin/main` dropped, other sessions' files untouched. Merge right away when asked, then report.\n\n## Steps\n\n1. **Orient.** `git fetch`. Note your branch, and the main checkout (first line of `git worktree list`). Repo `AGENTS.md`/`CLAUDE.md` merge, PR or conflict rules win over this skill. If the repo lands work through pull requests, push the branch, open or update the PR, and stop there (`gh pr merge` is blocked by the guard). Run `git status` in the main checkout: changes there that aren't yours belong to another session.\n\n2. **Bring main into your branch.** In your worktree: `git merge origin/main`. Resolve conflicts here, never on `main`, keeping both sides' intent (both changelog entries; two edits to one line combined). Derived or binary files follow the repo's rule. When the right combination isn't clear, `git merge --abort` and stop with a recommendation.\n\n3. **Test.** Run the repo's test command on the merged branch. Red means stop and report; do not land it.\n\n4. **Land on main, from the main checkout,** always with `git -C \u003cmain checkout>` (the guard cannot resolve a push after `cd`):\n   - `git -C \u003cmain> merge --ff-only origin/main` to bring local `main` up to date. If local `main` has commits not on origin, merge `origin/main` instead; those commits are someone's work.\n   - `git -C \u003cmain> merge --no-ff \u003cbranch>` with this message:\n     ```\n     Merge \u003cbranch>: \u003cwhat it brings, one line>\n\n     - \u003cone bullet per change that went in>\n     Conflicts kept both sides: \u003cfile> (\u003cwhat came from main>, \u003cwhat came from the branch>)\n\n     \u003cattribution trailers from this session's instructions>\n     ```\n     Leave out the Conflicts line when there were none.\n   - If git refuses because another session's uncommitted file would be overwritten, land from a temporary worktree instead: `git -C \u003cmain> worktree add --detach \u003ctmp> origin/main`, the same `--no-ff` merge there, `git -C \u003ctmp> push origin HEAD:main`; run steps 5 and 6 with `\u003ctmp>` in place of `\u003cmain>`, then `git -C \u003cmain> worktree remove \u003ctmp>`. Local `main` stays behind for its owner to pull; say so. Never stash, checkout, restore or commit files that aren't yours.\n\n5. **Push.** `git -C \u003cmain> push origin main`. Rejected because main moved? Fetch and repeat step 4's first bullet, then push again. Never force.\n\n6. **Verify.** After a fresh fetch, `git -C \u003cmain> log HEAD..origin/main` and `git -C \u003cmain> log origin/main..HEAD` are both empty.\n\n7. **Clean up, only now.** `git -C \u003cmain> worktree remove \u003cyour worktree>` (no `--force`; if it has uncommitted files, leave it and say so), then `git -C \u003cmain> branch -d \u003cbranch>` (lowercase `-d` refuses unmerged work; if it refuses because local `main` is behind, keep the branch and say so). Leave remote branches alone.\n\n8. **Report** in a few lines: the merge commit hash, what went in, how each conflict was resolved, the test result, that both verify logs are empty, what was cleaned up, and any other session's files you left untouched.\n\n## Common mistakes\n\n- `git push origin HEAD:main` from the branch: main then has no \"Merge \u003cbranch>: …\" commit. Use step 4.\n- Landing without tests, or leaving the worktree, branch or a stale local `main` behind.\n- `git add -A`, `commit -a` or `stash` to get a clean tree. Stage explicit paths; other sessions' files stay as they are.\n"}, {"name": "minimalist-ui", "description": "Clean editorial-style interfaces. Warm monochrome palette, typographic contrast, flat bento grids, muted pastels. No gradients, no heavy shadows.", "manual": false, "path": "~/.agents/skills/minimalist-ui", "file_count": 0, "files": [], "body": "---\nname: minimalist-ui\ndescription: Clean editorial-style interfaces. Warm monochrome palette, typographic contrast, flat bento grids, muted pastels. No gradients, no heavy shadows.\n---\n\n# Protocol: Premium Utilitarian Minimalism UI Architect\n\n## 1. Protocol Overview\nName: Premium Utilitarian Minimalism & Editorial UI\nDescription: An advanced frontend engineering directive for generating highly refined, ultra-minimalist, \"document-style\" web interfaces analogous to top-tier workspace platforms. This protocol strictly enforces a high-contrast warm monochrome palette, bespoke typographic hierarchies, meticulous structural macro-whitespace, bento-grid layouts, and an ultra-flat component architecture with deliberate muted pastel accents. It actively rejects standard generic SaaS design trends.\n\n## 2. Absolute Negative Constraints (Banned Elements)\nThe AI must strictly avoid the following generic web development defaults:\n- DO NOT use the \"Inter\", \"Roboto\", or \"Open Sans\" typefaces.\n- DO NOT use generic, thin-line icon libraries like \"Lucide\", \"Feather\", or standard \"Heroicons\".\n- DO NOT use Tailwind's default heavy drop shadows (e.g., `shadow-md`, `shadow-lg`, `shadow-xl`). Shadows must be practically non-existent or heavily customized to be ultra-diffuse and low opacity (\u003c 0.05).\n- DO NOT use primary colored backgrounds for large elements or sections (e.g., no bright blue, green, or red hero sections).\n- DO NOT use gradients, neon colors, or 3D glassmorphism (beyond subtle navbar blurs).\n- DO NOT use `rounded-full` (pill shapes) for large containers, cards, or primary buttons.\n- DO NOT use emojis anywhere in code, markup, text content, headings, or alt text. Replace with proper icons or clean SVG primitives.\n- DO NOT use generic placeholder names like \"John Doe\", \"Acme Corp\", or \"Lorem Ipsum\". Use realistic, contextual content.\n- DO NOT use AI copywriting clichés: \"Elevate\", \"Seamless\", \"Unleash\", \"Next-Gen\", \"Game-changer\", \"Delve\". Write plain, specific language.\n\n## 3. Typographic Architecture\nThe interface must rely on extreme typographic contrast and premium font selection to establish an editorial feel.\n- Primary Sans-Serif (Body, UI, Buttons): Use clean, geometric, or system-native fonts with character. Target: `font-family: 'SF Pro Display', 'Geist Sans', 'Helvetica Neue', 'Switzer', sans-serif`.\n- Editorial Serif (Hero Headings & Quotes): Target: `font-family: 'Lyon Text', 'Newsreader', 'Playfair Display', 'Instrument Serif', serif`. Apply tight tracking (`letter-spacing: -0.02em` to `-0.04em`) and tight line-height (`1.1`).\n- Monospace (Code, Keystrokes, Meta-data): Target: `font-family: 'Geist Mono', 'SF Mono', 'JetBr
