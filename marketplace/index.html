# 1. Start from project state\n\nApply the first matching row; do not evaluate lower state rows:\n\n| State                                                                                                                         | Action                                                                                                                                                                                                      |\n| ----------------------------------------------------------------------------------------------------------------------------- | ----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| Explicit port of existing Remotion source to HyperFrames                                                                      | Read `references/routes/remotion-to-hyperframes.md`, then route directly to that workflow. Skip the intent layer.                                                                                           |\n| Specific operation on an existing HyperFrames project: inspect, diagnose, validate, preview, render, publish, or batch-render | Perform only that operation. Skip intent and workflow routing; load `/hyperframes-cli` and any required domain skills.                                                                                      |\n| Specific edit to an existing project                                                                                          | Make the edit. Do not run the intent layer.                                                                                                                                                                 |\n| `BRIEF.md` exists                                                                                                             | Read `workflow` and `flow`. Execute that workflow; `flow: companion` always executes in `/general-video`. Ask no brief questions.                                                                           |\n| No brief, but `hyperframes.json` or `STORYBOARD.md` exists                                                                    | Resume from project files and recorded preferences. Infer the owning workflow from existing artifacts. If it cannot be determined uniquely, ask one routing-only question; do not run the intent interview. |\n| Fresh creation                                                                                                                | Run the intent layer — `references/intent-interview.md` — then route once using § 2's table.                                                                                                                |\n\nIf a fresh request does not identify the subject or input, ask what the video is about before routing. Check preferences and recipes before asking anything (`references/intent-interview.md`, step 1). A `figma.com` input or a named recipe changes intake, not routing — the interview's \"Adapt orthogonal inputs\" section handles both.\n\n### Keep the project's CLI current\n\nA scaffolded project pins `hyperframes@\u003cversion>` in its `package.json` scripts so renders stay reproducible; the pin never advances on its own, and a pinned run of an older CLI prints no warning about it. When resuming a project whose scripts carry a pin, probe once before the first render-affecting command:\n\n```bash\nnpx hyperframes@latest upgrade --project . --check\n```\n\nThe probe is read-only and reports the pin against the latest release; keep the explicit `.` — on older CLI releases a bare `--project` followed by another flag consumes that flag as its directory value. When it reports the project behind — or any CLI output already shows it (the stderr notice `This project pins hyperframes@… (latest …)`, or `_meta.updateAvailable: true` in a `--json` result from a pinned script) — apply with `npx hyperframes@latest upgrade --project .`, then verify with `npx hyperframes check`. A passing check confirms the project's compositions still validate on the new version — not that rendered output is frame-identical to the old pin — so a successful bump is never silent: name the old and new version in the run's summary. A project with no composition yet needs no verification. If the check fails, revert the `package.json` change, continue on the pinned version, and report which version the project stays on and why. Act on the signal rather than relaying it to the user; never leave a bumped pin unverified.\n\n## 2. Route fresh creation\n\nUse the first matching row. Match the requested **deliverable**, not a word or file type mentioned in passing.\n\n| Priority | Request                                                                                                            | Workflow                   |\n| -------- | ------------------------------------------------------------------------------------------------------------------ | -------------------------- |\n| 1        | Explicitly port an existing Remotion source                                                                        | `/remotion-to-hyperframes` |\n| 2        | Author a presentation, pitch deck, or navigable interactive deck                                                   | `/slideshow`               |\n| 3        | Add plain captions or subtitles to existing talking-head footage without changing it                               | `/embedded-captions`       |\n| 4        | Add designed graphic overlays to existing talking-head, interview, or podcast footage without changing the footage | `/talking-head-recut`      |\n| 5        | Build a beat-synced video from a music track, with no narration or website capture                                 | `/music-to-video`          |\n| 6        | Create an explicitly short, unnarrated, motion-first unit, typically under 10s                                     | `/motion-graphics`         |\n| 7        | Explain a GitHub pull request or code change from a PR reference                                                   | `/pr-to-video`             |\n| 8        | Market or showcase a website, product site, app, or company from a URL or site-specific brief                      | `/product-launch-video`    |\n| 9        | Explain a topic, article, or notes with invented visuals and no product or site capture                            | `/faceless-explainer`      |\n| 10       | Any other custom video or composition                                                                              | `/general-video`           |\n\nBefore finalizing the route, read `references/routes/\u003cworkflow>.md` — one small file per route: the canonical input/output/trigger contract (available before lazy-installed workflow skills are present) plus that route's interview entry. If the candidate does not satisfy its contract, continue routing instead of forcing the match. Read only the matched route's file.\n\n### Resolve common ambiguities\n\n- A short animated title, logo sting, stat hit, chart hit, map hit, or standalone lower-third is `/motion-graphics` when it is unnarrated and motion is the message. A static title card, narrated sequence, longer montage, or custom loop is `/general-video`.\n- An explicitly short motion graphic may use a URL, tweet, article, or screenshot as source material. A generic \"make a video from this site\" request is `/product-launch-video`.\n- Existing footage with captions routes to `/embedded-captions`; footage with designed information cards routes to `/talking-head-recut`. Retiming, reordering, recoloring, reframing, or remixing footage is a custom edit and falls through to `/general-video`.\n- A music file selects `/music-to-video` only when its beat grid drives the piece. Music used as a bed does not override the subject-matched route.\n- \"I want a storyboard\" changes the review process, not the workflow. With no other routing signal, use `/general-video`. A confirmed sketched board may itself be the requested deliverable; the review loop defines that stop point.\n- Specialized narrative workflows support up to about 3 minutes and are strongest around 30–90s. Route a clearly longer piece to `/general-video`. Length never overrides an explicit port, deck, caption, overlay, or music-driven deliverable.\n\n## 3. Route once, then leave\n\nFor fresh creation the intent layer (`references/intent-interview.md`) runs the full conversation — memory, triage, pitch round, must-haves, run-shape, hand-off — and **ends by writing `BRIEF.md`. The brief is the only routing artifact the workflow reads**; nothing later re-opens this skill or the interview. Answer every later \"what did the route require?\" from `BRIEF.md`.\n\n## 4. Install and enter the workflow\n\nBefore reading the selected workflow, install or refresh it and the core domain skills:\n\n```bash\nnpx hyperframes skills update \u003cworkflow-name>\n```\n\nUse the bare name without `/`. If the command fails, surface the error; do not reconstruct the workflow from memory. Everything else about installation — the core-vs-lazy split, what `init` refreshes, diagnosis, CI opt-out, and the no-CLI fallback — lives in `references/skill-lifecycle.md`.\n\n## 5. Load domain skills on demand\n\n| Need                                                                                                                | Skill                    |\n| ------------------------------------------------------------------------------------------------------------------- | ------------------------ |\n| Composition structure, timing attributes, tracks, variables, determinism                                            | `/hyperframes-core`      |\n| Motion rules, scene blueprints, transitions, runtime adapters                                                       | `/hyperframes-animation` |\n| Seek-safe GSAP, CSS, Anime.js, WAAPI, FLIP, paths, masks, SVG, 3D keyframes, or `hyperframes keyframes` diagnostics | `/hyperframes-keyframes` |\n| Design specs, concept, palette, typography, narration, beat planning                                                | `/hyperframes-creative`  |\n| Images, icons, logos, audio, captions, grades, LUTs, reusable media                                                 | `/media-use`             |\n| Init, lint, check, snapshots, compare, batch render, Studio, render, publish, or diagnostics                        | `/hyperframes-cli`       |\n| Registry blocks and components                                                                                      | `/hyperframes-registry`  |\n| Figma assets, tokens, components, or storyboard frames as reconstructed motion                                      | `/figma`                 |\n\nBroad feedback about how photographic media looks or behaves also routes to\n`/media-use`, even when the user never says “color grading” or “effect”: fix\ndark/flat/boring footage, stylize a clip, hide a face, or improve a media\nreveal. Read `../media-use/references/media-treatments.md` before editing a\ntreatment; it governs how footage is treated, never whether media may be used.\nDo not substitute a generic LUT, CSS filter/overlay, or opacity tween for an\nexisting canonical treatment primitive. Keep text/layout/motion-only edits in\ntheir owning domain.\nDuring a build with important photographic media, include one grounded\nmedia-polish scan in the final quality pass; leaving suitable media unchanged is\na valid result.\n\nDomain skills never take ownership of the end-to-end deliverable. Load only what the active workflow needs.\n"}, {"name": "hyperframes-animation", "description": "All animation knowledge for HyperFrames — atomic motion rules, multi-phase scene blueprints, scene transitions, broader motion-design techniques, AND the seven runtime adapters (GSAP default, plus Lottie, Three.js, Anime.js, CSS keyframes, Web Animations API, TypeGPU). Use for any motion or animation task: pick 2-4 rules and compose, or load a blueprint, or look up runtime-specific API (e.g. GSAP eases / Lottie player / Three.js mixer). Also covers auditing an existing composition's choreography (animation map) and 24 named text-animation effects. HyperFrames-native: single paused timeline, seek-safe, deterministic.", "manual": false, "path": "~/.agents/skills/hyperframes-animation", "file_count": 120, "files": ["adapters/animate-text.md", "adapters/animejs.md", "adapters/css-animations.md", "adapters/gsap-easing-and-stagger.md", "adapters/gsap-timeline-and-labels.md", "adapters/gsap-transforms-and-perf.md", "adapters/gsap.md", "adapters/html-in-canvas-patterns.md", "adapters/lottie.md", "adapters/three.md", "adapters/typegpu.md", "adapters/waapi.md", "blueprints/agent-progress-theater.md", "blueprints/camera-journey.md", "blueprints/comparison-split.md", "blueprints/constellation-hub.md", "blueprints/cta-morph-press.md", "blueprints/cursor-ui-demo.md", "blueprints/dataviz-countup.md", "blueprints/device-surface-showcase.md", "blueprints/fixed-anchor-cycle.md", "blueprints/grid-card-assemble.md", "blueprints/kinetic-type-beats.md", "blueprints/logo-assemble-lockup.md", "blueprints/overwhelm-surround.md", "blueprints/panel-edit-live-sync.md", "blueprints/prompt-type-submit-generate.md", "blueprints/spatial-pan-stations.md", "blueprints/ticker-takeover.md", "blueprints/titlecard-reveal.md", "blueprints/transcript-scroll-artifact-reveal.md", "blueprints/typewriter-reveal.md", "blueprints/video-text-pivot.md", "blueprints/zoom-out-workspace-reveal.md", "blueprints-index.md", "examples/brand-reveal-assemble-zoom.html", "examples/comparison-split-cards.html", "examples/concept-demo-decode-pan.html", "examples/cta-morph-press.html", "examples/cta-orbit-collapse.html", "examples/demo-page-scroll-spotlight.html", "examples/hook-counter-burst.html", "examples/messaging-multi-phrase.html", "examples/metric-video-text-pivot.html", "examples/problem-mockup-overwhelm.html", "examples/proof-logo-chain.html", "examples/takeover-ticker-displace.html", "examples/workflow-approve-press.html", "rules/3d-camera-flight.md", "rules/3d-page-scroll.md", "rules/3d-text-depth-layers.md", "rules/ai-tracking-box.md", "rules/ambient-glow-bloom.md", "rules/anchored-layout-expand.md", "rules/asr-keyword-glow.md", "rules/avatar-cloud-network.md", "rules/camera-cursor-tracking.md", "rules/card-morph-anchor.md", "rules/center-outward-expansion.md", "rules/chart-scrub-readout.md"], "body": "---\nname: hyperframes-animation\ndescription: \"All animation knowledge for HyperFrames — atomic motion rules, multi-phase scene blueprints, scene transitions, broader motion-design techniques, AND the seven runtime adapters (GSAP default, plus Lottie, Three.js, Anime.js, CSS keyframes, Web Animations API, TypeGPU). Use for any motion or animation task: pick 2-4 rules and compose, or load a blueprint, or look up runtime-specific API (e.g. GSAP eases / Lottie player / Three.js mixer). Also covers auditing an existing composition's choreography (animation map) and 24 named text-animation effects. HyperFrames-native: single paused timeline, seek-safe, deterministic.\"\n---\n\n# HyperFrames Animation\n\nAll motion knowledge in one skill: **rules** (atomic recipes), **blueprints** (multi-phase scene templates), **transitions** (scene-to-scene), **techniques** (broader motion-design patterns), and **adapters** (per-runtime APIs).\n\nFor the composition contract (data attributes, sub-compositions, determinism) see `hyperframes-core`.\n\n## Default: compose atomic rules\n\nPick 2-4 rules from `rules-index.md`, glue them together with a single paused GSAP timeline, done. This is faster and produces less code than starting from a blueprint.\n\n## Load a blueprint when\n\n- The scene matches an existing pre-designed multi-phase template (brand-reveal, social-proof, etc.) and reusing its phase pipeline saves real authoring time\n- You want runnable ground-truth code for a complex 4-5 phase choreography\n\nBlueprints live in `blueprints-index.md`. Each entry points to `blueprints/\u003cid>.md` (recipe). Do not read it speculatively; load it when you've already decided you need scene-level orchestration.\n\n## Routing\n\n| Want to…                                                                       | Read                                                |\n| ------------------------------------------------------------------------------ | --------------------------------------------------- |\n| Pick an atomic motion pattern by trigger / tag                                 | `rules-index.md`                                    |\n| Read one rule's full HTML / CSS / GSAP recipe                                  | `rules/\u003cname>.md`                                   |\n| Pick a multi-phase scene template                                              | `blueprints-index.md`                               |\n| Read one blueprint's full recipe                                               | `blueprints/\u003cid>.md`                                |\n| Author a scene transition (CSS-driven, between two clips)                      | `transitions/overview.md`, `transitions/catalog.md` |\n| Look up a broader motion-design technique                                      | `techniques.md`                                     |\n| Analyze an existing composition's animation map                                | `scripts/animation-map.mjs`                         |\n| GSAP API — timeline / tweens / position parameters                             | `adapters/gsap.md`                                  |\n| GSAP — drop-in effect recipes                                                  | `rules/gsap-effects.md`                             |\n| GSAP — transforms / perf                                                       | `adapters/gsap-transforms-and-perf.md`              |\n| GSAP — eases / stagger                                                         | `adapters/gsap-easing-and-stagger.md`               |\n| GSAP — timeline / labels                                                       | `adapters/gsap-timeline-and-labels.md`              |\n| Lottie / dotLottie (After Effects exports, `window.__hfLottie`)                | `adapters/lottie.md`                                |\n| Three.js / WebGL (3D scenes, `AnimationMixer`, `hf-seek`)                      | `adapters/three.md`                                 |\n| Anime.js (`window.__hfAnime`)                                                  | `adapters/animejs.md`                               |\n| CSS keyframes (`animation-delay` / `play-state` / `fill-mode`)                 | `adapters/css-animations.md`                        |\n| Web Animations API (`element.animate()`, `currentTime` seek)                   | `adapters/waapi.md`                                 |\n| TypeGPU / WebGPU (`navigator.gpu`, WGSL, compute pipelines)                    | `adapters/typegpu.md`                               |\n| HTML-as-texture + WebGL/GLSL post-fx (capture live DOM via `drawElementImage`) | `adapters/html-in-canvas-patterns.md`               |\n| Named text-animation effects (24 IDs via external `animate-text` skill)        | `adapters/animate-text.md`                          |\n\n## Picking a runtime\n\n- **GSAP** is the default for 95% of motion work — covers timeline orchestration, transforms, easing, stagger. All atomic rules in this skill are GSAP-based.\n- **Lottie** when an asset has its own pre-baked timeline (typically After Effects exports).\n- **Three.js** for 3D scenes, camera motion, shader-driven visuals.\n- **Anime.js** for lightweight tweening when GSAP is overkill.\n- **CSS** for simple repeated motifs, decoration, shimmer — no JavaScript animation cost.\n- **WAAPI** for native browser keyframes without a GSAP dependency.\n- **TypeGPU / WebGPU** for GPU-rendered canvases (particles, liquid glass, custom shaders).\n\nMultiple runtimes can coexist in one composition. Each registers its instances on the runtime-specific global so HyperFrames can seek all of them in one pass.\n\n## Critical Constraints\n\n**Prerequisite: `hyperframes-core` → Non-Negotiable Rules** (single paused timeline, `data-duration` governs length, no `Math.random` / `Date.now` / `performance.now`, no `repeat: -1`, no page-load `gsap.set` on later-scene clips, no `display` or raw `visibility` tweens, and no timeline construction inside `async` / `setTimeout` / `Promise`). GSAP `autoAlpha` and zero-duration visibility sets at explicit timeline boundaries remain allowed by core. Use those exceptions only on non-clip elements or wrappers inside a clip; the framework owns `.clip` lifecycle. Don't restate the full contract here.\n\nAnimation-craft additions on top of core's contract:\n\n- **Pre-calculated layout constants** — never derive positions from `getBoundingClientRect()` at tween time. Tween-time DOM measurements desync because the renderer samples in parallel; compute coordinates once at composition setup and reuse.\n- **Spatial motion uses GSAP transform aliases only** (`x`, `y`, `scale`, `rotation`). Core's allowlist also permits `opacity` / `color` / `backgroundColor` / `borderRadius` for non-spatial property tweens — but never `width` / `height` / `top` / `left` for layout changes.\n\n## Scripts\n\n```bash\nnode skills/hyperframes-animation/scripts/animation-map.mjs \u003ccomposition-dir> \\\n  --out \u003ccomposition-dir>/.hyperframes/anim-map\n```\n\nReads every GSAP timeline registered on `window.__timelines`, enumerates tweens, samples bboxes, computes flags, outputs `animation-map.json`. Use it to audit choreography (dead zones, stagger consistency, lifecycle warnings) after authoring.\n\n`animation-map.mjs` resolves helper packages from the current project first, then can bootstrap the bundled HyperFrames package version. Set `HYPERFRAMES_SKILL_PKG_VERSION=\u003cversion>` only when running the skill outside the bundled CLI/skill install and you need to pin that bootstrap version explicitly.\n\n## See Also\n\n- `hyperframes-core` — composition structure, data attributes, sub-compositions, deterministic render contract\n- `hyperframes-creative` — palettes, typography, narration, beat planning (non-animation creative direction)\n- `hyperframes-cli` — `npx hyperframes lint / check / snapshot / preview / render`\n"}, {"name": "hyperframes-cli", "description": "Use the HyperFrames CLI development loop: init, add, catalog, capture, lint, check, snapshot, compare, grade-compare, preview, play, present, beats, keyframes, single or batch render, publish, cloud, cloudrun, feedback, lambda, doctor, browser, info, upgrade, skills, compositions, docs, benchmark, telemetry, transcribe, auth, tts, and remove-background. Also use when diagnosing build or render failures. validate, inspect, and layout are deprecated aliases; use check. Covers local, HeyGen-hosted cloud, AWS Lambda, and Google Cloud Run rendering.", "manual": false, "path": "~/.agents/skills/hyperframes-cli", "file_count": 10, "files": ["references/beats.md", "references/cloud.md", "references/cloudrun.md", "references/compare-and-batch.md", "references/doctor-browser.md", "references/init-and-scaffold.md", "references/lambda.md", "references/lint-validate-inspect.md", "references/preview-render.md", "references/upgrade-info-misc.md"], "body": "---\nname: hyperframes-cli\ndescription: >\n  Use the HyperFrames CLI development loop: init, add, catalog, capture, lint, check, snapshot,\n  compare, grade-compare, preview, play, present, beats, keyframes, single or batch render, publish,\n  cloud, cloudrun, feedback, lambda, doctor, browser, info, upgrade, skills, compositions, docs,\n  benchmark, telemetry, transcribe, auth, tts, and remove-background. Also use when diagnosing build\n  or render failures. validate, inspect, and layout are deprecated aliases; use check. Covers local,\n  HeyGen-hosted cloud, AWS Lambda, and Google Cloud Run rendering.\n---\n\n# HyperFrames CLI\n\nRun commands as `npx hyperframes ...` unless project instructions provide a wrapper. Obey the wrapper when present. The CLI requires Node.js 22 or newer and FFmpeg.\n\n## Development loop\n\n1. **Scaffold:** `npx hyperframes init \u003cproject>` or capture a site. In non-TTY mode, pass `--non-interactive --example=\u003cname>`.\n2. **Author:** write the composition using `/hyperframes-core`.\n3. **Get fast feedback while editing:** run `npx hyperframes lint` after the first HTML pass and after structural changes.\n4. **Run the final gate:** run `npx hyperframes check`; it reruns lint before opening the browser. Do not prepend a redundant standalone lint invocation. Add `--snapshots` for annotated overview frames and finding crops.\n5. **Inspect sub-compositions:** when `index.html` mounts `data-composition-src`, capture midpoint snapshots and inspect each mounted scene.\n6. **Open the final Studio preview:** run `npx hyperframes preview`, hand the timeline project URL to the user, and ask whether to revise or render.\n7. **Render only after approval:** use draft quality for iteration and high quality for delivery.\n8. **Verify the output:** confirm the file exists, is non-empty, and has a plausible duration.\n\n```bash\n# Fast iteration check; repeat while authoring as needed.\nnpx hyperframes lint\n\n# Required final gate; includes lint.\nnpx hyperframes check\nnpx hyperframes preview\nnpx hyperframes render --quality high --output out.mp4\ntest -s out.mp4\nffprobe -v error -show_format out.mp4\n```\n\n`check` runs lint first, then uses one browser session and one seek pass to audit runtime errors, failed requests, layout, `*.motion.json` assertions, and WCAG contrast. Persistent findings gate the exit code; transient entrance or exit findings are informational. Use `--strict` to gate warnings. `validate`, `inspect`, and `layout` remain aliases for compatibility but must not appear in new instructions or scripts.\n\n## Two different preview surfaces\n\nDo not confuse these states:\n\n| Surface                   | When it may open                                       | Purpose                                                                           |\n| ------------------------- | ------------------------------------------------------ | --------------------------------------------------------------------------------- |\n| Storyboard board          | Before composition checks, only when `storyboard: yes` | Review plan cards and wireframe sketches. Open `?view=storyboard#project/\u003cname>`. |\n| Final composition preview | After `check` passes                                   | Review the assembled timeline before render. Open `#project/\u003cname>`.              |\n\nThe early board is not approval of the final video. Rendering always requires the final approval defined by `hyperframes-core/references/review-loop.md`.\n\n## Sub-composition smoke test\n\nStatic audits cannot catch every mount failure. When the project uses sub-compositions, capture at least one visible midpoint for each host slot:\n\n```bash\nnpx hyperframes snapshot --at \u003ct1>,\u003ct2>,\u003ct3>\n```\n\nTreat tiny unstyled content, canvas-sized icons, missing hero elements, or timeline-registration timeouts as render-blocking mount defects. See `hyperframes-core/references/sub-compositions.md` for the corresponding fixes.\n\n## Agent conventions\n\n- Prefer `--json` for agent and CI calls. Server-mode `render`, `preview`, and `play` do not provide ordinary JSON output; `preview --selection --json` and `preview --context --json` are query-mode exceptions.\n- `doctor --json` always exits zero. Gate on its payload:\n\n  ```bash\n  npx hyperframes doctor --json | jq -e '.ok' >/dev/null\n  ```\n\n- Non-TTY mode is automatic. `init` requires `--example` there; use `--non-interactive` to force deterministic behavior on a TTY.\n- Use one `HYPERFRAMES_RUN_ID` for all commands in the same verification loop.\n- Use `--strict`, `--strict-all`, and `--strict-variables` when the corresponding warnings, variables, or CI conditions must gate the render.\n- JSON paths redact the home directory as `$HOME`; do not try to reverse the redaction.\n- When a hosted cloud project approaches or exceeds the 200 MB upload limit, use `cloud render --dry-run --json` and follow the `.hyperframesignore` investigation in `references/cloud.md`. Never ignore an asset merely because it is large.\n- Never render merely because checks pass. Pause at the final preview and wait for approval.\n\n## Studio-directed edits\n\nWhen the user refers to “this element” or the current selection, query Studio instead of guessing:\n\n```bash\nnpx hyperframes preview --context --json --context-fields selection\n```\n\nUse `selection.target.hfId` when available, otherwise its selector and source file. If the result reports `no-selection`, ask the user to click the element and rerun. Request only the context slices you need; use `--context-detail full` only for computed styles or editable text metadata. Full behavior and failure codes live in `references/preview-render.md`.\n\n## Render choices\n\n| Need                                     | Command                                                                       |\n| ---------------------------------------- | ----------------------------------------------------------------------------- |\n| Fast local iteration                     | `npx hyperframes render --quality draft`                                      |\n| Final local delivery                     | `npx hyperframes render --quality high --output out.mp4`                      |\n| Reproducible container render            | `npx hyperframes render --docker --strict --output out.mp4`                   |\n| Local variable-driven batch render       | `npx hyperframes render --batch rows.json --output \"renders/{name}.mp4\"`      |\n| HeyGen-hosted zero-infrastructure render | `npx hyperframes cloud render`                                                |\n| Self-managed distributed AWS render      | `npx hyperframes lambda render \u003cproject> --width 1920 --height 1080 --wait`   |\n| Self-managed distributed GCP render      | `npx hyperframes cloudrun render \u003cproject> --width 1920 --height 1080 --wait` |\n\nSkill attribution is automatic — the examples above need no `--skill`. A project scaffolded by a workflow (`hyperframes init --skill=\u003cworkflow>`) records its owning skill in `hyperframes.json`, and every later render inherits it on anonymous telemetry: re-renders, `npm run render`, and `--batch` alike. Pass `--skill=\u003cslug>` explicitly only to stamp a project that was not created through a workflow (its first render then persists it).\n\nUse cloud rendering when the user wants hosted rendering without local Chrome, FFmpeg, or AWS. Use Lambda only when AWS ownership is a requirement. Use Cloud Run only when GCP ownership is a requirement. Read the matching reference before running any cloud path.\n\nAfter verifying a successful render, send one feedback report unless telemetry is disabled or the user opted out:\n\n```bash\nnpx hyperframes feedback --rating \u003c0-10> --comment \"\u003cspecific result or friction>\"\n```\n\nKeep clean-run feedback concise. For any bug or friction, capture a **reproduction packet** before submitting; do not send only a symptom summary. Include the rerunnable command (relative to the project directory — feedback is submitted to a public channel, so do **not** paste absolute paths, home-directory prefixes, or user/machine identifiers), expected versus actual behavior, exact error (also strip absolute paths from stack traces — keep basename + line, drop the leading directory), whether output completed/fell back/failed, workaround, and repro-project status. For a rating ≤ 7 that describes a visual defect (black frame, flicker, corrupt output, wrong frame, blank output, other visual anomaly), also include a `COMPOSITION_STRUCTURE:` block — a privacy-preserving structural anatomy (element census + attribute presence + timeline shape) so maintainers can pattern-match against known bug families without the composition ZIP. Agents auto-fill this via the composition-census helper; the human user does not fill it by hand. If the issue did not reproduce again, say so and still include the last failing command and logs. Use `--file-issue` only with consent: it publishes a minimal reproduction to a public URL. The required packet format and privacy warning live in `references/preview-render.md`.\n\n## Read the matching reference before running a command\n\nThe following references and owning skills are mandatory command contracts, not optional background reading. Before running a command in the table, read its matching row.\n\n| Need                                                                                   | Reference                             |\n| -------------------------------------------------------------------------------------- | ------------------------------------- |\n| `init`, `capture`, `skills`                                                            | `references/init-and-scaffold.md`     |\n| `lint`, `check`, motion sidecars, `snapshot`                                           | `references/lint-validate-inspect.md` |\n| `compare`, `grade-compare`, variable-driven `render --batch`                           | `references/compare-and-batch.md`     |\n| `beats` for an existing project's Studio beat grid                                     | `references/beats.md`                 |\n| `preview`, `play`, `render`, `publish`, Studio context, feedback                       | `references/preview-render.md`        |\n| `doctor`, browser management                                                           | `references/doctor-browser.md`        |\n| `auth`, HeyGen-hosted cloud rendering, and template variables                          | `references/cloud.md`                 |\n| AWS Lambda deployment and rendering                                                    | `references/lambda.md`                |\n| Google Cloud Run deployment and rendering                                              | `references/cloudrun.md`              |\n| `info`, `upgrade`, `compositions`, `docs`, `benchmark`, telemetry, media preprocessing | `references/upgrade-info-misc.md`     |\n\nFor composition variables, also read `/hyperframes-core` → `references/variables-and-media.md`. For `hyperframes add` and `hyperframes catalog`, use `/hyperframes-registry`. Before `hyperframes present`, read `/slideshow`; before `hyperframes keyframes`, read `/hyperframes-keyframes`. For TTS, transcription, captions, or background removal choices, use `/media-use`.\n\nThe specialized commands are deliberately documented by their owning workflows:\n\n```bash\nnpx hyperframes present \u003cproject-dir> --port 3004 --no-open\nnpx hyperframes beats \u003cproject-dir> --json\nnpx hyperframes keyframes \u003cproject-dir> --json\n```\n\n`present` serves a navigable deck with presenter and audience synchronization. `beats` is the standalone Studio beat-grid utility defined in `references/beats.md`. `keyframes` surfaces seek-safe animation and motion-path diagnostics.\n"}, {"name": "hyperframes-core", "description": "The HyperFrames composition contract — build one renderable project. Use for composition structure, the `data-*` timing attributes, `class=\"clip\"`, tracks, sub-compositions, variables, framework-owned media playback, deterministic-render rules, and validation. Also covers Tailwind projects and the STORYBOARD.md / SCRIPT.md plan formats. Read before writing composition HTML.", "manual": false, "path": "~/.agents/skills/hyperframes-core", "file_count": 18, "files": ["references/brief-contract.md", "references/brief-format.md", "references/composition-patterns.md", "references/data-attributes.md", "references/determinism-rules.md", "references/frame-worker-core.md", "references/full-screen-motion.md", "references/minimal-composition.md", "references/production-loop.md", "references/review-loop.md", "references/script-format.md", "references/storyboard-format.md", "references/sub-compositions.md", "references/subagent-dispatch.md", "references/tailwind.md", "references/tracks-and-clips.md", "references/variables-and-media.md", "scripts/lib/frame-packets-core.mjs"], "body": "---\nname: hyperframes-core\ndescription: The HyperFrames composition contract — build one renderable project. Use for composition structure, the `data-*` timing attributes, `class=\"clip\"`, tracks, sub-compositions, variables, framework-owned media playback, deterministic-render rules, and validation. Also covers Tailwind projects and the STORYBOARD.md / SCRIPT.md plan formats. Read before writing composition HTML.\n---\n\n# HyperFrames Core\n\nHyperFrames renders video from HTML. A composition is an HTML file whose DOM declares timing with `data-*` attributes, whose animation runtime is seekable, and whose media playback is owned by the framework.\n\nThis skill is the **technical contract** — how to build one hyperframes project. The body below is the build guide; per-topic detail lives in `references/` (index next), read on demand. Other concerns live in the sibling domain skills — `hyperframes-animation`, `hyperframes-creative`, `media-use`, `hyperframes-cli`, `hyperframes-registry`. The capability map in `/hyperframes` says what each one covers.\n\n## References\n\n| File                                 | Read it to…                                                                                                                                                                        |\n| ------------------------------------ | ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| `references/minimal-composition.md`  | start from the smallest renderable composition skeleton                                                                                                                            |\n| `references/composition-patterns.md` | choose monolithic vs modular; structure a modular `index.html`; pick a sub-comp archetype                                                                                          |\n| `references/data-attributes.md`      | look up any `data-*` (root / clip / sub-comp host / legacy aliases); use `class=\"clip\"`                                                                                            |\n| `references/tracks-and-clips.md`     | pick `data-track-index`, handle same-track overlap / z-index, time a clip relative to another                                                                                      |\n| `references/sub-compositions.md`     | wire a sub-composition (host attrs, `\u003ctemplate>`, per-instance vars) and animate inside it                                                                                         |\n| `references/variables-and-media.md`  | declare variables; place `\u003cvideo>`/`\u003caudio>`, set volume, trim                                                                                                                     |\n| `references/determinism-rules.md`    | build a seekable timeline; determinism bans; the animatable-property allowlist; layout / text fit                                                                                  |\n| `references/full-screen-motion.md`   | author full-frame motion with shared backgrounds                                                                                                                                   |\n| `references/storyboard-format.md`    | author a `STORYBOARD.md` plan (+ the parsed manifest)                                                                                                                              |\n| `references/review-loop.md`          | run the plan → sketch → build review passes on a live board — shared by every storyboard-planning workflow                                                                         |\n| `references/production-loop.md`      | take an approved plan to a delivered video — the stage dependencies (audio, frames, assembly, transitions, captions, verify, deliver) a freeform build follows directly            |\n| `references/brief-contract.md`       | the brief's ground rules — mode derivation (collaborative / autonomous), shared field registry, question invariants (the asking itself lives in `/hyperframes` → the intent layer) |\n| `references/brief-format.md`         | author `BRIEF.md` — the confirmed intent document a workflow's Setup writes and every later step reads                                                                             |\n| `references/script-format.md`        | author the optional `SCRIPT.md` locked narration                                                                                                                                   |\n| `references/subagent-dispatch.md`    | map subagent dispatch verbs (parallel fan-out / background / wait) to your harness                                                                                                 |\n| `references/frame-worker-core.md`    | the shared frame-worker role contract — each narrative workflow's packet builder prepends it to that workflow's `sub-agents/frame-worker.md` delta                                 |\n| `references/tailwind.md`             | work in a Tailwind v4 project (`init --tailwind`; runtime contract differs from Studio's v3)                                                                                       |\n\nFor animation runtime specifics (GSAP API, Lottie, Three.js, etc.) go to `hyperframes-animation` → `adapters/\u003cruntime>.md`.\n\n## Building a composition\n\n### Two root forms (not interchangeable)\n\n- **Standalone** (top-level `index.html`) — root `\u003cdiv data-composition-id=\"…\">` sits directly in `\u003cbody>`, **no `\u003ctemplate>` wrapper** (wrapping it hides all content and breaks rendering).\n- **Sub-composition** (loaded via `data-composition-src`) — root **must** be wrapped in `\u003ctemplate>`.\n\n> ⚠ Transport rule: the runtime **only clones `\u003ctemplate>` contents**; everything outside (incl. `\u003chead>` styles/scripts) is discarded — put `\u003cstyle>`/`\u003cscript>` **inside** the template.\n> ⚠ Host-id rule: the host slot's `data-composition-id` must **exactly equal** the inner template's `data-composition-id` **and** the `window.__timelines[\"\u003cid>\"]` key — no `-mount`/`-slot`/`-host` suffix.\n\nFile shape, host wiring, and the pre-render checklist → `references/sub-compositions.md`.\n\n### Root must be sized (silent layout bug)\n\nThe standalone root needs an explicit **sized box** (`width`/`height` in px), and every ancestor down to a `height:100%` element must have a resolved height — otherwise a flex/`100%` child collapses to ~0 and content piles into the top-left corner. Do not rely on automated gates alone to catch this; inspect a snapshot. Skeleton → `references/minimal-composition.md`.\n\n### One paused timeline\n\nEach composition registers **exactly one** `gsap.timeline({ paused: true })` at `window.__timelines[\"\u003cid>\"]` (key = root `data-composition-id`), built **synchronously** at page load. Render duration = root `data-duration`, not timeline length. Don't manually nest sub-timelines into the host. Full contract (incl. non-GSAP runtimes) → `references/determinism-rules.md` + `hyperframes-animation/adapters/`.\n\n### First-pass lint gotchas (a guaranteed first build failure)\n\nTwo rules that `lint` **does** catch, but only after the fact — write them right the first time:\n\n- The **root** composition element must carry `data-start=\"0\"` (alongside `data-composition-id`/`data-width`/`data-height`); omitting it fails `lint` with `root_composition_missing_data_start`.\n- Never pair a CSS initial `transform` with a GSAP tween on the **same** property — the CSS value and the tween's start fight and `lint` rejects it with `gsap_css_transform_conflict`. Set the initial state inside the tween with `gsap.fromTo(el, { x: -40 }, { x: 0 })` instead of a CSS `transform: translateX(-40px)`.\n\n### Non-negotiable rules (silent bugs automated gates may miss)\n\nSurfaced here; full rationale in the linked reference. Do not violate:\n\n- No render-time clocks / unseeded `Math.random` / network / input-state; no `repeat: -1` (use a finite count). → `determinism-rules.md`\n- Animate only the visual-property allowlist; never tween `display` or raw `visibility`. GSAP `autoAlpha` and zero-duration timeline boundary sets are the only visibility exceptions, and only on non-clip elements or wrappers inside a clip. The framework alone controls `.clip` visibility. Do not `gsap.set` later-scene clips at page load. → `determinism-rules.md`\n- No `\u003cbr>` in body text; transformed elements must be block-level + sized; pulsing absolute decoratives need peak clearance. → `determinism-rules.md`\n- `\u003cvideo>`/`\u003caudio>` work at **any nesting depth** (including inside a sub-comp `\u003ctemplate>` or wrapper); the framework owns playback and seeks/decodes media wherever it lives. The one caveat is timelines, not placement: a sub-comp timeline can't animate host-root elements. → `variables-and-media.md`\n- Every `id` must be unique across the **assembled** page; inside a sub-comp, prefix ids with the composition id (`#\u003cid>-hero`). Duplicate `\u003cvideo>`/`\u003cimg>` ids render **blank** — the producer injects frames by `getElementById`, and cross-file dupes slip past `lint`. → `composition-patterns.md`\n- A full-screen scene fill goes on a full-bleed **child** (`position:absolute; inset:0`), never on the composition root itself — the producer's frame compositing can drop the root element's own `background` (the frame renders **black**) even though preview/`snapshot` show it correctly. → `composition-patterns.md`\n\n## Editing existing compositions\n\n- Read the files first. Preserve unrelated timing, tracks, IDs, variables, media paths.\n- Match existing composition IDs and timeline keys.\n- Adding a clip: pick a non-overlapping `data-track-index` or adjust surrounding timing intentionally.\n- `data-hidden` on any composition element hides it in BOTH preview and render, overriding its time window; it is non-destructive/reversible and toggled by Studio's timeline eye icon.\n- Adding a sub-composition: verify its internal `data-composition-id` before wiring the host.\n\n## Validation\n\nUse `hyperframes-cli` for command details\n\n- [ ] `npx hyperframes check` passes (0 findings across lint, runtime, layout, motion, and contrast)\n- [ ] Projects with sub-compositions: `npx hyperframes snapshot --at \u003cmidpoints>` and eyeball each frame\n- [ ] `npx hyperframes preview` for review (the user can edit anything in Studio's timeline)\n- [ ] `npx hyperframes render` only after the user approves\n"}, {"name": "hyperframes-creative", "description": "Non-animation creative direction for HyperFrames videos. Use for design spec (frame.md / design.md) handling, palettes, typography, narration, beat planning, audio-reactive visuals, composition patterns, and brand / style decisions. For atomic motion patterns and scene blueprints, use `hyperframes-animation`.", "manual": false, "path": "~/.agents/skills/hyperframes-creative", "file_count": 77, "files": ["frame-presets/biennale-yellow/FRAME.md", "frame-presets/biennale-yellow/caption-skin.html", "frame-presets/biennale-yellow/frame-showcase.html", "frame-presets/blockframe/FRAME.md", "frame-presets/blockframe/caption-skin.html", "frame-presets/blockframe/frame-showcase.html", "frame-presets/blue-professional/FRAME.md", "frame-presets/blue-professional/caption-skin.html", "frame-presets/blue-professional/frame-showcase.html", "frame-presets/bold-poster/FRAME.md", "frame-presets/bold-poster/caption-skin.html", "frame-presets/bold-poster/frame-showcase.html", "frame-presets/broadside/FRAME.md", "frame-presets/broadside/caption-skin.html", "frame-presets/broadside/frame-showcase.html", "frame-presets/capsule/FRAME.md", "frame-presets/capsule/caption-skin.html", "frame-presets/capsule/frame-showcase.html", "frame-presets/cartesian/FRAME.md", "frame-presets/cartesian/caption-skin.html", "frame-presets/cartesian/frame-showcase.html", "frame-presets/cobalt-grid/FRAME.md", "frame-presets/cobalt-grid/caption-skin.html", "frame-presets/cobalt-grid/frame-showcase.html", "frame-presets/code-editorial/FRAME.md", "frame-presets/code-editorial/caption-skin.html", "frame-presets/code-editorial/fonts/EBGaramond-400.woff2", "frame-presets/code-editorial/fonts/EBGaramond-700.woff2", "frame-presets/code-editorial/fonts/Inter-400.woff2", "frame-presets/code-editorial/fonts/Inter-700.woff2", "frame-presets/code-editorial/fonts/JetBrainsMono-400.woff2", "frame-presets/code-editorial/fonts/JetBrainsMono-700.woff2", "frame-presets/code-editorial/fonts/OFL-eb-garamond.txt", "frame-presets/code-editorial/fonts/OFL-inter.txt", "frame-presets/code-editorial/fonts/OFL-jetbrains-mono.txt", "frame-presets/code-editorial/frame-showcase.html", "frame-presets/coral/FRAME.md", "frame-presets/coral/caption-skin.html", "frame-presets/coral/frame-showcase.html", "frame-presets/creative-mode/FRAME.md", "frame-presets/creative-mode/caption-skin.html", "frame-presets/creative-mode/frame-showcase.html", "frame-presets/daisy-days/FRAME.md", "frame-presets/daisy-days/caption-skin.html", "frame-presets/daisy-days/frame-showcase.html", "frame-presets/editorial-forest/FRAME.md", "frame-presets/editorial-forest/caption-skin.html", "frame-presets/editorial-forest/frame-showcase.html", "palettes/bold-energetic.md", "palettes/clean-corporate.md", "palettes/dark-premium.md", "palettes/jewel-rich.md", "palettes/monochrome.md", "palettes/nature-earth.md", "palettes/neon-electric.md", "palettes/pastel-soft.md", "palettes/warm-editorial.md", "references/audio-reactive.md", "references/beat-direction.md", "references/composition-patterns.md"], "body": "---\nname: hyperframes-creative\ndescription: Non-animation creative direction for HyperFrames videos. Use for design spec (frame.md / design.md) handling, palettes, typography, narration, beat planning, audio-reactive visuals, composition patterns, and brand / style decisions. For atomic motion patterns and scene blueprints, use `hyperframes-animation`.\n---\n\n# HyperFrames Creative\n\nBrand, pacing, style, narration, and composition direction. Use after the technical contract from `hyperframes-core` is in place.\n\nFor motion patterns, scene blueprints, transitions, and CSS marker effects, use `hyperframes-animation` — this skill is intentionally non-animation.\n\n> **Read these two FIRST for any non-trivial composition — they override web instincts:**\n>\n> - `references/house-style.md` — \"interpret the prompt, generate real content,\" the lazy-default list, and the background/foreground layer recipe. This is what turns a literal restyle into a _concept_.\n> - `references/video-composition.md` — video-medium scale, depth, and foreground detail. It explains how to avoid empty web-page layouts without imposing a universal element count.\n>\n> Skipping these is the single biggest cause of generic, web-page-looking output. They are not optional rows in the routing table below — for anything beyond a one-line edit, open both before you choose colors or write HTML.\n\n## Workflow\n\n1. If a project has a design spec, **read it first** and treat its frontmatter tokens as brand truth (colors, fonts, spacing, tone, constraints). Which file to read (precedence `frame.md` → `design.md` → `DESIGN.md`) and how to parse it (frontmatter = normative, prose = context) are defined once in [`references/design-spec.md`](references/design-spec.md) — resolve and load per that doc.\n2. If no design spec exists and the user asks for visual direction, choose a route:\n   - Ready-made frame-preset (optional) → `frame-presets/` (adopt a `FRAME.md` as `frame.md`; see `references/design-spec.md`)\n   - Named style or mood → `references/visual-styles.md`\n   - Fast defaults → `references/house-style.md`\n   - Interactive selection → `references/design-picker.md`\n3. For multi-scene work, plan beats and rhythm before writing HTML → `references/beat-direction.md`. For scene transitions, jump to `hyperframes-animation/transitions/`.\n4. For motion-heavy work, read `references/motion-principles.md` (high-level guardrails), then go to `hyperframes-animation` for atomic rules.\n\n## Routing\n\n| Topic                                                                         | Read                                           |\n| ----------------------------------------------------------------------------- | ---------------------------------------------- |\n| Adopt a ready-made frame-preset as `frame.md` (optional)                      | `frame-presets/` · `references/design-spec.md` |\n| Default palettes, motion, typography, lazy defaults to question               | `references/house-style.md`                    |\n| Named style presets, mood-to-style routing                                    | `references/visual-styles.md`                  |\n| Palette-specific color tokens                                                 | `palettes/*.md`                                |\n| Composition patterns — PiP, text-behind-subject, title card, slide show       | `references/composition-patterns.md`           |\n| Stats / infographic presentation                                              | `references/data-in-motion.md`                 |\n| Structured expansion for open-ended prompts                                   | `references/prompt-expansion.md`               |\n| Video-medium density, scale, color, frame composition                         | `references/video-composition.md`              |\n| Per-beat direction, rhythm planning, transition timing                        | `references/beat-direction.md`                 |\n| Post-authoring spec verification (colors, type, corners, spacing, depth)      | `references/design-adherence.md`               |\n| High-level motion guardrails and GSAP-quality rules                           | `references/motion-principles.md`              |\n| Font selection, pairings, rendered-video type guardrails                      | `references/typography.md`                     |\n| Story doctrine — hook language, value-before-evidence, storyboard-as-proposal | `references/story-spine.md`                    |\n| Script pacing, tone, openings, number pronunciation                           | `references/narration.md`                      |\n| Precomputed audio bands mapped to motion                                      | `references/audio-reactive.md`                 |\n\n## Scripts\n\n- `scripts/contrast-report.mjs` — inspect contrast warnings from rendered frames.\n- `scripts/extract-audio-data.py` — pre-extract audio bands for audio-reactive compositions.\n- `scripts/package-loader.mjs` — support script for bundled creative tooling.\n\n`contrast-report.mjs` resolves helper packages from the current project first, then can bootstrap the bundled HyperFrames package version. Set `HYPERFRAMES_SKILL_PKG_VERSION=\u003cversion>` only when running the skill outside the bundled CLI/skill install and you need to pin that bootstrap version explicitly.\n\nRun from the repo root with explicit paths, for example:\n\n```bash\npython skills/hyperframes-creative/scripts/extract-audio-data.py \u003caudio-file>\n```\n\nAnimation analysis (`animation-map.mjs`) lives in `hyperframes-animation/scripts/`.\n\n## Boundaries\n\n- Do not override `hyperframes-core` technical rules.\n- Do not require a design system for a minimal technical composition.\n- Do not add extra scenes, narration, music, captions, or transitions unless the request calls for them or you first propose the expansion.\n- Keep recipe references task-specific; do not read every reference for simple edits.\n"}, {"name": "hyperframes-keyframes", "description": "Use when a HyperFrames composition needs seek-safe 2D/3D keyframes, GSAP timelines, CSS keyframes, Anime.js, WAAPI, FLIP, paths, masks, SVG morph/draw, text trails, 3D depth, or `hyperframes keyframes` diagnostics. Don't use for broad scene strategy, brand design, media sourcing, captions, or general video planning.", "manual": false, "path": "~/.agents/skills/hyperframes-keyframes", "file_count": 2, "files": ["agents/openai.yaml", "references/keyframe-patterns.md"], "body": "---\nname: hyperframes-keyframes\ndescription: >\n  Use when a HyperFrames composition needs seek-safe 2D/3D keyframes, GSAP\n  timelines, CSS keyframes, Anime.js, WAAPI, FLIP, paths, masks, SVG morph/draw,\n  text trails, 3D depth, or `hyperframes keyframes` diagnostics.\n  Don't use for broad scene strategy, brand design, media sourcing, captions, or\n  general video planning.\n---\n\n# HyperFrames Keyframes\n\nKeyframes are a pose contract: visible states, continuous subject identity, seek-safe runtime, verified pixels.\n\nUse `hyperframes-animation` for broad scene recipes. Use `hyperframes-cli` for full command docs. Use `references/keyframe-patterns.md` only when choosing implementation mechanisms, not visual style.\n\n## Procedure\n\n1. Identify the animated subject, visible states, final state, and runtime.\n2. Choose the smallest mechanism that proves the prompt. Read `references/keyframe-patterns.md` only if the mechanism is unclear.\n3. Author seek-safe keyframes in the declared runtime. Build synchronously and register the runtime instance.\n4. Verify with `hyperframes lint`, `hyperframes check`, `hyperframes keyframes`, one focused `--shot`, and snapshots at proof times.\n5. If proof fails, fix the source keyframes and rerun the smallest failing diagnostic before rendering.\n\n## Contract\n\n- Name the moving subject.\n- Name the poses needed to prove the intended motion, including the final state.\n- Keyframe visible channels, not hidden helper state.\n- Preserve object identity when continuity matters.\n- Crossfade only when the intended motion is replacement or dissolve.\n- Hold readable or semantic states long enough to see.\n- Final frame is part of the animation, not cleanup.\n- Do not reset to rest unless requested.\n- Do not end on black unless requested.\n- If editing a starter scene, preserve layout, copy, assets, colors, and final state unless asked to redesign.\n\n## Runtime Rules\n\nGSAP:\n\n- build synchronously at page load\n- use `gsap.timeline({ paused: true })`\n- register as `window.__timelines[compositionId]`\n- registry key must match `data-composition-id`\n- do not call `tl.play()` for render-critical motion\n- keep repeats finite\n\nCSS keyframes:\n\n- finite duration and iteration count\n- deterministic delay\n- `animation-fill-mode: both`\n- use `data-start` when timing belongs to a clip\n\nAnime.js:\n\n- create synchronously\n- `autoplay: false`\n- finite duration and loops\n- push every instance to `window.__hfAnime`\n\nWAAPI:\n\n- finite `duration`\n- `fill: \"both\"`\n- deterministic construction\n- the text surface does not list WAAPI; verify with `--shot` (it seeks WAAPI) and snapshots\n\nNever use for render-critical motion:\n\n- `Date.now()`\n- `performance.now()`\n- unseeded `Math.random()`\n- hover/scroll triggers\n- timers\n- async-created timelines\n- unregistered `requestAnimationFrame`\n- infinite loops\n\n## GSAP Skeleton\n\n```js\nconst root = document.querySelector(\"[data-composition-id]\");\nconst compositionId = root.dataset.compositionId;\nconst tl = gsap.timeline({ paused: true });\n\ntl.addLabel(\"state-a\", 0);\ntl.to(\".subject\", {\n  keyframes: [\n    { x: 0, opacity: 1, duration: 0.2 },\n    { x: 120, opacity: 1, duration: 0.4, ease: \"power2.out\" },\n    { x: 100, opacity: 1, duration: 0.2, ease: \"power2.inOut\" },\n  ],\n  ease: \"none\",\n});\n\nwindow.__timelines = window.__timelines || {};\nwindow.__timelines[compositionId] = tl;\n```\n\nUse labels for semantic states. Use position parameters instead of chained delays. Use `immediateRender: false` for later `from()`/`fromTo()` tweens touching the same property.\n\n## Keyframe Forms\n\n- Array keyframes: pose ladder with per-step duration/ease.\n- Percentage keyframes: exact timing inside one tween.\n- Property arrays: compact multi-stop changes.\n- `ease: \"none\"` on the parent when each stop carries its own easing.\n- `easeEach` when every segment should share the same feel.\n\nDo not copy numeric distances or timing from examples. Derive them from the actual composition geometry and duration.\n\nFor one subject moving between two boxes, prefer one continuous transform tween or FLIP. Split `x/y/scale` into multiple eased keyframes only when the viewer should feel distinct beats; every segment changes velocity and can read as a hitch.\n\n## Channels\n\nPrefer compositor/visual channels: `x/y/z`, `xPercent/yPercent`, `scale`, `rotationX/Y/Z`, `skew`, `transformOrigin`, `svgOrigin`, `opacity`, `autoAlpha`, `clip-path`, masks, CSS vars, SVG path/dash values, camera transforms, shader uniforms.\n\nAvoid layout/lifecycle channels: `top/left/right/bottom`, `width/height`, `margin/padding`, `display`, `visibility`, late DOM creation, helper overlays doing subject motion.\n\nFor visibility changes, use `autoAlpha` on the registered seekable GSAP timeline, or a zero-duration `tl.set()` at an explicit boundary. Target only a non-clip element or a wrapper inside the clip; never target `.clip` itself. Never duration-tween raw `visibility`, and never tween `display`.\n\n## Mechanism Choice\n\nChoose the smallest mechanism that proves the prompt:\n\n| Need                                  | Mechanism                                          |\n| ------------------------------------- | -------------------------------------------------- |\n| Same subject changes box or hierarchy | shared element / FLIP                              |\n| Subject travels a visible route       | path travel                                        |\n| Stroke grows or traces                | stroke draw                                        |\n| Shape becomes another shape           | shape interpolation                                |\n| Reveal boundary is visible            | clip, mask, or shader uniform                      |\n| Many items move with order            | stagger / indexed delay                            |\n| Text itself moves                     | line, word, character, or band subdivision         |\n| Surface bends, stretches, or crops    | parent/child counter-transform                     |\n| UI has states                         | explicit state machine                             |\n| Scene has depth                       | DOM 3D, Three.js, or WebGL camera/object keyframes |\n\nMechanisms can combine, but each one must clarify the idea. Decoration is not proof.\n\n## Timing\n\n- Anticipation only when it clarifies cause or direction.\n- Acceleration leaves rest.\n- Peak proof shows the mechanism unmistakably.\n- Follow-through sells energy and direction.\n- Overshoot only when the subject should feel elastic or tactile.\n- Constant-speed path travel usually needs `ease: \"none\"`.\n- Discrete UI states usually need a sharp ease-out.\n- Repeated elements need ordered offsets, not identical timing.\n- Final lockups need longer holds than transition poses.\n- Smoothness means continuous velocity on the same subject.\n- Do not overlap tweens that write the same transform property unless the overlap is intentional and verified.\n- Avoid animating large `clip-path`/mask changes while the same hero surface is also scaling or traveling; use nested reveals after the main move settles.\n\n## Text\n\nPreserve line boxes, word spacing, readability, and final fit. If text moves internally, move the glyphs or masked bands, not only decorations around the text. Snapshot readable frames.\n\n## SVG\n\nFor stroke growth prefer `DrawSVGPlugin`, then `stroke-dasharray`/`stroke-dashoffset`. For shape interpolation prefer `MorphSVGPlugin`; convert primitives to paths when needed and split complex silhouettes into simpler parts.\n\n## 3D\n\nScale alone is fake depth. Use perspective on a stable parent, `transform-style: preserve-3d`, z travel, rotation, camera/world motion, occlusion, and layer order when objects cross.\n\nUse one or two diagnostic angles that expose the depth relationship. If angled proof shows no depth crossing, improve z/camera/occlusion.\n\n## Canvas / WebGL\n\nKeyframe camera position, camera target, object transform, material opacity, shader uniforms, and postprocess intensity through deterministic state. Render from HyperFrames time. Use `--ghost` because marker boxes cannot see internal canvas motion.\n\n## CLI Proof\n\n```bash\nnpx hyperframes lint\nnpx hyperframes check\nnpx hyperframes keyframes .\nnpx hyperframes keyframes . --json\nnpx hyperframes keyframes . --runtime all\nnpx hyperframes keyframes . --selector \"\u003cselector>\" --shot \"\u003cfile>\" --samples \u003cn>\nnpx hyperframes keyframes . --selector \"\u003cselector>\" --shot \"\u003cfile>\" --layout strip --from \u003ct0> --to \u003ct1>\nnpx hyperframes keyframes . --shot \"\u003cfile>\" --ghost --angle \u003cangle>\nnpx hyperframes snapshot . --at \u003ctimes>\n```\n\nChoose `\u003cselector>` for the real animated subject. Choose `\u003ctimes>` for first frame, proof poses, final-minus-hold, and exact final. Choose `\u003cangle>` only when depth must be proven.\n\n| Tool             | Proves                                                                                              |\n| ---------------- | --------------------------------------------------------------------------------------------------- |\n| `keyframes`      | targets, explicit stops, paths, traces, composed parent/child motion, CSS stops, Anime registration |\n| `--shot`         | ghosts, route shape, time spacing, DOM 3D projection, focused selector proof                        |\n| `--layout strip` | in-place motion, overlaps, contact, subtle scale/opacity, text waves                                |\n| `--ghost`        | canvas, WebGL, shader motion, rendered 3D                                                           |\n| `snapshot --at`  | masks, text readability, full state, final lockup, black/reset tails                                |\n\nIf selector proof looks wrong:\n\n1. rerun `--json`\n2. find the actual animated target\n3. shoot that target\n4. snapshot full frames\n5. trust painted pixels over logs\n\n## Diagnostic Reading\n\n`flat` means no explicit middle poses. `keyframes` means explicit stops exist. `motionPath` means a route exists. `trace` means multi-stroke drawing. `composed with` means child motion inherits parent motion.\n\nEven ghost spacing means constant speed. Clustered ghosts mean slow-in or settle. Large gaps mean fast travel.\n\nA helper-selector shot is not proof. An onion shot over a broken full frame is not proof.\n\n## Error Handling\n\n| Failure            | Fix                                                                                |\n| ------------------ | ---------------------------------------------------------------------------------- |\n| endpoint-only      | add middle poses, hold peak proof, rerun `--shot`                                  |\n| identity break     | keep one element alive, use shared source/final boxes, remove substitute crossfade |\n| fake 3D            | add z/camera travel, occlusion, angled proof                                       |\n| wrong final        | add final hold, snapshot final-minus-hold and exact final                          |\n| unseekable runtime | pause autoplay, register instance, remove timers, build synchronously              |\n| unreadable text    | preserve line boxes, reduce displacement, add final hold, snapshot text frames     |\n\n## Done\n\nRun `hyperframes lint`, `hyperframes check`, `hyperframes keyframes`, one focused `--shot`, and snapshots. Confirm first frame, proof poses, final-minus-hold, exact final, subject-owned motion, and no debug overlays.\n"}, {"name": "hyperframes-registry", "description": "Install, discover, and wire registry blocks and components into HyperFrames compositions. Use when running hyperframes add or hyperframes catalog, installing one item or every block matching a tag, wiring an installed item into index.html, or working with hyperframes.json. Covers discovery, install locations, block sub-composition wiring, component snippet merging, and authoring a new block or component to contribute upstream (idea → scaffold → validate → PR).", "manual": false, "path": "~/.agents/skills/hyperframes-registry", "file_count": 9, "files": ["examples/add-block.md", "examples/add-component.md", "references/contributing.md", "references/demo-html-pattern.md", "references/discovery.md", "references/install-locations.md", "references/templates.md", "references/wiring-blocks.md", "references/wiring-components.md"], "body": "---\nname: hyperframes-registry\ndescription: Install, discover, and wire registry blocks and components into HyperFrames compositions. Use when running hyperframes add or hyperframes catalog, installing one item or every block matching a tag, wiring an installed item into index.html, or working with hyperframes.json. Covers discovery, install locations, block sub-composition wiring, component snippet merging, and authoring a new block or component to contribute upstream (idea → scaffold → validate → PR).\n---\n\n# HyperFrames Registry\n\nThe registry provides reusable blocks and components installable via `hyperframes add \u003cname>`.\n\n- **Blocks** — standalone sub-compositions (own dimensions, duration, timeline). Included via `data-composition-src` in a host composition.\n- **Components** — effect snippets (no own dimensions). Pasted directly into a host composition's HTML.\n\n## Quick reference\n\n```bash\nhyperframes add data-chart              # install a block\nhyperframes add grain-overlay           # install a component\nhyperframes add captions                # install every block tagged captions\nhyperframes add shimmer-sweep --dir .   # target a specific project\nhyperframes add data-chart --json       # machine-readable output\nhyperframes add data-chart --no-clipboard  # skip clipboard (CI/headless)\n```\n\nAfter install, the CLI prints which files were written and a snippet to paste into your host composition. The snippet is a starting point — you'll need to add `data-composition-id` (must match the block's internal composition ID), `data-start`, and `data-track-index` attributes when wiring blocks.\n\nThe positional value is resolved as an exact item name first. If no item matches and the value is a tag, the command installs every block with that tag. Registry dependencies are installed before the requested item. `hyperframes add` works only for blocks and components; for examples, use `hyperframes init \u003cdir> --example \u003cname>` instead.\n\n## Install locations\n\nBlocks install to `compositions/\u003cname>.html` by default. Components install to `compositions/components/\u003cname>.html` by default.\n\nThese paths are configurable in `hyperframes.json`:\n\n```json\n{\n  \"registry\": \"https://raw.githubusercontent.com/heygen-com/hyperframes/main/registry\",\n  \"paths\": {\n    \"blocks\": \"compositions\",\n    \"components\": \"compositions/components\",\n    \"assets\": \"assets\"\n  }\n}\n```\n\nSee [install-locations.md](./references/install-locations.md) for full details.\n\n## Wiring blocks\n\nBlocks are standalone compositions — include them via `data-composition-src` in your host `index.html`:\n\n```html\n\u003cdiv\n  data-composition-id=\"data-chart\"\n  data-composition-src=\"compositions/data-chart.html\"\n  data-start=\"2\"\n  data-duration=\"15\"\n  data-track-index=\"1\"\n  data-width=\"1920\"\n  data-height=\"1080\"\n>\u003c/div>\n```\n\nKey attributes:\n\n- `data-composition-src` — path to the block HTML file\n- `data-composition-id` — must match the block's internal ID\n- `data-start` — when the block appears in the host timeline (seconds)\n- `data-duration` — how long the block plays\n- `data-width` / `data-height` — block canvas dimensions\n- `data-track-index` — layer ordering (higher = in front)\n\nSee [wiring-blocks.md](./references/wiring-blocks.md) for full details.\n\n## Wiring components\n\nComponents are snippets — paste their HTML into your composition's markup, their CSS into your style block, and their JS into your script (if any):\n\n1. Read the installed file (e.g., `compositions/components/grain-overlay.html`)\n2. Copy the HTML elements into your composition's `\u003cdiv data-composition-id=\"...\">`\n3. Copy the `\u003cstyle>` block into your composition's styles\n4. Copy any `\u003cscript>` content into your composition's script (before your timeline code)\n5. If the component exposes GSAP timeline integration (see the comment block in the snippet), add those calls to your timeline\n\nSee [wiring-components.md](./references/wiring-components.md) for full details.\n\n## Discovery\n\nUse the CLI as the primary discovery surface:\n\n```bash\nnpx hyperframes catalog\nnpx hyperframes catalog --type block\nnpx hyperframes catalog --type component\nnpx hyperframes catalog --type block --tag social\nnpx hyperframes catalog --json\nnpx hyperframes catalog --human-friendly\n```\n\nThe normal table and `--json` modes only list matches; install a selected name with `hyperframes add \u003cname>`. `--human-friendly` opens an interactive picker and installs the selected item immediately. In CI or agent workflows, prefer `--json` followed by an explicit `add`.\n\nIf the CLI cannot reach the configured registry, inspect the raw manifest as a fallback:\n\n```bash\ncurl -s https://raw.githubusercontent.com/heygen-com/hyperframes/main/registry/registry.json\n```\n\nEach item's `registry-item.json` contains: name, type, title, description, tags, dimensions (blocks only), duration (blocks only), and file list.\n\nSee [discovery.md](./references/discovery.md) for details on filtering by type and tags.\n\n## Contributing a new block or component\n\nTo author a NEW registry item (caption style, VFX block, transition, lower third, or a reusable component) and ship it as an upstream PR — not install an existing one — follow the full idea → scaffold → build → validate → preview → ship workflow in [contributing.md](./references/contributing.md). Copy-paste starter templates (caption / VFX / component / `registry-item.json`) are in [templates.md](./references/templates.md).\n"}, {"name": "image-to-code", "description": "Elite website image-to-code skill for Codex. For visually important web tasks, it must first generate the design image(s) itself, deeply analyze them, then implement the website to match them as closely as possible. In Codex, it must prefer large, readable, section-specific images instead of tiny compressed boards, generate fresh standalone images for sections or detail views instead of cropping old ones, avoid lazy under-generation, avoid cards-inside-cards-inside-cards UI, and keep the hero clean, spacious, readable, and visible on a small laptop.", "manual": false, "path": "~/.agents/skills/image-to-code", "file_count": 0, "files": [], "body": "---\nname: image-to-code\ndescription: Elite website image-to-code skill for Codex. For visually important web tasks, it must first generate the design image(s) itself, deeply analyze them, then implement the website to match them as closely as possible. In Codex, it must prefer large, readable, section-specific images instead of tiny compressed boards, generate fresh standalone images for sections or detail views instead of cropping old ones, avoid lazy under-generation, avoid cards-inside-cards-inside-cards UI, and keep the hero clean, spacious, readable, and visible on a small laptop.\n---\n\n# CORE DIRECTIVE: IMAGE-FIRST WEBSITE DESIGN TO CODE\nYou are an elite web design art director and implementation strategist.\n\nYour job is not to generate generic website mockups.\nYour job is to generate premium, artistic, implementation-friendly website section references and then turn them into real frontend.\n\nThis skill is for:\n- hero sections\n- landing pages\n- marketing sites\n- startup sites\n- editorial brand pages\n- product pages\n- portfolio websites\n- premium multi-section websites\n- redesigns where visual quality matters\n\nStandard AI output tends to collapse into repetitive defaults:\n- one single giant compressed image for too many sections\n- text that becomes too small to read\n- centered dark hero clichés\n- generic card spam\n- repeated left-text/right-image layouts\n- weak typography hierarchy\n- vague spacing\n- cards inside cards inside cards\n- giant rounded section containers everywhere\n- too much visible information in the first screen\n- tiny pills, labels, tags, system markers, and fake interface jargon\n- nice-looking but unextractable designs\n- generic coded reinterpretations after the image step\n- lazily generating too few images for too many sections\n\nYour goal is to aggressively break these defaults.\n\nThe output must feel:\n- premium\n- art-directed\n- readable\n- structured\n- implementation-friendly\n- deeply analyzable\n- visually strong\n- faithful enough to build from\n- clean on first view\n- responsive in spirit\n- realistic on a small laptop viewport\n\nIMPORTANT:\nFor visual website tasks, you must first generate the design image(s) yourself.\nThen you must deeply analyze the generated image(s).\nOnly after that should you implement the frontend.\n\nDo not skip image generation when image generation is available.\nDo not begin with freeform coding first.\nThe generated image(s) are the primary visual source of truth.\n\nThe required workflow is:\n\nimage generation first  \ndeep image analysis second  \nimplementation third\n\nIf the task is mainly visual, this order is mandatory.\n\n---\n\n## 1. ACTIVE BASELINE CONFIGURATION\n\n- DESIGN_VARIANCE: 8  \n  `(1 = rigid / conventional, 10 = highly art-directed / asymmetric)`\n- VISUAL_DENSITY: 3  \n  `(1 = airy / calm, 10 = dense / packed)`\n- ART_DIRECTION: 8  \n  `(1 = safe commercial, 10 = bold creative statement)`\n- IMPLEMENTATION_CLARITY: 9  \n  `(1 = loose moodboard, 10 = highly buildable UI reference)`\n- IMAGE_USAGE_PRIORITY: 9  \n  `(1 = mostly typographic, 10 = strongly image-led when appropriate)`\n- SPACING_GENEROSITY: 9  \n  `(1 = compact / tight, 10 = spacious / breathable)`\n- ANALYSIS_PRECISION: 10  \n  `(1 = broad vibe only, 10 = deep extraction of design details)`\n- IMAGE_GENERATION_EAGERNESS: 10  \n  `(1 = minimal image count, 10 = generate as many images as needed for excellent extraction)`\n- UI_SIMPLICITY_DISCIPLINE: 9  \n  `(1 = willing to add many micro-elements, 10 = aggressively reduce clutter and unnecessary UI chrome)`\n\nAI Instruction:\nUse these as defaults unless the user clearly wants something else.\nAdapt them to the prompt.\n\nInterpretation:\n- If the user says “clean”, reduce density and increase clarity.\n- If the user says “crazy creative”, increase variance and art direction.\n- If the user says “premium SaaS”, keep clarity high and art direction controlled.\n- If the user says “editorial”, allow stronger type and more asymmetry.\n- Keep sections breathable.\n- Prefer readability over squeezing too much into one image.\n- In Codex, bias strongly toward larger, more analyzable section images.\n- If more images would improve extraction quality, generate more images.\n- Do not be lazy with image count.\n- Default away from nested containers, excessive pills, tiny labels, and dashboard clutter.\n\n---\n\n## 2. MANDATORY IMAGE-FIRST RULE\n\nFor website d
